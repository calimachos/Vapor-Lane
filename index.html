  ctx.globalAlpha = BUILD_TAG_A; ctx.fillStyle = '#cfd6ff'; ctx.fillText(txt, x, y);
  ctx.restore();
}

/* ---------------------------------------------------------------
   FRAME GOVERNOR + FPS METER (build 71)
   Every frame's interval goes into a 2-second window. The window's 25th
   percentile is the screen's own rhythm (16.7 ms at 60 Hz, 33 ms under a
   30 fps cap, 8.3 at 120 Hz), and a frame is LATE when it takes over 1.5x
   that (and over 20 ms). If more than 5% of frames are late in two windows
   in a row while you drive, the glows step down one tier: 1 fades the
   world's glows out, 2 the HUD's. It only steps down, and it waits 3 s after
   any start, screen change, zone change or step before judging again. A
   steady capped browser is never "late", so it never triggers. Per frame
   this is a few comparisons; the window sort happens every 2 s.
--------------------------------------------------------------- */
var GOV_WIN=2000, GOV_LATE=0.05, GOV_HOLD=3;
var gov={tier:0, n:0, t:0, work:0, worst:0, bad:0, hold:GOV_HOLD, dirty:true,
         st:'', zone:-1, buf:new Float32Array(512),
         fps:0, hz:0, worstShow:0, workShow:0, lateShow:0};
var fpsOn=false;
try{ fpsOn = localStorage.getItem('vaporlane.fps')==='1'; }catch(_){}
function toggleFps(){
  fpsOn=!fpsOn;
  try{ localStorage.setItem('vaporlane.fps', fpsOn?'1':'0'); }catch(_){}
}
function govFrame(raw, work, dt){
  /* the fades: 1.2 s either way, so a step never pops */
  var gq=gov.tier>=1?0:1, hq=gov.tier>=2?0:1, sp=dt/1.2;
  if (GQ!==gq) GQ = GQ<gq ? Math.min(gq,GQ+sp) : Math.max(gq,GQ-sp);
  if (HQ!==hq) HQ = HQ<hq ? Math.min(hq,HQ+sp) : Math.max(hq,HQ-sp);

  if (raw>250 || document.hidden){          /* a stall or a tab switch: start over */
    gov.n=0; gov.t=0; gov.work=0; gov.worst=0; gov.hold=GOV_HOLD; gov.dirty=true; return;
  }
  if (state!==gov.st || zoneI!==gov.zone){ gov.st=state; gov.zone=zoneI; gov.hold=GOV_HOLD; }
  if (gov.hold>0){ gov.hold-=raw/1000; gov.dirty=true; }
  if (gov.n<gov.buf.length) gov.buf[gov.n++]=raw;
  gov.t+=raw; gov.work+=work; if (raw>gov.worst) gov.worst=raw;
  if (gov.t<GOV_WIN) return;

  var n=gov.n, v=gov.buf.subarray(0,n), i, late=0;
  v.sort();
  var base=v[(n*0.25)|0], thr=Math.max(base*1.5, 20);
  for (i=n-1; i>=0 && v[i]>thr; i--) late++;
  gov.fps=Math.round(n*1000/gov.t); gov.hz=Math.round(1000/base);
  gov.worstShow=gov.worst; gov.workShow=gov.work/n; gov.lateShow=late;
  if (state==='playing' && !gov.dirty && gov.tier<2){
    if (late > n*GOV_LATE){
      if (++gov.bad>=2){ gov.tier++; gov.bad=0; gov.hold=GOV_HOLD; }
    } else gov.bad=0;
  }
  gov.n=0; gov.t=0; gov.work=0; gov.worst=0; gov.dirty=false;
}
function drawFps(){
  var g=gov, tier=g.tier===0?'FULL':(g.tier===1?'LITE':'LITE+');
  var txt=(g.fps||'--')+' FPS \u00b7 '+(g.hz||'--')+' HZ \u00b7 WORST '+Math.round(g.worstShow)+
          ' MS \u00b7 JS '+g.workShow.toFixed(1)+' MS \u00b7 GLOW '+tier;
  var fs=10*UI;
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha=1; ctx.shadowBlur=0; ctx.globalCompositeOperation='source-over';
  ctx.font='700 '+fs+'px ui-monospace,Menlo,"Courier New",monospace';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  var w=ctx.measureText(txt).width+14;
  ctx.fillStyle='rgba(6,2,14,.80)'; ctx.fillRect(W/2-w/2,H-fs-9,w,fs+7);
  ctx.fillStyle = g.lateShow===0 ? '#7cff4f' : (g.lateShow<=g.fps*0.1 ? '#ffd23f' : '#ff4d6d');
  ctx.fillText(txt,W/2,H-6);
  ctx.restore();
}
/* where the FPS METER line sits on the pause screen, so a tap can find it */
function fpsLineY(){ return TOUCH ? H/2+50 : H/2+156; }

var last=performance.now(), lastDt=0.016;
function loop(now){
  var raw=now-last;
  var dt=Math.min(0.05,raw/1000); last=now;
  lastDt=dt;
  var w0=performance.now();
  update(dt);
  syncPad();
  render();
  govFrame(raw, performance.now()-w0, dt);
  if (fpsOn) drawFps();
  requestAnimationFrame(loop);
}
/* ---------------------------------------------------------------
   BUILD 73 - THE TUTORIAL (style C, steps that unlock) + GENTLER OPENING LAPS
   Build 72 was a test of three presentation styles. Carlos picked C (the car keeps
   driving, a banner on the road, nothing freezes) and added two things from B:
   a glowing BOX around the HUD part or touch control being explained, and a dim
   that fades in for about a second to draw the eye and then eases off.

   The tutorial is nine steps on a scripted road at CRUISE rules (no clock, no
   hull, no score, no record) at 55 % of the old lap-1 top speed. Each step now
   UNLOCKS only when the player actually does the thing:
     1 DRIVE      speed over half + a real steer. A reminder every 10 s.
     2 BRAKE      one slow car at a time; brake held 0.3 s. Else message + next car.
     3 CRASH      information only (a 5 s banner).
     4 NEAR MISS  the chain reaches x2 (a convoy of 4 beside you). Else message + 4 more cars.
     5 POWER-UPS  a heart AND a bolt collected. Else message + a new pair.
     6 DRIFT      3 s of drifting inside the curve. Else message + another curve.
     7 FIRE       a bolt destroys the target. Else message + a new car.
     8 CHECKPOINT cross the gate.
     9 READY      the only freeze: DRIVE / AGAIN / MENU. Reaching it = finished.
   A round that has not ended by itself after TUT_MAXROUND seconds counts as missed,
   so a parked player cannot dead-lock a step. After TUT_EXIT_AT misses on one step
   a small line says how to leave (pause, then the main menu); it never skips.

   OFFER RULES: the title always offers it (T on a desktop, a TUTORIAL slab last
   on the phone). The game-over offer shows only if the run ended on lap 4 or
   earlier, the tutorial is not finished and no run has ever reached lap 5.

   THE OPENING LAPS are gentler for everyone: a lower top speed, a longer gap
   between cars and, from build 73, 75 % of the old length on laps 1-3 (EASY_*).
   The checkpoint award divides the lap by top speed, so it scales with both.

   Test switches: ?tutorial=1 starts the tutorial on load, ?fresh=1 pretends it is a
   first launch, ?easy=0 puts laps 1-3 back to build 71.
--------------------------------------------------------------- */
var LEARN_SPEED = 0.55;                  /* tutorial top speed: share of the old lap-1 11500 */
var LEARN_DRIFT = 2.4;                   /* the DRIFT bar fills this much faster in the tutorial */
var LEARN_DRIFT_SPD = 0.60;              /* ...and pays out from this share of top speed (a normal run: DR_MIN_SPD 0.78) */
var EASY_ON  = true;
var EASY_SPD = [0.80, 0.88, 0.95];       /* laps 1, 2, 3: share of the old top speed */
var EASY_GAP = [1.35, 1.20, 1.08];       /* laps 1, 2, 3: spawn gap multiplier (bigger = emptier) */
var EASY_LEN = 0.75;                     /* laps 1, 2, 3: share of the old lap length (build 73) */
var learn = false, learnPending = false; /* learn = THIS run is the tutorial */
var tut = null;
var tutSeen = false, tutDone = false, tutSkilled = false, firstLaunch = false;
var TUT_KEY = 'vaporlane.tut', TUT_BAN = 5.5;
var msgBox = null;                       /* build 79: the banner's rectangle in canvas units (null = none up) */
var TUT_R_AFTER = 2;                     /* build 79: misses before the complementary text replaces the first one */
var TUT_DIM = 0.60, TUT_FADE_IN = 1.0, TUT_HOLD = 0.3, TUT_FADE_OUT = 1.2;   /* the dim: peak and timing, seconds */
var TUT_GAP = 1.2;                       /* pause between a miss and the next scene */
var TUT_MAXROUND = 26;                   /* a scene not finished by itself after this long counts as missed */
var TUT_BRAKE_S = 0.3;                   /* BRAKE: seconds of brake that count */
var TUT_DRIFT_S = 3;                     /* DRIFT: seconds of drift inside the curve that count */
var TUT_REMIND = 10;                     /* DRIVE: seconds between reminders */
var TUT_EXIT_AT = 4;                     /* misses on one step before the "how to leave" line */
var QS = ''; try{ QS = location.search || ''; }catch(_){}
function qs(k){ var m = new RegExp('[?&]'+k+'=([^&#]*)').exec(QS); return m ? decodeURIComponent(m[1]) : null; }

/* what a box can surround: HUD parts are rects in the 800x500 canvas, touch
   controls are DOM nodes (on a desktop they do not exist, so they are skipped) */
var HUDR = { speed:[W-240,10,232,68], lap:[W/2-98,10,196,68], drifthud:[10,368,214,50],
             shots:[10,420,214,64], nextcp:[W-232,420,222,50], chain:[10,116,214,50] };
var DOMR = { steer:'fanL', gas:'wGas', brake:'wBrake', drift:'wDrift', fire:'bFire' };
var tutEl = el('tut'), tutCardEl = el('tutCard'), tutSvgEl = el('tutSvg'), tutFxEl = el('tutFx');
var tutPulsed = [], tutFxKey = '', tutFxShown = false;

/* ---- the saved flags: their own key, so the main save is untouched ---- */
function tutLoad(){
  try{
    var d = JSON.parse(store.getItem(TUT_KEY) || 'null');
    if (d && typeof d === 'object'){ tutSeen = !!d.seen; tutDone = !!d.done; tutSkilled = !!d.skill; }
  }catch(_){}
}
function tutSave(){
  if (!saveOK) return;
  try{ store.setItem(TUT_KEY, JSON.stringify({v:1, seen:tutSeen?1:0, done:tutDone?1:0, skill:tutSkilled?1:0})); }catch(_){ }
}
/* Runs before loadGame(): "first launch" means nothing has ever been saved. */
function tutBoot(){
  var had = false;
  if (saveOK){
    try{ had = !!(store.getItem(SAVE_KEY) || store.getItem(SAVE_KEY_OLD)); }catch(_){}
    tutLoad();
  }
  firstLaunch = !had;
  if (qs('fresh') === '1'){ firstLaunch = true; tutSeen = false; tutDone = false; tutSkilled = false; }
  if (qs('easy') === '0') EASY_ON = false;
}
/* a run the player started themselves counts as having seen the offer */
function beginRun(){
  reset(); state = 'playing';
  prPlay();                             /* build 96 */
  if (!tutSeen){ tutSeen = true; tutSave(); }
}
/* the game-over offer: an early loss, not finished, never got to lap 5 */
function tutOffer(){ return lap <= 4; }   /* build 74: Carlos's rule only (was also: not finished, never reached lap 5) */
/* reaching lap 5 once is proof enough: the game-over offer stops for good */
function tutSkill(){ if (!tutSkilled){ tutSkilled = true; tutSave(); } }

/* ---- scene helpers ---- */
function tutLane(){
  var b = 0, d = 9, i, e;
  for (i = 0; i < LANES.length; i++){ e = Math.abs(LANES[i] - playerX); if (e < d){ d = e; b = i; } }
  return b;
}
function tutCar(lane, dz, spd){
  var c = { z:position + Z_CAR + dz, lane:lane, x:LANES[lane], speed:spd,
            color:ZN.traffic[(Math.random()*ZN.traffic.length)|0], passed:false,
            weaver:false, phase:null, sigT:0, moveT:0, sigDir:0, fromX:0, toLane:0,
            changeT:99, scripted:true };
  cars.push(c);
  return c;
}
function tutDz(o){ return o.z - (position + Z_CAR); }
/* FIRE: there is always something to shoot with while the target is still ahead. Overdrive can run
   out before the car arrives and a missed shot is gone. Quiet on purpose: a "BOLT LOADED" card would
   push the lesson's own banner off the screen. The HUD shot counter shows it. */
function tutAmmo(){ if (shots <= 0 && odT <= 0) shots = 1; }
function tutGoneCar(c){ return !c || c.passed || cars.indexOf(c) < 0; }
/* The tutorial road is flat except for the bends it asks for. Sections are short
   so a requested bend is never far behind the request. */
function tutBendSection(){
  secLen = 130;                                   /* 52k units of sweeper */
  var dir = lastDir > 0 ? -1 : 1; lastDir = dir;
  secAmp = dir * S_PEAK * Z().curve * Math.PI / (secLen*CH);   /* a full-strength bend */
  tut.bendZ = genN*CH; tut.bendEnd = (genN + secLen)*CH;
}

/* ---- the nine steps ----
   enter()  runs once as the step starts (set up its counters)
   round()  puts the scene on the road: at the start and again after every miss
   trig()   true when the first message should come up (the thing is near enough to see)
   watch()  runs every frame; sets tut.ok when the action has been done
   gone()   true when the scene is over (cars passed, pickups gone, bend behind you)
   now      advance the moment tut.ok is set, without waiting for gone()
   info     a step with no action: advance after this many seconds
   nudge    seconds between reminders for a step with no scene (DRIVE)
   r        has retry texts (TUT_<ID>_R_H / _R_B / _R_BT)
   max      this step's own limit for a scene (default TUT_MAXROUND)
   hard     freeze the game (the closing card) */
var TUT = [
  { id:'DRIVE', spot:['speed','gas','steer'], after:0.3, now:true, nudge:TUT_REMIND, r:true,
    enter:function(){ tut.steerMax = 0; },
    trig:function(){ return true; },
    watch:function(dt){
      tut.steerMax = Math.max(tut.steerMax, Math.abs(playerX));
      if (speed > maxSpeedFor(lap)*0.5 && tut.steerMax > 0.3) tut.ok = true;
    } },
  { id:'BRAKE', spot:['brake','speed'], r:true,
    enter:function(){ tut.brakeT = 0; },
    round:function(){ tut.obj = tutCar(tutLane(), 30000, 1400); },
    trig:function(){ return tutDz(tut.obj) <= 14000; },
    watch:function(dt){
      if (tut.obj && keys.down && tutDz(tut.obj) > -2000) tut.brakeT += dt;
      if (tut.brakeT >= TUT_BRAKE_S) tut.ok = true;
    },
    gone:function(){ return tutGoneCar(tut.obj); } },
  { id:'CRASH', spot:[], after:0.6, info:5.0,
    trig:function(){ return true; } },
  { id:'NEARMISS', spot:['chain'], r:true,
    round:function(){
      /* four slow cars in a row in the lane next to yours. 3200 apart at this speed keeps the
         passes inside the chain window (NM_CHAIN_T 1.6 s) even at half of top speed, so shaving
         two of them reaches x2 and shaving all four reaches x4. */
      var k, l = tutLane(), cl = l < 3 ? l + 1 : l - 1; tut.slal = [];
      for (k = 0; k < 4; k++) tut.slal.push(tutCar(cl, 26000 + k*3200, 1000));
    },
    trig:function(){ return tutDz(tut.slal[0]) <= 14000; },
    watch:function(dt){ if (chain >= 2) tut.ok = true; },
    gone:function(){
      for (var k = 0; k < tut.slal.length; k++) if (!tutGoneCar(tut.slal[k])) return false;
      return true;
    } },
  { id:'PICKUPS', spot:['shots'], r:true,
    enter:function(){ tut.got = { heart:false, bolt:false }; },
    round:function(){
      var l = tutLane(), zc = position + Z_CAR;
      if (health >= CH_().hp) health = Math.max(1, CH_().hp - 1);   /* so the heart has something to do */
      tut.pk = [ {kind:'heart', z:zc + 24000, x:LANES[l < 3 ? l + 1 : l - 1]},
                 {kind:'bolt',  z:zc + 33000, x:LANES[l > 0 ? l - 1 : l + 1]} ];
      pickups.push(tut.pk[0], tut.pk[1]);
    },
    trig:function(){ return tut.pk[0].z - (position + Z_CAR) <= 13000; },
    gone:function(){ return pickups.indexOf(tut.pk[0]) < 0 && pickups.indexOf(tut.pk[1]) < 0; } },
  { id:'DRIFT', spot:['drifthud','drift'], wait:45, max:70, r:true,
    enter:function(){ tut.driftT = 0; },
    round:function(){ tut.wantBend = true; tut.bendZ = undefined; tut.bendEnd = undefined; },
    trig:function(){ return tut.bendZ !== undefined && tut.bendZ - (position + Z_CAR) <= 26000; },
    watch:function(dt){ if (tut.driftT >= TUT_DRIFT_S) tut.ok = true; },
    gone:function(){ return tut.bendEnd !== undefined && position + Z_CAR > tut.bendEnd - 3000; } },
  { id:'FIRE', spot:['fire','shots'], now:true, r:true,
    round:function(){
      tutAmmo();
      tut.obj = tutCar(tutLane(), 24000, 1500);
    },
    watch:function(dt){ if (tut.obj && !tutGoneCar(tut.obj) && tutDz(tut.obj) > 2500) tutAmmo(); },
    trig:function(){ return tutDz(tut.obj) <= 15000; },
    gone:function(){ return tutGoneCar(tut.obj); } },
  { id:'GATE', spot:['nextcp','lap'], now:true,
    enter:function(){ var zc = position + Z_CAR; cpStart = zc; cpLen = 36000; nextCP = zc + cpLen; },
    trig:function(){ return nextCP - (position + Z_CAR) <= 18000; },
    watch:function(dt){ if (tut.gate) tut.ok = true; } },
  { id:'READY', spot:[], hard:true, final:true,
    enter:function(){ tutDone = true; tutSave(); prAdd('tutfin'); },   /* reaching the end is finishing; build 96: PROPELLER */
    trig:function(){ return true; } }
];

function tutInit(){
  tut = { i:-1, sub:0, t:0, t0:0, rt:0, sinceMsg:0, fails:0, ok:false, okT:0, boxOn:false, fxT:99, fxA:-1,
          crashed:false, wantBend:false, gate:false, shownAt:0, obj:null, slal:null, pk:null, got:null,
          steerMax:0, brakeT:0, driftT:0, bendZ:undefined, bendEnd:undefined, layKey:'' };
  cpStart = 0; cpLen = 1e9; nextCP = 1e9;      /* the gate is placed by its step */
  ufoT = 1e9; hailCool = 1e9;                  /* no saucers in a lesson */
  tutEnter(0);
}
/* Any other run: take down whatever the tutorial left up (a glowing touch control,
   the dim, the card). Quitting through the pause menu skips tutExit(). */
function tutClean(){
  if (!tutEl) return;
  tutPulse(null); tutFxClear(); tutHide();
}
function tutEnter(i){
  var b = TUT[i];
  tut.i = i; tut.sub = 1; tut.t = 0; tut.t0 = 0; tut.rt = 0; tut.sinceMsg = 0;
  tut.fails = 0; tut.ok = false; tut.okT = 0; tut.boxOn = false;
  if (b.enter) b.enter();
  if (b.round) b.round();
}
function tutAdvance(){
  tutPulse(null); tut.boxOn = false; tutFxClear();
  if (tut.i + 1 < TUT.length) tutEnter(tut.i + 1);
}
/* A missed scene: say why, wait a moment, then send the scene again. */
function tutFail(b){
  tut.fails++;
  tut.sub = 3; tut.t0 = 0;                        /* build 79: no new banner now; it comes back with the scene */
}
function tutRoundStart(b){
  tut.rt = 0; tut.sub = 1; tut.t0 = 0; tut.sinceMsg = 0;   /* wait for the scene to come into view, then the banner */
  if (b.round) b.round();
}
/* build 79: the first text is shown for the first two tries; the complementary one after two misses */
function tutKind(b){ return (b.r && tut.fails >= TUT_R_AFTER) ? 'R' : ''; }
/* called every frame of a playing tutorial, in place of the traffic spawner */
function tutStep(dt){
  var b = TUT[tut.i]; if (!b) return;
  if (b.watch) b.watch(dt);
  tut.rt += dt;
  if (tut.sub === 1){                              /* waiting for the thing to come into view */
    tut.t0 += dt;
    if (tut.ok){ tut.sub = 2; tut.t = 0; tut.sinceMsg = 0; }     /* done before the message came up */
    else if (tut.t0 >= (b.after || 0) && (b.trig() || tut.t0 > (tut.fails ? Math.min(b.wait || 40, 20) : (b.wait || 40)))) tutShow(b);
  } else if (tut.sub === 2){                       /* the message is up: watching for the action */
    tut.t += dt; tut.sinceMsg += dt;
    if (b.info){
      if (tut.t >= b.info) tutAdvance();
    } else if (tut.ok){
      tut.okT += dt;
      if (b.now || !b.gone || b.gone() || tut.okT > 4) tutAdvance();
    } else if (b.gone && (b.gone() || tut.rt > (b.max || TUT_MAXROUND))){
      tutFail(b);
    } else if (b.nudge && tut.sinceMsg > b.nudge){
      tut.fails++; tutMsg(b, tutKind(b));
    }
  } else if (tut.sub === 3){                       /* a breath before the next try */
    tut.t0 += dt;
    if (tut.t0 >= TUT_GAP) tutRoundStart(b);
  }
  tutFxFrame(dt);
}
function tutShow(b){
  tut.sub = 2; tut.t = 0; tut.rt = 0; tut.sinceMsg = 0;
  if (b.hard){
    tut.boxOn = false; tutFxClear();
    state = 'tutorial'; fansRelease();
    tut.shownAt = performance.now();
    tutRender(b);
  } else {
    tutMsg(b, tutKind(b));
  }
  blip(880, 0.07, 'sine', 0.12);
}
/* the banner on the road: the same card the game uses for PRESS SPACE TO SHOOT.
   kind '' is the first explanation, 'R' is the clarifying message after a miss. */
function tutMsg(b, kind){
  var ls = tutWrap(tutText(b, 'B', kind), 40), i;
  msgs.length = 0;
  say(tutText(b, 'H', kind), '#7cff4f', true, null, TUT_BAN);
  for (i = 0; i < ls.length && i < 3; i++) say(ls[i], '#cfd6ff', false, null, TUT_BAN);
  if (kind === 'R' && tut.fails >= TUT_EXIT_AT) say(T(TOUCH ? 'TUT_EXIT_T' : 'TUT_EXIT'), '#8a7ec4', false, null, TUT_BAN);
  tut.boxOn = !!(b.spot && b.spot.length);
  tut.fxT = 0; tut.sinceMsg = 0;                   /* the dim fades in again */
  tutPulse(b.spot);
}
/* hooks from the game: a pickup collected, a car shot */
function tutGot(kind){
  if (!tut || !tut.got || TUT[tut.i].id !== 'PICKUPS') return;
  if (kind === 'heart' || kind === 'bolt') tut.got[kind] = true;
  if (tut.got.heart && tut.got.bolt) tut.ok = true;
}
function tutShot(c){
  if (tut && c === tut.obj && TUT[tut.i].id === 'FIRE') tut.ok = true;
}
/* the gate line was crossed in the tutorial: no lap, no award, just the step */
function tutGate(){
  tut.gate = true; flash = 1; nextCP = 1e9; cpLen = 1e9;
  say(T('CHECKPOINT'), '#7cff4f', true, null, 2);
  blip(660, 0.10, 'square', 0.2);
  setTimeout(function(){ blip(990, 0.16, 'square', 0.2); }, 110);
}

/* ---- text ---- */
function tutText(b, suf, kind){
  var id = (b.id === 'CRASH' && tut.crashed) ? 'CRASH2' : b.id;
  if (kind === 'R') id += '_R';
  var v = (suf === 'B' && TOUCH) ? T('TUT_'+id+'_BT') : undefined;
  if (v === undefined) v = T('TUT_'+id+'_'+suf);
  return v;
}
function tutWrap(s, n){
  var w = s.split(' '), out = [], cur = '', i;
  for (i = 0; i < w.length; i++){
    if (cur && (cur+' '+w[i]).length > n){ out.push(cur); cur = w[i]; }
    else cur = cur ? cur+' '+w[i] : w[i];
  }
  if (cur) out.push(cur);
  return out;
}
function tutBtn(node, fn){
  if (!node) return;
  node.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  node.addEventListener('pointerup', function(e){ e.stopPropagation(); e.preventDefault(); fn(); });
}
function tutPulse(spot){
  var i, n;
  for (i = 0; i < tutPulsed.length; i++) tutPulsed[i].classList.remove('tutHint');
  tutPulsed = [];
  if (!TOUCH || !spot) return;
  for (i = 0; i < spot.length; i++){
    if (DOMR[spot[i]]){
      n = el(DOMR[spot[i]]);
      if (n){ n.classList.add('tutHint'); tutPulsed.push(n); }
    }
  }
}

/* ---- the boxes and the fading dim (live, over the moving road) ----
   One fixed SVG that never takes a touch. The dim is a rect with holes cut out
   around the boxed parts; its opacity is the only thing that changes each frame. */
function tutFxAlpha(t){
  var u;
  if (t < TUT_FADE_IN){ u = t/TUT_FADE_IN; return TUT_DIM*u*u*(3-2*u); }
  t -= TUT_FADE_IN;
  if (t < TUT_HOLD) return TUT_DIM;
  t -= TUT_HOLD;
  if (t < TUT_FADE_OUT){ u = 1 - t/TUT_FADE_OUT; return TUT_DIM*u*u*(3-2*u); }
  return 0;
}
/* build 79: the banner in viewport pixels (with a little room for its glow), or null */
function tutBannerRect(){
  if (!msgBox || !msgs.length) return null;
  var cr = cv.getBoundingClientRect(); if (!cr.width) return null;
  var sx = cr.width/W, sy = cr.height/H, p = 5;
  return [cr.left + (msgBox[0]-p)*sx, cr.top + (msgBox[1]-p)*sy, (msgBox[2]+2*p)*sx, (msgBox[3]+2*p)*sy];
}
/* spotlight targets in viewport pixels */
function tutRects(spot){
  var out = [], i, id, r, n;
  var cr = cv.getBoundingClientRect(); if (!cr.width) return out;
  var sx = cr.width/W, sy = cr.height/H;
  for (i = 0; i < spot.length; i++){
    id = spot[i];
    if (HUDR[id]){
      r = HUDR[id];
      out.push([cr.left + r[0]*sx, cr.top + r[1]*sy, r[2]*sx, r[3]*sy]);
    } else if (DOMR[id] && TOUCH){
      n = el(DOMR[id]); if (!n || !n.getBoundingClientRect) continue;
      r = n.getBoundingClientRect();
      if (r.width > 0) out.push([r.left, r.top, r.width, r.height]);
    }
  }
  return out;
}
function tutFxClear(){
  if (tutFxEl) tutFxEl.innerHTML = '';
  tutFxKey = ''; if (tut) tut.fxA = -1;
}
function tutFxFrame(dt){
  if (!tutFxEl || !tut) return;
  var b = TUT[tut.i];
  if (!tut.boxOn || !b || !b.spot || !b.spot.length){ if (tutFxKey) tutFxClear(); return; }
  tut.fxT += dt;
  var rects = tutRects(b.spot);
  if (!rects.length){ if (tutFxKey) tutFxClear(); return; }
  var vw = window.innerWidth || document.documentElement.clientWidth || 800;
  var vh = window.innerHeight || document.documentElement.clientHeight || 600;
  var bnr = tutBannerRect();
  var key = vw+'x'+vh+'|'+tut.i+'|'+rects.join(';')+'|'+(bnr ? bnr.join(',') : '');
  if (key !== tutFxKey){
    tutFxKey = key;
    var holes = '', rings = '', i, r, p = 7, a;
    if (bnr) holes += '<rect id="tutFxBn" x="'+bnr[0].toFixed(1)+'" y="'+bnr[1].toFixed(1)+'" width="'+bnr[2].toFixed(1)+
                      '" height="'+bnr[3].toFixed(1)+'" rx="16" fill="#000"/>';
    for (i = 0; i < rects.length; i++){
      r = rects[i];
      a = 'x="'+(r[0]-p).toFixed(1)+'" y="'+(r[1]-p).toFixed(1)+'" width="'+(r[2]+2*p).toFixed(1)+
          '" height="'+(r[3]+2*p).toFixed(1)+'" rx="12"';
      holes += '<rect '+a+' fill="#000"/>';
      rings += '<rect class="ring" '+a+'/>';
    }
    tutFxEl.setAttribute('viewBox', '0 0 '+vw+' '+vh);
    tutFxEl.innerHTML = '<defs><mask id="tutFxM" maskUnits="userSpaceOnUse" x="0" y="0" width="'+vw+'" height="'+vh+'">'+
      '<rect x="0" y="0" width="'+vw+'" height="'+vh+'" fill="#fff"/>'+holes+'</mask></defs>'+
      '<rect id="tutFxDim" x="0" y="0" width="'+vw+'" height="'+vh+'" fill="rgb(5,2,12)" fill-opacity="0" mask="url(#tutFxM)"/>'+rings;
    tut.fxA = -1;
  }
  var al = tutFxAlpha(tut.fxT);
  if (al !== tut.fxA){
    var dimEl = document.getElementById('tutFxDim');
    if (dimEl) dimEl.setAttribute('fill-opacity', al.toFixed(3));
    tut.fxA = al;
  }
}
/* called from render(): show the layer only while the tutorial is being driven */
function tutFxVis(){
  if (!tutFxEl) return;
  var on = !!(learn && state === 'playing' && tut && tut.boxOn);
  if (on !== tutFxShown){ tutFxShown = on; tutFxEl.style.display = on ? 'block' : 'none'; }
}

/* ---- the closing card (the only freeze) ---- */
/* build 78: one option = its button with (on desktop) its key cap right under it */
function tutOpt(id, label, key, cls, main){
  return '<div class="tOpt'+(main ? ' main' : '')+'"><button'+(cls ? ' class="'+cls+'"' : '')+' id="'+id+'">'+label+'</button>'+
         (TOUCH ? '' : '<div class="tGo">'+key+'</div>')+'</div>';
}
function tutRender(b){
  var h = '';
  h += '<div class="tTag">'+T('LEARN_TAG')+'  ·  '+(tut.i+1)+' / '+TUT.length+'</div>';
  h += '<div class="tHead">'+tutText(b,'H')+'</div>';
  h += '<div class="tBody">'+tutText(b,'B')+'</div>';
  h += '<div class="tBtns">'+
       tutOpt('tutGo',    T('TUT_GO'),    'ENTER', '',     true)+
       tutOpt('tutAgain', T('TUT_AGAIN'), 'T',     '',     false)+
       tutOpt('tutMenu',  T('TUT_MENU'),  T('TUT_MENU_K'), 'skip', false)+'</div>';
  tutCardEl.innerHTML = h;
  tutBtn(el('tutGo'),    function(){ tutExit('run'); });
  tutBtn(el('tutAgain'), function(){ startLearn(); });
  tutBtn(el('tutMenu'),  function(){ tutExit('title'); });
  tutEl.className = 'on';
  tut.layKey = '';
  tutLayout();
}
/* Called every frame while the card is up, so a rotation or a resize moves it. */
function tutLayout(){
  if (!tut || !tutEl || tutEl.className !== 'on') return;
  var sr = el('stage').getBoundingClientRect();
  var vw = window.innerWidth || document.documentElement.clientWidth || 800;
  var vh = window.innerHeight || document.documentElement.clientHeight || 600;
  var fs = Math.max(TOUCH ? 13 : 12, Math.min(19, sr.width/58));
  var cw = Math.min(sr.width*0.94, TOUCH ? 460 : 620);
  tutCardEl.style.fontSize = fs+'px';
  tutCardEl.style.width = Math.round(cw)+'px';
  tutCardEl.style.left = Math.round(sr.left + (sr.width - cw)/2)+'px';
  var chh = tutCardEl.offsetHeight;
  var yTop = sr.top + sr.height*0.17, yBot = sr.top + sr.height*0.95 - chh;
  /* A phone held upright shows the stage as a strip at the top with empty space
     under it: the card goes there first so the road stays visible. */
  var upright = TOUCH && sr.height < vh*0.5;
  var cands = upright ? [sr.bottom + 10, yTop, yBot, sr.top + 4] : [yTop, yBot];
  var y = cands[0], k;
  for (k = 0; k < cands.length; k++){
    if (cands[k] + chh <= vh - 6 && cands[k] >= 4){ y = cands[k]; break; }
  }
  tutCardEl.style.top = Math.round(y)+'px';
  var key = vw+'x'+vh;
  if (key === tut.layKey) return;
  tut.layKey = key;
  tutSvgEl.setAttribute('viewBox', '0 0 '+vw+' '+vh);
  tutSvgEl.innerHTML = '<rect x="0" y="0" width="'+vw+'" height="'+vh+'" fill="rgba(5,2,12,0.38)"/>';
}
function tutHide(){
  if (tutEl) tutEl.className = '';
  if (tutSvgEl) tutSvgEl.innerHTML = '';
  if (tut) tut.layKey = '';
}
function tutExit(where){
  tutHide(); tutPulse(null); tutFxClear();
  if (where === 'run'){
    tutDone = true; tutSave();
    learn = false; reset(); state = 'playing';
    prPlay();                           /* build 96 */
  } else {
    learn = false; reset(); state = 'title';
  }
}
/* keys on the closing card */
function tutKey(c){
  var b = tut && TUT[tut.i];
  if (c === 'KeyM'){ cycleAudio(); return; }
  if (c === 'KeyL'){ toggleLang(); if (b) tutRender(b); return; }
  if (c === 'Escape' || c === 'Backspace' || c === 'Delete'){ tutExit('title'); return; }   /* build 105: ESC is eaten by a fullscreen frame */
  if (c === 'Enter' || c === 'Space') tutExit('run');
  else if (c === 'KeyT') startLearn();
}

/* Start the tutorial. */
function startLearn(){
  tutHide(); tutPulse(null); tutFxClear();
  learnPending = true; reset(); learnPending = false;
  state = 'playing';
  prPlay();                             /* build 96 */
  tutSeen = true; tutSave();
  fansRelease();
  blip(660, 0.09, 'square', 0.14);
}

/* the top-left HUD panel in the tutorial, in place of SCORE and BEST */
function drawLearnPanel(){
  panel(12, 12, 224, 62);
  monoText(T('LEARN_TAG'), 24, 34, TS.LABEL*UI, '#7cff4f');
  glowText(T('LEARN_STEP')+((tut ? tut.i : 0) + 1)+' / '+TUT.length, 24, 63, TS.HERO, '#ffffff', 'left', 10);
}

tutBoot();
loadGame();
/* Canvas text only switches to a web font once it has loaded, and a canvas
   request alone does not always start the load — so ask for it up front.
   It is a data: URL, so this resolves within a frame or two. */
try{ if (document.fonts && document.fonts.load) document.fonts.load('900 20px "VL Display"'); }catch(_){}
applyStaticText();
fitCanvas();       /* build 70: backing store = the size it is shown at */
scheduleCircuit();
noteLandscape();   /* must follow loadGame(): it can write, and writing
                      before the read would clobber the saved record */
reset();
state='title';
gateShow();        /* build 103: READY TO RACE? over the dimmed main menu until the first click / tap / key */
/* build 73: ?tutorial=1 starts the tutorial on load */
(function(){ var q=qs('tutorial'); if (q && q !== '0') startLearn(); })();
requestAnimationFrame(loop);

})();
</script>
<!-- Separate from the game's script on purpose: that one runs inside a
     closure, and the registration has to sit outside it. -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline play just won't be available */ });
  });
}
</script>
