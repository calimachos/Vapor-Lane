<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- iPhone Safari has no Fullscreen API, so the in-game button cannot help there.
     These let "Add to Home Screen" launch it chrome-free instead, which is the
     only route to a full screen on iOS. Harmless everywhere else. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05020c">
<!-- iOS reads apple-mobile-web-app-title for the home-screen label and falls
     back to <title> without it. Setting it explicitly stops the two drifting
     apart the next time the name changes. -->
<meta name="apple-mobile-web-app-title" content="Vapor Lane">
<meta name="application-name" content="Vapor Lane">
<meta name="description" content="Vapor Lane — a neon-lit arcade racer. Four lanes, rising traffic, power-ups and drift-loaded shots. Runs in the browser, installs to your phone.">
<title>VAPOR LANE</title>
<!-- Installable-app wiring. Paths are relative, so the repo can be renamed
     or the game moved into a subfolder without any of this breaking. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

  :root{
    --cyan:#21e6ff;
    --pink:#ff2fbe;
    --violet:#7c3aed;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(ellipse at 50% 0%, #2a0b4a 0%, #0d0520 55%, #05020c 100%);
    color:#cfd6ff;
    font-family:ui-monospace,"SFMono-Regular",Menlo,"Courier New",monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:18px;min-height:100%;overflow:hidden;
  }
  
  /* A fixed element with z-index:0 still paints ABOVE static in-flow content,
     so everything that must sit on top of the board needs lifting explicitly.
     Missing one would bury it behind the background. */
  #circuit{ position:fixed; inset:0; width:100%; height:100%;
            z-index:0; pointer-events:none }
  #stage{
    /* Desktop/laptop gameplay window, widened 2026-08-23. +1.5cm top and
       +1.5cm bottom = 3cm more height. aspect-ratio:8/5 is fixed, so width
       has to grow by the same factor to keep that ratio: 3cm * 8/5 = 4.8cm,
       i.e. 2.4cm added to each side. Only max-width is touched — height
       still comes from aspect-ratio, so it grows automatically and stays
       exactly proportional. Touch/mobile layouts are untouched: they carry
       their own #stage max-width/max-height under (pointer:coarse) below. */
    position:relative; z-index:1;width:100%;max-width:calc(940px + 4.8cm);aspect-ratio:8/5;
    border-radius:10px;background:#05020c;
    box-shadow:
      0 0 0 2px #2b1050,
      0 0 22px rgba(255,47,190,.35),
      0 0 60px rgba(33,230,255,.18),
      0 26px 70px rgba(0,0,0,.7);
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  /* build 104: the TOP layer. Same size as #c, laid exactly over it, never filtered, and clicks fall through to #c. */
  #c2{ position:absolute; left:0; top:0; pointer-events:none }
  #scan{
    position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    /* build 71: no mix-blend-mode. Both layers are pure black with alpha, and
       multiplying by black is the same as laying black over it, so multiply
       only cost the browser a full re-blend every frame. */
  }
  

  /* ------------------------------------------------------------------
     TOUCH LAYOUT
     Everything below only comes into play when body.touch is set, which
     the script does after sniffing for a coarse pointer. On a desktop
     none of it exists, so the original layout is untouched.
     ------------------------------------------------------------------ */
  body.touch{ justify-content:flex-start; padding:6px 8px 14px; gap:8px;
              overscroll-behavior:none; }

  /* about 1.5cm of breathing room between the screen and your thumbs */
  /* 2cm further from the screen than the old layout: thumbs sit lower on a
     phone than the eye expects, and the pad was crowding the canvas. */
  #pad{ display:none; position:relative; z-index:1; width:100%; max-width:540px; margin-top:calc(56px + 2cm); }
  body.touch #pad{ display:block }

  #padDrive{ display:flex; justify-content:space-between; align-items:flex-end; gap:4px }
  #padL,#padR{ display:flex; flex-direction:column; align-items:center; gap:7px }
  /* Both thumbs get the same 135-degree arc, mirrored. Each pivots at the
     corner the thumb actually lives in, so the whole range is one sweep. */
  .fanpad{ display:block; touch-action:none;
           -webkit-user-select:none; user-select:none }
  /* The right hand does more work — three live pedals plus the trigger —
     so it gets the bigger arc. Removing the centre pause button paid for it. */
  /* The steering pad rides 2cm higher than the pedals: the left thumb sits
     further up the phone than the right one, which is doing bar-and-arc work. */
  #padL{ margin-bottom:2cm }
  #fanL{ width:172px; height:172px }
  #fanR{ width:184px; height:184px }
  .wedge{ fill:rgba(20,11,40,.92); stroke:rgba(124,58,237,.75); stroke-width:2.5;
          transition:fill .05s linear }
  .wedge.on{ fill:rgba(33,230,255,.30); stroke:#21e6ff }
  /* Traffic-light logic, so the pedal you are on is readable at a glance
     without looking away from the road: green go, yellow drift, red stop. */
  .wedge.gas{ fill:rgba(20,11,40,.96); stroke:rgba(124,255,79,.45) }
  .wedge.gas.on  { fill:rgba(124,255,79,.32); stroke:#7cff4f }
  .wedge.drift.on{ fill:rgba(255,210,63,.34); stroke:#ffd23f }
  .wedge.brake.on{ fill:rgba(255,61,79,.32);  stroke:#ff3d4f }
  .wlab{ fill:#a99fdc; text-anchor:middle; dominant-baseline:central;
         pointer-events:none }
  .wlab.ar{ font-size:26px }
  /* The centre of the steering fan is not a direction, it is where the thumb
     sits when you are going straight. Dashed and dimmed so it reads as a
     rest position rather than a third control. */
  /* The centre of the steering pad is not a direction, it is where the thumb
     sits when you are going straight — a ridged strip with the wheel on it,
     so it reads as a rest position rather than a third control. */
  .wedge.mid{ fill:rgba(28,18,54,.92); stroke:rgba(124,58,237,.5) }
  .wedge.mid.on{ fill:rgba(124,58,237,.22); stroke:rgba(167,140,255,.9) }
  .wedge.steer.on{ fill:rgba(33,230,255,.30); stroke:#21e6ff }
  .ridge{ stroke:rgba(150,125,220,.45); stroke-width:2; fill:none;
          pointer-events:none }
  .wheelicon{ pointer-events:none }
  .wheelicon circle{ fill:none; stroke:rgba(167,140,255,.75); stroke-width:2.2 }
  .wheelicon circle.hub{ fill:rgba(167,140,255,.75); stroke:none }
  .wheelicon path{ stroke:rgba(167,140,255,.75); stroke-width:2.2; fill:none }
  .wlab.sm{ font-size:14px; font-weight:700; letter-spacing:.02em;
            font-family:ui-monospace,Menlo,"Courier New",monospace }
  #bPause{ width:184px; height:34px; font-size:13px; letter-spacing:.3em }
  #bFire{ width:184px; height:54px }

  #padMenu{ display:none; flex-wrap:wrap; gap:8px; justify-content:center; padding:2px 0 }

  /* ------------------------------------------------------------------
     SLAB MENU  —  title, pause and game over
     Two columns that echo where your thumbs already are: the actions
     that start or change a run stack down the LEFT, under the steering
     fan, and the settings sit as icon tiles on the RIGHT, over the
     pedals. Garage and info are untouched — one is a D-pad and the
     other is two arrows, and neither wants a column.
     ------------------------------------------------------------------ */
  #padMenu.slabs{ flex-wrap:nowrap; align-items:stretch; justify-content:center;
                  gap:12px; padding:0 }
  #padMenu.slabs .col{ display:flex; min-width:0 }
  #padMenu.slabs .col.l{ flex:1 1 auto; flex-direction:column; gap:8px; max-width:236px }
  #padMenu.slabs .col.r{ flex:0 0 auto; display:grid; gap:8px;
                         grid-template-columns:repeat(2,72px);
                         grid-auto-rows:minmax(0,1fr) }

  /* A marquee, not a pill: square corners, a heavy lit edge down the
     left, and the label pushed off it rather than centred. */
  #padMenu .tbtn.slab{
    width:100%; min-width:0; height:52px; flex:0 0 auto;
    justify-content:flex-start; text-align:left;
    padding:0 12px 0 22px; border-radius:3px; border-width:2px;
    font-size:14px; letter-spacing:.15em; color:#eaf6ff;
    position:relative; overflow:hidden;
  }
  #padMenu .tbtn.slab::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:7px;
    background:rgba(150,110,255,.9); box-shadow:0 0 12px rgba(124,58,237,.9);
  }
  #padMenu .tbtn.slab.big::before{
    background:#ff2fbe; box-shadow:0 0 15px rgba(255,47,190,.95);
  }
  /* build 74: the TUTORIAL slab and its NEW HERE? badge */
  #padMenu .tbtn.slab.tut::before{ background:#7cff4f; box-shadow:0 0 14px rgba(124,255,79,.95) }
  #padMenu.slabs .col.l{ position:relative }
  #padMenu .newHere{ position:absolute; left:8px; top:100%; margin-top:8px;
    display:flex; align-items:center; gap:7px; pointer-events:none; white-space:nowrap;
    padding:4px 10px 4px 8px; border-radius:6px; background:rgba(8,3,20,.82);
    border:1px solid rgba(124,255,79,.55); box-shadow:0 0 10px rgba(124,255,79,.35);
    font:900 13px "Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif;
    letter-spacing:.06em; color:#7cff4f; text-shadow:0 0 8px rgba(124,255,79,.95), 0 0 2px #0a0418;
    animation:vlNewHere 1.04s ease-in-out infinite alternate }
  #padMenu .newHere svg{ width:14px; height:11px; fill:#7cff4f;
    filter:drop-shadow(0 0 4px rgba(124,255,79,.95)); animation:vlNewArrow .52s ease-in-out infinite alternate }
  @keyframes vlNewHere{ from{ opacity:.7 } to{ opacity:1 } }
  @keyframes vlNewArrow{ from{ transform:translateY(2px) } to{ transform:translateY(-2px) } }
  #padMenu .tbtn.slab.on::before, #padMenu .tbtn.slab:active::before{
    background:#ffffff; box-shadow:0 0 18px rgba(255,255,255,.9);
  }

  #padMenu .tbtn.tile{
    min-width:0; width:100%; height:100%; padding:6px 3px;
    flex-direction:column; gap:5px; border-radius:9px;
    font-size:9.5px; letter-spacing:.05em; line-height:1.1; text-align:center;
  }
  #padMenu .tbtn.tile svg{ width:26px; height:26px; flex:0 0 auto;
                           stroke:currentColor; fill:none; stroke-width:1.7;
                           stroke-linecap:round; stroke-linejoin:round }
  #padMenu .tbtn.tile .lab{ display:block; max-width:100%; word-break:break-word }
  #padMenu .tbtn{ min-width:104px; height:46px; flex:0 1 auto; padding:0 14px }
  #padMenu .tbtn.wide{ min-width:150px }
  #padMenu .tbtn.nav{ min-width:60px; font-size:17px }
  /* Garage navigation as a D-pad cross rather than a row of four arrows.
     Up/down move between rows and left/right change the part, so a cross
     maps the buttons onto what they actually do — a horizontal row made
     "up" and "left" look like the same kind of move. Back spans the
     bottom, well clear of the arrows you are repeatedly tapping. */
  #padMenu.cross{ grid-template-columns:repeat(3, 62px);
                  grid-auto-rows:46px; gap:7px;
                  justify-content:center; align-content:center; flex-wrap:nowrap }
  #padMenu.cross .up   { grid-area:1 / 2 }
  #padMenu.cross .left { grid-area:2 / 1 }
  #padMenu.cross .right{ grid-area:2 / 3 }
  #padMenu.cross .down { grid-area:3 / 2 }
  #padMenu.cross .backbtn{ grid-area:4 / 1 / 5 / 4; height:44px; min-width:0 }

  .tbtn{
    -webkit-tap-highlight-color:transparent; touch-action:none;
    -webkit-user-select:none; user-select:none;
    display:flex; align-items:center; justify-content:center;
    border-radius:13px; border:2px solid rgba(124,58,237,.75);
    background:linear-gradient(180deg, rgba(26,14,48,.92), rgba(10,5,22,.92));
    color:#cfd6ff; font-family:inherit; font-weight:700;
    font-size:12px; letter-spacing:.13em; text-transform:uppercase;

  /* ------------------------------------------------------------------
     FULLSCREEN OFFSETS
     Going fullscreen reclaims the browser chrome, which shifts everything
     up under thumbs that have not moved. These put it back.

     Portrait is scoped to its own orientation query on purpose. Written
     unscoped, `body.touch.fs #padL` would out-specify the landscape rules
     below and leak a portrait transform into landscape — which would also
     break the pinned pads, since a transformed ancestor becomes the
     containing block for position:fixed descendants.
     ------------------------------------------------------------------ */
  @media (orientation: portrait) and (pointer: coarse){
    /* The stage was starting under the front camera. Shift it down, again as
       a transform rather than a margin: a margin would push the pads down by
       the same amount, and they are already sitting as low as short phones
       allow. The pad clears the stage by 56px + 2cm, so spending 0.7cm of
       that gap costs nothing. Landscape already has room and is untouched. */
    body.touch #stage{ transform:translateY(0.7cm) }
  }
  @media (orientation: portrait) and (pointer: coarse){
    /* A transform, not a margin. Two reasons:

       1. The margin version was clamped against 100dvh so it could not push
          the bolt bar off a short screen — but the clamp's floor was the
          non-fullscreen value, so on any viewport under ~709px it resolved
          to exactly where the pad already was and moved nothing at all. A
          safety rail that silently cancels the feature is worse than no
          rail. This has no conditions left to misfire.

       2. transform is visual only. It never changes layout height, so it
          cannot reflow the stage or alter what the flex column measures —
          it just slides both groups down into the space fullscreen freed. */
    body.touch.fs #padL,
    body.touch.fs #padR{ transform:translateY(1cm) }
  }

  /* ------------------------------------------------------------------
     LANDSCAPE — PASS 1: layout only
     A pure override layer. Every rule here is scoped to landscape *and* a
     coarse pointer, so the portrait build above is bit-for-bit untouched:
     nothing in this block can fire on a desktop or on a phone held upright.

     The trick that keeps it simple is taking the two pads out of flow with
     position:fixed and pinning them to the screen edges. The stage then
     stays a plain centred block and just gets a tighter max-width. Because
     the pads are still DOM children of #padDrive, the existing JS that hides
     that container when you are not driving keeps working untouched — an
     ancestor set to display:none hides fixed descendants too.
     ------------------------------------------------------------------ */
  @media (orientation: landscape) and (pointer: coarse){
    /* #circuit and the z-index layering are now global — nothing to add. */
    /* In landscape the notch moves to one SIDE and the home indicator runs
       along the bottom. The pads are position:fixed, so body padding never
       reaches them — they have to read the insets themselves. */
    body.touch{ justify-content:center; gap:4px;
                padding:4px calc(6px + env(safe-area-inset-right, 0px))
                        calc(4px + env(safe-area-inset-bottom, 0px))
                        calc(6px + env(safe-area-inset-left, 0px)); }
    body.touch #pad{ margin-top:0; width:auto; max-width:none }
    body.touch #padDrive{ display:block }

    #padL, #padR{ position:fixed; top:50%; transform:translateY(-50%);
                  margin:0; z-index:5 }
    #padL{ left:calc(6px + env(safe-area-inset-left, 0px)) }
    #padR{ right:calc(6px + env(safe-area-inset-right, 0px)) }
    /* Only the steering pad: the pedal stack is taller and already sits
       where the right thumb wants it. */
    body.fs #padL{ transform:translateY(calc(-50% + 1cm)) }

    /* ~15% smaller than portrait, traded for stage width */
    #fanL{ width:146px; height:146px }
    #fanR{ width:156px; height:156px }
    #bPause{ width:156px; height:30px; font-size:12px }
    #bFire{ width:156px; height:46px }
    #padL, #padR{ gap:6px }

    /* 336px is the two pinned columns plus their gutters */
    #stage{ width:100%; height:auto;
            max-width:calc(100vw - 336px
                           - env(safe-area-inset-left, 0px)
                           - env(safe-area-inset-right, 0px));
            max-height:calc(100dvh - 10px - env(safe-area-inset-bottom, 0px)) }

    /* The menu strip floats over the lower canvas instead of stacking under
       it. Stacking would cost the stage ~100px of height on every screen,
       including while driving, to make room for buttons that only appear
       when you are stopped. */
    #padMenu{ position:fixed; left:50%; transform:translateX(-50%);
              bottom:calc(8px + env(safe-area-inset-bottom, 0px));
              max-width:calc(100vw - 348px
                             - env(safe-area-inset-left, 0px)
                             - env(safe-area-inset-right, 0px));
              gap:6px; z-index:6 }
    #padMenu .tbtn{ min-width:92px; height:40px; font-size:11px; padding:0 11px }
    #padMenu .tbtn.wide{ min-width:126px }
    #padMenu .tbtn.nav{ min-width:52px; font-size:16px }

    /* In landscape the slab block stops being a strip and splits: the run
       actions pin to the left edge where the steering fan lives, the setting
       tiles pin to the right edge over the pedals. The two columns land in
       the same gutters the stage already reserves for the driving pads, so
       the track stays fully visible behind a menu instead of wearing one.

       The layer spans the viewport with pointer-events:none and hands them
       back on the columns only, so a tap in the middle still reaches the
       canvas — which is what starts a run from the title screen. */
    #padMenu.slabs{
      position:fixed; left:0; right:0; top:0; bottom:0;
      transform:none; max-width:none; width:auto; gap:0;
      align-items:center; justify-content:space-between;
      padding:0 calc(6px + env(safe-area-inset-right, 0px))
              0 calc(6px + env(safe-area-inset-left, 0px));
      pointer-events:none;
    }
    #padMenu.slabs .col{ pointer-events:auto }
    /* 6 + 158 = 164px, inside the 168px gutter the stage leaves on each
       side, so neither column can reach onto the canvas. */
    #padMenu.slabs .col.l{ max-width:158px; gap:6px }
    #padMenu.slabs .col.r{ grid-template-columns:repeat(2,56px);
                           grid-auto-rows:56px; gap:6px }
    #padMenu .tbtn.slab{ height:42px; font-size:11px; letter-spacing:.06em;
                         padding:0 8px 0 16px }
    #padMenu .tbtn.slab::before{ width:6px }
    #padMenu .tbtn.tile{ font-size:8.5px; gap:3px; padding:4px 2px }
    #padMenu .tbtn.tile svg{ width:22px; height:22px }
    #padMenu .newHere{ left:4px; font-size:11px; letter-spacing:.03em; gap:5px; padding:3px 7px 3px 6px }
    #padMenu .newHere svg{ width:12px; height:9px }
    /* The garage cross moves out of the middle and into the steering pad's
       column, which is empty on that screen anyway — padDrive is hidden
       whenever you are not driving. Centred, it sat on top of the car you
       are trying to look at. Sized to stay clear of the stage's left edge
       (6 + 146 + 8 = 160px in), so it overlaps nothing. */
    #padMenu.cross{ grid-template-columns:repeat(3, 48px);
                    grid-auto-rows:34px; gap:4px;
                    left:calc(6px + env(safe-area-inset-left, 0px));
                    right:auto; bottom:auto; top:50%;
                    transform:translateY(-50%); max-width:none }
    #padMenu.cross .backbtn{ height:32px }
  }
  @supports not (height: 100dvh){
    @media (orientation: landscape) and (pointer: coarse){
      #stage{ max-height:calc(100vh - 10px - env(safe-area-inset-bottom, 0px)) }
    }
  }

            font-family:"Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif; line-height:1.3 }
  #tutCard .tTag{ font:700 .62em ui-monospace,Menlo,"Courier New",monospace; letter-spacing:.12em;
                  color:#8a7ec4; margin-bottom:.35em }
  #tutCard .tHead{ font-size:1.45em; color:#7cff4f; letter-spacing:.02em;
                   text-shadow:0 0 12px rgba(124,255,79,.55) }
  #tutCard .tBody{ margin:.45em 0 .1em; font:700 1em/1.35 ui-monospace,Menlo,"Courier New",monospace;
                   color:#eaf0ff }

  /* build 78: each button sits above its own key cap, so it is clear which key does what */
  #tutCard .tBtns{ display:flex; gap:1.1em; justify-content:center; align-items:flex-start; margin-top:.8em; flex-wrap:wrap }
  #tutCard .tOpt{ display:flex; flex-direction:column; align-items:center; gap:.5em }
  #tutCard .tGo{ font:800 .72em ui-monospace,Menlo,"Courier New",monospace; color:#7cff4f; letter-spacing:.1em;
                 padding:.25em .8em; border:1.5px solid rgba(124,255,79,.75); border-radius:6px;
                 background:rgba(124,255,79,.08); box-shadow:0 2px 0 rgba(124,255,79,.35) }
  #tutCard .tOpt.main .tGo{ animation:tutPulse 1.2s ease-in-out infinite }
  #tutCard button{ pointer-events:auto; cursor:pointer; font:800 .8em ui-monospace,Menlo,"Courier New",monospace;
                   color:#eaf6ff; background:rgba(33,230,255,.14); border:2px solid #21e6ff;
                   border-radius:9px; padding:.55em 1.1em; letter-spacing:.06em }
  #tutCard button.skip{ border-color:#8a7ec4; color:#a99fdc; background:rgba(138,126,196,.10) }
  /* build 73: the live boxes and the fading dim over the moving road. It never takes a touch. */
  #tutFx{ display:none; position:fixed; inset:0; width:100%; height:100%; z-index:40; pointer-events:none }

  /* ------------------------------------------------------------------
     BUILD 103 - the START GATE (#gate) and the LEAVE-THE-RACE box (#leave).
     Two fixed layers above everything (the canvas, the phone pad, the tutorial). Each sits hidden until
     the script adds .on. The gate dims the main menu until the first click / tap / key; the leave box
     is the "are you sure?" on the pause screen.
     ------------------------------------------------------------------ */
  #gate, #leave{ display:none; position:fixed; inset:0; z-index:80; align-items:center; justify-content:center;
                 -webkit-user-select:none; user-select:none; touch-action:none;
                 font-family:"Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif }
  #gate.on, #leave.on{ display:flex }
  #gate{ background:rgba(5,2,14,.64); cursor:pointer; -webkit-tap-highlight-color:transparent }
  #gate .gBox{ box-sizing:border-box; max-width:88vw; text-align:center; padding:.8em 1.5em .95em; border-radius:16px;
               font-size:clamp(13px,3.1vmin,30px); background:rgba(8,4,18,.9); border:2px solid #21e6ff;
               box-shadow:0 0 28px rgba(33,230,255,.55), 0 0 64px rgba(255,47,190,.28), inset 0 0 0 1px rgba(255,255,255,.14) }
  #gate .gHead{ font-size:2.1em; line-height:1.1; letter-spacing:.03em; color:#fff;
                text-shadow:0 0 16px #ff2fbe, 0 0 4px #ff2fbe }
  #gate .gGo{ display:inline-block; margin-top:.6em; padding:.4em 1.2em; border-radius:9px;
              font:800 1.05em ui-monospace,Menlo,"Courier New",monospace; letter-spacing:.14em; color:#7cff4f;
              border:2px solid rgba(124,255,79,.8); background:rgba(124,255,79,.1);
              box-shadow:0 0 14px rgba(124,255,79,.35); animation:gatePulse 1.2s ease-in-out infinite }
  #gate .gSub{ margin-top:.8em; font:700 .62em ui-monospace,Menlo,"Courier New",monospace; letter-spacing:.12em; color:#8a7ec4 }
  #gate .gSub:empty{ display:none }
  @keyframes gatePulse{ 0%,100%{ opacity:.62; transform:scale(1) } 50%{ opacity:1; transform:scale(1.05) } }
  #leave{ background:rgba(5,2,14,.58) }
  #leave .lBox{ box-sizing:border-box; width:min(88vw,540px); text-align:center; padding:.85em 1.1em 1em; border-radius:14px;
                font-size:clamp(12px,2.7vmin,22px); background:rgba(8,4,18,.94); border:2px solid #ffd23f;
                box-shadow:0 0 24px rgba(255,210,63,.4), inset 0 0 0 1px rgba(255,255,255,.14) }
  #leave .lHead{ font-size:1.65em; line-height:1.1; letter-spacing:.02em; color:#ffd23f; text-shadow:0 0 12px rgba(255,210,63,.55) }
  #leave .lBody{ margin:.7em 0 .15em; font:700 1em/1.4 ui-monospace,Menlo,"Courier New",monospace; color:#eaf0ff }
  #leave .lBtns{ display:flex; gap:.9em; justify-content:center; align-items:stretch; flex-wrap:wrap; margin-top:1em }
  #leave button{ cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.35em; min-width:9em;
                 font:800 .9em ui-monospace,Menlo,"Courier New",monospace; letter-spacing:.06em;
                 border-radius:9px; padding:.6em 1.1em }
  #leave button .k{ font-size:.68em; letter-spacing:.12em; opacity:.8 }
  #leave button.stay{ color:#eaf6ff; background:rgba(33,230,255,.14); border:2px solid #21e6ff }
  #leave button.go{ color:#ffd23f; background:rgba(255,210,63,.1); border:2px solid #ffd23f }
  body.touch #leave button .k{ display:none }
</style>

<script>
(function(){
"use strict";

var cv = document.getElementById('c'), ctx = cv.getContext('2d');
/* BUILD 104 - TWO LAYERS. `cv` / `ctxW` is the WORLD layer: the zone's CSS grade (ZN.grade) sits on this canvas only.
   `cv2` / `ctx2` is the TOP layer, stacked over it and never graded. The global `ctx` is whichever layer is being drawn
   on right now; render() switches it with useWorld() / useTop(). After render() it is left on the top layer, so any
   stray draw (the FPS meter) lands on the UI. */
var cv2 = document.getElementById('c2'), ctx2 = cv2.getContext('2d'), ctxW = ctx;
function useWorld(){ ctx = ctxW; }
function useTop(){ ctx = ctx2; }
var wBlank = true;                 /* the world layer is empty (the garage covers the stage) */
var W = 800, H = 500; // Base logical resolution
var BUILD_NO = 105;     /* build 99: Carlos's 2nd garage notes (classic lock, bigger NEW dot, green 'changed' dot, MODS, Q / E chevrons). Bump it with every build. */

/* ------------------------------------------------------------------
   TYPE SCALE  (2026-09-04)

   Seven steps, in this 800x500 logical space. Every piece of type in
   the game picks a step from here; no call site invents its own size.
   Hierarchy comes from SIZE + COLOUR + TREATMENT, never from a size
   nudged a pixel or two away from its neighbour -- that was what made
   the old screens read as noise. The two face stacks are unchanged.

   SIZE and FACE are independent axes. BODY is usually mono prose, but
   the secondary record readout is BODY in the display face; that is
   deliberate, not a slip.
   ------------------------------------------------------------------ */
var TS = {
  DISPLAY: 72,   /* the logo, and nothing else                         */
  TITLE:   48,   /* moment headings over live play: PAUSA, GAME OVER   */
  SUB:     32,   /* screen headings: COMO FUNCIONA, GARAJE, final score*/
  HERO:    24,   /* live numbers, the one CTA per screen, section heads*/
  BODY:    18,   /* prose meant to be read; secondary numbers          */
  LABEL:   14,   /* every HUD label and menu key label                 */
  MICRO:   11    /* footnotes and dense stat strips                    */
};

/* Touch multiplier. The stage is 800 logical px landing in roughly 374
   physical ones on a phone, so the two smallest steps arrive at about
   half their intended size. They grow TOGETHER, by one factor, instead
   of one corner being hand-tuned larger than the rest -- that is what
   left DERRAPE at 22px while PUNTOS sat at 13px. Only LABEL and MICRO
   are multiplied: HERO and up are already large enough to survive the
   squeeze, and growing them would burst the HUD panel geometry. */
var UI = 1;
var dpr = window.devicePixelRatio || 1;
cv.width = W * dpr;
cv.height = H * dpr;
ctx.scale(dpr, dpr); // Scale the context so everything draws crisply on high-res screens
cv2.width = cv.width; cv2.height = cv.height;      /* build 104 */
ctx2.scale(dpr, dpr);

/* RENDER SCALE (build 70). `dpr` used to be the screen's full pixel ratio,
   whatever size the stage ended up on screen. A phone shows the stage at
   ~536x335 CSS px in landscape (~376x235 upright) but was drawing
   800x500 x 2.75 = 2200x1375 and throwing most of it away: 2.2x the pixels
   it shows sideways, 4.5x upright. Now the backing store matches the size
   the canvas is actually shown at, capped at the pixel ratio (never more
   pixels than before) and floored at 1x. The Mac in the itch embed
   (928 CSS px wide) and in fullscreen still lands on exactly 2x, so the
   desktop picture is unchanged. k is a multiple of 0.01, which makes
   W*k and H*k whole numbers (8m and 5m). Re-run on resize, rotation and
   fullscreen through scheduleCircuit(). */
function fitCanvas(){
  var d=window.devicePixelRatio||1, r;
  try{ r=cv.getBoundingClientRect(); }catch(_){ return; }
  if (!r || !(r.width>50)) return;             /* hidden or not laid out yet */
  var k=Math.min(d, Math.max(1, r.width*d/W));
  k=Math.round(k*100)/100;
  var cw=Math.round(W*k), chh=Math.round(H*k);
  if (cw===cv.width && chh===cv.height){ dpr=k; return; }
  dpr=k; cv.width=cw; cv.height=chh;           /* render() sets the transform */
  cv2.width=cw; cv2.height=chh;                /* build 104: the top layer always matches the world layer */
}

/* ---------------------------------------------------------------
   PROJECTION
--------------------------------------------------------------- */
var FOV = 100;
var camDepth  = 1 / Math.tan((FOV/2) * Math.PI/180);
var camH      = 1500;
var yOff      = -38;
var roadWidth = 1200;
var segLength = 200;
/* A coarse pointer means fingers, not a mouse. Everything mobile-specific
   hangs off this one flag so the desktop build is bit-for-bit unchanged. */
var TOUCH = (function(){
  try{
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return true;
    return (navigator.maxTouchPoints||0) > 0 && !window.matchMedia('(pointer: fine)').matches;
  }catch(e){ return false; }
})();

if (TOUCH) UI = 1.45;

/* Shorter sight line on a phone: ~25% fewer sprites, props and grid lines to
   push each frame. Still leaves about 2.5s of warning on approaching traffic. */
var MAXZ      = TOUCH ? 42000 : 56000;
var horizonY  = H/2 + yOff;
var topRow    = Math.ceil(horizonY) + 2;

/* The player sprite is not at the camera — it sits some way down the road.
   Everything the car interacts with (the bend it is drawn on, its hitbox,
   the road edges, the checkpoint line) is measured from HERE, not from the
   camera, otherwise the picture and the physics disagree on a curve. */
var PLAYER_Y = H - 34;
var Z_CAR    = camDepth*camH*(H/2)/(PLAYER_Y - H/2 - yOff);
var PPU_CAR  = (camDepth/Z_CAR)*roadWidth*W/2;

var LANES = [-0.75, -0.25, 0.25, 0.75];
var CAR_W = 0.26;                 // car width in road units (road spans -1..1)
/* how deep the hitbox is, front and back — measured so a crash fires exactly
   when the two sprites start to overlap on screen, not before */
var HIT_FRONT = 270;
var HIT_BACK  = 215;
var DRIFT_HOLD = 0.80;  // throttle+brake settles here: drifting costs 20% of top speed
var MAX_HULL   = 4;      // default only; the chassis decides the real cap
var WEAVE_EVERY= 5;      // a van reconsiders its lane this often
var WEAVE_TTC  = 1.7;    // ...but never inside this many seconds of you
var CP_MSG     = 3.4;   // lap banners hold on screen this long
var MAX_SHOTS  = 3;
var OD_TIME    = 11;     // overdrive: unlimited fire
/* Two rate limits, not one. Overdrive rounds pierce and keep travelling, so
   at 9 a second they cleared the road faster than it could fill and the lap
   drove itself; 2 a second still clears a queue but you have to aim it. The
   manual trigger keeps the old, snappier gate — with three shots in the
   magazine there is nothing there to farm. */
var OD_CD      = 0.50;   // overdrive: rounds a second while the trigger is held
var FIRE_CD    = 0.11;   // ...the three manual shots stay as quick as they were
var OD_COLS    = ['#b06cff','#7cff4f','#ff6a3d','#ffffff'];
var DINO_TIME  = 15;     // seconds of rampage
var DINO_WARN  = 2;      // ...with this long of a warning before it drops
var DINO_CAR_W = 0.62;   // you, as a dinosaur, in road units (a car is 0.26)
var DINO_PU_W  = 0.45;   // the pickup itself, a shade larger than the heart (1.5x)
var DINO_HIT   = 0.44;   // half your width plus half a car's
var HEART_W   = 0.285;  // heart and bolt pickups, both drawn from this (1.5x)
/* Reach is derived, not typed in: the pickups were scaled up 1.5x and a
   hand-written radius would have left you driving through a sprite you
   visibly overlapped. Half a car plus half a pickup, same as before. */
var HEART_R   = CAR_W/2 + HEART_W/2;    // 0.2725
var DINO_R    = CAR_W/2 + DINO_PU_W/2;  // 0.355
/* NEAR MISS tuning. A lane is 0.5 road units wide and a car is 0.26, so the
   band below reaches 0.115 units past the paintwork on each side — under half
   a lane. Sitting in the next lane over is ~0.5 away and never fires; you have
   to deliberately shave the gap. */
var NM_BAND     = 0.375;
var NM_CHAIN_T  = 1.6;    // seconds before the chain lapses
var NM_BASE     = 55;     // points for one clean pass at chain 1
var NM_MAX_MULT = 8;      // chain multiplier ceiling
var NM_POP_LIFE = 1.5;    // seconds the closeness readout stays up
/* build 91 (Carlos 10-21): a close call also fills the drift bar, straight into the BANK (cyan, safe: the pass is
   already clean, so there is nothing to put at risk). Linear on the x-readout the player sees (rounded to 0.1):
   x0.5 -> 2 %, x1.0 -> 4.5 %, x1.5 -> 7 % (0.5 % per 0.1). A full bar is a bolt, exactly as from a drift. */
var NM_FILL_LO  = 0.02;   // bar share for x0.5 (the outer edge of the band)
var NM_FILL_HI  = 0.07;   // bar share for x1.5 (a paint-scraping pass)
/* Drifting charges a bolt, gated three ways so the meter cannot be farmed by
   waggling the wheel down an empty straight:
     1. BEND  — the rate scales with how hard the road curves where the car
                actually is, and is exactly zero on a straight, so the farm is
                impossible rather than merely slow.
     2. SPEED — below DR_MIN_SPD of top speed a drift earns nothing. Note that
                holding both pedals settles at DRIFT_HOLD (0.80) exactly, so
                the gate sits just under it: an exact-equality test would be
                knife-edge against float and the shoulder drag.
     3. EXIT  — charge accrues into a pot that only becomes a bank when you
                come out of the drift still on the road. Crash out of it, or
                put a wheel on the shoulder, and the pot is gone. */
var DR_RATE     = 0.198;  // bank per second at a full-strength bend
var DR_MIN_SPD  = 0.78;   // share of maxS below which a drift pays nothing
var DR_MIN_BEND = 0.18;   // share of S_PEAK below which the road reads straight
var PW    = CAR_W * PPU_CAR;      // drawn width == hitbox width
var CP_BONUS   = 32;   // (legacy) the real award now scales with the leg
                       // CLOCK_CAP removed 2026-08-18 — see the checkpoint block
var CRASH_TIME = 2;


/* ---------------------------------------------------------------
   ZONES
   Authored in the Zone Lab and pasted in whole. The schema is the
   lab's COPY ZONE JSON payload, field for field, so an export drops
   in without translation.

   `vapor` is the game exactly as it shipped in build 58 — every value
   below was read back off the old hardcoded literals, not retyped from
   the lab. Two fields deliberately differ from the lab's VAPOR: the
   lab gives it a 0.16 magenta horizon haze and a five-colour traffic
   palette, and the game has neither. Keeping the game's values means
   build 59 changes nothing you have already played; flip `haze.a` to
   0.16 and `traffic` to the lab's list if you want them to match.

   Physics dials (`curve`, `len`, `grip`, `cf`) follow the four-edit
   plan in the zone-system doc. VAPOR sits at 1/1/1 with cf 1.0, which
   is today's behaviour, so the whole base game is untouched until you
   decide the global CF_GAIN question.
--------------------------------------------------------------- */
var ZONES = {

vapor: {
  id:'vapor', name:'VAPOR', accent:'#ff2fbe',
  sky:['#0a0418','#2a0b4e','#6b1170'], skyMid:0.55,
  haze:{col:'#ff2fbe', a:0, h:70},
  stars:{n:90, col:'#dcefff', tw:1},
  orb:{on:1, r:88, y:18, cols:['#fff27a','#ff9b3d','#ff2fbe'],
       glow:'rgba(255,80,190,.85)', slats:7, slatCol:'rgba(12,4,26,0.85)'},
  skyline:{on:1, fill:'#14062b', edgeA:'33,230,255', edgeB:'255,47,190', win:'33,230,255'},
  ground:['#2c0e4c','#170830','#0a0418'],
  grid:{major:'255,47,190', minor:'124,58,237', ring:'33,230,255'},
  fog:[44,14,74], fogPow:3.2,
  road:{a:[27,23,44], b:[19,16,32], rumA:[0,236,255], rumB:[255,46,190], lane:[228,235,255]},
  posts:['#21e6ff','#ff2fbe'],
  props:['#7cff4f','#21e6ff','#ff2fbe','#ffd23f','#b06cff','#ff6a3d'],
  propStruct:'138,104,206', propWarm:'#ffb15a', gate:'#7cff4f',
  lamp:'#21e6ff',   /* build 76: swan-neck lamps, one colour */
  traffic:['#f2f6ff','#ffd23f','#7cff4f','#ff6a3d','#3dffc0'],   /* build 76: no hot pink (Carlos); build 75: ice white for cyan, mint for violet */
  weather:'none', wcol:'#ffffff', wamt:0.5,
  bloom:1, grade:{bri:1, con:1, sat:1, hue:0},
  propMask:127, propDens:1, groundFog:0, fogMul:1, bloomMul:1, weatherAmt:1,
  curve:1, len:1, grip:1, cf:1, mult:1 },

/* Carlos's first authored zone, 2026-09-12. The colours below are the
   RAW export — they are green. The rose/purple you screenshotted is
   `grade.hue:180` rotating them, which the game now applies as a CSS
   filter on the canvas exactly as the lab does. Nothing is baked, so
   re-exporting from the lab overwrites this block cleanly. */
vaporEdit: {
  id:'vapor-edit', name:'ALIEN PLAINS', accent:'#ff2fbe',
  sky:['#03100a','#0a2a16','#1e5220'], skyMid:0.58,
  haze:{col:'#a8ff4f', a:0.46, h:96},
  stars:{n:31, col:'#c8ffb0', tw:0.4},

   HUD's; both are 1 (full) unless govFrame() sees frames keep arriving late,

var GQ = 1, HQ = 1;
function blur(v){ return v*GB*GQ; }

/* The lab does its grade as a CSS filter on the canvas element rather
   than a per-frame ctx.filter, so it costs nothing to draw and the
   compositor does the work. Same here. */
/* Build 104: the grade is a CSS filter on the WORLD canvas (#c) only. The top canvas (#c2) has no filter, so the car, the
   HUD and every menu keep their natural colours in a graded zone. A zone's own colour tables still hold the RAW values the
   filter turns into the final look. What goes on which layer is decided in render(): to move something from one to the
   other, call useWorld() / useTop() around it. */
function gradeString(){
  var g=ZN.grade;
  return 'brightness('+g.bri.toFixed(2)+') contrast('+g.con.toFixed(2)+
         ') saturate('+g.sat.toFixed(2)+') hue-rotate('+Math.round(g.hue)+'deg)';
}

  var f=gradeString();

}

function mix(c, f){
  var F=ZN.fog;
  return 'rgb(' + ((c[0]+(F[0]-c[0])*f)|0) + ',' +
                  ((c[1]+(F[1]-c[1])*f)|0) + ',' +
                  ((c[2]+(F[2]-c[2])*f)|0) + ')';
}

var rowZ=[], rowPPU=[], rowFog=[], rowCol=[];
/* This used to be a top-level loop that ran once at load, which meant the
   game physically could not change road colour. It is a function now; it
   is ~500 rows and sub-millisecond, and it only runs on a zone change. */
function rebuildRows(){
  var R=ZN.road, pw=ZN.fogPow*ZN.fogMul;
  for (var y=0; y<H; y++){
    if (y < topRow){ rowZ[y]=Infinity; rowPPU[y]=0; rowFog[y]=1; rowCol[y]=null; continue; }
    var denom = y - H/2 - yOff;
    var z = camDepth*camH*(H/2)/denom;
    var sc = camDepth/z;
    var f  = Math.pow(Math.min(1, z/MAXZ), pw);
    rowZ[y]=z; rowPPU[y]=sc*roadWidth*W/2; rowFog[y]=f;
    rowCol[y]={ a:mix(R.a,f), b:mix(R.b,f),
                ra:mix(R.rumA,f), rb:mix(R.rumB,f), ln:mix(R.lane,f) };
  }
}
rebuildRows();

  var sc = camDepth/zRel;
  return { ppu: sc*roadWidth*W/2, y: H/2 + sc*camH*(H/2) + yOff };

/* ---------------------------------------------------------------
   THE ROAD'S CENTRELINE
--------------------------------------------------------------- */
var CH = 400;                 // chunk length in world units
var SLOPE_MAX = 8.2e-4;       // safety ceiling
var S_PEAK    = 6.0e-4;       // sharpest bend at full strength
var P_STRAIGHT= 0.42;         // share of sections that are straight

var kA=[], slA=[0], ofA=[0], genN=0;
var secAmp=0, secLen=26, secPos=0, lastDir=1;

function trackReset(){
  kA=[]; slA=[0]; ofA=[0]; genN=0;
  secAmp=0; secLen=26; secPos=0;      // open on a short straight
  lastDir = Math.random()<0.5 ? -1 : 1;
}
function newSection(){
  secPos=0;
  if (learn){                           /* build 72: a scripted road */
    if (tut && tut.wantBend){ tut.wantBend=false; tutBendSection(); return; }
    secLen=20; secAmp=0; slA[genN]=0;   /* short flat sections: a requested bend is never far off */
    return;
  }
  if (Math.random() < P_STRAIGHT){
    secLen=(50+Math.random()*100)|0;  // 20k–60k units of open road
    secAmp=0;
    slA[genN]=0;                      // land it perfectly flat
    return;
  }
  secLen=(90+Math.random()*110)|0;    // 36k–80k units: a long sweeper
  /* Section LENGTH is the dial that was never exposed, and it is capped by
     nothing — it holds peak push constant while changing how fast the force
     arrives and how much ground it covers. Short is busy, long is heavy. */
  secLen=Math.max(8,(secLen*Z().len)|0);
  var dir = Math.random()<0.72 ? -lastDir : lastDir;
  lastDir = dir;
  /* Multiplied HERE and nowhere else. drawBendWarning() and the drift-charge
     term keep measuring against the global S_PEAK on purpose, so a sharper
     zone objectively warns more and pays more. */
  var peak = (0.5+Math.random()*0.5)*S_PEAK*Z().curve;
  secAmp = dir * peak*Math.PI/(secLen*CH);
}

function genChunk(){
  if (secPos >= secLen) newSection();
  var k = secAmp * Math.sin(2*Math.PI*(secPos+0.5)/secLen);
  secPos++;
  var s0=slA[genN], s1=s0 + k*CH;
  if (secPos>=secLen && secAmp!==0) s1=0;             // exit the bend flat
  /* the safety ceiling scales with the zone, or a sharp zone would be
     silently flattened back to VAPOR's geometry by its own clamp */
  var lim = SLOPE_MAX*Math.max(1,Z().curve);
  if (s1 >  lim) s1 =  lim;
  if (s1 < -lim) s1 = -lim;
  k = (s1-s0)/CH;
  kA[genN]   = k;
  ofA[genN+1]= ofA[genN] + s0*CH + 0.5*k*CH*CH;
  slA[genN+1]= s1;
  genN++;
}
function ensure(z){
  var need=Math.floor(z/CH)+2;
  while (genN < need) genChunk();
}
function curveAt(z){
  if (z<0) z=0;
  var i=Math.floor(z/CH); if (i>=genN) ensure(z);
  var t=z-i*CH;
  return ofA[i] + slA[i]*t + 0.5*kA[i]*t*t;
}
function slopeAt(z){
  if (z<0) z=0;
  var i=Math.floor(z/CH); if (i>=genN) ensure(z);
  return slA[i] + kA[i]*(z-i*CH);
}
var cAnchor=0;
function bend(zRel){ return curveAt(position+zRel)-cAnchor; }

/* ---------------------------------------------------------------
   DIFFICULTY
--------------------------------------------------------------- */
/* The whole block below was re-derived on 2026-08-18 against a driving
   simulation rather than arithmetic. The old numbers assumed a leg takes
   lapLength/maxSpeedFor(l) seconds — flat out, start to finish. Measured, that
   is true on lap 1 and nowhere near true after lap 6: from there you are
   threading traffic and lifting off, and the only genuinely flat-out seconds
   are inside the rampage and overdrive windows. At lap 12 the leg takes ~44s
   against a 35s flat-out time. Every constant here is set from the measured
   time, not the divided one. */
function maxSpeedFor(l){
  /* build 72: the learn run has its own top speed, and laps 1-3 start gentler */
  if (learn) return 11500*LEARN_SPEED*CH_().spd;
  var e = (EASY_ON && l>=1 && l<=3) ? EASY_SPD[l-1] : 1;
  return Math.min(14800, 11500 + (l-1)*640) * CH_().spd * e;
}
/* What one wrecked car is worth. Doubled while you are the dinosaur: rampage
   is short, it ends whether you used it well or not, and paying flat made it
   a survival break rather than a scoring window. Both kill sites read this,
   so ramming and shooting can never drift apart. */
/* Every point in the game goes through here, so a zone multiplier is one
   line instead of seven. */
function addScore(n){ if (learn) return; score += n*ZN.mult; prSet('score', score|0); }   /* build 96 */   /* build 72: a lesson scores nothing */
function killScore(){ return 300*(1+0.2*(lap-1))*(dinoT>0?2:1); }
/* Shorter than before at the start — the first checkpoint now lands at ~17s
   instead of 21s — and longer than before at the end. 520k rather than 620k:
   a 620k leg runs ~57s, and dying 50 seconds from the nearest checkpoint
   reads as unfair rather than tense. */
function lapLength(l){
  var n = Math.min(520000, 190000 + (l-1)*41000);
  return (EASY_ON && l>=1 && l<=3) ? Math.round(n*EASY_LEN) : n;     /* build 73: laps 1-3 are 75 % of their old length */
}
/* THE CLOCK. The award used to be a flat 1.28 x the flat-out leg time, which
   means it was DEFINED as 28% more time than the leg costs — so a clean lap
   banked ~+9s at every lap, forever, and by lap 12 you were carrying 140s and
   the timer was decoration. Two things fix that. One: from the mid laps the
   leg takes far longer than flat-out, so a fixed multiple of flat-out time
   quietly tightens on its own. Two: this taper, which stops the early laps
   compounding. Measured result — margin runs +9s on lap 1, crosses zero at
   lap 9, and sits near -4s a lap after that, so the clock peaks around 116s
   and then drains. The run has an ending again.
   Too harsh? Raise the 1.16 floor: 1.20 gives -2.6s/lap late, 1.24 ~breaks even. */
function cpMult(l){      return Math.max(1.16, 1.60 - (l-1)*0.055); }
function cpBonus(l){     return Math.round(lapLength(l)/maxSpeedFor(l)*cpMult(l)); }
/* Two slopes, not one. Every curve in this block used to flatten at lap 7,
   which is why laps 9 and 10 played identically to 7 — measured at 2.14 cars
   passed per second and 11.3 cars on the road ahead, flat forever. The second
   slope runs from 7 to 12 at roughly a quarter of the first one's rate and
   lands at 3.1 cars/sec with 17.9 ahead: about half again as much traffic,
   arrived at over five laps rather than in one step.
   Note that the spawn gate is what actually sets density here — clusterWin
   and maxCluster measured a 0% rejection rate at every lap, so they are not
   the lever and are left alone. */
function trafficTop(l){  return l<=6 ? Math.min(6600, 3800 + (l-1)*560)
                                     : Math.min(7400, 6600 + (l-6)*115); }
/* Density. Lap 1 was 0.83 cars a second — one car every 1.2 seconds spread
   across four lanes — which is why nobody who tried the game for ninety
   seconds ever saw it get interesting. It now opens at 1.15 and keeps
   climbing past where the old curve flattened.
   Simulated against this spawner including its own refusals: it declines a
   spawn when three cars already sit inside clusterWin, or when placing one
   would leave fewer than two lanes open. Below ~0.20 those refusals start to
   bite (3-4% at lap 16) — that is the practical ceiling of a four-lane road,
   and going past it means raising maxCluster to 4, which throws away the
   guarantee that a gap exists at all. Do not. */
function spawnGap(l){
  var g = l<=7 ? Math.max(0.36, 0.83 - (l-1)*0.078)
               : Math.max(0.20, 0.36 - (l-7)*0.020);
  return (EASY_ON && l>=1 && l<=3) ? g*EASY_GAP[l-1] : g;     /* build 72 */
}
function clusterWin(l){  return Math.max(2600, 4600 - (l-1)*260); }
function maxCluster(l){  return l<2 ? 2 : 3; }
/* Vans from lap 5 instead of lap 8 — three and a half minutes of waiting for
   the signature hazard was most of why the early game felt empty. Capped at
   38%: maxCluster only guarantees a gap at the moment a car is CREATED, and
   weavers move afterwards, so a high share turns "hard" into "random". */
function weaverOdds(l){  return l<5 ? 0 : Math.min(0.38, 0.14 + (l-5)*0.045); }

/* ---------------------------------------------------------------
   LOCAL SAVE
   One versioned record kept in the browser. Adding something new later
   is a single line in each of save/load: every field is read and range
   checked on its own, so an older save simply keeps its defaults for
   whatever it doesn't have yet, and a newer one degrades the same way.
   Storage is unavailable in some sandboxes and in Safari's private mode,
   where touching it throws — so every access is guarded and the game
   falls back to running in memory rather than breaking.
--------------------------------------------------------------- */
var SAVE_KEY='vaporlane.save', SAVE_KEY_OLD='neonrush.save', SAVE_V=1;
var store=null, saveOK=false;
(function(){
  try{
    var probe='__vl__';
    window.localStorage.setItem(probe,'1');
    window.localStorage.removeItem(probe);
    store=window.localStorage; saveOK=true;
  }catch(e){ store=null; saveOK=false; }
})();

}
function pickName(v,list,def){
  if (typeof v==='string') for (var i=0;i<list.length;i++) if (list[i].n===v) return i;
  return def;
}

   unlock shows "UNLOCKED!" in the race, goes in the game-over list and is
   saved at once. Counting starts with this build: nothing done before it
   counts, nobody is given anything for old play.

var PR_MC={run:'r', cruise:'c', learn:'l'};
var PR_ZONED={kill:1, heart:1};             /* the counters also kept per zone */
var PR_BY={};                               /* counter -> its rules */
(function(){ for (var i=0;i<PR_RULES.length;i++){ var b=PR_RULES[i].ev.split('@')[0]; (PR_BY[b]=PR_BY[b]||[]).push(PR_RULES[i]); } })();
function prBlank(){ return { t:{run:{}, cruise:{}, learn:{}}, b:{}, got:{}, seen:{}, wk:{mon:'', days:[]} }; }
var PR=prBlank();
var R={un:[], cl:true, nk:true};            /* this run: counters, unlocked list, no-crash / no-kill flags */
var PR_NOW=function(){ return new Date(); };   /* the tests swap in a fixed clock */
var garOwn={};                              /* garage: the last owned item of each row */

function prMode(){ return learn ? 'learn' : (mode==='cruise' ? 'cruise' : 'run'); }
function prKey(row,n){ return row+':'+n; }
function prRuleFor(row,n){ for (var i=0;i<PR_RULES.length;i++) if (PR_RULES[i].row===row && PR_RULES[i].n===n) return PR_RULES[i]; return null; }
function prOwns(row,item){ return !item || !item.lk || !!PR.got[prKey(row,item.n)]; }
function prRunReset(){ R={un:[], cl:true, nk:true}; }

/* a counter moved by n (most move by 1) */
function prAdd(ev,n){
  n=n||1;
  var m=prMode(), t=PR.t[m];
  t[ev]=(t[ev]|0)+n; R[ev]=(R[ev]|0)+n;
  if (PR_ZONED[ev]){ var z=ev+'@'+zoneI; t[z]=(t[z]|0)+n; R[z]=(R[z]|0)+n; }
  prCheck(ev);
}
/* a this-run value that only goes up: the score, the lap reached clean / without a kill */
function prSet(ev,v){
  if (v>(R[ev]|0)){ R[ev]=v; prCheck(ev); }
}
/* how far along a rule is right now (for the bars). 'run' rules show the best single run. */
function prVal(r){
  if (r.sc==='wk') return prWeekDays();
  if (r.sc==='run') return PR.b[prKey(r.row,r.n)]|0;
  var v=0;
  for (var m in PR_MC) if (r.md.indexOf(PR_MC[m])>=0) v+=(PR.t[m][r.ev]|0);
  return v;
}
function prCheck(ev){
  var list=PR_BY[ev]; if (!list) return;
  var mc=PR_MC[prMode()];
  for (var i=0;i<list.length;i++){
    var r=list[i], k=prKey(r.row,r.n);
    if (PR.got[k] || r.md.indexOf(mc)<0) continue;   /* this mode doesn't count for it */
    if (r.sc==='run'){
      var v=R[r.ev]|0;
      if (v>(PR.b[k]|0)) PR.b[k]=v;
      if (v>=r.to) prUnlock(r);
    } else if (prVal(r)>=r.to) prUnlock(r);
  }
}
function prUnlock(r){
  var k=prKey(r.row,r.n);
  if (PR.got[k]) return;
  PR.got[k]=1;
  delete PR.seen[k];                        /* NEW again until the player stops on it (build 97's badge) */
  R.un.push(r.n);
  say(T('UNLOCKED')+'  '+r.n, '#7cff4f', false, null, 2.8);
  blip(660,0.08,'square',0.16);
  setTimeout(function(){ blip(990,0.08,'square',0.16); },80);
  setTimeout(function(){ blip(1320,0.22,'square',0.16); },160);
  saveGame();
}

/* HAPPY: play days in the current Monday-Sunday week, on the player's own clock */
function prPad2(n){ return (n<10?'0':'')+n; }
function prDay(d){ return d.getFullYear()+'-'+prPad2(d.getMonth()+1)+'-'+prPad2(d.getDate()); }
function prMonday(d){
  var m=new Date(d.getFullYear(), d.getMonth(), d.getDate());
  m.setDate(m.getDate()-((m.getDay()+6)%7));
  return prDay(m);
}
function prWeekDays(){ return PR.wk.mon===prMonday(PR_NOW()) ? PR.wk.days.length : 0; }
function prPlay(){                          /* a tutorial, timed or cruise run just started */
  var d=PR_NOW(), mon=prMonday(d), day=prDay(d);
  if (PR.wk.mon!==mon) PR.wk={mon:mon, days:[]};
  if (PR.wk.days.indexOf(day)<0) PR.wk.days.push(day);
  var r=prRuleFor('eye','HAPPY');
  if (!PR.got[prKey(r.row,r.n)] && PR.wk.days.length>=r.to) prUnlock(r);
  saveGame();
}

/* ---- locks in the garage: try a locked item on, but never race it ---- */
function prRowOwned(row,i){ return prOwns(row.id, row.list[i]); }
function prGarEnter(){
  for (var r=0;r<GROWS.length;r++){ var row=GROWS[r]; if (row.list && row.id!=='react') garOwn[row.id]=row.get(); }
}
function prGarSet(row){                     /* the cursor stopped on an item */
  if (!row.list || row.id==='react') return;
  var i=row.get();                          /* build 97: seen = shown GAR_DWELL s on the turntable (garTick) */
  if (prRowOwned(row,i)) garOwn[row.id]=i;
}
/* every row back to an item the player owns: the last one shown, else the row's first (today's look) */
function prEnforce(){
  for (var r=0;r<GROWS.length;r++){
    var row=GROWS[r]; if (!row.list || row.id==='react') continue;
    if (prRowOwned(row,row.get())) continue;
    var o=garOwn[row.id];
    row.set((typeof o==='number' && o>=0 && o<row.list.length && prRowOwned(row,o)) ? o : 0);
  }
}
function prGarLeave(){ prEnforce(); saveGame(); }

/* ---- the save ('pr' inside vaporlane.save) ---- */
function prSaveObj(){
  var got=[], seen=[], k;
  for (k in PR.got) got.push(k);
  for (k in PR.seen) seen.push(k);
  return { v:1, t:PR.t, b:PR.b, got:got, seen:seen, wk:PR.wk };
}
function prNum(v){ v=parseInt(v,10); return (isFinite(v) && v>0) ? Math.min(v, 1e9) : 0; }
var PR_DAY_RE=/^\d{4}-\d\d-\d\d$/;
function prLoad(p, hadSave){
  PR=prBlank();
  if (p && typeof p==='object'){
    var m, k, i;
    if (p.t && typeof p.t==='object')
      for (m in PR.t) if (p.t[m] && typeof p.t[m]==='object')
        for (k in p.t[m]){ var n=prNum(p.t[m][k]); if (n) PR.t[m][k]=n; }
    if (p.b && typeof p.b==='object')
      for (k in p.b){ var nb=prNum(p.b[k]); if (nb) PR.b[k]=nb; }
    if (Array.isArray(p.got))
      for (i=0;i<p.got.length;i++){ var gs=String(p.got[i]).split(':'); if (gs.length===2 && prRuleFor(gs[0],gs[1])) PR.got[p.got[i]]=1; }
    if (Array.isArray(p.seen))
      for (i=0;i<p.seen.length && i<400;i++) if (typeof p.seen[i]==='string' && p.seen[i].length<40) PR.seen[p.seen[i]]=1;
    for (i=0;i<NEONS.length;i++) if (PR.seen[prKey('light',NEONS[i].n)]) PR.seen[prKey('livc',NEONS[i].n)]=1;   /* build 101 */
    if (p.wk && typeof p.wk==='object' && PR_DAY_RE.test(p.wk.mon) && Array.isArray(p.wk.days)){
      PR.wk.mon=p.wk.mon;
      for (i=0;i<p.wk.days.length && PR.wk.days.length<7;i++)
        if (PR_DAY_RE.test(p.wk.days[i]) && PR.wk.days.indexOf(p.wk.days[i])<0) PR.wk.days.push(p.wk.days[i]);
    }
  } else if (hadSave) prSeedSeen();
}
/* A save from before build 96: the designs it already had count as seen, so on the update day
   NEW shows only on what is new (a player with no save at all sees NEW on everything). */
function prSeedSeen(){
  var i, s=function(row,n){ PR.seen[prKey(row,n)]=1; };
  for (i=0;i<NEONS.length;i++){ s('trim',NEONS[i].n); s('light',NEONS[i].n); s('livc',NEONS[i].n); }
  for (i=0;i<7;i++){ s('shape',BARS[i].n); s('eye',EYES[i].n); }
  for (i=0;i<CHASSIS.length;i++) s('chassis',CHASSIS[i].n);
  s('paint','VOID VIOLET'); s('paint','CARBON');
  s('fin',FINISHES[0].n); s('liv',LIVERIES[0].n); s('spo',SPOILERS[0].n); s('tail',TAILS[0].n);
  s('plate',PLATES[0].n); s('exh',EXHAUSTS[0].n); s('glow',GLOWS[0].n); s('trail',TRAILS[0].n);
}

function prLockIcon(cx,cy,s,col){           /* a small padlock, s = body width */
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,s*0.16);
  ctx.beginPath(); ctx.arc(cx, cy-s*0.30, s*0.30, Math.PI, 0); ctx.lineTo(cx+s*0.30, cy-s*0.05);
  ctx.moveTo(cx-s*0.30, cy-s*0.30); ctx.lineTo(cx-s*0.30, cy-s*0.05); ctx.stroke();
  ctx.fillStyle=col; ctx.fillRect(cx-s*0.5, cy-s*0.08, s, s*0.72);
  ctx.fillStyle='rgba(10,5,22,.85)'; ctx.fillRect(cx-s*0.07, cy+s*0.12, s*0.14, s*0.26);
  ctx.restore();
}
function prFmt(n){
  var s=String(Math.max(0,n|0)), sep=(lang==='es')?'.':',', o='';
  while (s.length>3){ o=sep+s.slice(-3)+o; s=s.slice(0,-3); }
  return s+o;
}
function prText(r){
  var t=(lang==='es') ? r.es : r.en;
  if (r.md==='r') t+='  ·  '+T('MODE_RUN');
  else if (r.md==='c') t+='  ·  '+T('MODE_CRUISE');
  return t;
}
function prWrap(txt,maxW){
  var words=txt.split(' '), lines=[], cur='';
  for (var i=0;i<words.length;i++){
    var t=cur ? cur+' '+words[i] : words[i];
    if (cur && ctx.measureText(t).width>maxW){ lines.push(cur); cur=words[i]; } else cur=t;
  }
  if (cur) lines.push(cur);
  return lines;
}
/* the panel beside the garage car while the picked item is a locked one */
function prGarPanel(row){
  if (!row || !row.list || row.id==='react') return false;
  var item=row.list[row.get()]; if (!item || !item.lk) return false;
  var r=prRuleFor(row.id,item.n); if (!r) return false;
  var x=508, y=104, own=!!PR.got[prKey(r.row,r.n)];
  if (own){
    monoText(T('LK_OWNED'), x, y, TS.LABEL, '#7cff4f');
    return false;
  }
  prLockIcon(x+7, y-5, 12, '#ff6ad5');
  monoText(T('LK_LOCKED'), x+20, y, TS.LABEL, '#ff6ad5');
  ctx.font='700 '+TS.MICRO+'px ui-monospace,Menlo,"Courier New",monospace';
  var lines=prWrap(prText(r), 272), i;
  for (i=0;i<lines.length && i<3;i++) monoText(lines[i], x, y+20+i*15, TS.MICRO, '#cfd6ff');
  var by=y+24+Math.min(3,lines.length)*15, v=Math.min(prVal(r), r.to), bw=180;
  ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fillRect(x, by, bw, 7);
  ctx.fillStyle='#ff6ad5'; ctx.fillRect(x, by, Math.round(bw*v/r.to), 7);
  var lab = r.sc==='wk' ? T('LK_WEEK') : (r.sc==='run' ? T('LK_BEST') : '');
  monoText((lab?lab+' ':'')+prFmt(v)+' / '+prFmt(r.to), x+bw+8, by+7, TS.MICRO, '#ffffff');
  monoText(T('LK_TRY'), x, by+24, TS.MICRO, '#8a7ec4');
  return true;
}
/* the names unlocked this run, fitted to one line */
function prUnLine(maxW, size){
  if (!R.un.length) return '';
  ctx.font='700 '+size+'px ui-monospace,Menlo,"Courier New",monospace';
  var n=R.un.length, s;
  for (var k=n;k>=1;k--){
    s=T('UNLOCKED')+'  '+R.un.slice(0,k).join('  ·  ')+(k<n ? '  +'+(n-k) : '');
    if (ctx.measureText(s).width<=maxW) return s;
  }
  return T('UNLOCKED')+'  +'+n;
}

function loadGame(){
  if (!saveOK) return;
  var raw,d;
  try{ raw=store.getItem(SAVE_KEY); }catch(e){ saveOK=false; return; }
  /* Nothing under the new name yet: read the NEON RUSH record once. It is
     left in place rather than deleted, so an older build still finds it if
     this one has to be rolled back. The next saveGame() writes the new key. */
  if (!raw){ try{ raw=store.getItem(SAVE_KEY_OLD); }catch(e){ raw=null; } }
  if (!raw) return;
  try{ d=JSON.parse(raw); }catch(e){ return; }        /* corrupt: keep defaults */
  if (!d || typeof d!=='object') return;
  var b=parseInt(d.best,10);
  if (isFinite(b) && b>0) best=b;
  trimI =pickIdx(d.trim , NEONS.length , trimI);
  shapeI=pickIdx(d.shape, BARS.length  , shapeI);
  eyeI  =pickIdx(d.eye  , EYES.length  , eyeI);
  lightI=pickIdx(d.light, NEONS.length , lightI);
  /* build 94: the look is saved by name (lk); a build-93 save only has the old paint index */
  var lk=(d.lk && typeof d.lk==='object') ? d.lk : null;
  if (lk && typeof lk.paint==='string') paintI=pickName(lk.paint, PAINTS, paintI);
  else { var op=parseInt(d.paint,10); if (isFinite(op) && op>=0 && op<PAINT_OLD.length) paintI=pickName(PAINT_OLD[op], PAINTS, paintI); }
  if (lk){
    finishI =pickName(lk.fin , FINISHES, finishI);
    liveryI =pickName(lk.liv , LIVERIES, liveryI);
    spoilerI=pickName(lk.spo , SPOILERS, spoilerI);
    tailI   =pickName(lk.tail, TAILS   , tailI);
    plateI  =pickName(lk.plate,PLATES  , plateI);
    exhaustI=pickName(lk.exh , EXHAUSTS, exhaustI);
    glowI   =pickName(lk.glow, GLOWS   , glowI);
    trailI  =pickName(lk.trail,TRAILS  , trailI);
    var pt=plClean(lk.ptxt); plateTxt=plateBad(pt)?'':pt;
    reactOn = (lk.react!==0);
  }
  /* build 101: the wrap's own colour; a save from before 101 starts it at the bar colour (same look) */
  wrapcI = (lk && typeof lk.livc==='string') ? pickName(lk.livc, NEONS, lightI) : lightI;
  chassisI=pickIdx(d.chassis, CHASSIS.length, chassisI);
  lang = (d.lang==='es') ? 'es' : 'en';
  mode = (d.mode==='cruise') ? 'cruise' : 'run';
  var am=parseInt(d.audio,10);
  audioMode = (isFinite(am) && am>=0 && am<=3) ? am
            : (d.music===false ? AUD_NOMUSIC : AUD_ALL);   /* legacy save */
  applyAudioMode();
  sawLandscape = !!d.sawLand;
  prLoad(d.pr, true);                 /* build 96: progress; a save from before 96 starts at zero */
  prEnforce();                        /* build 96: a locked item worn in 94 / 95 goes back to the row's first */
  garLoad(d.gs);                      /* build 97: saved slots, the one showing, the build in progress */
}
function saveGame(){
  if (!saveOK) return;
  try{
    store.setItem(SAVE_KEY, JSON.stringify({
      v:SAVE_V, best:Math.max(0,best|0),
      trim:trimI, light:lightI, paint:Math.max(0,PAINT_OLD.indexOf(PAINTS[paintI].n)), shape:shapeI, eye:eyeI, lang:lang,
      chassis:chassisI, mode:mode, sawLand:sawLandscape, audio:audioMode,
      /* build 94: the look by name; 'paint' above stays an index build 93 can read */
      lk:{ paint:PAINTS[paintI].n, fin:FINISHES[finishI].n, liv:LIVERIES[liveryI].n, spo:SPOILERS[spoilerI].n,
           tail:TAILS[tailI].n, plate:PLATES[plateI].n, ptxt:plateTxt, exh:EXHAUSTS[exhaustI].n,
           glow:GLOWS[glowI].n, trail:TRAILS[trailI].n, react:reactOn?1:0, livc:NEONS[wrapcI].n },
      pr:prSaveObj(),                 /* build 96: counters, best runs, earned, seen, play days */
      gs:garSaveObj()                 /* build 97: slots 1 2 3, the slot showing, the build in progress */
    }));
  }catch(e){ saveOK=false; }                          /* quota or perms lost */
}

/* ---------------------------------------------------------------
   THE RIDE
   Two props that were pure scenery become the only way between zones.

   A HAILER is a roadside alien that has stepped forward to the very edge
   of its usual band and is waving with both arms under a blinking ?/!.
   Passing close to one calls a saucer down. That is the whole input —
   no stopping, because the alien band sits at 2.00 road units and the
   car's hard stop is 1.55, so it was never reachable, and because touch
   has no handbrake.

   The saucer that answers is a HUNTER. It keeps station ahead of you and
   MATCHES YOUR SPEED up to UFO_TOP, so easing off the throttle parks you
   under it; above that you simply outrun it and nothing happens. The beam
   eases sideways onto you but not fast enough to do the work alone. Hold
   both for UFO_LOCK seconds and it takes you. Every step is refusable and
   none of it costs you anything if you decline.
--------------------------------------------------------------- */
var HAIL_LAT   = 2.00;   /* a hailer stands here exactly, nearer than its kin */
var HAIL_R     = 1.15;   /* pass this close to send the signal              */
var HAIL_ODDS  = 0.34;   /* share of roadside aliens that are hailers       */
var HAIL_COOL  = 26;     /* seconds before another one will flag you down   */
var HAIL_LAP   = 2;      /* not on the opening lap                          */
var UFO_HOLD   = 900;    /* the hunter's station, ahead of the car          */
var UFO_BAND   = 1500;   /* how far off station the beam still reaches      */
var UFO_TOP    = 0.72;   /* share of top speed the hunter can manage        */
var UFO_TRACK  = 1.15;   /* how hard the beam eases sideways onto you       */
var UFO_BEAM_R = 0.46;   /* beam half-width in road units (a car is 0.26)   */
var UFO_LOCK   = 4.0;    /* seconds inside the beam before it takes you (build 91: was 2.0; Carlos 10-21) */
var UFO_NOTICE = 5400;   /* how close a WANDERING saucer lets you get first  */
var UFO_HUNT_T = 20;     /* ...and how long it will keep trying             */
var UFO_UP     = 11;     /* build 85: about how long a wandering saucer is up at racing speed (measured) */
/* build 85: a zone's ufoRate (absent = 1) thins its WANDERING saucers; 0.7 = 30 % fewer a minute. The
   wait counts from when the last one has gone, so it is stretched until wait + time up is 1/rate as
   long. The saucers an alien, a hitchhiker or the Halloween activator calls are not touched. */
function ufoWait(t){ var k=ZN.ufoRate; return (k && k!==1) ? (t+UFO_UP)/k-UFO_UP : t; }
var hailCool   = 0;
var zoneI      = 'vapor';

/* the cutscene writes these; the world renderer never knows */
var cut=null;
var cutCar={x:0,y:0,sc:1,tilt:0,alpha:1,spin:0,lit:0};
function cutCarRest(){ cutCar.x=0; cutCar.y=0; cutCar.sc=1; cutCar.tilt=0; cutCar.alpha=1; cutCar.spin=0; cutCar.lit=0; }
/* build 83: the lab's landing curves (clamped) */
function bounceOut(t){ t=clamp(t,0,1); var n=7.5625, d=2.75;
  if (t<1/d) return n*t*t; if (t<2/d) return n*(t-=1.5/d)*t+0.75; if (t<2.5/d) return n*(t-=2.25/d)*t+0.9375; return n*(t-=2.625/d)*t+0.984375; }
function easeOut(t){ t=clamp(t,0,1); return 1-(1-t)*(1-t); }
function easeIn(t){ t=clamp(t,0,1); return t*t; }
function ease(t){ return t<0?0:(t>1?1:t*t*(3-2*t)); }

/* A prop slot holds a hailer only if it holds an alien at all. The test
   mirrors drawDecor's own hashes exactly, so what you drive past and what
   you see are the same decision made twice, not two decisions. */
function isHailer(idx){
  if (ZN.id==='vapor') return hwHailHas(idx);   /* build 89: VAPOR's are scheduled per lap (hw89_hail.js) */
  if (hashAt(idx,1) > Math.min(1,0.5*ZN.propDens)) return false;
  var t=hashAt(idx,4);
  var type = t<0.22?0 : t<0.42?1 : t<0.59?2 : t<0.76?3 : t<0.85?4 : t<0.94?5 : 6;
  if (!(ZN.propMask & (1<<type))){
    var allow=[];
    for (var pm=0;pm<7;pm++) if (ZN.propMask & (1<<pm)) allow.push(pm);
    if (!allow.length) return false;
    type=allow[(hashAt(idx,11)*allow.length)|0];
  }
  return type===6 && hashAt(idx,10)<HAIL_ODDS;
}

/* Build 77: THE HAILER'S LAMP. A hailer stands beside a broken swan-neck lamp whose head hangs over the
   outer lane. Drive under it while it flickers and the saucer is called, no need to leave the road.
   `hailLive()` is the ONE test for "a call can really be made right now": the alien waves and the lamp
   flickers only while it is true, so nothing waves at you that would then ignore you. */
var HAIL_HEAD_X = 0.78;   /* the lamp head's lateral (road lamps use the same), over the outer lane at 0.75 */
var HAIL_LAMP_R = 0.38;   /* pass within this of the head, along the road, to be "under" it */
var hailPrevZ   = -1;     /* the car's z last frame; -1 = no previous frame (a new run) */
/* build 91 (Carlos 10-21): every zone-change activator (this lamp in every zone, the Halloween group in VAPOR, the
   hitchhikers' lamps in HAUNTED HIGHWAY) needs at least ACT_IN_SHARE of the car's width - or of the dino's - inside
   the outer lane, which starts at 0.5 on that side. So the centre must be at least 0.5 - (0.5-share) x width out:
   car 0.435, dino 0.345 (before: lamps 0.40 = 11 % of the car; Halloween 0.38 = 4 %, dino 0.25). */
var ACT_IN_SHARE = 0.25;
function actInner(){ return 0.5 - (0.5-ACT_IN_SHARE)*(dinoT>0?DINO_CAR_W:CAR_W); }
function hailLive(){
  return !learn && lap>=HAIL_LAP && hailCool<=0 && !(ufo && (ufo.hunt||ufo.cutting));
}
/* Erratic and deterministic in time: a new mood about every 1.25 s, and inside it 60 ms cells of on/off. */
function hailFlick(t,idx){
  var mood=hashAt(idx*31+Math.floor(t*0.8+hashAt(idx,21)*50),22);
  var cell=Math.floor(t*17), r=hashAt(idx*7919+cell,23);
  if (mood<0.22) return 1;                                   /* a spell of steady light */
  if (mood<0.55) return r>0.42?1:0;                          /* stuttering */
  if (mood<0.85) return r>0.90?1:0;                          /* mostly dark, a rare spark */
  return r>0.25 ? 0.55+0.45*hashAt(idx*7919+cell,24) : 0.1;  /* a weak buzz */
}
/* Is a hailer's slot within `win` units of world z? Returns its side (-1/+1) or 0. Used to make room. */
function hailerAt(z,win){
  if (lap<HAIL_LAP) return 0;
  var i=Math.round(z/DECO_SPACE);
  if (Math.abs(z-i*DECO_SPACE)>=win || !(isHailer(i)||isHwAct(i))) return 0;   /* build 84: the activator's lamp too */
  return hashAt(i,2)<0.5?-1:1;
}
/* Build 84: THE HALLOWEEN ACTIVATOR. In VAPOR only, a few prop slots hold a crooked gas lamp with the
   skeleton and the ghost hitchhikers waving beside it (hwActDraw). Drive under its lantern (or right
   beside them, like the alien) while it is live and the mist takes you to HAUNTED HIGHWAY.
   Rate: 1.2x the waving alien (Carlos). A VAPOR prop slot is a hailer 0.06 x 0.34 = 2.04 % of the time;
   the activator takes 2.50 % of the slots that are NOT hailers, i.e. 2.45 % of all slots = 1.2x. The
   hailers are untouched (an activator never takes a hailer's slot). Same rules as a hailer: not on lap 1,
   not in the tutorial, not while a saucer is hunting, not during the cooldown (hailLive()).
   THE SEASON (Carlos, 10-18): the game reads the date, so no build is needed when Halloween is over.
   Full rate from Oct 1 to Nov 7, a third of it to Nov 20, then none until next Oct 1 (it comes back by
   itself). Dates are month, day; each is one number to change. ?halloween=on / off forces it (testing). */
var HW_ACT_ODDS = 0.0250;
var HW_SEASON   = { from:[10,1], full:[11,7], fade:[11,20], fadeK:1/3 };
var HW_SEASON_K = null;   /* tests: a number here overrides the date */
var hwK = 0;              /* this run's activator rate, set by reset() */
function hwSeasonK(d){
  try{
    var m=/[?&]halloween=(on|off)/.exec(location.search||'');
    if (m) return m[1]==='on' ? 1 : 0;
  }catch(_){}
  var S=HW_SEASON, v=(d.getMonth()+1)*100+d.getDate();
  var a=S.from[0]*100+S.from[1], b=S.full[0]*100+S.full[1], c=S.fade[0]*100+S.fade[1];
  if (v>=a && v<=b) return 1;
  if (v>b && v<=c) return S.fadeK;
  return 0;
}
/* Build 88: THE ACTIVATOR'S SCHEDULE (Carlos, 10-20: "it doesn't go more than 2 laps without a halloween group
   waving down, and in some laps it can show twice"). Build 84 chose its slots by a hash of the slot's number
   alone, so every run had them in the SAME places: once in laps 2 and 3, three times in lap 5, none in laps 4,
   6, 7 and 8, three times in lap 9. That is exactly what Carlos saw. Now every lap from HAIL_LAP on gets its
   own count, new each run: none, one or two (HW_ACT_N), never none on the first lap it can come and never none
   twice in a row; two only on a lap long enough for two (HW_ACT_TWO_LEN). They stand at a set share of the way
   down the lap, on a slot that holds a prop in VAPOR and is not a hailer, with no hailer within HW_ACT_GAP
   slots either side, so the alien's saucer can't take the call away just before it. One that goes by while it
   can't take you (a saucer is hunting, the cooldown is running) is made up further on, out of sight
   (hwActMakeup). The season (hwK) still thins them after Nov 7: each one is kept with odds hwK. */
var HW_ACT_N       = [0.20, 0.50, 0.30];   /* share of laps with none / one / two                            */
var HW_ACT_TWO_LEN = 250000;               /* a lap shorter than this gets one at most                         */
var HW_ACT_GAP     = 6;                    /* slots kept clear of hailers on either side                       */
var hwActLaps={}, hwActMade={}, hwActPend=-1, hwLapZ=[0,0], hwActFill=false;
function hwActReset(){ hwActLaps={}; hwActMade={}; hwActPend=-1; hwLapZ=[0,0]; hwHailLaps={}; }   /* build 89: and the waving aliens' */
/* the lap a world z falls in: laps are laid end to end from z = 0, lapLength(1), lapLength(2)... */
var HW_LAPS_EXACT = 40;                    /* past this every lap is the same length (lapLength caps by lap 10) */
function hwLapStart(L){
  if (L>HW_LAPS_EXACT) return hwLapStart(HW_LAPS_EXACT)+(L-HW_LAPS_EXACT)*lapLength(HW_LAPS_EXACT);
  for (var l=hwLapZ.length-1; l<L; l++) hwLapZ[l+1]=hwLapZ[l]+lapLength(l);
  return hwLapZ[L];
}
function hwLapOf(z){
  for (var L=1; L<HW_LAPS_EXACT; L++) if (z<hwLapStart(L+1)) return L;
  return HW_LAPS_EXACT+Math.floor((z-hwLapStart(HW_LAPS_EXACT))/lapLength(HW_LAPS_EXACT));
}
/* VAPOR's own prop decision for a slot (the activator only ever stands in VAPOR, whatever zone is showing) */
function hwVaporType(idx){
  var Z=ZONES.vapor;
  if (hashAt(idx,1) > Math.min(1,0.5*Z.propDens)) return -1;
  var t=hashAt(idx,4);
  var type = t<0.22?0 : t<0.42?1 : t<0.59?2 : t<0.76?3 : t<0.85?4 : t<0.94?5 : 6;
  if (!(Z.propMask & (1<<type))){
    var allow=[];
    for (var pm=0;pm<7;pm++) if (Z.propMask & (1<<pm)) allow.push(pm);
    if (!allow.length) return -1;
    type=allow[(hashAt(idx,11)*allow.length)|0];
  }
  return type;
}
function hwVaporHailer(idx){ return hwHailHas(idx); }   /* build 89: VAPOR's waving aliens are scheduled per lap */
function hwActOk(idx){
  if (idx<1 || hwVaporType(idx)<0 || hwVaporHailer(idx)) return false;
  for (var j=1;j<=HW_ACT_GAP;j++) if (hwVaporHailer(idx-j) || hwVaporHailer(idx+j)) return false;
  return true;
}
/* the nearest good slot to i0, inside [zLo, zHi); forward only for a make-up */
function hwActSpot(i0,zLo,zHi,fwd){
  for (var k=0;k<40;k++){
    var i = fwd ? i0+k : i0+((k&1)?(k+1)>>1:-(k>>1));
    if (i*DECO_SPACE<zLo || i*DECO_SPACE>=zHi) continue;
    if (hwActOk(i)) return i;
  }
  return -1;
}
function hwActPlan(L){
  var P=hwActLaps[L]; if (P) return P;
  P={n:0}; hwActLaps[L]=P;
  if (L<HAIL_LAP) return P;
  if (!hwActFill){ hwActFill=true;                           /* build 89: the laps before it, in order (no deep chain) */
    for (var l=Math.max(HAIL_LAP,L-60); l<L; l++) if (!hwActLaps[l]) hwActPlan(l);
    hwActFill=false; }
  var pq=hwActLaps[L-1], prev=(L>HAIL_LAP && pq) ? pq.n : 1;
  var r=hashAt(L*7919+propRun*104729,91), n=r<HW_ACT_N[0]?0:(r<HW_ACT_N[0]+HW_ACT_N[1]?1:2);
  if (n===0 && (L===HAIL_LAP || prev===0)) n=1;
  var z0=hwLapStart(L), len=lapLength(L);
  if (n===2 && len<HW_ACT_TWO_LEN) n=1;
  var at = n===1 ? [0.30+0.45*hashAt(L+propRun*31,92)]
         : n===2 ? [0.16+0.22*hashAt(L+propRun*31,92), 0.60+0.24*hashAt(L+propRun*31,93)] : [];
  for (var a=0;a<at.length;a++){
    var i=hwActSpot(Math.round((z0+at[a]*len)/DECO_SPACE), z0+len*0.08, z0+len*0.94, false);
    if (i>=0 && !P[i]){ P[i]=1; P.n++; }
  }
  return P;
}
/* Build 89: THE WAVING ALIENS' SCHEDULE (Carlos, 10-20: "update the waving aliens so it's more dynamic").
   In VAPOR the alien hailers (the ?/! alien by its flickering lamp that calls the UFO to ALIEN PLAINS) were
   chosen by a hash of the slot's number alone, like the Halloween group before build 88: the same places in

   They stand on a VAPOR prop slot, drawn as the waving alien whatever prop the slot held; the old hash

   AUDIO
--------------------------------------------------------------- */
/* Audio is one control with four states, cycled by M on a keyboard and by the
   Sound button on the touch pad. `muted` (effects + engine) and `musicOn` are
   DERIVED from it, so every existing check in this file keeps working as
   written and nothing has to know the cycle exists. */
var AUD_ALL=0, AUD_NOMUSIC=1, AUD_NOSFX=2, AUD_NONE=3;

   strings are still in the tables for the desktop legend. */

   a laptop. Applied after the limiter — see audioInit. */
var AUD_MAKEUP = 1.30;

function applyAudioMode(){
  muted   = (audioMode===AUD_NOSFX || audioMode===AUD_NONE);
  musicOn = (audioMode===AUD_ALL   || audioMode===AUD_NOSFX);
}
function cycleAudio(){
  audioMode=(audioMode+1)%4;
  applyAudioMode();
  say(T(AUD_MSG[audioMode]),'#21e6ff');

}
/* Suspending the context is the only thing that actually silences WebAudio —
   turning gains down leaves the graph running and, on a phone, audible after
   you have left the game. Both live here so every caller does the same thing. */
function audioSuspend(){
  if (!A) return;
  try{ if (A.ctx.suspend && A.ctx.state==='running') A.ctx.suspend(); }catch(_){}
}
function audioResume(){
  if (!A) return;
  try{ if (A.ctx.state==='suspended') A.ctx.resume(); }catch(_){}
}
function audioInit(){
  /* Already built: the job is no longer to construct the graph but to make sure
     it is running, because we suspend it whenever the app goes to the
     background. Every pad press and key press routes through here, so coming
     back and touching anything wakes the sound up. */
  if (A){ audioResume(); return; }
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var actx=new C();

       any dense moment clipped. A gentle limiter costs one node. */
    var comp=actx.createDynamicsCompressor();
    comp.threshold.value=-8; comp.knee.value=6; comp.ratio.value=8;
    comp.attack.value=0.003; comp.release.value=0.15;

       would just push more signal into the compressor and get most of the
       increase squashed back out — the quiet parts would lift and the loud
       parts would not. Post-limiter, everything rises by the same 30%, and the
       limiter still owns the peaks: its output tops out near 0.55, so 0.55 x
       1.30 = 0.72 stays clear of the 1.0 clipping ceiling. */

    var g=actx.createGain(); g.gain.value=0; g.connect(lp);
    var o1=actx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=52; o1.connect(g);
    var o2=actx.createOscillator(); o2.type='square';   o2.frequency.value=26; o2.connect(g);

       slow throb reads as strain. Cheaper and more alive than a 4th harmonic. */
    var o3=actx.createOscillator(); o3.type='sawtooth'; o3.frequency.value=52;
    o3.detune.value=ENG_DETUNE; o3.connect(g);

    var nb=actx.createBuffer(1, Math.floor(actx.sampleRate*2), actx.sampleRate);
    var nd=nb.getChannelData(0);

    var wf=actx.createBiquadFilter(); wf.type='bandpass';

    var vfb1=actx.createGain(), vfb2=actx.createGain(); vfb1.gain.value=0.60; vfb2.gain.value=0.58;
