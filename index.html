/* ---------------------------------------------------------------
   TRAFFIC
--------------------------------------------------------------- */
function trySpawn(){
  var z=position + 50000 + Math.random()*4000;
  var win=clusterWin(lap), near=0, blocked={}, i, d;
  for (i=0;i<cars.length;i++){
    d=Math.abs(cars[i].z - z);
    if (d < win) near++;
    if (d < 2800) blocked[cars[i].lane]=true;
  }
  if (near >= maxCluster(lap)) return;
  var free=[];
  for (i=0;i<LANES.length;i++) if (!blocked[i]) free.push(i);
  if (free.length <= 1) return;              // always leave a way through
  var lane=free[(Math.random()*free.length)|0];
  var top=trafficTop(lap);
  var weav=Math.random() < weaverOdds(lap);
  cars.push({
    z:z, lane:lane, x:LANES[lane],
    speed: top*(0.55+Math.random()*0.45),
    color: weav ? '#ffd23f' : ZN.traffic[(Math.random()*ZN.traffic.length)|0],
    passed:false,
    weaver:weav, phase:weav?'wait':null, sigT:0, moveT:0, sigDir:0,
    fromX:0, toLane:0,
    changeT: 0.8+Math.random()*1.6         // first move soon after it appears
  });
}

function fire(){
  if (spinT>0 || fireCd>0) return;
  var col='#8ef4ff';
  if (odT>0){
    col=OD_COLS[odShotN%OD_COLS.length];   /* purple, green, orange, white */
    odShotN++;
  } else {
    if (shots<=0) return;
    shots--;
  }
  fireCd = (odT>0 ? OD_CD : FIRE_CD);
  pshots.push({z:position+Z_CAR+240, x:playerX, prevZ:position+Z_CAR, isShot:true, col:col});
  shake=Math.max(shake, odT>0?3:4.5);
  blip(odT>0?1750:1500,0.05,'square',0.15);
  setTimeout(function(){ blip(680,0.12,'sawtooth',0.12); },45);
}

/* One bolt, from wherever it came: a pickup, or a drift you banked. Kept in
   one place so the drift award cannot drift out of step with the pickup. */
function giveBolt(src){             /* build 96: src = 'pickup' / 'drift' / 'nm' (near miss) */
  if (odT>0){                       /* already lit: top it back up */
    odT=OD_TIME; addScore(500); react('fire');   /* build 94 */
    prOd(src);                        /* build 96 */
    say(T('T_OD_REFRESH'),'#ffd23f',true,'bolt');
    overdriveSfx();
    return;
  }
  shots++;
  if (shots>=MAX_SHOTS){            /* the third one tips you over */
    shots=0; odT=OD_TIME; odShotN=0; flash=1; react('fire');   /* build 94 */
    prOd(src);                        /* build 96 */
    shake=Math.max(shake,7);
    say(T('T_OD_ON')+OD_TIME+'s','#ffd23f',true,'bolt');
    overdriveSfx();
  } else {
    say(T('T_SHOT_LOADED1')+shots+T('T_SHOT_LOADED2')+MAX_SHOTS,'#21e6ff',true,'bolt');
    /* A second line on the same card, green like the title's PRESS ENTER
       prompt. life 3.0 = gone exactly 3 s later (the card's own fade takes
       the last 0.55 s of it). Touch has an on-screen fire button instead. */
    if (!TOUCH && !taughtSpace){
      taughtSpace=true;
      say(T('T_SPACE_SHOOT'),'#7cff4f',true,null,3.0);
    }
    blip(520,0.07,'square',0.18);
    setTimeout(function(){ blip(780,0.07,'square',0.18); },70);
    setTimeout(function(){ blip(1170,0.18,'square',0.18); },140);
  }
}

/* `rear` is true when the car was behind your anchor at the moment of
   contact — it came in through the back face of the hitbox. */
function crash(rear){
  chain=0; chainT=0;              /* any contact breaks the chain, always */
  hitFlash=1;

  /* A REAR-END IS NOT YOUR MISTAKE, so it does not carry your mistake's
     price. Traffic tops out well below your top speed, so the only way a
     car reaches your back face at all is that you are slower than it: you
     are threading a queue at low speed and one you already went past is
     still sitting inside the 215 units behind your anchor when you move
     across. Charging two seconds of clock and a heart for that is punishing
     the player for the situation rather than for the driving.

     It is not free — it halves your speed, and in a game whose real enemy
     is the clock, momentum IS the currency. That is the whole cost. The
     drift bank survives too; losing a charge you could not have protected
     is the same unfairness in a different coat. The near-miss chain does
     break, because a chain is defined as consecutive passes WITHOUT
     contact and this was contact. */
  if (rear){
    speed*=0.5; spinT=0; shake=12;   /* deliberately the overdrive reaction */
    invT=Math.max(invT,0.9);         /* long enough for it to get through you,
                                        far too short to be a free battering ram */
    crashSfx();
    say(T('T_REAR'),'#ffd23f',false,null,1.3);
    prCrash(true);                   /* build 96: a rear tap (breaks ANTENNA BALL) */
    return;                          /* no health, no clock, dPot untouched */
  }

  dPot=0;                         /* a drift you crash out of pays nothing */
  react('dizzy');                 /* build 94 */
  prCrash(false);                 /* build 96: a crash, counted before a crash can end the run */
  invT=2.3;
  if (odT>0){
    /* no invulnerability, but the aura carries you through: half your speed
       and a jolt instead of a spin and a dead stop */
    speed*=0.5; spinT=0; shake=12;
  } else {
    speed*=0.2; spinT=0.85; shake=15;
  }
  crashSfx();
  /* In cruise the impact still costs you momentum and the chain — it should
     sting — but health and the clock are not in play at all, so there is
     nothing to lose and nothing to end. */
  if (learn){                       /* build 72: the lesson only says what it would have cost */
    if (tut) tut.crashed=true;
    say(T('T_LEARN_CRASH'),'#ff5d5d',true,null,2.2);
    return;
  }
  if (mode==='cruise') return;

  health--;
  timeLeft=Math.max(0, timeLeft-CRASH_TIME);
  if (health<=0){
    endReason='WRECKED'; state='gameover'; best=Math.max(best,score|0); saveGame();
  } else if (timeLeft<=0){
    if (!coast) coastStart();          /* build 105: the crash took the last seconds: the car rolls out instead of ending at once */
  } else {
    say(T('T_CRASH')+CRASH_TIME+T('T_CRASH_S'),'#ff5d5d',true);
  }
}

/* ---------------------------------------------------------------
   BUILD 105 - TIME-OUT COAST
   When the clock reaches zero the gas stops working, the TIME OUT message and the tears reaction come up, and the
   car rolls down on its own (a touch quicker than the normal idle: COAST_T seconds from full speed). Steering,
   braking, shooting and drifting all still work. The run ends when the speed is down to COAST_END (10 %) of the
   lap's top speed. A lap gate reached on the roll adds time again (coast=false) and the run goes on.
--------------------------------------------------------------- */
var COAST_T = 4.2;       /* the idle drag is maxS/6.5 per second; the roll uses maxS/COAST_T                    */
var COAST_END = 0.10;    /* game over at this share of the lap's top speed                                       */
function coastStart(){
  coast=true;
  react('tears');
  say(T('T_TIMEOUT'),'#ff4d6d',true,null,2.6);
  blip(330,0.18,'square',0.16);
  setTimeout(function(){ blip(220,0.34,'square',0.16); },150);
}

/* ---------------------------------------------------------------
   BUILD 105 - WHERE THE PICKUPS GO (options A + C of the build-89 doc)
   Same amounts per lap as before. A: each lap's pickups are dealt at random into six bands along the lap (the
   same six bands as before), so the heart is no longer always first. C: about one lap in three has two of the
   same pickup back to back, a heart pair or a bolt pair (the second 6.5 to 9 k units behind the first, in another
   lane). A combo lap swaps one pickup of the other kind for the doubled one, and the NEXT lap swaps it back, so
   over the two laps the amounts are exactly what they always were. Combos start on lap 4 (laps 2 and 3 keep
   their heart + bolt).
--------------------------------------------------------------- */
var PK_BANDS = [[0.10,0.20],[0.26,0.36],[0.40,0.48],[0.52,0.62],[0.66,0.74],[0.80,0.90]];
var PK_COMBO_P = 0.2;        /* chance on a free lap; with the forced payback lap that is about 1 lap in 3        */
var PK_COMBO_FROM = 4;
var PK_PAIR_GAP = 6500, PK_PAIR_JIT = 2500;
function shuffleArr(a){
  for (var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0, t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function pickupPlan(hearts,bolts){
  var n={heart:hearts, bolt:bolts}, pair=null, payback=false;
  if (comboOwe){ pair=comboOwe; comboOwe=null; payback=true; }
  else if (lap>=PK_COMBO_FROM && Math.random()<PK_COMBO_P) pair=(Math.random()<0.5)?'heart':'bolt';
  if (pair){
    var other=(pair==='heart')?'bolt':'heart';
    if (n[other]>0){ n[pair]++; n[other]--; if (!payback) comboOwe=other; }   /* the payback lap does not start a new debt */
    else pair=null;
  }
  return { h:n.heart, b:n.bolt, pair:pair };
}
function layPickups(hearts,bolts,dinos,pair){
  var units=[], i, nh=hearts, nb=bolts, p0=pickups.length;
  if (pair==='heart' && nh>=2){ units.push(['heart','heart']); nh-=2; }
  else if (pair==='bolt' && nb>=2){ units.push(['bolt','bolt']); nb-=2; }
  for (i=0;i<nh;i++) units.push(['heart']);
  for (i=0;i<nb;i++) units.push(['bolt']);
  for (i=0;i<dinos;i++) units.push(['dino']);
  shuffleArr(units);
  var bands=shuffleArr(PK_BANDS.slice()).slice(0,units.length).sort(function(p,q){ return p[0]-q[0]; });
  for (i=0;i<units.length;i++){
    var u=units[i], bd=bands[i];
    var z0=cpStart + cpLen*(bd[0]+Math.random()*(bd[1]-bd[0]));
    var l0=(Math.random()*LANES.length)|0;
    pickups.push({ kind:u[0], z:z0, x:LANES[l0] });
    if (u.length>1){
      var l1=(l0+1+((Math.random()*(LANES.length-1))|0))%LANES.length;       /* another lane */
      pickups.push({ kind:u[1], z:z0+PK_PAIR_GAP+Math.random()*PK_PAIR_JIT, x:LANES[l1] });
    }
  }
  /* two pickups within 3500 units in the same lane would sit on top of each other: move the later one over a lane */
  for (i=p0+1;i<pickups.length;i++){
    for (var k=p0;k<i;k++){
      if (Math.abs(pickups[i].z-pickups[k].z)<3500 && pickups[i].x===pickups[k].x)
        pickups[i].x=LANES[(LANES.indexOf(pickups[i].x)+1)%LANES.length];
    }
  }
}

/* ---------------------------------------------------------------
   UPDATE
--------------------------------------------------------------- */
function update(dt){
  var i,c,dz;

  shake *= Math.pow(0.02,dt);
  shT += dt;
  carRum += (((drifting && state==='playing')?1:0) - carRum)*Math.min(1,dt*14);
  hitFlash=Math.max(0,hitFlash-dt*2.6);
  flash   =Math.max(0,flash-dt*1.8);
  fxStep(dt);                          /* build 83: the screen-effects layer */
  garTick(dt);                         /* build 97: the showroom's clock (NEW, trail preview) */
  trailStep(dt);                       /* build 94 */
  for (i=msgs.length-1;i>=0;i--){ msgs[i].life-=dt; if (msgs[i].life<=0) msgs.splice(i,1); }

  /* The cutscene owns the frame. Everything below this line — the clock,
     collision, spawning, scoring — is simply not reached, which is how
     the clock freeze costs one branch instead of a pause system. */
  if (state==='abduct'){ cutStep(dt); return; }

  if (state!=='playing'){
    if (state!=='garage' && state!=='info' && state!=='paused' && state!=='tutorial') position += 2400*dt;
    ensure(position+MAXZ+Z_CAR+CH);
    cAnchor=curveAt(position+Z_CAR);
    curSlope=slopeAt(position+Z_CAR);
    warnSlope=slopeAt(position+Z_CAR+17000);
    bgX += (-curSlope*108000 - bgX)*Math.min(1,3*dt);
    engine(ENG_IDLE, state==='title');
    screech(0);
    musMix();
    return;
  }

  var maxS=maxSpeedFor(lap);
  var spct=clamp(speed/maxS,0,1);

  /* last frame's drift state, so the exit can be spotted. Set true again below
     only while the drift is live; spinning out counts as not drifting. */
  var wasDrift=drifting; drifting=false;

  if (spinT>0){
    spinT-=dt; spinAng+=dt*11;
    speed-=maxS*0.9*dt;
    steerVel*=Math.pow(0.05,dt);
  } else {
    spinAng*=Math.pow(0.001,dt);

    // Calculate input first to check for drifting
    var input = (keys.left?-1:0) + (keys.right?1:0);
    
    // Drift condition: braking + steering + moving at a decent speed
    var isDrifting = keys.down && input !== 0 && speed > maxS * 0.35;

    var gasOn = keys.up && !coast;         /* build 105: no gas once the clock is out */
    var both = gasOn && keys.down;

    if (both){
      /* holding both is a drift tool, not free speed — it bleeds off at the
         same rate as a plain brake until you sit 20% below your top speed */
      var floorS = maxS*DRIFT_HOLD;
      if (speed > floorS){
        speed -= (maxS/1.15)*dt;
        if (speed < floorS) speed = floorS;
      }
      /* at or below the floor it simply holds: you can drift at a steady 80%
         indefinitely, but holding both can never gain you speed */
    } else if (gasOn) {
      speed += (maxS/3.1)*dt;
    } else if (keys.down) {
      speed -= isDrifting ? (maxS/2.2)*dt : (maxS/1.15)*dt;
    } else {
      speed -= (maxS/(coast?COAST_T:6.5))*dt;
    }

    var grip = CH_().grip * Z().grip;   /* chassis grip composes with the zone's */
    var agility = (1.60 - 0.70 * spct) * grip;
    var resp = (9.5 - 5.4 * spct) * grip;

    // Apply drift physics and screeching sound effect
    if (isDrifting) {
      agility *= 1.85; // Significantly sharper turning radius
      resp *= 1.4;     // Faster response snapping into the turn
      /* build 71: the drift rumble is on the car now (drawPlayer), not the camera */
      

      /* charge the pot — bend and speed gates, see the DR_ block */
      drifting = true;
      if (speed >= maxS*(learn?LEARN_DRIFT_SPD:DR_MIN_SPD)){    /* build 73: a slower learner still gets credit */
        var bendF = Math.abs(curSlope)/S_PEAK;
        if (bendF > DR_MIN_BEND){
          dPot += Math.min(1,bendF)*DR_RATE*(learn?LEARN_DRIFT:1)*dt;
          if (learn && tut) tut.driftT += dt;     /* build 73: seconds of drift inside a curve */
        }
      }
    }

    steerVel += (input*agility-steerVel)*Math.min(1,resp*dt);
  }

  if (Math.abs(playerX)>1){
    if (speed > maxS*0.45) speed -= (maxS/2.0)*dt;
    shake=Math.max(shake, 2.4*spct);
    scrapeCd-=dt;                /* was up to 24 onsets a second: same crackle */
    if (scrapeCd<=0 && Math.random()<spct*0.6){
      scrapeCd=0.11;
      blip(90+Math.random()*60,0.05,'triangle',0.05, playerX>0?0.85:-0.85);
    }
    dPot=0;                      /* nothing earned off the road ever banks */
  }

  /* Came out of a drift still on the road: the pot becomes a bank, and a full
     bank is a bolt. Sits after the shoulder test so an exit that puts a wheel
     off the road has already been voided by it. */
  screech(drifting ? 0.45+Math.min(1,Math.abs(steerVel)*0.9)*0.55 : 0);

  if (wasDrift && !drifting && dPot>0){
    dBank += dPot; dPot=0;
    while (dBank>=1){ dBank-=1; giveBolt('drift'); }
  }

  speed=clamp(speed,0,maxS);
  spct =clamp(speed/maxS,0,1);

  playerX += steerVel*dt*Math.min(1, spct*3.2);

  /* the bend throws you wide — measured where the car actually is */
  /* The bend is the only force in the game that writes straight to playerX
     with no state of its own, which is why curves used to read as a camera
     trick. Z().cf is the centrifugal gain: VAPOR keeps 1.0 (build 58's
     behaviour, untouched) and an authored zone raises it. 2.0 is the
     recommended value for the base game once it has been played on a Mac. */
  playerX -= curSlope*speed*dt*(0.007 + 0.024*Math.pow(spct,1.5))*Z().cf;

  if (playerX> 1.55){ playerX= 1.55; steerVel=0; }
  if (playerX<-1.55){ playerX=-1.55; steerVel=0; }

  position += speed*dt;
  addScore(speed*dt/220);
  invT=Math.max(0,invT-dt);

  /* the chain lapses on its own if you stop threading traffic */
  if (chainT>0){
    chainT-=dt;
    if (chainT<=0) chain=0;
  }
  for (i=nmPops.length-1;i>=0;i--){
    nmPops[i].t+=dt;
    if (nmPops[i].t>NM_POP_LIFE) nmPops.splice(i,1);
  }

  ensure(position+MAXZ+Z_CAR+CH);
  cAnchor =curveAt(position+Z_CAR);
  curSlope=slopeAt(position+Z_CAR);
  warnSlope=slopeAt(position+Z_CAR+17000);
  bgX += (-curSlope*108000 - bgX)*Math.min(1,3*dt);

  if (mode==='run' && !learn){
    if (!coast){
      timeLeft-=dt;
      if (timeLeft<=0){ timeLeft=0; coastStart(); }
    } else if (speed<=maxS*COAST_END){
      /* build 105: the roll is over (10 % of the top speed): now the run ends */
      endReason='OUT OF TIME'; state='gameover'; best=Math.max(best,score|0); saveGame();
    }
  }

  if (learn && position+Z_CAR >= nextCP){
    tutGate();                          /* build 72: the lesson's gate: no lap, no award */
  } else if (position+Z_CAR >= nextCP){
    lap++;
    if (lap>=5) tutSkill();
    prLap();                                     /* build 96 */                      /* build 73: reaching lap 5 once ends the game-over offer */
    cpStart=nextCP; cpLen=lapLength(lap); nextCP=cpStart+cpLen;
    var award=cpBonus(lap);
    timeLeft += award; coast=false;     /* build 105: a gate reached on the roll saves the run */
    /* The lap<=3 clamp to CLOCK_CAP is gone. It only ever bit a player who was
       ALREADY doing well — someone struggling never reached 48s in the first
       place — so all it did was confiscate the early margin from good play and
       hand nothing to anyone. The generous early awards are the beginner
       assist now, and the tapering multiplier plus the traffic curve take that
       cushion back over the following ten laps. */
    addScore(2500); flash=1;
    /* ONE CARD, NOT FIVE SENTENCES.
       This block used to fire up to five separate say() lines at the same
       instant. On lap 8 that was a 480x117 slab parked at y=120 — across the
       horizon (y=212) and over the traffic you were closing on at 14,400
       units a second. The card is now:
         line 1  LAP n  +award        (the two numbers that matter)
         line 2  chip row             (what this leg carries, as icons)
         line 3  hazard alert         (only on the lap one is introduced)
       heart early in the leg, bolt later, so they never land on top of each
       other and you get a reason to keep pushing through the middle. Hull
       kits scale with the punishment: one, then two, then three. */
    /* The unlock schedule, moved forward. Everything interesting used to sit
       behind minutes of driving: the first shot at 46s, the rampage at 103s,
       the first lane-changing van at 201s. Someone trying the game out of
       curiosity quit before any of it. Note also that the old heart rule was
       `lap>=7 || lap%2===0`, which gave laps 2, 4 and 6 a heart and laps 1, 3
       and 5 none — an accident of the modulo, not a decision. */
    /* Three from lap 7, not from lap 10. The simulation had flagged that health
       and not the clock was probably the meter that runs out after lap 10 —
       1 to 2 crashes a leg against a 4-bar cap — and playtesting confirmed it.
       The extra bar is the cheap fix; the clock multiplier stays as tuned. */
    var hearts = lap>=7 ? 3 : 1;
    var bolts  = lap>=6 ? 2 : 1;                   /* shooting from lap 1     */
    var dinos  = (lap>=3 && lap%2===1) ? 1 : 0;   /* rampage at ~37s in; build 88: every other lap, 3, 5, 7... (Carlos) */
    /* Only claim a speed bump when there is one. Top speed caps at lap 7, so
       the old unconditional "TOP SPEED UP" was false on every lap after it. */
    var spdUp  = maxSpeedFor(lap) > maxSpeedFor(lap-1);
    var pk = pickupPlan(hearts,bolts); hearts=pk.h; bolts=pk.b;    /* build 105: A + C, same amounts over two laps */

    say(T('T_LAP')+lap+'   +'+award+T('T_CP_S'),'#7cff4f',true,null,CP_MSG);
    var chips=[];
    if (hearts>0) chips.push({icon:'heart', n:hearts});
    if (bolts >0) chips.push({icon:'bolt',  n:bolts});
    if (dinos >0) chips.push({icon:'dino',  n:dinos});
    if (spdUp)    chips.push({icon:'spd',   n:1, label:T('T_SPD')});
    if (chips.length) sayChips(chips,'#21e6ff',CP_MSG);

    layPickups(hearts,bolts,dinos,pk.pair);          /* build 105 (was fixed bands: heart first, bolt second ...) */
    /* Must match weaverOdds() — this warning fired on lap 8 while the vans
       themselves moved to lap 5, so for three laps you met the hazard with no
       warning at all and then got told about it long after you had worked it
       out. If weaverOdds moves again, move this with it. */
    if (weaverOdds(lap)>0 && !taughtWeavers){
      taughtWeavers=true;
      say(T('T_WEAVERS'),'#ffd23f',false,'warn',CP_MSG);
    }
    blip(660,0.10,'square',0.2);
    setTimeout(function(){ blip(990,0.16,'square',0.2); },110);
  }

  for (i=cars.length-1;i>=0;i--){
    c=cars[i];
    c.z+=c.speed*dt;
    dz=c.z-position-Z_CAR;               // distance from the car you can see
    var dzPrev=dz+(speed-c.speed)*dt;    // where it was one step ago
    if (!c.passed && dz<0){
      c.passed=true; overtakes++;
      addScore(180*(1+0.2*(lap-1)));
      blip(1200,0.05,'sine',0.06);

      /* NEAR MISS — the reason to shave past traffic instead of avoiding it.
         This lives INSIDE the overtake block on purpose. It used to be a
         separate test further down that also required !c.passed, which the
         line above had already set in the same iteration — so the condition
         was unsatisfiable and the whole mechanic was dead. The moment a car
         draws level is exactly here; there is no second place to check it.

         The band is under half a lane wide, so it cannot trigger from
         ordinary lane discipline — you have to aim at the gap. */
      var nmLat=Math.abs(c.x-playerX);
      if (dinoT<=0 && spinT<=0 && nmLat<NM_BAND && nmLat>=CAR_W-0.01 &&
          speed>maxSpeedFor(lap)*0.45){
        chain++; chainT=NM_CHAIN_T;
        if (chain>chainBest) chainBest=chain;
        var close=1-(nmLat-(CAR_W-0.01))/(NM_BAND-(CAR_W-0.01));
        var mult=Math.min(NM_MAX_MULT, chain);
        /* runs 0.5 at the outer edge of the band to 1.5 for a paint-scraping
           pass — the part of the score the player has no other way to see */
        var closeMul=0.5+close;
        addScore(NM_BASE*closeMul*mult*(1+0.2*(lap-1)));
        var nmSide=(c.x>playerX?1:-1);
        nmPops.push({m:closeMul, t:0, side:nmSide});
        react('wink');                    /* build 94 */
        prAdd('nm');                      /* build 96 */
        if (nmPops.length>5) nmPops.shift();
        /* build 91: and the drift bar, by the number on screen (closeMul.toFixed(1)) */
        var nmShown=Math.round(closeMul*10)/10;
        dBank += NM_FILL_LO + (NM_FILL_HI-NM_FILL_LO)*(nmShown-0.5);
        while (dBank>=1){ dBank-=1; giveBolt('nm'); }
        /* the chirp comes from the side the car went by and slides down as it
           passes: a Doppler read for the one thing you cannot see happening */
        blip(760+Math.min(8,chain)*90, 0.05, 'sine', 0.07, nmSide*0.8, 0.78);
        if (chain===5||chain===10||chain===20)
          say(T('T_CHAIN')+chain,'#ffd23f',true,null,1.4);
      }
    }
    if (dz<-2600){ cars.splice(i,1); continue; }
    if (c.weaver){
      c.changeT -= dt;                    /* the clock runs through every phase,
                                             so changes land a true 5s apart */
      if (c.phase==='wait'){
        /* Gate on TIME to reach you, not distance. Barrel along and the vans
           settle early; ease off and they keep weaving right in front of you,
           which is the only way you ever get to watch one do it. */
        var ttc = dz/Math.max(400, speed-c.speed);
        if (c.changeT<=0 && ttc>WEAVE_TTC && dz>1500){
          var opts=[], j, k, ok;
          for (j=-1;j<=1;j+=2){
            k=c.lane+j;
            if (k<0||k>3) continue;
            ok=true;
            for (var q=0;q<cars.length;q++){
              if (cars[q]!==c && cars[q].lane===k && Math.abs(cars[q].z-c.z)<4200){ ok=false; break; }
            }
            if (ok) opts.push(k);
          }
          if (opts.length){
            c.toLane=opts[(Math.random()*opts.length)|0];
            c.sigDir=c.toLane>c.lane?1:-1;
            c.sigT=0.8;                       // blink before it commits
            c.phase='signal';
            c.changeT=WEAVE_EVERY;            // next one is due 5s from now
          } else c.changeT=1.2;               // boxed in: try again shortly
        }
      } else if (c.phase==='signal'){
        c.sigT-=dt;
        if (c.sigT<=0){ c.phase='move'; c.moveT=0.8; c.fromX=c.x; }
      } else if (c.phase==='move'){
        c.moveT-=dt;
        var tt=clamp(1-c.moveT/0.8,0,1);
        c.x=c.fromX+(LANES[c.toLane]-c.fromX)*(tt*tt*(3-2*tt));
        if (c.moveT<=0){
          c.x=LANES[c.toLane]; c.lane=c.toLane;
          c.phase='wait';
        }
      }
    }

    /* swept in z: a gap closing at 10,000 units/sec cannot skip the box */
    var inBox = Math.min(dz,dzPrev)<HIT_FRONT && Math.max(dz,dzPrev)>-HIT_BACK;
    var lat = Math.abs(c.x-playerX);

    if (dinoT>0){
      if (inBox && lat<DINO_HIT){
        blasts.push({z:c.z, x:c.x, t:0, isBlast:true});
        addScore(killScore());
        prKill();                         /* build 96: the dino */
        cars.splice(i,1);
        blip(150,0.20,'sawtooth',0.16);
        shake=Math.max(shake,6);
        continue;
      }
    } else if (invT<=0 && spinT<=0 && inBox && lat<CAR_W-0.01){
      /* dz<0 means it sits behind the anchor right now — the same sign the
         overtake test uses two dozen lines up, so "it is behind me" means
         exactly one thing in this loop. */
      crash(dz<0);
    }
  }
  if (fireHeld && odT>0) fire();      /* held trigger only runs in overdrive */

  if (learn) tutStep(dt);               /* build 72: scripted scenes instead of random traffic */
  else {
    spawnT-=dt;
    if (spawnT<=0){ spawnT=spawnGap(lap)*(0.7+Math.random()*0.7); trySpawn(); }
  }

  for (i=pickups.length-1;i>=0;i--){
    var pk=pickups[i];
    var pdz=pk.z-position-Z_CAR, pdzPrev=pdz+speed*dt;
    if (pdz<-3000){ pickups.splice(i,1); continue; }
    var reach = pk.kind==='dino' ? DINO_R : HEART_R;
    if (Math.min(pdz,pdzPrev)<HIT_FRONT && Math.max(pdz,pdzPrev)>-HIT_BACK &&
        Math.abs(pk.x-playerX)<reach){
      pickups.splice(i,1); flash=1;
      if (learn) tutGot(pk.kind);                /* build 73 */
      if (pk.kind==='heart'){
        react('heart');                   /* build 94 */
        prAdd('heart');                   /* build 96 */
        if (health<CH_().hp){ health++; say(T('T_HULL_UP'),'#ff6ad5',true,'heart'); }
        else { addScore(10000); say(T('T_HULL_FULL'),'#ff6ad5',true,'heart'); }
        blip(740,0.09,'sine',0.2);
        setTimeout(function(){ blip(988,0.09,'sine',0.2); },90);
        setTimeout(function(){ blip(1319,0.20,'sine',0.2); },180);
      } else if (pk.kind==='bolt'){
        giveBolt('pickup');
      } else {
        dinoT=DINO_TIME; shake=Math.max(shake,8);
        prAdd('dino');                    /* build 96 */
        say(T('T_RAMPAGE_ON')+DINO_TIME+'s','#7cff4f',true,'dino');
        roar();
      }
    }
  }


  /* ---- the hail: did we just pass a waving alien close enough? ----
     Props sit on a fixed grid, so "passing one" is the frame in which the
     car's own z crosses a slot boundary. One test a frame, no scanning. */
  hailCool=Math.max(0,hailCool-dt);
  /* build 77: the previous z is STORED (crash() changes `speed` after the car has moved, so rebuilding it as
     now - speed*dt could step over a slot), the test is hailLive() (a wandering saucer no longer blocks it),
     and there are two ways in: drive under the broken lamp (on the road) or, as before, right beside the alien. */
  var zcNow=position+Z_CAR, zcPrev=hailPrevZ;
  hailPrevZ=zcNow;
  /* build 88: the Halloween activator has its own, wider pass test (hwActPass); one that goes by while it can't
     take you is made up further on (hwActMakeup) */
  if (lap>=HAIL_LAP && !learn && ZN.id==='vapor' && hwK>0){
    if (hailLive() && hwActPass()){ if (state==='playing'){ startMist('haunted'); return; } }
    if (zcPrev>=0 && zcNow>zcPrev && zcNow-zcPrev<DECO_SPACE && Math.floor(zcNow/DECO_SPACE)>Math.floor(zcPrev/DECO_SPACE)
        && isHwAct(Math.floor(zcNow/DECO_SPACE)) && !hailLive()) hwActMakeup();
  }
  if (zcPrev>=0 && zcNow>zcPrev && zcNow-zcPrev<DECO_SPACE && hailLive()){
    var iNow=Math.floor(zcNow/DECO_SPACE);
    var hwAct=false;                    /* build 88: the activator is tested above (build 84: isHwAct(iNow)) */
    if (iNow>Math.floor(zcPrev/DECO_SPACE) && (hwAct || isHailer(iNow))){
      var hSide=hashAt(iNow,2)<0.5?-1:1;
      if ((hSide*playerX >= actInner() && hSide*playerX < HAIL_HEAD_X+HAIL_LAMP_R) ||   /* build 91: inner edge = a quarter in the outer lane */
          Math.abs(hSide*HAIL_LAT - playerX) < HAIL_R){
        if (hwAct){ if (state==='playing'){ startMist('haunted'); return; } }
        else if (ZN.look==='haunted'){ if (state==='playing'){ startMist('vapor'); return; } }   /* a hitchhiker: back to VAPOR */
        else callUfo();
      }
    }
  }

  /* the saucer: drifts along the road at half your speed, so you reel it in
     slowly instead of blowing past it. Scenery only — nothing collides.
     A HUNTER (called by a hailer) ignores all of that and flies the block
     below instead. */
  if (ufo && ufo.hunt){
    var dzc=ufo.z-(position+Z_CAR);
    var uTop=UFO_TOP*maxSpeedFor(lap);
    /* Station-keeping that is really speed-matching: the target is your own
       speed, corrected toward UFO_HOLD, and capped. Under the cap it sits
       over you for as long as you let it; over the cap you leave it behind,
       which is the refusal. */
    var uWant=clamp(speed+(UFO_HOLD-dzc)*0.9, 0, uTop);
    ufo.v += (uWant-ufo.v)*Math.min(1,dt*2.2);
    ufo.z += ufo.v*dt;
    ufo.x += (playerX-ufo.x)*Math.min(1,dt*UFO_TRACK);
    ufo.spin+=dt*2.4; ufo.bob+=dt; ufo.beamOn=true; ufo.beamK=1;
    /* spinning out breaks the lock: you cannot be picked up mid-crash */
    var onBeam = spinT<=0 && invT<=0.01 &&
                 Math.abs(dzc-UFO_HOLD)<UFO_BAND && Math.abs(playerX-ufo.x)<UFO_BEAM_R;
    /* drains faster than it fills, so a wobble costs you, but half a second
       of bad luck does not throw the whole attempt away */
    ufo.lock=clamp(ufo.lock+(onBeam?dt:-dt*1.6),0,UFO_LOCK);
    if (!ufo.told && ufo.lock>0.25){ ufo.told=true; say(T('BEAM_HOLD'),'#7cff4f',false,null,1.5); }
    ufo.life-=dt;
    /* `state` is re-tested because crash() runs EARLIER in this same frame
       and may already have ended the run. Losing beats being abducted.
       The return hands the rest of the frame to the cutscene. */
    if (ufo.lock>=UFO_LOCK && state==='playing'){ startAbduct(); return; }
    else if (ufo.life<=0 || dzc<-4200){
      ufo.fade-=dt*1.3;
      if (ufo.fade<=0){ ufo=null; hailCool=HAIL_COOL; say(T('BEAM_GONE'),'#8a7ec4',false,null,1.4); }
    }
  } else if (ufo){
    /* A wandering saucer is scenery until you put yourself under its lit
       cone. Then it notices, and from that moment it is a hunter like any
       other. This is the opportunistic way in: no alien needed, but you
       have to run one down and time its sway, because it drifts at half
       your speed and the beam blinks. */
    if (ufo.beamOn && lap>=HAIL_LAP && state==='playing' && spinT<=0 && invT<=0.01){
      var adz = ufo.z-(position+Z_CAR);
      if (adz < UFO_NOTICE && adz > -400 && Math.abs(playerX-ufo.x) < UFO_BEAM_R){
        ufo.hunt=true; ufo.lock=0; ufo.told=false; ufo.beamK=1;
        ufo.v=speed; ufo.life=UFO_HUNT_T; ufo.fade=1; ufo.color=ZN.accent;
        say(T('BEAM_SEEN'),'#7cff4f',true,null,1.8);
        blip(300,0.10,'square',0.16);
        setTimeout(function(){ blip(400,0.14,'square',0.16); },100);
      }
    }
    ufo.z    += speed*0.5*dt;
    ufo.phase+= ufo.rate*dt;
    ufo.x     = ufo.amp*Math.sin(ufo.phase);
    ufo.spin += dt*2.4;
    ufo.bob  += dt;
    ufo.beamT-= dt;
    if (ufo.beamT<=0){                       /* the beam blinks on and off */
      ufo.beamOn=!ufo.beamOn;
      ufo.beamT = ufo.beamOn ? (0.5+Math.random()*1.4) : (0.7+Math.random()*2.2);
    }
    ufo.life -= dt;
    if (ufo.life<1.4) ufo.fade=Math.max(0,ufo.life/1.4);
    if (ufo.life<=0 || ufo.z-position-Z_CAR < -3200) ufo=null;
  } else {
    ufoT -= dt;
    if (ufoT<=0){
      ufoT = ufoWait(20+Math.random()*14);   /* build 85 */
      ufo = { z: position+44000+Math.random()*6000, x:0, hunt:false, lock:0, beamK:1,
              amp: 1.5+Math.random()*1.0, rate: 0.45+Math.random()*0.60,
              phase: Math.random()*Math.PI*2,
              hover: 0.95+Math.random()*0.50, bob: Math.random()*6, spin:0,
              color: ZN.props[(Math.random()*ZN.props.length)|0],
              beamOn: Math.random()<0.5, beamT: 0.6+Math.random()*1.4,
              life: 26, fade: 1, isUfo: true };
      ufo.x = ufo.amp*Math.sin(ufo.phase);
    }
  }

  /* Cruise has no fail state, so its score is unbounded — a long enough
     session would beat any legitimate run. It never touches `best`. */
  if (mode==='run' && !learn && (score|0)>best) best=score|0;
  if (fireCd>0) fireCd=Math.max(0,fireCd-dt);
  if (odT>0){
    var wasO=odT;
    odT=Math.max(0,odT-dt);
    if (wasO>DINO_WARN && odT<=DINO_WARN){
      rampageWarn();
      say(T('T_OD_ENDING'),'#ffd23f',true,'bolt');
    }
    if (odT===0) say(T('T_OD_SPENT'),'#8a7ec4');
  }

  if (dinoT>0){
    var wasT=dinoT;
    dinoT=Math.max(0,dinoT-dt);
    /* call it before it drops, not after — running out mid-traffic while
       you still think you are invincible is how you lose a run */
    if (wasT>DINO_WARN && dinoT<=DINO_WARN){
      rampageWarn();
      say(T('T_RAMPAGE_ENDING'),'#ffd23f',true,'dino');
    }
    if (dinoT===0) say(T('T_BACK_TO_CAR'),'#8a7ec4');
  }

  /* rounds in flight: they pierce, so one shot can clear a whole queue */
  var shotV=maxSpeedFor(lap)*1.5;
  for (i=pshots.length-1;i>=0;i--){
    var sh=pshots[i];
    sh.prevZ=sh.z;
    sh.z += shotV*dt;
    for (var j=cars.length-1;j>=0;j--){
      var tc=cars[j];
      if (Math.abs(tc.x-sh.x)<0.22 && tc.z>sh.prevZ-340 && tc.z<=sh.z+340){
        blasts.push({z:tc.z, x:tc.x, t:0, isBlast:true});
        addScore(killScore());
        if (learn) tutShot(tc);                  /* build 73: a bolt destroyed this car */
        prKill();                                /* build 96: shots and overdrive fire */
        cars.splice(j,1);
        blip(150,0.20,'sawtooth',0.16);
      }
    }
    if (sh.z>position+MAXZ) pshots.splice(i,1);
  }
  for (i=blasts.length-1;i>=0;i--){
    blasts[i].t += dt/0.7;
    if (blasts[i].t>=1 || blasts[i].z<position-3000) blasts.splice(i,1);
  }

  hwSpookStep(dt);                     /* build 87: HAUNTED HIGHWAY's ghost and giant hand */
  engine(speed/SPD_REF,true);
  musMix();
}

/* ---------------------------------------------------------------
   DRAW HELPERS
--------------------------------------------------------------- */
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function glowText(txt,x,y,size,color,align,blur,weight){
  ctx.font=(weight||'700')+' '+size+'px "Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif';
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.shadowColor=color; ctx.shadowBlur=hb(blur===undefined?14:blur);
  ctx.fillStyle=color; ctx.fillText(txt,x,y);
  ctx.shadowBlur=0;
}
function monoText(txt,x,y,size,color,align){
  ctx.font='700 '+size+'px ui-monospace,Menlo,"Courier New",monospace';
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillStyle=color; ctx.fillText(txt,x,y);
}
/* Bottom-row HUD labels: heavy display face, tracked out, knocked out of a
   dark outline. The outline is what makes them readable over a bright road --
   that job belongs to contrast, never to size. Their SIZE is set by BTAG at
   the top of the bottom row: HERO on desktop, LABEL * UI on touch. */
/* Build 71: the four bottom tags never change while you drive, but each one
   was a stroked outline plus a blurred glow, every frame. They are painted
   once (per text, size, colour, scale and font load) into a small sprite and
   copied in at whole device pixels. While the HUD glow is mid-fade they are
   drawn live, so the cache never churns. */
var tagCache={}, tagN=0;
try{ if (document.fonts && document.fonts.addEventListener)
       document.fonts.addEventListener('loadingdone', function(){ tagCache={}; tagN=0; }); }catch(_){}
function hudTag(txt,x,y,size,color,align){
  if (HQ===1 || HQ===0){
    var key=txt+'|'+size+'|'+color+'|'+(align||'left')+'|'+dpr+'|'+HQ, e=tagCache[key];
    if (!e){
      if (tagN>=40){ tagCache={}; tagN=0; }
      e=tagCache[key]=tagSprite(txt,size,color,align); tagN++;
    }
    if (e){
      ctx.save(); ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(e.c, Math.round(x*dpr)-e.ax, Math.round(y*dpr)-e.ay);
      ctx.restore();
      return;
    }
  }
  hudTagLive(ctx,txt,x,y,size,color,align);
}
function tagSprite(txt,size,color,align){
  try{
    var c=document.createElement('canvas'), g=c.getContext('2d');
    if (!g || !g.measureText) return null;
    c.addEventListener('contextrestored', dropCaches);
    g.font='900 '+size+'px "Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif';
    if ('letterSpacing' in g) g.letterSpacing='1.5px';
    var tw=g.measureText(txt).width + size*0.3, m=6+24/dpr;   /* glow + outline room */
    var lw=tw+2*m, lh=size*1.5+2*m;
    var ax0 = align==='right' ? m+tw : (align==='center' ? m+tw/2 : m);
    c.width=Math.ceil(lw*dpr); c.height=Math.ceil(lh*dpr);
    var ax=Math.round(ax0*dpr), ay=Math.round((m+size*1.12)*dpr);
    g.setTransform(dpr,0,0,dpr,ax,ay);
    hudTagLive(g,txt,0,0,size,color,align);
    return {c:c, ax:ax, ay:ay};
  }catch(_){ return null; }
}
function hudTagLive(ctx,txt,x,y,size,color,align){
  var ls = ('letterSpacing' in ctx);
  ctx.font='900 '+size+'px "Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif';
  if (ls) ctx.letterSpacing='1.5px';
  ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.lineJoin='round'; ctx.lineWidth=4.5;
  ctx.strokeStyle='rgba(4,2,12,.88)'; ctx.strokeText(txt,x,y);
  ctx.shadowColor=color; ctx.shadowBlur=hb(10);
  ctx.fillStyle=color; ctx.fillText(txt,x,y);
  ctx.shadowBlur=0; ctx.lineWidth=1; ctx.lineJoin='miter';
  if (ls) ctx.letterSpacing='0px';
}

/* ---------------------------------------------------------------
   PAINT-ONCE LAYERS (build 70)
   The sky and ground gradients, the sun/moon with its glow, and ALIEN
   PLAINS' ground fog never change within a zone, but they were being
   repainted from scratch every frame -- about half the frame when the
   canvas is drawn on the CPU, which is how Safari draws it. Each is now
   painted once per zone and render scale into an offscreen canvas, with
   the exact calls it used before, and copied in with whole-pixel blits.
   Blits are placed in device pixels and the camera shake is rounded to a
   whole pixel for them, so a copy is never resampled.
--------------------------------------------------------------- */
var shX=0, shY=0;                  /* this frame's camera shake (render) */

  ctx.lineTo(x+s*0.25,y+s*0.12);

function drawSky(){

/* ---------------- ALIEN slot: the hitchhikers (the hailers of this zone) ---------------- */

/* the haunted look for a prop slot: each type, each prop's own coin (build 81's toss) picks A or B */
function hwDeco(type,x,gy,u,idx,side,walk,hail,zRel){
  var A=propToss(idx);
  if (type===0){ if (A) hwMastA(x,gy,u,idx,side); else hwMastB(x,gy,u,idx,side); }
  else if (type===1){ if (A) hwBillboardA(x,gy,u,idx,side,zRel); else hwBillboardB(x,gy,u,idx,side); }
  else if (type===2){ if (A) hwKioskA(x,gy,u,idx,side); else hwKioskB(x,gy,u,idx,side); }
  else if (type===3){ if (A) hwTowerA(x,gy,u,idx,side); else hwTowerB(x,gy,u,idx,side); }
  else if (type===4){ if (A) hwDinoA(x,gy,u,idx,side,walk); else hwDinoB(x,gy,u,idx,side,walk); }
  else if (type===5){ if (A) hwObeliskA(x,gy,u,idx,side); else hwObeliskB(x,gy,u,idx,side); }

/* THE HALLOWEEN ACTIVATOR as it stands in VAPOR (build 84): a crooked gas lamp with its lantern over
   the outer lane, the skeleton hitchhiker at the hailer's spot and the ghost hovering a little further up
   the road (1,600 units, so the two never overlap). They wave
   (one ?/! between them, the ghost's) and the flame burns green only while hailLive(): the mist can
   really take you then. */
function hwActDraw(idx,zRel,p,a,side){
  var live=hailLive(), t=performance.now()/1000;

    if (pg.y>horizonY && ag>0.05){
      var xg=W/2+pg.ppu*(bend(zg)+side*2.30-playerX);
      if (xg>-pg.ppu*3 && xg<W+pg.ppu*3){ ctx.globalAlpha=ag; hwAlienA(xg,pg.y,pg.ppu,idx,side,0,live,live); }
    }

}
/* ---------------------------------------------------------------
   HAUNTED HIGHWAY'S TWO SURPRISES (build 87, Carlos 10-19)
   1. THE GHOST'S BOO. Now and then one of the roadside ghost hitchhikers (only the ones that thumb a
      ride, never a hailer that takes you home) wakes up as you come up to it: it lifts off its spot,
      floats out into the lanes, then rushes the car and pops up right in front of the camera, big and
      see-through, with a classic "booooo". The face stays SCARE_FACE (1.3 s) at SCARE_A of full
      strength, so the road shows through it. It is the sheet ghost's own cartoon face: two eyes, an O.
   2. THE GIANT HAND. A few graveyards hold a much bigger skeleton hand. When one is coming up and a car
      is about to pass it, the hand rears back, swings out over the road and slams that car flat, a
      little way ahead of you: the slam lands when the graveyard is 0.45 s of your speed ahead
      (4,500-8,000 units), close enough to see it, never out at the horizon. The flat car is harmless:
      drive over it. To make the timing land, the car the hand picks is eased (between half and 1.6x its
      own speed) so it reaches the graveyard as you come up to it. No car fits = no slam, it just claws.
   Both live in HAUNTED HIGHWAY only (ZN.look 'haunted'), only while playing, never in the tutorial,
   and never both at once. Neither uses Math.random, so nothing else in a run changes.
   ?spooky=1 makes both happen as often as they can (testing).
--------------------------------------------------------------- */
var SPOOK_TEST=(function(){ try{ return /[?&]spooky=1/.test(location.search||''); }catch(_){ return false; } })();
var SCARE_ODDS  = SPOOK_TEST?1:0.70;  /* share of the roadside ghosts that can wake                    */
var SCARE_EVERY = SPOOK_TEST?8:35;    /* s: at least this long between two scares                      */
var SCARE_WAKE  = 19000;              /* a ghost wakes when it is this far ahead...                    */
var SCARE_NEAR  = 11000;              /* ...and not yet nearer than this                               */
var SCARE_HOVER = 7000;               /* where it hangs in the lanes before the rush                   */
var SCARE_LEAVE = 0.85;               /* s: lifting off and floating out into the lanes                */
var SCARE_RUSH  = 0.50;               /* s: the rush at the car                                        */
var SCARE_FACE  = 1.3;                /* s: the face up close (Carlos)                                 */
var SCARE_A     = 0.40;               /* the face's strength: mostly see-through (Carlos)             */
var BOO_VOL     = 0.31;               /* the voice; build 88: 15 % louder (was 0.27, Carlos)            */
var HAND_ODDS   = SPOOK_TEST?0.70:0.28;  /* share of the graveyard slots that hold the giant hand      */
var HAND_EVERY  = SPOOK_TEST?5:20;    /* s between two slams                                           */
var HAND_LAT    = 2.45;               /* its graveyard stands here, just off the road                  */
var HAND_ARM    = 40000;              /* it starts picking a car when it is this close                 */
var HAND_REACH  = 2400;               /* how far along the road from its graveyard it can still reach  */
var HAND_WIND=0.55, HAND_SWING=0.30, HAND_HOLD=0.12, HAND_LIFT=0.60;   /* s */
var PAN_LIFE    = 6;                  /* s a flattened car lies there                                  */
var PAN_SLIDE   = 0.85;               /* the flat car skids on at this share of its speed, slowing     */
var scare=null, scareCool=0, scareLast=-1, hand=null, handCool=0, handLast=-1, pans=[];
var SPOOK_ON    = true;               /* build 88: false = neither ever comes (tests)                  */
var SPOOK_DUE   = 1.1;                /* build 88: laps of HAUNTED driving at most between two of each */
var SCARE_DUE_EVERY = 20;            /* build 88: s after the last scare before a due one may come (35 for the others) */
var SPOOK_FIRST = 0.5;                /* build 88: laps into a visit before the first ghost is due (the hand at 0.7 of it) */
var hwHD=0, scareDueD=0, handDueD=0, handForce=-1, ghostForce=-1;

function hwSpookClear(){
  scare=null; hand=null; pans=[]; scareLast=-1; handLast=-1;
  scareCool=SPOOK_TEST?2:12; handCool=SPOOK_TEST?1:6;      /* not the moment you arrive */
  hwHD=0; handForce=-1; ghostForce=-1;                      /* build 88: a new visit */
  scareDueD=SPOOK_FIRST*lapLength(lap); handDueD=SPOOK_FIRST*0.7*lapLength(lap);
}
function hwLerp(a,b,k){ return a+(b-a)*k; }
function hwCamH(){ return camH*H/(roadWidth*W); }            /* the camera's height in road units */
/* a prop slot's type, the same decision drawDecor makes (-1 = an empty slot) */
function hwSlotType(idx){
  if (hashAt(idx,1) > Math.min(1,0.5*ZN.propDens)) return -1;
  if (idx===ghostForce && ZN.look==='haunted') return 6;   /* build 88: a due ghost hitchhiker stands here */
  var t=hashAt(idx,4);
  var type = t<0.22?0 : t<0.42?1 : t<0.59?2 : t<0.76?3 : t<0.85?4 : t<0.94?5 : 6;
  if (!(ZN.propMask & (1<<type))){
    var allow=[];
    for (var pm=0;pm<7;pm++) if (ZN.propMask & (1<<pm)) allow.push(pm);
    if (!allow.length) return -1;
    type=allow[(hashAt(idx,11)*allow.length)|0];
  }
  return type;
}
/* a ghost hitchhiker that only thumbs a ride (look A of the alien slot, not a hailer) and may wake */
function isScareGhost(idx){
  return ZN.look==='haunted' && hwSlotType(idx)===6 && hashAt(idx,10)>=HAIL_ODDS && propToss(idx) && hashAt(idx,81)<SCARE_ODDS;
}
/* a graveyard slot (either look) that holds the giant hand instead */
function isGiantHand(idx){
  if (ZN.look!=='haunted') return false;
  if (idx===handForce) return hwSlotType(idx)>=0;                          /* build 88: a due one */
  return SPOOK_ON && hwSlotType(idx)===5 && hashAt(idx,82)<HAND_ODDS;
}
/* Build 88: AT LEAST ONCE EVERY OTHER LAP (Carlos, 10-20). hwHD is the distance driven in HAUNTED HIGHWAY since
   you came in. Each of the two is due SPOOK_FIRST of a lap into a visit (the hand a little sooner) and
   SPOOK_DUE laps after the last one. Once due, the next ghost hitchhiker wakes whatever its odds; ghost
   hitchhikers are rare (about one slot in 80), so the next prop slot beyond the draw distance holds one
   (ghostForce), and the next one after that the giant hand's graveyard (handForce): nothing changes in sight.
   The ones that come by their odds still come as before, and each one resets its clock. */
function isGhostProp(idx){ return ZN.look==='haunted' && hwSlotType(idx)===6 && hashAt(idx,10)>=HAIL_ODDS && propToss(idx); }
function scareDue(){ return SPOOK_ON && hwHD>=scareDueD; }
function handDuePick(){
  if (!SPOOK_ON || hwHD<handDueD) return;
  if (handForce>=0 && handForce*DECO_SPACE>=position-DECO_SPACE) return;   /* the one picked is still ahead */
  var i0=Math.ceil((position+MAXZ+DECO_SPACE)/DECO_SPACE);
  for (var i=i0;i<i0+200;i++){
    if (i===ghostForce || hwSlotType(i)<0 || (hwSlotType(i)===6 && hashAt(i,10)<HAIL_ODDS)) continue;   /* not a hitchhiker that takes you home */
    handForce=i; return;
  }
}
function ghostDuePick(){
  if (!scareDue() || (ghostForce>=0 && ghostForce*DECO_SPACE>=position-DECO_SPACE)) return;
  var i0=Math.ceil((position+MAXZ+DECO_SPACE)/DECO_SPACE);
  for (var i=i0;i<i0+200;i++){
    if (i===handForce || hashAt(i,1)>Math.min(1,0.5*ZN.propDens) || hashAt(i,10)<HAIL_ODDS || !propToss(i)) continue;
    if (hwSlotType(i)===5 && hashAt(i,82)<HAND_ODDS) continue;              /* a giant hand's graveyard stays one */
    ghostForce=i; return;
  }
}
function handBusy(){ return !!(hand && (hand.vic || hand.ph==='wind' || hand.ph==='swing' || hand.ph==='hold' || hand.ph==='lift')); }

/* ---- the step: once a frame, from update(), only while playing ---- */
function hwSpookStep(dt){
  if (ZN.look!=='haunted' || learn || state!=='playing') return;
  hwHD+=speed*dt; handDuePick(); ghostDuePick();   /* build 88 */
  scareStep(dt); handStep(dt); panStep(dt);
}

function scareStep(dt){
  if (!scare){
    scareCool=Math.max(0,scareCool-dt);
    if (scareCool>(scareDue()?Math.max(0,SCARE_EVERY-SCARE_DUE_EVERY):0) || handBusy()) return;   /* build 88: a due one waits less */
    var lo=Math.max(scareLast+1, Math.floor((position+SCARE_NEAR)/DECO_SPACE)+1), hi=Math.floor((position+SCARE_WAKE)/DECO_SPACE);
    for (var idx=lo; idx<=hi; idx++){
      if (!(SPOOK_ON && isScareGhost(idx)) && !(scareDue() && isGhostProp(idx))) continue;   /* build 88: or one is due */
      var zr=idx*DECO_SPACE-position, side=hashAt(idx,2)<0.5?-1:1, l0=side*(2.00+hashAt(idx,3)*0.60);
      scare={isSpook:true, kind:'ghost', idx:idx, side:side, ph:'leave', t:0, z0:zr, l0:l0,
             gz:zr, gl:l0, gh:0.95, a:0.85, z:position+zr, rz:0, rl:0, rh:0, sx:0, sy:0, hr:0};
      scareLast=idx; scareDueD=hwHD+SPOOK_DUE*lapLength(lap);   /* build 88 */
      break;
    }
    return;
  }
  var s=scare; s.t+=dt;
  if (s.ph==='leave'){
    var q=clamp(s.t/SCARE_LEAVE,0,1);
    s.gz=hwLerp(s.z0, SCARE_HOVER, ease(q));
    s.gl=hwLerp(s.l0, clamp(playerX+s.side*0.30,-0.85,0.85), ease(clamp(q*1.15,0,1)));   /* out into the lanes, its side of you */
    s.gh=0.95+0.16*Math.sin(q*Math.PI*0.5);
    if (s.t>=SCARE_LEAVE){ s.ph='rush'; s.t=0; s.rz=s.gz; s.rl=s.gl; s.rh=s.gh; scareWhoosh(); }
  } else if (s.ph==='rush'){
    var r=clamp(s.t/SCARE_RUSH,0,1), e=easeIn(r);
    s.gz=hwLerp(s.rz, 600, e);
    s.gl=hwLerp(s.rl, playerX, ease(r));
    s.gh=hwLerp(s.rh, hwCamH()+0.12, ease(r));
    s.a=hwLerp(0.85, 0.55, e);
    var p=proj(Math.max(200,s.gz)), hr=1.15*p.ppu*0.30;
    if (hr>=scareR()*0.72 || s.t>=SCARE_RUSH){            /* it has reached the camera: the face */
      s.sx=W/2+p.ppu*(bend(Math.max(200,s.gz))+s.gl-playerX); s.sy=p.y-s.gh*p.ppu; s.hr=hr;
      s.ph='face'; s.t=0; shake=Math.max(shake,3);
      booSfx();
    }
  } else if (s.t>=SCARE_FACE){ scare=null; scareCool=SCARE_EVERY; return; }
  s.z=position+s.gz;
}

function handZs(){ return clamp(Z_CAR+0.42*speed, 4500, 7000); }   /* where the slam lands, ahead of you */
function handStep(dt){
  handCool=Math.max(0,handCool-dt);
  if (!hand){
    if (handCool>0 || scare) return;
    var lo=Math.max(handLast+1, Math.floor((position+handZs()+speed*(HAND_WIND+HAND_SWING)+1500)/DECO_SPACE)+1);
    var hi=Math.floor((position+Math.min(HAND_ARM,MAXZ-1500))/DECO_SPACE);
    for (var idx=lo; idx<=hi; idx++){
      if (!isGiantHand(idx)) continue;
      hand={isSpook:true, kind:'hand', idx:idx, side:hashAt(idx,2)<0.5?-1:1, zP:idx*DECO_SPACE, ph:'arm', t:0,
            vic:null, tz:idx*DECO_SPACE, tx:0, z:idx*DECO_SPACE, squashed:false};
      hand.tx=hand.side*0.5;
      handLast=idx;
      break;
    }
    return;
  }
  var h=hand, zRelP=h.zP-position;
  if (zRelP<300){ if (h.vic) h.vic.hwVic=false; hand=null; return; }   /* gone past it */
  if (h.vic && cars.indexOf(h.vic)<0) h.vic=null;                    /* shot, eaten by the dino... */
  if (h.ph==='arm'){
    var Tslam=(zRelP-handZs())/Math.max(speed,3000), Tpre=HAND_WIND+HAND_SWING;
    if (Tslam<=Tpre){
      if (h.vic && Math.abs(h.vic.z+h.vic.speed*Math.max(0,Tslam)-h.zP)<=HAND_REACH){
        h.ph='wind'; h.t=0; h.tz=h.vic.z; h.tx=h.vic.x; handCreakSfx(h);
      } else { if (h.vic) h.vic.hwVic=false; h.vic=null; h.ph='pass'; }
      return;
    }
    if (!h.vic) h.vic=handPick(h,Tslam);
    if (h.vic){
      var c=h.vic, req=(h.zP-c.z)/Tslam, vmin=Math.max(1600,c.hwBase*0.5), vmax=Math.min(8800,c.hwBase*1.6);
      if (req<vmin*0.8 || req>vmax*1.25){ c.hwVic=false; h.vic=null; }             /* it can't make it now */
      else c.speed+=(clamp(req,vmin,vmax)-c.speed)*Math.min(1,dt*1.6);
    }
  } else if (h.ph==='wind'){
    h.t+=dt; handTrack(h);
    if (h.t>=HAND_WIND){ h.ph='swing'; h.t=0; handWhooshSfx(h); }
  } else if (h.ph==='swing'){
    h.t+=dt; handTrack(h);
    if (h.t>=HAND_SWING){ handSlam(h); h.ph='hold'; h.t=0; }
  } else if (h.ph==='hold'){
    h.t+=dt; if (h.t>=HAND_HOLD){ h.ph='lift'; h.t=0; }
  } else if (h.ph==='lift'){
    h.t+=dt; if (h.t>=HAND_LIFT){ h.ph='done'; h.t=0; }
  }
  h.z = (h.ph==='swing'||h.ph==='hold'||h.ph==='lift') ? h.tz-8 : h.zP;   /* sorted just in front of its car */
}
function handTrack(h){ if (h.vic){ h.tz=h.vic.z; h.tx=h.vic.x; } }
/* the car that can reach the graveyard just as you come up to it with the least change of speed;
   one in the lanes on the hand's side is preferred, a weaver van a little less */
function handPick(h,T){
  var best=null, bs=1e9, zc=position+Z_CAR;
  for (var i=0;i<cars.length;i++){
    var c=cars[i];
    if (c.passed || c.z-zc<2500) continue;
    var req=(h.zP-c.z)/T, vmin=Math.max(1600,c.speed*0.5), vmax=Math.min(8800,c.speed*1.6);
    if (req<vmin || req>vmax) continue;
    var sc=Math.abs(Math.log(req/c.speed)) + (c.x*h.side>0?0:0.35) + (c.weaver?0.3:0);
    if (sc<bs){ bs=sc; best=c; }
  }
  if (best){ best.hwVic=true; best.hwBase=best.speed; }
  return best;
}
function handSlam(h){
  var c=h.vic, ok=!!c && cars.indexOf(c)>=0 && Math.abs(c.z-h.zP)<=HAND_REACH+600;
  if (ok){ h.tz=c.z; h.tx=c.x; cars.splice(cars.indexOf(c),1); h.squashed=true; }
  h.vic=null; handCool=HAND_EVERY; handDueD=hwHD+SPOOK_DUE*lapLength(lap);   /* build 88 */
  pans.push({isSpook:true, kind:'pan', z:h.tz, x:h.tx, col:ok?c.color:null, empty:!ok, t:0, hit:false, seed:h.idx,
             v:ok?c.speed*PAN_SLIDE:0, v0:ok?c.speed*PAN_SLIDE:1});
  shake=Math.max(shake, ok?5:4);
  var zr=h.tz-position, p=proj(Math.max(200,zr));
  handSlamSfx(ok, clamp((W/2+p.ppu*(bend(Math.max(200,zr))+h.tx-playerX)-W/2)/(W/2),-1,1)*0.7);
}
function panStep(dt){
  for (var i=pans.length-1;i>=0;i--){
    var o=pans[i]; o.t+=dt;
    if (o.v>0 && o.t>HAND_HOLD){ o.z+=o.v*dt; o.v*=Math.pow(0.2,dt); if (o.v<60) o.v=0; }   /* pressed, then it skids on, flat, and stops */
    var dz=o.z-(position+Z_CAR);
    if (!o.empty && !o.hit && dz<60 && dz>-500 && Math.abs(o.x-playerX)<0.36){   /* you drove over it: a bump, nothing more */
      o.hit=true; shake=Math.max(shake,2.5); blip(150,0.10,'square',0.10,0,0.6);
    }
    if (o.t>=PAN_LIFE || o.z-position<-2600) pans.splice(i,1);
  }
}

/* ---- drawing ---- */
/* render() hands these to the far-to-near list with the cars */
function hwSpookSort(list){
  if (ZN.look!=='haunted') return;
  for (var i=0;i<pans.length;i++) list.push(pans[i]);
  if (hand && (hand.ph==='swing'||hand.ph==='hold'||hand.ph==='lift')) list.push(hand);
  if (scare && (scare.ph==='leave'||scare.ph==='rush') && scare.gz>=Z_CAR+150) list.push(scare);
}
function drawSpook(o){
  if (o.kind==='pan') drawPancake(o);
  else if (o.kind==='hand') drawHandArm(o.idx,o.side,o.zP,o);
  else drawScareGhost(o);
}
/* once the rushing ghost is nearer than your car it is drawn over it */
function hwSpookNear(){ if (scare && scare.ph==='rush' && scare.gz<Z_CAR+150) drawScareGhost(scare); }

function drawScareGhost(o){
  var zr=Math.max(200,o.gz), p=proj(zr), u=p.ppu, t=tnow();
  var x=W/2+u*(bend(zr)+o.gl-playerX), hy=p.y-o.gh*u+Math.sin(t*6+o.idx)*u*0.03, s=u*1.15;
  if (x<-s*2||x>W+s*2) return;
  var A0=ctx.globalAlpha, a=(1-fogAt(zr))*o.a;
  if (o.ph==='leave'){ ctx.globalAlpha=a*(1-clamp(o.t/SCARE_LEAVE,0,1)); shadowOn(x,p.y,u*0.35,u); }
  ctx.globalAlpha=1;
  if (u<6){ ctx.globalAlpha=a; ctx.fillStyle='#e8f6ff'; ctx.fillRect(x-1,hy-u*0.4,2,u*1.0); ctx.globalAlpha=A0; return; }
  sheetGhost(x,hy,s,t,o.idx,a,2);
  ctx.globalAlpha=A0;
}

function scareR(){ return Math.min(H*0.36, W*0.30); }       /* the face's head radius up close */
function booEnv(t){                                          /* how open the mouth is, with the voice */
  if (t<0.12) return t/0.12;
  if (t<0.90) return 1-0.15*(t-0.12)/0.78;
  return Math.max(0,0.85*(1-(t-0.90)/0.40));
}
/* THE JUMP SCARE: drawn over the world and under the HUD, see-through (SCARE_A) */
function drawScareFace(){
  if (!scare || scare.ph!=='face' || (state!=='playing' && state!=='paused')) return;
  var s=scare, t=s.t, R0=scareR();
  var pe=easeOut(clamp(t/0.16,0,1)), bump=1+0.10*Math.sin(clamp(t/0.16,0,1)*Math.PI);
  var out=clamp((t-(SCARE_FACE-0.32))/0.32,0,1);
  var R=hwLerp(s.hr,R0,pe)*bump*(1+0.30*out*out);
  var cx=hwLerp(s.sx,W/2,pe)+Math.sin(t*6.3)*R*0.035, cy=hwLerp(s.sy,H*0.44,pe)+Math.sin(t*4.2)*R*0.025;
  var Aa=hwLerp(0.55,SCARE_A,pe)*(1-out);
  if (Aa<=0.005 || R<=1) return;
  var env=booEnv(t), wav=Math.sin(t*9);
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(Math.sin(t*5.1)*0.035);
  /* the sheet: head dome, sides running off the bottom of the screen, both arms up ("boo!"),
     one path so where the arms meet the body it is not doubly dark. A flat colour, no gradient and no
     halo: it covers a lot of screen, and on a phone those two cost about 6 ms a frame (measured) */
  ctx.globalAlpha=Aa;
  ctx.fillStyle='#e6f2ff';
  ctx.beginPath(); ctx.moveTo(-R,0); ctx.arc(0,0,R,Math.PI,0);
  ctx.quadraticCurveTo(R*1.18,R*1.2,R*1.30,R*2.4);
  for (var i=0;i<=8;i++) ctx.lineTo(R*1.30-i*R*2.6/8, R*2.4+((i%2)?-R*0.12:R*0.06)*(0.7+0.3*Math.sin(t*5+i)));
  ctx.quadraticCurveTo(-R*1.18,R*1.2,-R,0); ctx.closePath();
  for (var sd=-1; sd<=1; sd+=2){
    var ra=sd*(0.50+0.10*wav*sd), ax=sd*R*1.06, ay=R*0.10;      /* an arm raised beside the head, waving a little */
    ctx.moveTo(ax+Math.cos(ra)*R*0.20, ay+Math.sin(ra)*R*0.20);
    ctx.ellipse(ax, ay, R*0.20, R*0.58, ra, 0, Math.PI*2);
    var hx=ax+Math.sin(ra)*R*0.52, hy2=ay-Math.cos(ra)*R*0.52;  /* its round mitten of a hand */
    ctx.moveTo(hx+R*0.17,hy2); ctx.arc(hx,hy2,R*0.17,0,Math.PI*2);
  }
  ctx.fill('nonzero');
  ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Aa*0.35;      /* a faint glowing rim on its head */
  ctx.strokeStyle='#dff2ff'; ctx.lineWidth=Math.max(1.5,R*0.022);
  ctx.beginPath(); ctx.arc(0,0,R*0.99,Math.PI*1.06,Math.PI*1.94); ctx.stroke();
  ctx.globalCompositeOperation='source-over';
  /* its own cartoon face, as on the roadside: two tall eyes and an O mouth that opens with the voice */
  ctx.globalAlpha=Math.min(0.62,Aa*1.45); ctx.fillStyle='#140a24';
  ctx.beginPath();
  ctx.ellipse(-R*0.36,-R*0.06,R*0.15,R*0.24,0,0,Math.PI*2);
  ctx.moveTo(R*0.51,-R*0.06); ctx.ellipse(R*0.36,-R*0.06,R*0.15,R*0.24,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,R*0.50,R*(0.12+0.07*env),R*(0.09+0.21*env),0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=Math.min(0.70,Aa*1.6); ctx.fillStyle='#ffffff';      /* a shine in each eye */
  ctx.beginPath(); ctx.arc(-R*0.40,-R*0.16,R*0.045,0,Math.PI*2); ctx.moveTo(R*0.365,-R*0.16); ctx.arc(R*0.32,-R*0.16,R*0.045,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=Aa*0.55; ctx.fillStyle='rgba(255,140,190,0.5)';      /* and a little blush */
  ctx.beginPath(); ctx.ellipse(-R*0.62,R*0.22,R*0.13,R*0.06,0,0,Math.PI*2); ctx.moveTo(R*0.75,R*0.22); ctx.ellipse(R*0.62,R*0.22,R*0.13,R*0.06,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha=1;
}

/* a point on the hand's arm, world -> screen (z, lateral, height in road units) */
function hwPt(zw,lat,ht){
  var zr=Math.max(200,zw-position), p=proj(zr);
  return {x:W/2+p.ppu*(bend(zr)+lat-playerX), y:p.y-ht*p.ppu, u:p.ppu};
}
/* the arm's pose: e = elbow, w = wrist (z, lateral, height); ang = the hand's direction (0 up, side*pi/2
   toward that side); flat 0 upright .. 1 lying palm-down; curl = how far the fingers bend */
function handPose(idx,side,zP,h){
  var t=tnow(), lg=side*HAND_LAT;
  var I={e:[zP,lg+side*0.05,0], w:[zP,lg-side*0.10,1.30+0.05*Math.sin(t*1.3+idx)],
         ang:-side*0.10+0.07*Math.sin(t*0.9+idx), flat:0, curl:0.40+0.30*Math.sin(t*2.3+idx), spread:1};
  if (!h || h.ph==='arm' || h.ph==='pass' || h.ph==='done') return I;
  var Wd={e:[zP,lg+side*0.30,0.60], w:[zP,lg+side*0.60,2.05], ang:side*0.38, flat:0, curl:0.06, spread:1.18};
  if (h.ph==='wind') return poseMix(I,Wd,ease(h.t/HAND_WIND));
  var S={e:[hwLerp(zP,h.tz,0.50), hwLerp(lg,h.tx,0.38), 1.10], w:[h.tz, h.tx+side*0.52, 0.14], ang:-side*1.62, flat:1, curl:0, spread:1.10};
  if (h.ph==='swing') return poseArc(Wd,S,easeIn(h.t/HAND_SWING),2.7,1.6);
  if (h.ph==='hold'){ S.curl=Math.sin(h.t*30)*0.05*(1-h.t/HAND_HOLD); return S; }   /* pressed down, twitching */
  return poseArc(S,I,ease(h.t/HAND_LIFT),2.2,1.4);                                    /* lift */
}
function poseMix(A,B,k){
  function m(a,b){ return [hwLerp(a[0],b[0],k),hwLerp(a[1],b[1],k),hwLerp(a[2],b[2],k)]; }
  return {e:m(A.e,B.e), w:m(A.w,B.w), ang:hwLerp(A.ang,B.ang,k), flat:hwLerp(A.flat,B.flat,k),
          curl:hwLerp(A.curl,B.curl,k), spread:hwLerp(A.spread,B.spread,k)};
}
function poseArc(A,B,k,wh,eh){           /* through a raised midpoint, so it swings over rather than slides */
  k=clamp(k,0,1);
  function bz(a,b,mh){ var q=1-k, m=[(a[0]+b[0])/2,(a[1]+b[1])/2,mh];
    return [q*q*a[0]+2*q*k*m[0]+k*k*b[0], q*q*a[1]+2*q*k*m[1]+k*k*b[1], q*q*a[2]+2*q*k*m[2]+k*k*b[2]]; }
  var o=poseMix(A,B,k); o.e=bz(A.e,B.e,eh); o.w=bz(A.w,B.w,wh); return o;
}
/* the slot itself, from drawDecor: tombstones and a cracked mound; the arm too unless it is out over the road */
function drawHandSlot(idx,zRel,p,a,side){
  var u=p.ppu, x=W/2+u*(bend(zRel)+side*HAND_LAT-playerX);
  if (x<-u*7||x>W+u*7) return;
  ctx.globalAlpha=a;
  if (u<5){ ctx.fillStyle=BONE; ctx.fillRect(x-1,p.y-Math.max(3,u*1.9),2,Math.max(3,u*1.9)); ctx.globalAlpha=1; return; }
  handGrave(x,p.y,u,idx,side);
  var mine=hand && hand.idx===idx ? hand : null;
  if (!(mine && (mine.ph==='swing'||mine.ph==='hold'||mine.ph==='lift'))) drawHandArm(idx,side,idx*DECO_SPACE,mine);
  ctx.globalAlpha=1;
}
function hwStone(sx,gy,w,h,lean,kind){
  ctx.save(); ctx.translate(sx,gy); ctx.rotate(lean);
  var g=ctx.createLinearGradient(-w/2,0,w/2,0); g.addColorStop(0,'#4a4256'); g.addColorStop(0.5,'#3a3346'); g.addColorStop(1,'#221c2c');
  ctx.fillStyle=g; ctx.beginPath();
  if (kind===0){ ctx.moveTo(-w/2,0); ctx.lineTo(-w/2,-h+w/2); ctx.arc(0,-h+w/2,w/2,Math.PI,0); ctx.lineTo(w/2,0); }
  else { ctx.moveTo(-w/2,0); ctx.lineTo(-w/2,-h*0.75); ctx.lineTo(0,-h); ctx.lineTo(w/2,-h*0.75); ctx.lineTo(w/2,0); }
  ctx.closePath(); ctx.fill();
  if (h>=12){ ctx.fillStyle='rgba(10,6,14,.55)'; for (var l=0;l<2;l++) ctx.fillRect(-w*0.28,-h*0.58+l*h*0.14,w*(0.56-l*0.14),Math.max(1,h*0.03)); }
  ctx.restore();
}
function handGrave(x,gy,u,idx,side){
  var t=tnow(), A0=ctx.globalAlpha;
  shadowOn(x+side*u*0.5,gy,u*1.25,u);
  hwStone(x+side*u*0.95,gy,u*0.40,u*0.86,-side*0.08,0);
  hwStone(x+side*u*1.45,gy,u*0.32,u*0.64,side*0.10,1);
  var k=0.55+0.45*Math.sin(t*2.1+idx);
  glowDot(x,gy-u*0.06,u*0.95,GOO,(0.22+0.12*k)*A0);
  ctx.fillStyle='#2a1a1e'; ctx.beginPath(); ctx.ellipse(x,gy,u*0.78,u*0.22,0,Math.PI,0); ctx.fill();
  if (u>=10){
    ctx.strokeStyle='rgba(157,255,106,'+(0.45+0.4*k).toFixed(3)+')'; ctx.lineWidth=Math.max(1,u*0.014);
    ctx.beginPath(); ctx.moveTo(x-u*0.55,gy-u*0.04); ctx.lineTo(x-u*0.30,gy-u*0.12); ctx.lineTo(x-u*0.14,gy-u*0.07);
    ctx.moveTo(x+u*0.16,gy-u*0.13); ctx.lineTo(x+u*0.36,gy-u*0.07); ctx.lineTo(x+u*0.58,gy-u*0.03); ctx.stroke();
  }
}
/* the giant arm and hand. In the slot (idle / rearing back) from drawDecor; out over the road from
   render()'s far-to-near list, so it lands on top of its car */
function drawHandArm(idx,side,zP,h){
  var zr=zP-position;
  if (zr<600 || zr>MAXZ) return;
  var P=handPose(idx,side,zP,h), a=1-fogAt(zr), A0=ctx.globalAlpha;
  ctx.globalAlpha=a;
  var S=hwPt(zP,side*(HAND_LAT+0.12),0), E=hwPt(P.e[0],P.e[1],P.e[2]), Wr=hwPt(P.w[0],P.w[1],P.w[2]);
  var u=Wr.u, ue=E.u, live=h && h.ph!=='arm' && h.ph!=='pass' && h.ph!=='done';
  if (live) glowDot(S.x,S.y,ue*1.0,GOO,0.20);
  if (P.e[2]>0.04) bone(S.x,S.y,E.x,E.y,Math.max(2.2,(S.u+ue)*0.5*0.16));          /* the upper arm, out of the ground */
  var dx=Wr.x-E.x, dy=Wr.y-E.y, L=Math.sqrt(dx*dx+dy*dy)||1, nx=-dy/L, ny=dx/L, off=Math.max(1.2,(u+ue)*0.5*0.07);
  bone(E.x-nx*off,E.y-ny*off,Wr.x-nx*off*0.6,Wr.y-ny*off*0.6,Math.max(1.6,ue*0.085));   /* ulna */
  bone(E.x+nx*off,E.y+ny*off,Wr.x+nx*off*0.6,Wr.y+ny*off*0.6,Math.max(1.8,ue*0.105));   /* radius */
  if (P.e[2]<0.30){                                    /* the mound's front lip buries the elbow */
    ctx.fillStyle='#2a1a1e'; ctx.beginPath(); ctx.ellipse(E.x,E.y+ue*0.01,ue*0.38,ue*0.10,0,0,Math.PI); ctx.fill();
    if (ue>=12) for (var d=0;d<4;d++){ ctx.fillRect(E.x+(hashAt(idx*5+d,83)-0.5)*ue*0.5,E.y-ue*(0.02+0.03*hashAt(idx*9+d,83)),Math.max(1,ue*0.04),Math.max(1,ue*0.03)); }
  }
  handBones(Wr.x,Wr.y,u,P,side,live);
  ctx.globalAlpha=A0; ctx.lineCap='butt';
}
function handBones(x,y,u,P,side,live){
  var dx=Math.sin(P.ang), dy=-Math.cos(P.ang);              /* along the hand, on screen */
  var sq=1-0.62*P.flat, nx=-dy*sq, ny=dx*sq;                 /* across it, foreshortened when it lies flat */
  var A0=ctx.globalAlpha;
  if (u<8){                                                  /* far: a claw */
    ctx.strokeStyle=BONE; ctx.lineWidth=Math.max(1,u*0.06); ctx.lineCap='round'; ctx.beginPath();
    for (var f0=0;f0<4;f0++){ var o0=(f0-1.5)*0.13*u; ctx.moveTo(x+nx*o0*0.4,y+ny*o0*0.4); ctx.lineTo(x+dx*u*0.88+nx*o0,y+dy*u*0.88+ny*o0); }
    ctx.stroke(); return;
  }
  if (live) glowDot(x+dx*u*0.5,y+dy*u*0.5,u*1.0,GOO,0.22*A0);
  var w=Math.max(1.4,u*0.075), PALM=0.42*u, sp=P.spread, LEN=[0.92,1.0,0.96,0.80], SEG=[0.24,0.18,0.14];
  var base=Math.atan2(dy,dx), bendDir=-side;                 /* fingers curl toward the road */
  for (var f=0;f<4;f++){
    var o=f-1.5, bx=x+nx*o*u*0.05, by=y+ny*o*u*0.05;
    var kx=x+dx*PALM+nx*o*u*0.12*sp, ky=y+dy*PALM+ny*o*u*0.12*sp;
    bone(bx,by,kx,ky,w*0.85);                                /* the palm's bones */
    var an=base+o*0.10*sp, px=kx, py=ky;
    for (var s=0;s<3;s++){
      an+=(s===0?0.5:1)*P.curl*bendDir;
      var ln=SEG[s]*u*LEN[f], ex=px+Math.cos(an)*ln, ey=py+Math.sin(an)*ln;
      bone(px,py,ex,ey,w*(0.78-s*0.12));
      px=ex; py=ey;
    }
  }
  /* the thumb */
  var tbx=x+nx*(-1.6)*u*0.05, tby=y+ny*(-1.6)*u*0.05;
  var tkx=x+dx*PALM*0.45+nx*(-2.7)*u*0.12, tky=y+dy*PALM*0.45+ny*(-2.7)*u*0.12;
  bone(tbx,tby,tkx,tky,w*0.8);
  bone(tkx,tky,tkx+dx*u*0.17+nx*(-0.6)*u*0.11,tky+dy*u*0.17+ny*(-0.6)*u*0.11,w*0.66);
  ctx.fillStyle=BONE; ctx.strokeStyle=INK; ctx.lineWidth=Math.max(1,w*0.4);   /* the wrist */
  ctx.beginPath(); ctx.ellipse(x,y,u*0.10,u*0.075*(0.6+0.4*sq),P.ang,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.lineCap='butt';
}
function hwStar(x,y,r,rot){
  ctx.beginPath();
  for (var i=0;i<10;i++){ var an=rot+i*Math.PI/5-Math.PI/2, rr2=i%2?r*0.45:r; var px=x+Math.cos(an)*rr2, py=y+Math.sin(an)*rr2; if (i) ctx.lineTo(px,py); else ctx.moveTo(px,py); }
  ctx.closePath(); ctx.fill();
}
/* the flattened car (or, if the hand missed, just the dent in the road) */
function drawPancake(o){
  var zr=o.z-position;
  if (zr<=180||zr>MAXZ) return;
  var p=proj(zr), u=p.ppu, a=(1-fogAt(zr))*clamp((PAN_LIFE-o.t)/0.8,0,1);
  if (a<=0.01) return;
  var x=W/2+u*(bend(zr)+o.x-playerX), gy=p.y, t=o.t, cw=CAR_W*u, A0=ctx.globalAlpha, k;
  if (x<-cw*4||x>W+cw*4) return;
  if (t<0.8){                                                /* the dust ring */
    var q=t/0.8; ctx.globalAlpha=a*0.55*(1-q); ctx.strokeStyle='#b9a8c8'; ctx.lineWidth=Math.max(1,u*0.03*(1-q));
    ctx.beginPath(); ctx.ellipse(x,gy,cw*(0.7+q*1.9),Math.max(1,cw*(0.14+q*0.36)),0,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=a*0.75; ctx.strokeStyle='rgba(10,6,14,.85)'; ctx.lineWidth=Math.max(1,u*0.012);   /* cracks in the road */
  ctx.beginPath();
  for (k=0;k<6;k++){ var an=k/6*Math.PI*2+hashAt(o.seed+k,83)*0.6, r=cw*(0.75+0.6*hashAt(o.seed*3+k,83));
    ctx.moveTo(x+Math.cos(an)*cw*0.38,gy+Math.sin(an)*cw*0.08); ctx.lineTo(x+Math.cos(an)*r,gy+Math.sin(an)*r*0.22); }
  ctx.stroke();
  if (!o.empty){
    var sq=ease(t/0.09), w=cw*(1+0.32*sq), hh=Math.max(1,cw*0.66*(1-0.70*sq));
    ctx.globalAlpha=a;
    ctx.save(); ctx.translate(x,gy); ctx.rotate(Math.sin(t*9)*0.10*(o.v/o.v0)); ctx.translate(-x,-gy);   /* it spins a little as it skids */
    ctx.fillStyle='#05030a';                                 /* wheels squashed out to the sides */
    ctx.beginPath(); ctx.ellipse(x-w*0.50,gy-hh*0.3,w*0.12,Math.max(1,hh*0.5+u*0.01),0,0,Math.PI*2);
    ctx.moveTo(x+w*0.62,gy-hh*0.3); ctx.ellipse(x+w*0.50,gy-hh*0.3,w*0.12,Math.max(1,hh*0.5+u*0.01),0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#100a1c'; rr(x-w/2,gy-hh,w,hh,Math.min(hh*0.45,w*0.1)); ctx.fill();
    ctx.lineWidth=Math.max(1,cw*0.05); ctx.strokeStyle=o.col||BONE; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(x-w/2,gy-hh*0.6);              /* the crumpled roof */
    for (k=1;k<=8;k++) ctx.lineTo(x-w/2+w*k/8, gy-hh*(k%2?1.15:0.62));
    ctx.moveTo(x-w/2,gy); ctx.lineTo(x+w/2,gy); ctx.stroke(); ctx.lineJoin='miter';
    ctx.fillStyle='#ff4747';                                 /* its tail lights, flattened */
    ctx.fillRect(x-w*0.44,gy-hh*0.55,w*0.20,Math.max(1,hh*0.25)); ctx.fillRect(x+w*0.24,gy-hh*0.55,w*0.20,Math.max(1,hh*0.25));
    ctx.restore();
    if (t<0.9){                                              /* bits flying off */
      for (k=0;k<7;k++){
        var vx=(hashAt(o.seed*7+k,83)-0.5)*2.4, vy=1.2+hashAt(o.seed*11+k,83)*1.4;
        var cx=x+vx*cw*t*2.2, cy=gy-hh-(vy*t-2.6*t*t)*u*0.9;
        if (cy>gy) continue;
        ctx.globalAlpha=a*(1-t/0.9); ctx.fillStyle=k%2?(o.col||BONE):'#3a3346';
        var cs=Math.max(1,cw*0.07); ctx.fillRect(cx-cs/2,cy-cs/2,cs,cs);
      }
    }
    if (t>0.2 && t<3.6 && cw>6){                             /* cartoon stars, it's seeing */
      ctx.globalAlpha=a*Math.min(1,(t-0.2)/0.3)*Math.min(1,(3.6-t)/0.5); ctx.fillStyle='#ffd23f';
      for (k=0;k<3;k++){ var sa=t*4.2+k*Math.PI*2/3; hwStar(x+Math.cos(sa)*w*0.42, gy-hh-cw*0.30+Math.sin(sa)*cw*0.08, Math.max(2,cw*0.13), t*3+k); }
    }
  }
  ctx.globalAlpha=A0;
}

/* ---- sounds ---- */
/* a classic ghost "booooo": a voice made of two saws (a few cents apart) and a triangle an octave down,
   through the formants of "oo"; the lips open from closed (the B), the pitch rises, wobbles and slides
   down; a breath of noise and a send to the reverb, like THE MIST's wail */
function booSfx(){
  if (!A||muted) return;
  try{
    var c=A.ctx, t=c.currentTime+0.005, D=SCARE_FACE, i;
    var env=c.createGain();
    env.gain.setValueAtTime(0.0001,t);
    env.gain.linearRampToValueAtTime(BOO_VOL,t+0.07);
    env.gain.linearRampToValueAtTime(BOO_VOL*0.85,t+0.45);
    env.gain.linearRampToValueAtTime(BOO_VOL*0.65,t+0.95);
    env.gain.exponentialRampToValueAtTime(0.0001,t+D);
    env.connect(A.master);
    if (A.verbIn){ var snd=c.createGain(); snd.gain.value=0.45; env.connect(snd); snd.connect(A.verbIn); }
    var lip=c.createBiquadFilter(); lip.type='lowpass'; lip.Q.value=0.8;
    lip.frequency.setValueAtTime(160,t); lip.frequency.exponentialRampToValueAtTime(1300,t+0.08);
    lip.frequency.setValueAtTime(1300,t+0.85); lip.frequency.exponentialRampToValueAtTime(650,t+D);
    var F=[[310,5,1.6],[820,8,0.9],[2350,10,0.25]];           /* "oo": frequency, Q, level */
    for (i=0;i<F.length;i++){
      var bp=c.createBiquadFilter(), bg=c.createGain();
      bp.type='bandpass'; bp.frequency.value=F[i][0]; bp.Q.value=F[i][1]; bg.gain.value=F[i][2];
      lip.connect(bp); bp.connect(bg); bg.connect(env);
    }
    var o1=c.createOscillator(), o2=c.createOscillator(), o3=c.createOscillator(), g3=c.createGain();
    o1.type='sawtooth'; o2.type='sawtooth'; o3.type='triangle'; g3.gain.value=0.6;
    var pts=[[0,150],[0.16,205],[0.42,196],[0.80,170],[D,112]];
    var pc=function(o,m){ o.frequency.setValueAtTime(pts[0][1]*m,t); for (var k=1;k<pts.length;k++) o.frequency.linearRampToValueAtTime(pts[k][1]*m,t+pts[k][0]); };
    pc(o1,1); pc(o2,1.006); pc(o3,0.5);
    var lfo=c.createOscillator(), lg=c.createGain();
    lfo.frequency.value=5.4; lg.gain.setValueAtTime(1.5,t); lg.gain.linearRampToValueAtTime(9,t+0.6); lg.gain.linearRampToValueAtTime(12,t+D);
    lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    o1.connect(lip); o2.connect(lip); o3.connect(g3); g3.connect(lip);
    var nz=noiseSrc(), ng=c.createGain();
    ng.gain.setValueAtTime(0.0001,t); ng.gain.linearRampToValueAtTime(0.05,t+0.05); ng.gain.exponentialRampToValueAtTime(0.0001,t+D);
    nz.connect(ng); ng.connect(lip);
    o1.start(t); o2.start(t); o3.start(t); lfo.start(t); nz.start(t,0.61);
    o1.stop(t+D+0.05); o2.stop(t+D+0.05); o3.stop(t+D+0.05); lfo.stop(t+D+0.05); nz.stop(t+D+0.05);
  }catch(e){}
  blip(80,0.22,'sine',0.14,0,0.6);                           /* a soft thump under the B */
}
/* a band of the shared noise bed sweeping f0 -> f1 */
function hwNoise(f0,f1,dur,vol,q,pan,off){
  if (!A||muted) return;
  try{
    var c=A.ctx, t=c.currentTime, n=noiseSrc(), bp=c.createBiquadFilter(), g=c.createGain(), dst=A.master;
    bp.type='bandpass'; bp.Q.value=q; bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+dur*0.35); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    if (pan && c.createStereoPanner){ var pn=c.createStereoPanner(); pn.pan.value=clamp(pan,-1,1); pn.connect(A.master); dst=pn; }
    n.connect(bp); bp.connect(g); g.connect(dst); n.start(t,off||0.3); n.stop(t+dur+0.05);
  }catch(e){}
}
function scareWhoosh(){ hwNoise(300,1600,0.45,0.45,1.1,0,0.9); }   /* the ghost rushing at you */
function handPan(h){ var zr=Math.max(200,h.zP-position), p=proj(zr); return clamp(p.ppu*(bend(zr)+h.side*HAND_LAT-playerX)/(W/2),-1,1)*0.7; }
function handCreakSfx(h){                                    /* the ground groans, the bones clack */
