function drawBoost(bb){
  var zRel=bb.z-position;
  if (zRel<=180||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var w=Math.max(4,HEART_W*p.ppu), s=w*0.62;
  var x=W/2+p.ppu*(bend(zRel)+bb.x-playerX);
  if (x<-w*2||x>W+w*2) return;
  var t=performance.now();
  var y=p.y-(w*0.75+Math.sin(t/340)*w*0.14);
  var zap=0.72+0.28*Math.abs(Math.sin(t/70));

  ctx.globalAlpha=a*0.30; ctx.fillStyle='#21e6ff';
  ctx.beginPath(); ctx.ellipse(x,p.y,w*0.85,Math.max(1,w*0.22),0,0,Math.PI*2); ctx.fill();

  ctx.globalAlpha=a;
  var g=ctx.createLinearGradient(x,y-s,x,y+s);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.45,'#8ef4ff'); g.addColorStop(1,'#21e6ff');
  ctx.shadowColor='#21e6ff'; ctx.shadowBlur=Math.min(30,w*zap);
  ctx.beginPath();
  for (var i=0;i<BOLT.length;i++){
    var px=x+BOLT[i][0]*s, py=y+BOLT[i][1]*s;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  if (w>10){
    ctx.lineWidth=Math.max(1,w*0.05);
    ctx.strokeStyle='rgba(255,255,255,'+zap.toFixed(2)+')';
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

/* The strip across the roof. Everything is drawn from the same anchor so a
   shape can be swapped without touching the rest of the car. */
function drawLightBar(pw,ph,col,shape){
  var y=-ph-pw*0.076, w=pw*0.92, x0=-pw*0.46, th=pw*0.054, i, s, cx;
  var t=performance.now();
  ctx.fillStyle=col; ctx.strokeStyle=col;
  ctx.shadowColor=col; ctx.shadowBlur=pw*0.14;

  if (shape===1){                                   /* SAWTOOTH */
    var n=7, tw=w/n, hg=pw*0.085;
    ctx.beginPath(); ctx.moveTo(x0,y+th);
    for (i=0;i<n;i++){
      ctx.lineTo(x0+i*tw+tw/2, y+th-hg);
      ctx.lineTo(x0+(i+1)*tw, y+th);
    }
    ctx.lineTo(x0+w,y+th*0.9); ctx.lineTo(x0,y+th*0.9);
    ctx.closePath(); ctx.fill();
  } else if (shape===2){                            /* SPIKES */
    var m=5, sp=w/m, hs=pw*0.14;
    for (i=0;i<m;i++){
      cx=x0+sp*(i+0.5);
      ctx.beginPath();
      ctx.moveTo(cx-sp*0.20,y+th); ctx.lineTo(cx,y+th-hs); ctx.lineTo(cx+sp*0.20,y+th);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillRect(x0,y+th*0.35,w,th*0.7);
  } else if (shape===3){                            /* CROWN */
    ctx.beginPath();
    ctx.moveTo(x0,y+th);
    ctx.lineTo(x0,            y+th-pw*0.055);
    ctx.lineTo(x0+w*0.20,     y+th-pw*0.012);
    ctx.lineTo(x0+w*0.35,     y+th-pw*0.115);
    ctx.lineTo(x0+w*0.50,     y+th-pw*0.020);
    ctx.lineTo(x0+w*0.65,     y+th-pw*0.115);
    ctx.lineTo(x0+w*0.80,     y+th-pw*0.012);
    ctx.lineTo(x0+w,          y+th-pw*0.055);
    ctx.lineTo(x0+w,y+th);
    ctx.closePath(); ctx.fill();
  } else if (shape===4){                            /* HORNS */
    for (s=-1;s<=1;s+=2){
      ctx.beginPath();
      ctx.moveTo(s*w*0.30, y+th);
      ctx.quadraticCurveTo(s*w*0.52, y+th-pw*0.05, s*w*0.50, y+th-pw*0.17);
      ctx.quadraticCurveTo(s*w*0.40, y+th-pw*0.07, s*w*0.20, y+th);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillRect(-w*0.22,y+th*0.3,w*0.44,th*0.75);
  } else if (shape===5){                            /* HALO */
    ctx.lineWidth=Math.max(1.4,pw*0.030);
    ctx.beginPath();
    ctx.ellipse(0, y-pw*0.085, w*0.32, pw*0.042, 0, 0, Math.PI*2);
    ctx.stroke();
  } else if (shape===6){                            /* PULSE */
    var k=8, seg=w/k;
    for (i=0;i<k;i++){
      ctx.globalAlpha = (((Math.floor(t/110)+i)%4)===0) ? 1 : 0.22;
      ctx.fillRect(x0+i*seg+seg*0.14, y, seg*0.72, th);
    }
    ctx.globalAlpha=1;
  } else {                                          /* BAR */
    ctx.fillRect(x0,y,w,th);
  }
  ctx.shadowBlur=0;
}

/* A face in the rear window. Blinks now and then, and squints under braking. */
function drawEyes(pw,ph,style,braking){
  if (style===0) return;
  var t=performance.now(), blink=(t%4300)<130;
  var ex=pw*0.15, ey=-ph*0.76, r=pw*0.055, s, cx;
  var col='#eaf6ff';
  ctx.shadowColor='#bfe9ff'; ctx.shadowBlur=pw*0.09;

  if (style===6){                                   /* VISOR */
    ctx.fillStyle='#ff3b5c'; ctx.shadowColor='#ff3b5c';
    ctx.fillRect(-pw*0.25, ey-pw*0.021, pw*0.50, pw*0.042);
    ctx.fillStyle='#ffffff';
    ctx.fillRect(Math.sin(t/300)*pw*0.19-pw*0.035, ey-pw*0.021, pw*0.07, pw*0.042);
    ctx.shadowBlur=0; return;
  }
  if (style===5){                                   /* CYCLOPS */
    var R=pw*0.082;
    ctx.fillStyle=col;
    if (blink){ ctx.fillRect(-R,ey-pw*0.011,R*2,pw*0.022); }
    else {
      ctx.beginPath(); ctx.arc(0,ey,R*(braking?0.72:1),0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0d0818';
      ctx.beginPath(); ctx.arc(0,ey+R*0.06,R*0.40,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur=0; return;
  }
  for (s=-1;s<=1;s+=2){
    cx=s*ex;
    if (style===4){                                 /* DIZZY */
      ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.3,pw*0.021); ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(cx-r,ey-r); ctx.lineTo(cx+r,ey+r);
      ctx.moveTo(cx+r,ey-r); ctx.lineTo(cx-r,ey+r);
      ctx.stroke();
      continue;
    }
    if (blink){
      ctx.fillStyle=col; ctx.fillRect(cx-r,ey-pw*0.010,r*2,pw*0.020);
      continue;
    }
    if (style===3){                                 /* SLEEPY */
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(cx,ey+r*0.10,r*0.92,0,Math.PI); ctx.fill();
      ctx.fillRect(cx-r,ey-pw*0.008,r*2,pw*0.017);
      continue;
    }
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(cx,ey,r*(braking?0.68:1),0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0d0818';
    ctx.beginPath(); ctx.arc(cx+s*r*0.12,ey+r*0.08,r*0.40,0,Math.PI*2); ctx.fill();
    if (style===2){                                 /* ANGRY brows */
      ctx.fillStyle=col;
      ctx.save();
      ctx.translate(cx,ey-r*1.30);
      ctx.rotate(-s*0.45);
      ctx.fillRect(-r*1.15,-pw*0.015,r*2.3,pw*0.030);
      ctx.restore();
    }
  }
  ctx.shadowBlur=0;
}

/* Super-saiyan flare: two flickering envelopes drawn additively so they
   blow out where they overlap, taller than they are wide, with embers
   climbing out of the top. Replaces the car's underglow while it burns. */
function drawAura(pw,ph,fade){
  var t=performance.now()/1000, i, k, layer;
  var cx=0, cy=-ph*0.50, n=20;
  var rx=pw*0.64, ry=ph*0.98;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for (layer=0; layer<2; layer++){
    var sc=layer?1.0:0.70, al=(layer?0.26:0.50)*fade;
    ctx.beginPath();
    for (i=0;i<=n;i++){
      var a=(i/n)*Math.PI*2 - Math.PI/2;
      var up=Math.max(0,-Math.sin(a));
      var flick=0.80+0.36*Math.abs(Math.sin(i*2.3 + t*(11+layer*5)));
      var r=flick*(1+up*0.80)*sc;
      var px=cx+Math.cos(a)*rx*r, py=cy+Math.sin(a)*ry*r;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    var g=ctx.createRadialGradient(cx,cy,pw*0.05,cx,cy,rx*1.7);
    g.addColorStop(0,'rgba(255,255,238,'+al.toFixed(3)+')');
    g.addColorStop(0.48,'rgba(255,206,64,'+(al*0.72).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,120,10,0)');
    ctx.fillStyle=g; ctx.fill();
  }
  ctx.fillStyle='rgba(255,244,196,0.9)';
  for (k=0;k<8;k++){
    var pr=(t*1.9 + k*0.31)%1;
    var sx=Math.sin(k*3.1+t*2.2)*pw*0.40;
    var sy=cy - pr*ph*1.9 + ph*0.35;
    var ss=Math.max(1,pw*0.022*(1-pr));
    ctx.globalAlpha=(1-pr)*0.85*fade;
    ctx.fillRect(sx-ss/2, sy, ss, ss*2.4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

function paintCar(pw,o){
  var ph=pw*0.62;
  var trim=NEONS[trimI].c, light=NEONS[lightI].c, paint=PAINTS[paintI];
  var glow=o.glow||0;

  if (o.aura>0){
    drawAura(pw,ph,o.aura);
  } else {
    ctx.fillStyle=hexA(trim, 0.10+glow*0.30);
    ctx.beginPath(); ctx.ellipse(0,ph*0.10,pw*0.62,ph*0.16+glow*ph*0.16,0,0,Math.PI*2); ctx.fill();
  }

  ctx.fillStyle='#07040d';
  rr(-pw*0.54,-ph*0.52,pw*0.14,ph*0.5,pw*0.03); ctx.fill();
  rr( pw*0.40,-ph*0.52,pw*0.14,ph*0.5,pw*0.03); ctx.fill();

  var bg=ctx.createLinearGradient(0,-ph,0,0);
  bg.addColorStop(0,paint.a); bg.addColorStop(1,paint.b);
  ctx.fillStyle=bg;
  rr(-pw/2,-ph,pw,ph,pw*0.10); ctx.fill();
  ctx.lineWidth=Math.max(1.4,pw*0.026); ctx.strokeStyle=trim;
  ctx.shadowColor=trim; ctx.shadowBlur=pw*0.17; ctx.stroke(); ctx.shadowBlur=0;

  ctx.fillStyle='rgba(140,215,255,.20)';
  rr(-pw*0.31,-ph*0.94,pw*0.62,ph*0.34,pw*0.05); ctx.fill();

  drawEyes(pw,ph,eyeI,o.brake);
  drawLightBar(pw,ph,light,shapeI);

  var braking=o.brake;
  ctx.shadowColor=braking?'#ff2020':'#ff5a5a';
  ctx.shadowBlur=braking?pw*0.24:pw*0.11;
  ctx.fillStyle=braking?'#ff2626':'#c53a4a';
  ctx.fillRect(-pw*0.42,-ph*0.42,pw*0.22,ph*0.17);
  ctx.fillRect( pw*0.20,-ph*0.42,pw*0.22,ph*0.17);
  ctx.shadowBlur=0;

  ctx.fillStyle='#e9e6ff';
  ctx.fillRect(-pw*0.11,-ph*0.24,pw*0.22,ph*0.13);
}

function drawPlayerDino(lean){
  var w=DINO_CAR_W*PPU_CAR, h=w*0.72;
  var frame = speed>300 ? 1+((Math.floor(position/700))&1) : 0;
  var t=performance.now();
  var fade = (dinoT<=DINO_WARN && (Math.floor(dinoT*8)%2===0)) ? 0.40 : 1;
  ctx.save();
  ctx.translate(W/2+lean*9, PLAYER_Y+(frame===1?-h*0.03:0));
  ctx.rotate(spinT>0?spinAng:(-lean*0.05-curSlope*92));
  ctx.globalAlpha=fade*0.30;
  ctx.fillStyle='hsl('+((t/6)%360)+',100%,60%)';
  ctx.beginPath(); ctx.ellipse(0,4,w*0.48,h*0.10,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=fade;
  dinoPath(-w/2,-h,w/24,h/17,frame);
  ctx.shadowColor='hsl('+(((t/6)+180)%360)+',100%,60%)'; ctx.shadowBlur=28;
  ctx.fillStyle=rainbowFill(-w/2,-h,w/2,0,6);
  ctx.fill(); ctx.shadowBlur=0;
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawPlayer(){
  var lean=clamp(steerVel,-1.6,1.6);
  if (dinoT>0){ drawPlayerDino(lean); return; }
  var blink=invT>0&&(Math.floor(invT*12)%2===0);
  var spct=clamp(speed/maxSpeedFor(lap),0,1);

  ctx.save();
  ctx.translate(W/2 + lean*9, PLAYER_Y);
  ctx.rotate(spinT>0 ? spinAng : (-lean*0.07 - curSlope*92));
  ctx.globalAlpha=blink?0.42:1;
  var auraOn = odT>0 ? (odT<=DINO_WARN ? (0.45+0.55*Math.abs(Math.sin(odT*9))) : 1) : 0;
  paintCar(PW,{brake:!!keys.down&&spinT<=0, glow:spct, aura:auraOn});
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawBendWarning(){
  var mag=Math.min(1, Math.abs(warnSlope)/S_PEAK);
  if (mag<0.16) return;
  var dir=warnSlope>0?1:-1;
  var n  =mag>0.66?3:(mag>0.38?2:1);
  var col=mag>0.66?'#ff4d6d':(mag>0.38?'#ffd23f':'#21e6ff');
  var y=94;
  ctx.save();
  ctx.globalAlpha=0.45+0.55*mag;
  ctx.strokeStyle=col; ctx.lineWidth=3;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor=col; ctx.shadowBlur=10;
  for (var i=0;i<n;i++){
    var cx=W/2 + dir*(i*14) - dir*((n-1)*14)/2;
    ctx.beginPath();
    ctx.moveTo(cx-dir*5,y-7);
    ctx.lineTo(cx+dir*5,y);
    ctx.lineTo(cx-dir*5,y+7);
    ctx.stroke();
  }
  ctx.restore();
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(8,4,18,.62)';
  rr(x,y,w,h,6); ctx.fill();
  ctx.strokeStyle='rgba(124,58,237,.55)'; ctx.lineWidth=1; ctx.stroke();
}
function drawHUD(){
  var maxS=maxSpeedFor(lap), spct=clamp(speed/maxS,0,1);
  var kmh=Math.round(speed/40);

  /* The whole top row is the old layout scaled up by 1.2 — panels, labels,
     readouts and bars alike — so the proportions that were tuned on a
     desktop survive intact and only the density changes. The two mini
     panels underneath keep a 12px label instead of 13: at 13 the Spanish
     SOBRECARGA ran straight into its own countdown. */
  panel(12,12,224,62);
  monoText(T('SCORE'),24,34,13,'#8a7ec4');
  glowText(pad(score|0,7),24,63,26,'#ffffff','left',10);

  var beating = bestAtStart>0 && (score|0)>bestAtStart;
  panel(12,80,224,34);
  monoText(T('BEST'),24,103,13,beating?'#7cff4f':'#8a7ec4');
  if (beating){
    monoText(T('NEW'),84,103,12,'#7cff4f');
    ctx.globalAlpha=0.74+0.26*Math.abs(Math.sin(performance.now()/300));
    glowText(pad(best,7),226,103,18,'#7cff4f','right',15);
    ctx.globalAlpha=1;
  } else {
    glowText(pad(best,7),226,103,18,'#a99fdc','right',7);
  }

  panel(W/2-94,12,188,62);
  if (mode==='cruise'){
    monoText(T('LAP'),W/2,34,13,'#8a7ec4','center');
    glowText(String(lap),W/2,63,26,'#21e6ff','center',12);
  } else {
    monoText(T('LAP'),W/2-55,34,13,'#8a7ec4','center');
    monoText(T('TIME'),W/2+34,34,13,'#8a7ec4','center');
    glowText(String(lap),W/2-55,63,26,'#21e6ff','center',12);
    var low=timeLeft<10;
    var tTxt = timeLeft>=100 ? String(Math.round(timeLeft)) : timeLeft.toFixed(1);
    glowText(tTxt,W/2+34,63,26,low?'#ff4d6d':(timeLeft>60?'#21e6ff':'#7cff4f'),'center',low?24:10);
    ctx.fillStyle='rgba(124,58,237,.5)'; ctx.fillRect(W/2-12,26,1,41);
  }

  var slot=80;
  if (dinoT>0){
    var ending = dinoT<=DINO_WARN, beat = (Math.floor(dinoT*6)%2===0);
    panel(W-236,slot,224,34);
    monoText(T('RAMPAGE'),W-226,slot+23,12,ending?(beat?'#ffd23f':'#ff4d6d'):'#7cff4f');
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(W-108,slot+12,84,11);
    ctx.fillStyle = ending ? (beat?'#ffd23f':'#ff4d6d') : rainbowFill(W-108,slot+12,W-24,slot+23,6);
    if (ending){ ctx.shadowColor='#ffd23f'; ctx.shadowBlur=12; }
    ctx.fillRect(W-108,slot+12,84*(dinoT/DINO_TIME),11);
    ctx.shadowBlur=0;
    monoText(dinoT.toFixed(1)+'s',W-118,slot+23,12,ending?'#ffd23f':'#eaf6ff','right');
    slot+=38;
  }
  if (odT>0){
    var oEnd = odT<=DINO_WARN, oBeat = (Math.floor(odT*6)%2===0);
    panel(W-236,slot,224,34);
    monoText(T('OVERDRIVE'),W-226,slot+23,12,oEnd?(oBeat?'#ffd23f':'#ff4d6d'):'#ffd23f');
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(W-98,slot+12,74,11);
    ctx.fillStyle = oEnd&&!oBeat ? '#ff4d6d' : OD_COLS[(Math.floor(performance.now()/110))%OD_COLS.length];
    ctx.shadowColor='#ffd23f'; ctx.shadowBlur=oEnd?14:8;
    ctx.fillRect(W-98,slot+12,74*(odT/OD_TIME),11);
    ctx.shadowBlur=0;
    monoText(odT.toFixed(1)+'s',W-108,slot+23,12,oEnd?'#ffd23f':'#eaf6ff','right');
  }

  panel(W-236,12,224,62);
  monoText(T('SPEED'),W-24,34,13,'#8a7ec4','right');
  glowText(kmh+' km/h',W-24,63,26,spct>0.86?'#ff2fbe':'#ffffff','right',12);
  ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(W-224,68,200,5);
  var sg=ctx.createLinearGradient(W-224,0,W-24,0);
  sg.addColorStop(0,'#21e6ff'); sg.addColorStop(0.7,'#ff2fbe'); sg.addColorStop(1,'#ffd23f');
  ctx.fillStyle=sg; ctx.fillRect(W-224,68,200*spct,5);

  /* CHAIN — only on screen while one is alive, and it drains visibly so you
     can see exactly how long you have to find the next gap. */
  if (chain>0){
    var cf=clamp(chainT/NM_CHAIN_T,0,1);
    var ccol = chain>=10 ? '#ff2fbe' : (chain>=5 ? '#ffd23f' : '#7cff4f');
    panel(16,120,206,41);
    monoText(T('NEARMISS'),26,137,12,'#8a7ec4');
    glowText('x'+chain,212,147,24,ccol,'right',12);
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(26,150,120,5);
    ctx.fillStyle=ccol; ctx.shadowColor=ccol; ctx.shadowBlur=8;
    ctx.fillRect(26,150,120*cf,5); ctx.shadowBlur=0;
  }

  /* -----------------------------------------------------------------
     BOTTOM ROW — two stacked pairs instead of one crowded strip.
     Left:  DRIFT over SHOTS.   Right: HULL over NEXT CHECKPOINT.
     Every column stays inside 220px so nothing lands on the player
     sprite, which spans roughly x=300..500 once you are the dinosaur.
     ----------------------------------------------------------------- */
  var BTAG=22;

  /* Drift charge. Cyan is banked and safe; amber is still at risk in the drift
     you are in, so the cost of crashing out of it is on screen. */
  hudTag(T('DRIFTM'),16,394,BTAG,dPot>0?'#ffd23f':'#b9aef0');
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(16,400,200,13);
  var wB=200*clamp(dBank,0,1), wP=200*clamp(dPot,0,1-dBank);
  if (wB>0){
    ctx.fillStyle='#21e6ff'; ctx.shadowColor='#21e6ff'; ctx.shadowBlur=10;
    ctx.fillRect(16,400,wB,13); ctx.shadowBlur=0;
  }
  if (wP>0){ ctx.fillStyle='#ffd23f'; ctx.fillRect(16+wB,400,wP,13); }
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1;
  ctx.strokeRect(16.5,400.5,199,12);

  hudTag(odT>0?T('UNLIMITED'):T('SHOTS'),16,444,BTAG,
         odT>0?'#ffd23f':(shots>0?'#21e6ff':'#b9aef0'));
  var BS=1.5, ky=450;
  for (var k=0;k<MAX_SHOTS;k++){
    var kx=16+k*30;
    if (odT>0 || k<shots){
      var gc = odT>0 ? OD_COLS[(k+Math.floor(performance.now()/110))%OD_COLS.length] : '#21e6ff';
      ctx.shadowColor=gc; ctx.shadowBlur=12; ctx.fillStyle=gc;
      ctx.beginPath();
      ctx.moveTo(kx+9*BS,ky);        ctx.lineTo(kx+15*BS,ky);
      ctx.lineTo(kx+10*BS,ky+7*BS);  ctx.lineTo(kx+14*BS,ky+7*BS);
      ctx.lineTo(kx+4*BS,ky+17*BS);  ctx.lineTo(kx+8*BS,ky+8*BS);
      ctx.lineTo(kx+4*BS,ky+8*BS);
      ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
    } else {
      ctx.strokeStyle='rgba(255,255,255,.24)'; ctx.lineWidth=1.5;
      ctx.strokeRect(kx+4*BS+0.5,ky+0.5,11*BS,17*BS);
    }
  }
  ctx.lineWidth=1;

  /* Hull moves over to the right column so drift can sit above shots on the
     left. The cruise tag takes the same slot at a smaller size — it is a
     standing label, not a live readout, and at 22px it ran half the screen. */
  if (mode==='cruise'){
    hudTag(T('CRUISE_TAG'),W-16,398,15,'#7cff4f','right');
  } else {
    hudTag(T('HULL'),W-16,394,BTAG,'#b9aef0','right');
    var hpMax=CH_().hp, hx0=W-16-(hpMax*34-6);
    for (var i=0;i<hpMax;i++){
      var bx=hx0+i*34;
      if (i<health){
        var col=health===1?'#ff4d6d':(health===2?'#ffd23f':'#7cff4f');
        ctx.shadowColor=col; ctx.shadowBlur=14; ctx.fillStyle=col;
        ctx.fillRect(bx,400,28,15); ctx.shadowBlur=0;
      } else {
        ctx.strokeStyle='rgba(255,255,255,.24)'; ctx.lineWidth=1.5;
        ctx.strokeRect(bx+0.5,400.5,27,14);
      }
    }
    ctx.lineWidth=1;
  }

  var barW=200, bx2=W-barW-16, by=452;
  hudTag(T('NEXT_CP'),W-16,444,BTAG,'#b9aef0','right');
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(bx2,by,barW,13);
  ctx.fillStyle='#7cff4f'; ctx.shadowColor='#7cff4f'; ctx.shadowBlur=8;
  ctx.fillRect(bx2,by,barW*clamp((position+Z_CAR-cpStart)/cpLen,0,1),13);
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(124,255,79,.65)'; ctx.lineWidth=1;
  ctx.strokeRect(bx2+0.5,by+0.5,barW-1,12);

  if (state==='playing') drawBendWarning();

  if (Math.abs(playerX)>1 && state==='playing' && Math.floor(performance.now()/220)%2===0)
    glowText(T('OFF_ROAD'),W/2,H-72,24,'#ffd23f','center',18);

  drawMessages();
}

function iconHeart(cx,cy,sz){
  var t=performance.now(), hue=(t/9)%360, i;
  var g=ctx.createLinearGradient(cx-sz,cy-sz,cx+sz,cy+sz);
  for (i=0;i<=4;i++) g.addColorStop(i/4,'hsl('+((hue+i*72)%360)+',100%,64%)');
  ctx.shadowColor='hsl('+((hue+180)%360)+',100%,60%)'; ctx.shadowBlur=10;
  heartPath(cx, cy+sz*0.45, sz*0.60);
  ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
}
function iconDino(cx,cy,sz){
  var w=sz*2.0, h=w*0.72;
  dinoPath(cx-w/2, cy-h/2, w/24, h/17, 0);
  ctx.shadowColor='hsl('+(((performance.now()/9)+180)%360)+',100%,60%)'; ctx.shadowBlur=8;
  ctx.fillStyle=rainbowFill(cx-w/2,cy-h/2,cx+w/2,cy+h/2);
  ctx.fill(); ctx.shadowBlur=0;
}
function iconBolt(cx,cy,sz){
  var g=ctx.createLinearGradient(cx,cy-sz,cx,cy+sz);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.5,'#8ef4ff'); g.addColorStop(1,'#21e6ff');
  ctx.shadowColor='#21e6ff'; ctx.shadowBlur=10;
  ctx.beginPath();
  for (var i=0;i<BOLT.length;i++){
    var px=cx+BOLT[i][0]*sz*0.78, py=cy+BOLT[i][1]*sz*0.62;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
}
/* The hazard triangle. It carries the whole "something new is on the road"
   message on its own, which is the point — the words next to it never need to
   be longer than two. */
function iconWarn(cx,cy,sz){
  var r=sz*0.66;
  ctx.shadowColor='#ffd23f'; ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.moveTo(cx, cy-r);
  ctx.lineTo(cx+r*0.98, cy+r*0.74);
  ctx.lineTo(cx-r*0.98, cy+r*0.74);
  ctx.closePath();
  ctx.fillStyle='#ffd23f'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#1a0f00';                     /* the bang, knocked out */
  ctx.fillRect(cx-r*0.12, cy-r*0.30, r*0.24, r*0.62);
  ctx.beginPath(); ctx.arc(cx, cy+r*0.53, r*0.14, 0, Math.PI*2); ctx.fill();
}
/* Top speed went up. An arrow, because "TOP SPEED UP" was a whole line of
   banner for one bit of information. */
function iconSpd(cx,cy,sz){
  var r=sz*0.62;
  ctx.shadowColor='#7cff4f'; ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(cx, cy-r);
  ctx.lineTo(cx+r*0.86, cy+r*0.26);
  ctx.lineTo(cx+r*0.33, cy+r*0.26);
  ctx.lineTo(cx+r*0.33, cy+r*0.80);
  ctx.lineTo(cx-r*0.33, cy+r*0.80);
  ctx.lineTo(cx-r*0.33, cy+r*0.26);
  ctx.lineTo(cx-r*0.86, cy+r*0.26);
  ctx.closePath();
  ctx.fillStyle='#7cff4f'; ctx.fill();
  ctx.shadowBlur=0;
}
/* Every icon function takes a different `sz` to mean a different thing: the
   dinosaur draws 2.00 units wide for sz=1, the bolt only 0.95 and 1.24 tall.
   Passing them all the same number put the dinosaur at double everyone else's
   size, overflowing its slot and landing on the row below. This table is each
   icon's largest drawn dimension per unit of sz, so drawIcon can take a BOX —
   the square the icon must fit inside — and every kind ends up the same
   visual weight. Measure a new icon and add it here; do not eyeball it. */
var ICON_UNIT = { heart:1.26, bolt:1.24, warn:1.29, spd:1.12, dino:1.85 };
function drawIcon(kind,x,y,box){
  var sz = box / (ICON_UNIT[kind] || 1.30);
  if      (kind==='heart') iconHeart(x,y,sz);
  else if (kind==='bolt')  iconBolt(x,y,sz);
  else if (kind==='warn')  iconWarn(x,y,sz);
  else if (kind==='spd')   iconSpd(x,y,sz);
  else                     iconDino(x,y,sz);
}

/* Lap banners used to be loose glowing text that washed out against the road.
   They now sit in one bordered box — and the box is fitted to the stage rather
   than trusting the strings inside it to stay short. Two hard limits, because
   this 800x500 canvas is squeezed into ~360px of phone glass and the horizon
   sits at y=212:
     WIDTH  — never more than half the road (MSG_MAXW).
     HEIGHT — the bottom edge never passes MSG_FLOOR, which is above the
              horizon. A banner cannot hide traffic you are closing on.
   Both are enforced by scaling the whole card, so a long translation shrinks
   rather than spills. One measure pass, one correction pass: every dimension
   is linear in the scale, so the correction is exact and needs no search.

   The chip icons are deliberately oversized — CHIP_ICON below is close to
   double the label's own size — because they are read peripherally at 300 km/h,
   not looked at. The row therefore carries its own line height (CHIP_LH) rather
   than sharing the text lines'; the count next to each icon stays small, so
   growing the picture costs almost no width. */
var MSG_TOP   = 104;    /* clears the bend-warning chevrons, which sit at y=94 */
var MSG_FLOOR = 207;    /* ...and stays above the horizon at y=212 */
var CHIP_BOX  = 2.30;   /* icon box as a share of the chip row's unit    */
var CHIP_SLOT = 1.16;   /* ...the horizontal slot it gets, box-relative  */
var CHIP_LH   = 1.32;   /* ...and the row height it sits in, box-relative */
var CHIP_NUM  = 1.60;   /* count text ("x3") as a share of the row unit      */
function drawMessages(){
  if (!msgs.length) return;
  var i, j, alpha=0, MSG_MAXW=W*0.52;

  function layout(sc){
    var a, b, lines=[], wmax=0, tot=0, pad=Math.round(18*sc);
    for (a=0;a<msgs.length;a++){
      var m=msgs[a], fs, w=0, parts=null, lh, box=0;
      if (m.chips){
        fs=Math.max(9,Math.round(16*sc));
        box=fs*CHIP_BOX; lh=box*CHIP_LH;
        /* Two label sizes, on purpose. A COUNT is a number you read at a glance
           next to its icon — "three hearts this leg" — so it is set at roughly
           twice the old size and now carries about the same weight as the icon
           beside it. A WORD label (only SPD/VEL) stays small: doubling that one
           would make a caption shout louder than the pickups it sits among. */
        var lf=Math.max(12,Math.round(fs*CHIP_NUM));
        var lw=Math.max(8, Math.round(fs*0.80));
        parts=[];
        for (b=0;b<m.chips.length;b++){
          var ch=m.chips[b];
          var txt = ch.label ? ch.label : (ch.n>1 ? 'x'+ch.n : '');
          var pf  = ch.label ? lw : lf;
          ctx.font='800 '+pf+'px "Arial Black","Segoe UI",Impact,system-ui,sans-serif';
          var tw  = txt ? ctx.measureText(txt).width+fs*0.18 : 0;
          parts.push({icon:ch.icon, txt:txt, iw:box*CHIP_SLOT, tw:tw, lf:pf});
          w += box*CHIP_SLOT + tw + (b<m.chips.length-1 ? fs*0.42 : 0);
        }
      } else {
        fs=Math.max(9,Math.round((m.big?20:13)*sc));
        lh=fs*1.32; box=fs*1.90;
        ctx.font='700 '+fs+'px "Arial Black","Segoe UI",Impact,system-ui,sans-serif';
        w=ctx.measureText(m.t).width + (m.icon?box*1.16:0);
      }
      lines.push({m:m, fs:fs, w:w, parts:parts, lh:lh, box:box});
      if (w>wmax) wmax=w;
      tot += lh;
    }
    return {lines:lines, bw:wmax+pad*2, bh:tot+pad, pad:pad};
  }

  /* Same size on phone and desktop now. The icons exist to be caught in
     peripheral vision, which is exactly where the small screen needs them
     most; the width cap and the floor are what keep the card honest. */
  var base = 1;
  var lay  = layout(base);
  var k    = Math.min(1, MSG_MAXW/lay.bw, (MSG_FLOOR-MSG_TOP)/lay.bh);
  if (k < 0.995) lay = layout(base*k);

  for (i=0;i<msgs.length;i++) alpha=Math.max(alpha, clamp(msgs[i].life/0.55,0,1));

  var bw=lay.bw, bh=lay.bh, bx=(W-bw)/2, by=MSG_TOP;

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(8,4,18,.86)';
  rr(bx,by,bw,bh,10); ctx.fill();
  ctx.lineWidth=3.5; ctx.strokeStyle=msgs[0].c;
  ctx.shadowColor=msgs[0].c; ctx.shadowBlur=18;
  rr(bx,by,bw,bh,10); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.16)';
  rr(bx+5,by+5,bw-10,bh-10,7); ctx.stroke();

  /* Rows are laid out from their own centre line, not from a shared baseline —
     the chip row is twice the height of a text row, so a common baseline would
     hang the icons off the top of it. */
  var y=by+lay.pad*0.5;
  for (i=0;i<lay.lines.length;i++){
    var ln=lay.lines[i], mm=ln.m, mid=y+ln.lh*0.5;
    ctx.globalAlpha=alpha*clamp(mm.life/0.55,0,1);
    if (ln.parts){
      var px=W/2-ln.w/2;
      for (j=0;j<ln.parts.length;j++){
        var p=ln.parts[j];
        drawIcon(p.icon, px+p.iw/2, mid, ln.box);
        px += p.iw;
        if (p.txt){
          glowText(p.txt, px, mid+p.lf*0.36, p.lf, mm.c, 'left', 10, '800');
          px += p.tw;
        }
        px += ln.fs*0.42;
      }
    } else {
      var tx=W/2, cy=mid+ln.fs*0.36;
      if (mm.icon){
        drawIcon(mm.icon, W/2-ln.w/2+ln.box*0.58, mid, ln.box);
        tx=W/2+ln.box*0.58;
      }
      glowText(mm.t,tx,cy,ln.fs,mm.c,'center',14);
    }
    y += ln.lh;
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawTitle(){

  glowText(T('LOGO_A'),W/2,164,74,'#21e6ff','center',34);

  /* No tagline under the rule any more. The badge moves up into its slot and
     the screen reads as logo, mode, two lines, prompt — four beats instead
     of six. The badge is the one thing here that changes what ENTER is about
     to do, so it gets the display face and a lit border rather than being one
     more 12px caption among several. */
  var cru=(mode==='cruise');
  var mTxt=(cru?T('MODE_CRUISE'):T('MODE_RUN'));

  var mw=ctx.measureText(mTxt).width+44;
  ctx.fillStyle=cru?'rgba(124,255,79,.14)':'rgba(33,230,255,.14)';
  rr(W/2-mw/2,268,mw,36,8); ctx.fill();
  ctx.strokeStyle=mCol; ctx.lineWidth=2.5;
  ctx.shadowColor=mCol; ctx.shadowBlur=14;
  rr(W/2-mw/2,268,mw,36,8); ctx.stroke();
  ctx.shadowBlur=0; ctx.lineWidth=1;
  glowText(mTxt,W/2,294,20,mCol,'center',12,'900');

  /* 13px was fine on a desktop and about six real pixels on a phone, where
     this canvas lands 800 logical px in roughly 374 physical ones. */
  monoText(T('HINT2'),W/2,336,18,'#cfd6ff','center');
  monoText(T('HINT3'),W/2,360,18,'#cfd6ff','center');
  if (Math.floor(performance.now()/420)%2===0)
    glowText(TOUCH?T('PRESS_DRIVE_TOUCH'):T('PRESS_DRIVE_KEY'),W/2,404,22,'#7cff4f','center',18);
  if (!TOUCH) titleKeys(cru);
  if (best>0) monoText(T('BEST_LINE')+best,W/2,464,12,'#8a7ec4','center');
  /* Portrait phones only, and only until you have tried it sideways once.
     Sized for a phone, not a desktop: the canvas is 800 logical px wide but
     lands on ~374 physical ones, so anything under ~20px here arrives
     unreadable. It takes the footer's slot rather than stacking under it. */
  var nudge = TOUCH && !isLandscape() && !sawLandscape;
  if (nudge){
    ctx.globalAlpha=0.6+0.4*Math.sin(performance.now()/620);
    glowText(T('ROTATE_HINT'),W/2,492,24,'#ffd23f','center',16);
    ctx.globalAlpha=1;
  } else {
    monoText(saveOK ? T('SAVED_ON') : T('SAVED_OFF'),
             W/2,478,10,saveOK?'#4e4677':'#6b5a1e','center');
  }
}

/* The four keyboard shortcuts, as caps rather than as one 12px run-on line.
   Laid out by measurement rather than by fixed columns: the labels differ in
   length between English and Spanish, and hard-coded x positions drifted
   apart the moment either string changed. */
function titleKeys(cru){
  var sz=26, fs=13, gap=30, pad=sz*0.32, i, x;
  var items=[['G',T('TF_GARAGE')],['I',T('TF_INFO')],['L',T('TF_LANG')],
             ['C',cru?T('MODE_RUN'):T('MODE_CRUISE')]];
  ctx.font='700 '+fs+'px ui-monospace,Menlo,"Courier New",monospace';
  var total=0, ws=[];
  for (i=0;i<items.length;i++){
    ws[i]=sz+pad+ctx.measureText(items[i][1]).width;
    total+=ws[i];
  }
  total+=gap*(items.length-1);
  x=W/2-total/2;
  for (i=0;i<items.length;i++){
    keyCap(x,422,sz,items[i][0],items[i][1],fs);
    x+=ws[i]+gap;
  }
}

}

/* Reference sheet, opened on demand — the title screen stays sparse so the
   rest is still yours to find out on the road.

   Two columns on a desktop. On a phone the canvas is still 800 logical px
   wide but lands on ~380 physical ones, so 11px type arrived at about five
   real pixels. Touch therefore gets one full-width column at nearly double
   the size, split across three pages rather than shrunk to fit. */

/* An amber van, as seen from behind on the road, with its blinker
   alternating sides so the icon reads as "this one changes lane". */
function iconVan(cx,cy,w){
  var vh=w*0.94, x=cx-w/2, yb=cy+vh/2;
  ctx.fillStyle='#171019';
  rr(x,yb-vh,w,vh,w*0.09); ctx.fill();
  ctx.lineWidth=Math.max(1,w*0.055); ctx.strokeStyle='#ffd23f'; ctx.stroke();
  ctx.fillStyle='rgba(160,205,255,.16)';
  rr(cx-w*0.36,yb-vh*0.93,w*0.72,vh*0.24,w*0.05); ctx.fill();
  var on=(Math.floor(performance.now()/230)%2)===0;
  if (on){ ctx.shadowColor='#ffd23f'; ctx.shadowBlur=w*0.5; }
  ctx.fillStyle=on?'#ffe98a':'#6b5a1e';
  ctx.fillRect(cx-w*0.32,yb-vh-w*0.11,w*0.64,w*0.10);
  ctx.shadowBlur=0;
  var side=(Math.floor(performance.now()/1500)%2)===0?1:-1;
  if ((Math.floor(performance.now()/105)%2)===0){
    ctx.fillStyle='#ff9b1a'; ctx.shadowColor='#ff9b1a'; ctx.shadowBlur=w*0.5;
    ctx.fillRect(side>0?cx+w*0.34:cx-w*0.50, yb-vh*0.50, w*0.16, vh*0.16);
    ctx.shadowBlur=0;
  }
  ctx.shadowColor='#ff2b2b'; ctx.shadowBlur=w*0.3;
  ctx.fillStyle='#ff4747';
  ctx.fillRect(cx-w*0.42,yb-vh*0.28,w*0.18,vh*0.11);
  ctx.fillRect(cx+w*0.24,yb-vh*0.28,w*0.18,vh*0.11);
  ctx.shadowBlur=0;
}

/* The three shot lights exactly as the HUD cycles them under overdrive.
   Returns the width it used so text can sit after it. */
function odPips(x,y,s){
  for (var k=0;k<MAX_SHOTS;k++){
    var kx=x+k*20*s;
    var gc=OD_COLS[(k+Math.floor(performance.now()/110))%OD_COLS.length];
    ctx.shadowColor=gc; ctx.shadowBlur=10*s; ctx.fillStyle=gc;
    ctx.beginPath();
    ctx.moveTo(kx+9*s,y);      ctx.lineTo(kx+15*s,y);
    ctx.lineTo(kx+10*s,y+7*s); ctx.lineTo(kx+14*s,y+7*s);
    ctx.lineTo(kx+4*s,y+17*s); ctx.lineTo(kx+8*s,y+8*s);
    ctx.lineTo(kx+4*s,y+8*s);
    ctx.closePath(); ctx.fill();
  }
  ctx.shadowBlur=0;
  return MAX_SHOTS*20*s;
}

/* A keyboard cap: rounded square, letter inside, caption to the right. */
function keyCap(x,y,sz,letter,label,fs){
  ctx.fillStyle='rgba(33,230,255,.10)';
  rr(x,y,sz,sz,sz*0.22); ctx.fill();
  ctx.lineWidth=Math.max(1.5,sz*0.07); ctx.strokeStyle='#21e6ff';
  ctx.shadowColor='#21e6ff'; ctx.shadowBlur=8;
  rr(x,y,sz,sz,sz*0.22); ctx.stroke();
  ctx.shadowBlur=0;
  glowText(letter,x+sz/2,y+sz*0.72,sz*0.54,'#eaf6ff','center',6);
  monoText(label,x+sz+sz*0.32,y+sz*0.68,fs,'#cfd6ff');
}

function infoHead(x,y,head,col,fs){

  ctx.fillRect(x,y+fs*0.26,w,Math.max(2,fs*0.08));
  ctx.globalAlpha=1;
}

function drawOver(){
  overlay(0.7);
  glowText(endReason==='WRECKED'?T('OVER_WRECKED'):T('OVER_TIMEUP'),W/2,164,56,'#ff2fbe','center',28);

    glowText(T('OVER_AGAIN'),W/2,362,20,'#7cff4f','center',18);
  monoText(T('OVER_GARAGE'),W/2,394,12,'#21e6ff','center');
}

function swatchRow(label,yy,list,sel,active,paintSw){
  monoText(label,116,yy+13,11,active?'#ffffff':'#8a7ec4');
  if (active){
    ctx.fillStyle='#7cff4f';
    ctx.beginPath(); ctx.moveTo(99,yy+4); ctx.lineTo(108,yy+9); ctx.lineTo(99,yy+14); ctx.closePath(); ctx.fill();
  }
  var x0=248, sw=30, gap=7, i, x;
  for (i=0;i<list.length;i++){
    x=x0+i*(sw+gap);
    ctx.fillStyle='rgba(10,5,22,.75)';
    ctx.fillRect(x,yy,sw,18);
    ctx.save();
    ctx.beginPath(); ctx.rect(x,yy,sw,18); ctx.clip();
    paintSw(x,yy,sw,18,list[i],i);
    ctx.restore();
    if (i===sel){
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
      ctx.strokeRect(x-2.5,yy-2.5,sw+5,23);
    } else {
      ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
      ctx.strokeRect(x+0.5,yy+0.5,sw-1,17);
    }
  }
  monoText(list[sel].n, x0+list.length*(sw+gap)+8, yy+13, 10, active?'#ffffff':'#a99fdc');
}

function swColour(x,y,w,h,item,i){
  ctx.fillStyle=item.c; ctx.shadowColor=item.c; ctx.shadowBlur=10;
  ctx.fillRect(x+2,y+2,w-4,h-4); ctx.shadowBlur=0;
}
function swPaint(x,y,w,h,item){
  var g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,item.a); g.addColorStop(1,item.b);
  ctx.fillStyle=g; ctx.fillRect(x+1,y+1,w-2,h-2);
}
function swShape(x,y,w,h,item,i){
  ctx.save();
  ctx.translate(x+w/2, y+h*0.84);
  drawLightBar(w*0.96, 0, NEONS[lightI].c, i);
  ctx.restore();
}
function swEye(x,y,w,h,item,i){
  if (i===0){
    ctx.strokeStyle='rgba(255,255,255,.30)'; ctx.lineWidth=1;
    ctx.strokeRect(x+7.5,y+5.5,w-15,h-11);
    return;
  }
  ctx.save();
  ctx.translate(x+w/2, y+h/2);
  drawEyes(w*1.95, 0, i, false);
  ctx.restore();
}

/* The chassis swatch is a three-bar readout — speed, grip, health — so the
   trade-off is legible from the swatch alone before you read the numbers. */
function swChassis(x,y,w,h,item){
  ctx.fillStyle='rgba(10,5,22,.9)'; ctx.fillRect(x,y,w,h);
  var bars=[item.spd/1.20, item.grip/1.20, item.hp/5], i, bw=(w-8)/3;
  for (i=0;i<3;i++){
    var bh=Math.max(2,(h-6)*clamp(bars[i],0,1));
    ctx.fillStyle=item.c; ctx.globalAlpha=0.35+0.22*i;
    ctx.fillRect(x+3+i*bw, y+h-3-bh, bw-2, bh);
  }
  ctx.globalAlpha=1;
}

function drawGarage(){
  overlay(0.88);
  glowText(T('GARAGE'),W/2,48,32,'#21e6ff','center',20);
  monoText(T('GAR_HINT'),W/2,66,11,'#a99fdc','center');

  ctx.save();
  ctx.translate(W/2,180+Math.sin(performance.now()/700)*3);
  paintCar(140,{brake:false, glow:0.55+0.2*Math.sin(performance.now()/500)});
  ctx.restore();

  /* Live stats for whatever chassis is selected, so the numbers move while
     you cycle the row rather than being buried in a submenu. */
  var ch=CH_(), sx=W/2;
  monoText(ch.n, sx-150, 212, 12, ch.c);
  monoText(T('GAR_SPD') +' '+Math.round(ch.spd*100) +'%', sx-46, 212, 12, '#cfd6ff');
  monoText(T('GAR_GRIP')+' '+Math.round(ch.grip*100)+'%', sx+50, 212, 12, '#cfd6ff');
  monoText(T('GAR_HP')  +' '+ch.hp,                       sx+156, 212, 12, '#cfd6ff');

  swatchRow(T('GAR_TRIM'),     236, NEONS,   trimI,    garRow===0, swColour);
  swatchRow(T('GAR_BARCOL'),   272, NEONS,   lightI,   garRow===1, swColour);
  swatchRow(T('GAR_BARSHAPE'), 308, BARS,    shapeI,   garRow===2, swShape);
  swatchRow(T('GAR_EYES'),     344, EYES,    eyeI,     garRow===3, swEye);
  swatchRow(T('GAR_PAINT'),    380, PAINTS,  paintI,   garRow===4, swPaint);
  swatchRow(T('GAR_CHASSIS'),  416, CHASSIS, chassisI, garRow===5, swChassis);

  glowText(T('GAR_BACK'), W/2, 466, 15, '#7cff4f','center',14);
}

/* ---------------------------------------------------------------
   FRAME
--------------------------------------------------------------- */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W*dpr,H*dpr); // Clear taking scaling into account
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var sx=0, sy=0;
  if (shake>0.3){ sx=(Math.random()*2-1)*shake; sy=(Math.random()*2-1)*shake*0.6; }
  ctx.save();
  ctx.translate(sx,sy);

  drawSky();
  drawGround();
  drawRoad();
  drawDecor();
  drawPosts();
  drawGate();

  var sorted=cars.slice();
  for (var q3=0;q3<pickups.length;q3++) sorted.push(pickups[q3]);
  if (ufo)   sorted.push(ufo);
  for (var q=0;q<pshots.length;q++) sorted.push(pshots[q]);
  for (var q2=0;q2<blasts.length;q2++) sorted.push(blasts[q2]);
  sorted.sort(function(a,b){ return b.z-a.z; });
  for (var i=0;i<sorted.length;i++){
    if (sorted[i].kind==='heart')     drawHeart(sorted[i]);
    else if (sorted[i].kind==='bolt') drawBoost(sorted[i]);
    else if (sorted[i].kind==='dino') drawDinoPickup(sorted[i]);
    else if (sorted[i].isUfo)   drawUfo(sorted[i]);
    else if (sorted[i].isShot)  drawShot(sorted[i]);
    else if (sorted[i].isBlast) drawBlast(sorted[i]);
    else                        drawTraffic(sorted[i]);
  }

  drawPlayer();
  drawNearMissPops();
  ctx.restore();

  if (flash>0){ ctx.fillStyle='rgba(124,255,79,'+(flash*0.28).toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
  if (hitFlash>0){ ctx.fillStyle='rgba(255,60,90,'+(hitFlash*0.34).toFixed(3)+')'; ctx.fillRect(0,0,W,H); }

  if (state!=='garage' && state!=='info') drawHUD();
  if (state==='title')    drawTitle();
  if (state==='paused')   drawPause();
  if (state==='gameover') drawOver();
  if (state==='garage')   drawGarage();
  if (state==='info')     drawInfo();
}

var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  syncPad();
  render();
  requestAnimationFrame(loop);
}
loadGame();
applyStaticText();
scheduleCircuit();
noteLandscape();   /* must follow loadGame(): it can write, and writing
                      before the read would clobber the saved record */
reset();
state='title';
requestAnimationFrame(loop);

})();
</script>
