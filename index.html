function drawDecor(){
  var first=Math.floor(position/DECO_SPACE)+1;
  var last =Math.floor((position+MAXZ)/DECO_SPACE);
  for (var idx=last; idx>=first; idx--){          
    if (hashAt(idx,1) > Math.min(1,0.5*ZN.propDens)) continue;
    var zRel=idx*DECO_SPACE-position;
    if (zRel<=350||zRel>MAXZ) continue;
    var p=proj(zRel), a=1-fogAt(zRel);
    if (a<0.06||p.y<=horizonY||p.y>H) continue;
    var side=hashAt(idx,2)<0.5?-1:1;
    if (lap>=HAIL_LAP && isHwAct(idx)){ hwActDraw(idx,zRel,p,a,side); continue; }   /* build 84: the Halloween activator */
    if (ZN.look==='haunted' && isGiantHand(idx)){ drawHandSlot(idx,zRel,p,a,side); continue; }   /* build 87: the giant hand */
    var t=hashAt(idx,4);
    /* mast .22 | billboard .20 | kiosk .17 | tower .17 | dino .09 |
       obelisk .09 | alien .06 — the two new ones stay rare on purpose */
    var type = t<0.22?0 : t<0.42?1 : t<0.59?2 : t<0.76?3 : t<0.85?4 : t<0.94?5 : 6;
    /* propMask is a bitfield straight off the lab: bit 0 mast, 1 billboard,
       2 kiosk, 3 tower, 4 dino, 5 obelisk, 6 alien. A masked-out type is
       re-rolled onto an allowed one rather than left as a hole, so a zone
       that only wants towers and aliens still gets a populated roadside. */
    if (!(ZN.propMask & (1<<type))){
      var allow=[];
      for (var pm=0;pm<7;pm++) if (ZN.propMask & (1<<pm)) allow.push(pm);
      if (!allow.length) continue;
      type=allow[(hashAt(idx,11)*allow.length)|0];
    }
    if (idx===ghostForce && ZN.look==='haunted') type=6;   /* build 88: a due ghost hitchhiker (hwSlotType says the same) */
    if (ZN.id==='vapor' && lap>=HAIL_LAP && isHailer(idx)) type=6;   /* build 89: a scheduled waving alien stands here */
    var lat, walk=0;
    if (type===4){
      /* it crosses the road well ahead and is clear of it long before you
         arrive — pure scenery, nothing in the game collides with it */
      var base=4.3+hashAt(idx,3)*1.6;
      walk=clamp((36000-zRel)/27000,0,1);
      walk=walk*walk*(3-2*walk);
      lat=side*base*(1-2*walk);
    } else {
      var latMin = type===3?3.2 : (type===5?3.0 : (type===6?2.00 : 2.05));
      var latSpan= type===3?1.4 : (type===5?1.2 : (type===6?0.60 : 0.95));
      lat=side*(latMin+hashAt(idx,3)*latSpan);
    }
    /* A hailer has stepped forward to the near edge of the alien band, so
       it is both closer to you and visibly out of line with its kin. The
       same hash decides it here and in isHailer(); HAIL_LAT is pinned so
       the pass distance is one number rather than a range. */
    var hailer = (type===6) && isHailer(idx) && lap>=HAIL_LAP;   /* build 89: isHailer (the same test elsewhere; VAPOR's scheduled) */
    if (hailer) lat = side*HAIL_LAT;
    /* build 77: it waves, and its lamp flickers, only while a call can really be made */
    var hail = hailer && hailLive();
    if (hailer){
      if (ZN.lampKind==='gas') gasLampAt(zRel,p,side,hail?hailFlick(performance.now()/1000,idx):1,idx,HAIL_HEAD_X,hail,ZN.webs);   /* build 84 */
      else drawLampAt(zRel,p,side,hail?hailFlick(performance.now()/1000,idx):1);
      ctx.globalAlpha=a;
    }
    var x=W/2+p.ppu*(bend(zRel)+lat-playerX);
    if (x<-p.ppu*7||x>W+p.ppu*7) continue;
    if (type===6 && scare && scare.idx===idx) continue;   /* build 87: this ghost has left its spot */
    ctx.globalAlpha=a;
    if ((type<3||type===6) && p.ppu<5){                        
      ctx.fillStyle=ZN.look==='haunted' ? (t<0.5?'#ff9a2e':'#efe6d2') : (t<0.5?'#b06cff':'#21e6ff');
      ctx.fillRect(x-1,p.y-Math.max(2,p.ppu*1.6),2,Math.max(2,p.ppu*1.6));
    }
    else if (ZN.look==='haunted') hwDeco(type,x,p.y,p.ppu,idx,side,walk,hail,zRel);   /* build 84 */
    else if (type===0) decoMast(x,p.y,p.ppu,idx);
    else if (type===1) decoBillboard(x,p.y,p.ppu,idx);
    else if (type===2) decoKiosk(x,p.y,p.ppu,idx,side);
    else if (type===3) decoBuilding(x,p.y,p.ppu,idx);
    else if (type===4) decoDino(x,p.y,p.ppu,idx,side,walk);
    else if (type===5) decoObelisk(zRel,lat,p.ppu,idx);
    else               decoAlien(zRel,lat,p.ppu,idx,side,hail);
    ctx.globalAlpha=1;
  }
  ctx.lineJoin='miter'; ctx.lineCap='butt';   /* build 81 */
}

/* ---------------------------------------------------------------
   ROADSIDE LIGHTS (build 76, redone in build 81 from Carlos's picks on the
   81 picker page: chevron C "arrow kerb", brighter, 1.3x; lamps S1 "split
   sides"; chevrons only in the sharp middle of a bend).
   - CURVE CHEVRONS: one frameless chevron with a visible thickness, standing
     low on two short legs at the OUTSIDE edge of a bend, pointing the way the
     road turns. Only where the bend is sharp (|slope| >= 0.40 x S_PEAK), so a
     bend's gentle start and end carry none. Spaced 2,140 units apart (build 80:
     1,500, so 30 % fewer slots; with one side and the sharp middle only, about
     79 % fewer posts in VAPOR). The lit one walks into the bend as before.
   - SWAN-NECK LAMPS: every lamp slot keeps its lamp (3,430 apart). On a
     straight it alternates sides as before; anywhere in a bend it stands on
     the INSIDE, across the road from the chevrons, so the two never crowd.
   An "off" chevron is a dim saturated amber, never alpha-dimmed (alpha-dimmed
   amber over the purple sky turns muddy brown); halos add light ('lighter').
   No shadowBlur.
--------------------------------------------------------------- */
var CHEV_SPACE = 2140;               /* build 80: 1500 -> 30 % fewer (1500/0.7) */
var LAMP_SPACE = 3430;               /* mockup 2400 -> 30 % fewer (2400/0.7) */
var CHEV_S     = 0.10*S_PEAK;        /* |slope| at or above this counts as a bend: lamps step to the inside */
var CHEV_SHARP = 0.40*S_PEAK;        /* build 81: chevrons only where the bend is at least this sharp */
var CHEV_H     = 0.15*1.3;           /* chevron height in road units: build 80's plate (0.15) x 1.3 */
var CHEV_LAT   = 1.18;               /* chevron lateral, just outside the road edge */
var CHEV_AMBER='#ffe46e', CHEV_DIM='#d19d22', CHEV_SIDE='#8a5c0c', CHEV_CORE='#fff6d8', CHEV_DARK='#120a22';
var CHEV_STD=[CHEV_AMBER,CHEV_DIM,CHEV_SIDE,CHEV_CORE];   /* build 84: a zone can recolour them (ZN.chev); setZone() applies it */

function drawPosts(){
  var t=performance.now()/1000;
  var cs=Math.floor(position/CHEV_SPACE)+1, ls=Math.floor(position/LAMP_SPACE)+1;
  var ci=Math.ceil(MAXZ/CHEV_SPACE)+1, li=Math.ceil(MAXZ/LAMP_SPACE)+1;
  /* far to near across both kinds, so a near lamp always paints over a far chevron */
  while (ci>=0 || li>=0){
    var zc = ci>=0 ? (cs+ci)*CHEV_SPACE-position : -1;
    var zl = li>=0 ? (ls+li)*LAMP_SPACE-position : -1;
    if (zc>=zl){ postChevron(cs+ci,zc,t); ci--; }
    else       { postLamp(ls+li,zl); li--; }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.lineJoin='miter'; ctx.lineCap='butt';
}

function postChevron(n,zRel,t){
  if (zRel<=200||zRel>MAXZ) return;
  var p=proj(zRel); if (p.y<=horizonY||p.y>H) return;
  var sl=slopeAt(n*CHEV_SPACE);                          /* after the screen test, as the old posts did: no extra road generated */
  if (Math.abs(sl)<CHEV_SHARP) return;                   /* straight road or the gentle part of a bend */
  var dir=sl>0?1:-1, s=-dir;                             /* the outside of the bend only */
  if (hailerAt(n*CHEV_SPACE,750)===s) return;            /* build 77: the hailer's lamp stands on this side here */
  var x=W/2+p.ppu*(bend(zRel)+s*CHEV_LAT-playerX);
  if (x<-80||x>W+80) return;
  var a=1-fogAt(zRel), h=p.ppu*CHEV_H, dep=h*0.13, bot=p.y-p.ppu*0.045, cy=bot-dep-h/2;
  if (p.ppu>=12){                                        /* two short legs */
    var lw=Math.max(1,p.ppu*0.016), ly=bot-dep-h*0.2;
    ctx.globalAlpha=a*0.95; ctx.fillStyle=CHEV_DARK;
    ctx.fillRect(x-h*0.22-lw/2,ly,lw,p.y-ly); ctx.fillRect(x+h*0.18-lw/2,ly,lw,p.y-ly);
  }
  glyphC(x,cy,h,dir,chevLit(n,t),a,p.ppu);
}

function chevLit(n,t){                                   /* 0..1: the lit one walks along the row, into the bend */
  var ph=((t*2.2 - n*0.35)%1+1)%1;
  return Math.max(0,1-ph*2.2);
}
function chevFill(lit,a){                                /* fills the current path: dim amber, bright amber over it */
  ctx.globalAlpha=a; ctx.fillStyle=CHEV_DIM; ctx.fill();
  if (lit>0.01){ ctx.globalAlpha=a*lit; ctx.fillStyle=CHEV_AMBER; ctx.fill(); }
}
/* closed chevron: span = x distance from back corners to the tip, th = arm thickness (horizontal) */
function chevShape(x,cy,h,dir,spanR,thR){
  var span=h*spanR, th=h*thR, x0=x-dir*(span+th)/2, tip=x0+dir*span, c=h/2;
  ctx.moveTo(x0,cy-c); ctx.lineTo(x0+th*dir,cy-c); ctx.lineTo(tip+th*dir,cy);
  ctx.lineTo(x0+th*dir,cy+c); ctx.lineTo(x0,cy+c); ctx.lineTo(tip,cy); ctx.closePath();
}
function chevCore(x,cy,h,dir,spanR,thR){                 /* the hot centre line along both arms */
  var span=h*spanR, th=h*thR, x0=x-dir*(span+th)/2, tipC=x0+dir*(span+th/2), f=0.78, c=h/2*f;
  ctx.moveTo(tipC-dir*span*f,cy-c); ctx.lineTo(tipC,cy); ctx.lineTo(tipC-dir*span*f,cy+c);
}
function chevTinyPath(x,cy,h,dir){                       /* far away: a lit wedge still points the way */
  ctx.moveTo(x-dir*h*0.30,cy-h*0.45); ctx.lineTo(x+dir*h*0.34,cy); ctx.lineTo(x-dir*h*0.30,cy+h*0.45); ctx.closePath();
}
/* the arrow kerb: a chunky chevron with a darker extrusion under it (its thickness) */
function glyphC(x,cy,h,dir,lit,a,ppu){
  var dep=h*0.13;
  if (ppu<12){ ctx.beginPath(); chevTinyPath(x,cy,h,dir); chevFill(Math.max(lit,0.4),a); return; }
  if (ppu>=40){
    ctx.globalCompositeOperation='lighter';              /* halo: adds light, never browns the sky */
    ctx.globalAlpha=a*(0.08+0.20*lit); ctx.fillStyle=CHEV_AMBER; ctx.beginPath(); chevShape(x,cy+dep*0.5,h*1.40,dir,0.50,0.50); ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=a*0.92; ctx.strokeStyle=CHEV_DARK; ctx.lineJoin='miter'; ctx.lineWidth=Math.max(1.5,h*0.10);
    ctx.beginPath(); chevShape(x,cy+dep,h,dir,0.50,0.36); chevShape(x,cy,h,dir,0.50,0.36); ctx.stroke();   /* dark rim */
  }
  ctx.globalAlpha=a; ctx.fillStyle=CHEV_SIDE; ctx.beginPath(); chevShape(x,cy+dep,h,dir,0.50,0.36); ctx.fill();   /* the thickness */
  ctx.beginPath(); chevShape(x,cy,h,dir,0.50,0.36); chevFill(0.35+0.65*lit,a);   /* a solid object: never fully "off" */
  if (ppu>=20){
    ctx.globalAlpha=a*(0.25+0.65*lit); ctx.strokeStyle=CHEV_CORE; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.lineWidth=Math.max(1,h*0.09); ctx.beginPath(); chevCore(x,cy,h,dir,0.50,0.36); ctx.stroke(); ctx.lineCap='butt'; ctx.lineJoin='miter';
  }
}

function postLamp(n,zRel){
  if (zRel<=220||zRel>MAXZ) return;
  var p=proj(zRel); if (p.y<=horizonY||p.y>H) return;
  if (hailerAt(n*LAMP_SPACE,LAMP_SPACE*0.5)) return;     /* build 77: a hailer's own lamp stands here instead */
  var sl=slopeAt(n*LAMP_SPACE);
  /* build 81: never skipped in a bend; there it stands on the inside (the chevrons are on the outside) */
  var sd=Math.abs(sl)>=CHEV_S ? (sl>0?1:-1) : ((n&1)?-1:1);
  if (ZN.lampKind==='gas') gasLampAt(zRel,p,sd,1,n,GAS_HEAD,false,ZN.webs);   /* build 84: the crooked gas lamp */
  else drawLampAt(zRel,p,sd,1);
}

/* One swan-neck lamp. s = side, k = how lit it is: 1 is the normal steady lamp (identical to build 76),
   0 is a dead one (dark head, no halo or pool, only a faint lit edge). */
function drawLampAt(zRel,p,s,k){
  var a=1-fogAt(zRel), cRoad=bend(zRel), col=ZN.lamp||ZN.posts[0], m=0.45+0.55*k;
  var x=W/2+p.ppu*(cRoad+s*1.30-playerX), hx=W/2+p.ppu*(cRoad+s*HAIL_HEAD_X-playerX);
  if (Math.max(x,hx)<-80||Math.min(x,hx)>W+80) return;
  var h=p.ppu*0.80, w=Math.max(1,p.ppu*0.028), top=p.y-h;
  if (p.ppu<7){                                          /* far lamp: a pole, a lit edge, a head dot, one pool */
    if (k>0){ ctx.globalAlpha=a*0.13*k; ctx.fillStyle=col; ctx.fillRect(hx-p.ppu*0.3,p.y-1,p.ppu*0.6,1); }
    ctx.globalAlpha=a*0.9; ctx.fillStyle='#140a26'; ctx.fillRect(x-w,top,w*2,h);
    ctx.globalAlpha=a*0.9*m; ctx.fillStyle=col; ctx.fillRect(s<0?x+w*0.4:x-w,top,w*0.6,h);
    ctx.fillRect(Math.min(x,hx),top,Math.abs(hx-x)+1,1);
    ctx.globalAlpha=a*(0.12+0.88*k); ctx.fillStyle='#fff6e6'; ctx.fillRect(hx-1,top,2,2);
    return;
  }
  var near=p.ppu>=16;
  /* pool of light on the road under the head (drawn first, under the pole) */
  if (k>0){
    ctx.globalAlpha=a*0.13*k; ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(hx,p.y,p.ppu*0.34,Math.max(1,p.ppu*0.07),0,0,Math.PI*2); ctx.fill();
    if (near){
      ctx.globalAlpha=a*0.10*k;
      ctx.beginPath(); ctx.ellipse(hx,p.y,p.ppu*0.18,Math.max(1,p.ppu*0.035),0,0,Math.PI*2); ctx.fill();
    }
  }
  /* no light cone: a cone over the road reads as the UFO's abduction beam */
  /* pole and swan-neck arm */
  ctx.globalAlpha=a*0.95; ctx.fillStyle='#140a26';
  ctx.fillRect(x-w,top+p.ppu*0.06,w*2,h-p.ppu*0.06);
  ctx.globalAlpha=a*0.95*m; ctx.fillStyle=col; ctx.fillRect(s<0?x+w*0.4:x-w,top+p.ppu*0.06,w*0.6,h-p.ppu*0.06);   /* lit edge facing the road */
  ctx.globalAlpha=a*0.95;
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,top+p.ppu*0.08);
  ctx.quadraticCurveTo(x,top-p.ppu*0.02,(x+hx)/2,top-p.ppu*0.01);
  ctx.lineTo(hx,top+p.ppu*0.01);
  if (near){                                             /* dark arm, then the lit line on top */
    ctx.strokeStyle='#140a26'; ctx.lineWidth=w*1.6; ctx.stroke();
    ctx.globalAlpha=a*0.95*m;
    ctx.strokeStyle=hexA(col,0.8); ctx.lineWidth=Math.max(1,w*0.5); ctx.stroke();
  } else { ctx.globalAlpha=a*0.95*m; ctx.strokeStyle=hexA(col,0.85); ctx.lineWidth=Math.max(1,w*1.1); ctx.stroke(); }
  ctx.lineCap='butt';
  /* lamp head */
  var hw=p.ppu*0.14, hh=Math.max(2,p.ppu*0.035);
  if (k>0){
    ctx.globalAlpha=a*0.22*k; ctx.fillStyle=col;
    ctx.beginPath(); ctx.ellipse(hx,top+hh*2,hw*1.3,hh*3.2,0,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=a; ctx.fillStyle='#140a26'; ctx.fillRect(hx-hw/2,top,hw,hh);
  ctx.globalAlpha=a*(0.12+0.88*k); ctx.fillStyle='#fff6e6'; ctx.fillRect(hx-hw*0.4,top+hh,hw*0.8,Math.max(1,hh*0.7));
}

/* ---------------------------------------------------------------
   THE CROOKED GAS LAMP (build 84, Carlos's pick A on the Halloween picker,
   cobwebs on). Zones with lampKind 'gas' put it in every lamp slot, on the
   same sides as the swan necks (build 81's rule). A bent iron post, a curled
   bracket, a glass lantern with a live flame; a cobweb on every other lamp.
   headLat is where the lantern hangs: 1.02 for an ordinary lamp (as on the
   picker); a hitchhiker's lamp and the Halloween activator hang theirs over
   the outer lane (HAIL_HEAD_X), on a longer arm with a brace, so "drive under
   it" means what it says. live: the call can be made right now; the flame
   turns ghost green and flickers (k = hailFlick), like the broken swan lamp.
--------------------------------------------------------------- */
var GAS_HEAD = 1.02;
function lampFlame(t,n){ return 0.82+0.10*Math.sin(t*13+n*1.7)+0.08*Math.sin(t*31+n*0.9); }
function cobweb(x,y,r,dirX,a){                    /* a corner web: spokes and sagging threads */
  ctx.globalAlpha=a*0.45; ctx.strokeStyle='#e8e0ff'; ctx.lineWidth=Math.max(0.6,r*0.025);
  var sp=5, i, j;
  ctx.beginPath();
  for (i=0;i<=sp;i++){ var an=i/sp*Math.PI/2; ctx.moveTo(x,y); ctx.lineTo(x+dirX*Math.cos(an)*r,y+Math.sin(an)*r); }
  for (j=1;j<=3;j++){ var rj=r*j/3.4;
    for (i=0;i<sp;i++){ var a0=i/sp*Math.PI/2, a1=(i+1)/sp*Math.PI/2, am=(a0+a1)/2;
      var p0x=x+dirX*Math.cos(a0)*rj, p0y=y+Math.sin(a0)*rj, p1x=x+dirX*Math.cos(a1)*rj, p1y=y+Math.sin(a1)*rj;
      if (i===0) ctx.moveTo(p0x,p0y);
      ctx.quadraticCurveTo(x+dirX*Math.cos(am)*rj*0.82,y+Math.sin(am)*rj*0.82,p1x,p1y); } }
  ctx.stroke(); ctx.globalAlpha=a;
}
function lampPool(x,y,ppu,k,a,col){
  if (k<=0) return;
  ctx.globalAlpha=a*0.16*k; ctx.fillStyle=col;
  ctx.beginPath(); ctx.ellipse(x,y,ppu*0.34,Math.max(1,ppu*0.07),0,0,Math.PI*2); ctx.fill();
  if (ppu>=16){ ctx.globalAlpha=a*0.12*k; ctx.beginPath(); ctx.ellipse(x,y,ppu*0.17,Math.max(1,ppu*0.035),0,0,Math.PI*2); ctx.fill(); }
}
function gasLampAt(zRel,p,s,k,n,headLat,live,webs){
  var a=1-fogAt(zRel), t=performance.now()/1000, u=p.ppu, cR=bend(zRel);
  var x=W/2+u*(cR+s*1.28-playerX), lx=W/2+u*(cR+s*headLat-playerX);
  if (Math.max(x,lx)<-80||Math.min(x,lx)>W+80) return;
  var h=u*0.78, kk=live ? k : k*lampFlame(t,n);
  var hot=live?'#9dff6a':'#ff9a2e', warm=live?'#c8ffb0':'#ffb050';
  if (u<7){ ctx.globalAlpha=a*0.9; ctx.fillStyle='#140a14'; ctx.fillRect(x-1,p.y-h,2,h);
    if (Math.abs(lx-x)>2) ctx.fillRect(Math.min(x,lx),p.y-h,Math.abs(lx-x)+1,1);
    ctx.globalAlpha=a*(0.2+0.8*kk); ctx.fillStyle=warm; ctx.fillRect(lx-1,p.y-h*0.86,2,2); ctx.globalAlpha=1; return; }
  lampPool(lx,p.y,u,kk,a,hot);
  var w=Math.max(1,u*0.026), lean=s*u*0.05;
  /* the post: base, a kink at 40 %, leaning top */
  var bx=x, kx=x+lean*0.3, ky=p.y-h*0.42, tx=x-lean*0.5, ty=p.y-h;
  var IRON='#21142a';
  ctx.globalAlpha=a*0.96; ctx.strokeStyle=IRON; ctx.lineCap='round'; ctx.lineWidth=w*2;
  ctx.beginPath(); ctx.moveTo(bx,p.y); ctx.lineTo(kx,ky); ctx.lineTo(tx,ty); ctx.stroke();
  ctx.fillStyle=IRON; ctx.beginPath(); ctx.moveTo(bx-w*2.6,p.y); ctx.lineTo(bx+w*2.6,p.y); ctx.lineTo(bx+w*1.2,p.y-u*0.06); ctx.lineTo(bx-w*1.2,p.y-u*0.06); ctx.closePath(); ctx.fill();
  if (u>=10){ ctx.globalAlpha=a*0.7*(0.4+0.6*kk); ctx.strokeStyle=hot; ctx.lineWidth=Math.max(0.8,w*0.5);   /* firelight on the road side */
    ctx.beginPath(); ctx.moveTo(bx-s*w*0.8,p.y-u*0.06); ctx.lineTo(kx-s*w*0.8,ky); ctx.lineTo(tx-s*w*0.8,ty); ctx.stroke(); }
  /* the bracket: out toward the road, a curl at its end; a long one gets a brace */
  var ay=ty+u*0.02, cx2=lx, reach=Math.abs(lx-tx)/u;
  ctx.globalAlpha=a*0.96; ctx.strokeStyle=IRON; ctx.lineWidth=w*1.6;
  ctx.beginPath(); ctx.moveTo(tx,ay); ctx.quadraticCurveTo((tx+cx2)/2,ay-u*0.06,cx2,ay);
  if (u>=16){ ctx.arc(cx2+s*-u*0.025,ay+u*0.02,u*0.025,-Math.PI/2,Math.PI*1.2,s>0); }
  ctx.stroke();
  if (reach>0.35){ ctx.lineWidth=w*0.9; ctx.beginPath(); ctx.moveTo(x-lean*0.3,p.y-h*0.80); ctx.quadraticCurveTo(tx+(cx2-tx)*0.25,ay+u*0.02,tx+(cx2-tx)*0.55,ay-u*0.035); ctx.stroke(); }
  if (u>=10){                                     /* a pale rim along the arm and the post, so the iron reads on a dark sky,
                                                    and the lantern's own light along the arm */
    ctx.globalAlpha=a*0.55; ctx.strokeStyle='#cbb8f0'; ctx.lineWidth=Math.max(0.7,w*0.4);
    ctx.beginPath(); ctx.moveTo(tx,ay-w*0.8); ctx.quadraticCurveTo((tx+cx2)/2,ay-u*0.06-w*0.8,cx2,ay-w*0.8);
    ctx.moveTo(bx+s*w*0.9,p.y-u*0.06); ctx.lineTo(kx+s*w*0.9,ky); ctx.lineTo(tx+s*w*0.9,ty); ctx.stroke();
    ctx.globalAlpha=a*0.65*(0.4+0.6*kk); ctx.strokeStyle=hot; ctx.lineWidth=Math.max(0.8,w*0.45);
    ctx.beginPath(); ctx.moveTo(tx,ay-w*0.7); ctx.quadraticCurveTo((tx+cx2)/2,ay-u*0.06-w*0.7,cx2,ay-w*0.7); ctx.stroke(); }
  ctx.lineCap='butt';
  /* the lantern */
  var lw=u*0.11, lh=u*0.16, ly=ay+u*0.05;
  if (kk>0){ ctx.globalAlpha=1; glowDot(cx2,ly+lh*0.5,u*(live?0.40:0.32),hot,0.45*kk*a); }
  ctx.globalAlpha=a; ctx.fillStyle=IRON;
  ctx.beginPath(); ctx.moveTo(cx2-lw*0.7,ly); ctx.lineTo(cx2+lw*0.7,ly); ctx.lineTo(cx2+lw*0.35,ly-lh*0.28); ctx.lineTo(cx2-lw*0.35,ly-lh*0.28); ctx.closePath(); ctx.fill();
  ctx.fillRect(cx2-w*0.5,ay,w,ly-ay-lh*0.2);
  if (ZN.look==='haunted' && u<12){     /* build 88: glass under 2 px tall: one colour, the gradient's middle */
    ctx.fillStyle=live?'rgba(165,242,140,'+(0.275+0.65*kk).toFixed(3)+')':'rgba(255,167,90,'+(0.275+0.65*kk).toFixed(3)+')';
  } else {
    var gl=ctx.createLinearGradient(0,ly,0,ly+lh);
    if (live){ gl.addColorStop(0,'rgba(220,255,200,'+(0.3+0.7*kk).toFixed(3)+')'); gl.addColorStop(1,'rgba(110,230,80,'+(0.25+0.6*kk).toFixed(3)+')'); }
    else { gl.addColorStop(0,'rgba(255,214,140,'+(0.3+0.7*kk).toFixed(3)+')'); gl.addColorStop(1,'rgba(255,120,40,'+(0.25+0.6*kk).toFixed(3)+')'); }
    ctx.fillStyle=gl;
  }
  ctx.fillRect(cx2-lw/2,ly,lw,lh);
  ctx.fillStyle=IRON; ctx.fillRect(cx2-lw*0.6,ly+lh,lw*1.2,Math.max(1,lh*0.14));
  if (u>=20){ ctx.fillRect(cx2-w*0.3,ly,Math.max(1,w*0.6),lh);
    ctx.fillStyle=live?'rgba(240,255,230,'+(0.5+0.5*kk).toFixed(3)+')':'rgba(255,250,220,'+(0.5+0.5*kk).toFixed(3)+')';   /* the flame */
    ctx.beginPath(); ctx.ellipse(cx2+Math.sin(t*9+n)*lw*0.05,ly+lh*0.55,lw*0.12,lh*0.24*(0.8+0.2*kk),0,0,Math.PI*2); ctx.fill(); }
  if (webs && u>=18 && (n%2===0)) cobweb(tx,ay+u*0.004,u*0.15,-s,a);
  ctx.globalAlpha=1;
}
function drawGate(){
  var zRel=nextCP-position;
  if (zRel<=140||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var cRoad=bend(zRel);
  var h=p.ppu*1.05, thick=Math.max(2,p.ppu*0.06);
  var x0=W/2+p.ppu*(cRoad-1.3-playerX), x1=W/2+p.ppu*(cRoad+1.3-playerX);
  ctx.globalAlpha=a;
  ctx.shadowColor=ZN.gate; ctx.shadowBlur=blur(Math.min(26,p.ppu*0.3));
  ctx.fillStyle=ZN.gate;
  ctx.fillRect(x0-thick/2,p.y-h,thick,h);
  ctx.fillRect(x1-thick/2,p.y-h,thick,h);
  ctx.fillRect(x0,p.y-h-thick,x1-x0,thick*1.2);
  ctx.shadowBlur=0;
  if (p.ppu>50) glowText(T('CHECKPOINT'),(x0+x1)/2,p.y-h-thick*2.4,Math.min(30,p.ppu*0.16),'#eaffe0','center',12);
  ctx.globalAlpha=1;
}

/* The closeness multiplier, thrown off the side of the car the traffic went
   past on. Drawn in screen space rather than world space: it belongs to you,
   not to the car you shaved, and anchoring it to the player means it stays
   legible instead of shrinking away down the road. Called inside the shake
   transform so it rides with the car.

   The chain count is deliberately NOT repeated here — it already has a live
   HUD meter, and two numbers popping at once for one event reads as noise. */
function drawNearMissPops(){
  if (!nmPops.length) return;
  var lean=clamp(steerVel,-1.6,1.6);
  var bx=W/2+lean*9, by=PLAYER_Y-PW*0.55, i;
  for (i=0;i<nmPops.length;i++){
    var np=nmPops[i], k=np.t/NM_POP_LIFE;
    /* rises fast then settles, so the number is readable while it is still
       bright and only drifts once it is on its way out */
    var rise=1-(1-k)*(1-k);
    var x=bx + np.side*(PW*0.58 + 14*k);
    var y=by - 54*rise;
    var a=k<0.55 ? 1 : 1-(k-0.55)/0.45;
    /* cool -> hot as the pass gets closer, matching the game's own ramp */
    var col = np.m>=1.25 ? '#ff2fbe' : (np.m>=0.95 ? '#ffd23f' : '#8ef4ff');
    ctx.globalAlpha=Math.max(0,a);
    glowText('x'+np.m.toFixed(1), x, y, 15+np.m*4, col, 'center', 12);
    ctx.globalAlpha=1;
  }
}

/* A weaver's lane change used to be announced by one small amber square on
   its flank, which at any real distance was a couple of pixels you had to
   already be looking for. The roof bar now becomes the signal instead: three
   chevrons pointing the way it is about to go, lit in sequence so the block
   reads as MOVEMENT rather than as a light that is merely on. Three frames of
   chase plus one dark frame, so it still blinks. */
function vanChevrons(x,yTop,w,dir){
  var bw=w*0.78, x0=x-bw/2, cw=bw/3, h=Math.max(2.2,w*0.17), i, cx, lit;
  var ph=(Math.floor(performance.now()/105))%4;   /* 0 dark, then 1..3 lit */
  ctx.lineWidth=Math.max(1.4,w*0.062);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for (i=0;i<3;i++){
    /* index from the leading edge out, so the chase runs the way it points */
    lit = ph > (dir>0 ? i : (2-i));
    ctx.strokeStyle = lit ? '#ffd24a' : 'rgba(120,92,26,.85)';
    if (lit){ ctx.shadowColor='#ffb020'; ctx.shadowBlur=blur(Math.min(22,w*0.55)); }
    cx = x0 + cw*(i+0.5);
    ctx.beginPath();
    ctx.moveTo(cx-dir*cw*0.24, yTop);
    ctx.lineTo(cx+dir*cw*0.24, yTop+h/2);
    ctx.lineTo(cx-dir*cw*0.24, yTop+h);
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.lineCap='butt'; ctx.lineJoin='miter'; ctx.lineWidth=1;
}

function drawTraffic(c){
  var zRel=c.z-position;
  if (zRel<=180||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var w=CAR_W*p.ppu, h=w*0.66;
  var x=W/2+p.ppu*(bend(zRel)+c.x-playerX);
  if (x<-w||x>W+w) return;

  ctx.globalAlpha=a*0.25; ctx.fillStyle=c.color;
  ctx.beginPath(); ctx.ellipse(x,p.y,Math.max(1,w*0.62),Math.max(1,h*0.14),0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=a;

  if (w<8){                       
    var mw=Math.max(5,w), mh=Math.max(c.weaver?6:4,h);
    ctx.fillStyle=c.color;
    ctx.fillRect(x-mw/2,p.y-mh,mw,mh);
    if (c.weaver){
      /* Too few pixels for chevrons out here, so the strip itself leans:
         half width, pushed to the side it is heading for, blinking fast. */
      var fsg = (c.sigT>0||c.phase==='move') ? c.sigDir : 0;
      var fon = (Math.floor(performance.now()/(fsg?105:230))%2)===0;
      if (fon){
        /* A weaver usually starts signalling around 13,000 units out, which
           is exactly where it is too small for chevrons — so out here the
           strip leans AND blooms. At five pixels wide the glow is doing more
           work than the shape is. */
        if (fsg){
          ctx.shadowColor='#ffb020'; ctx.shadowBlur=blur(9); ctx.fillStyle='#ffe07a';
          ctx.fillRect(x+(fsg>0?mw*0.05:-mw*0.55), p.y-mh-3, mw*0.5, 3);
          ctx.shadowBlur=0;
        } else {
          ctx.fillStyle='#fff3b0';
          ctx.fillRect(x-mw/2, p.y-mh-2, mw, 2);
        }
      }
    }
    ctx.fillStyle='#ff5555';
    ctx.fillRect(x-mw/2,p.y-mh*0.5,mw,Math.max(1,mh*0.28));
    ctx.globalAlpha=1; return;
  }

  if (c.weaver){                  
    var vh=w*0.94;
    ctx.fillStyle='#171019';
    rr(x-w/2,p.y-vh,w,vh,w*0.09); ctx.fill();
    ctx.lineWidth=Math.max(1,w*0.055); ctx.strokeStyle='#ffd23f'; ctx.stroke();

    ctx.fillStyle='rgba(160,205,255,.16)';
    rr(x-w*0.36,p.y-vh*0.93,w*0.72,vh*0.24,w*0.05); ctx.fill();
    ctx.fillStyle='rgba(255,210,63,.22)';
    ctx.fillRect(x-w/2,p.y-vh*0.56,w,Math.max(1,vh*0.05));

    /* The signal runs through the whole change, not just the wind-up: the
       chevrons stay up while it is actually crossing, so a van caught
       mid-slide still tells you which way it is committed. */
    var sgn = (c.sigT>0 || c.phase==='move') ? c.sigDir : 0;
    if (sgn){
      vanChevrons(x, p.y-vh-w*0.20, w, sgn);
    } else {
      var on=(Math.floor(performance.now()/230)%2)===0;
      if (on){ ctx.shadowColor='#ffd23f'; ctx.shadowBlur=blur(Math.min(20,w*0.55)); }
      ctx.fillStyle=on?'#ffe98a':'#6b5a1e';
      ctx.fillRect(x-w*0.32,p.y-vh-w*0.11,w*0.64,w*0.10);
      ctx.shadowBlur=0;
    }

    ctx.shadowColor='#ff2b2b'; ctx.shadowBlur=blur(Math.min(14,w*0.3));
    ctx.fillStyle='#ff4747';
    ctx.fillRect(x-w*0.42,p.y-vh*0.28,w*0.18,vh*0.11);
    ctx.fillRect(x+w*0.24,p.y-vh*0.28,w*0.18,vh*0.11);
    ctx.shadowBlur=0;
    ctx.fillStyle='#05030a';
    ctx.fillRect(x-w*0.52,p.y-vh*0.15,w*0.10,vh*0.15);
    ctx.fillRect(x+w*0.42,p.y-vh*0.15,w*0.10,vh*0.15);
    ctx.globalAlpha=1; return;
  }

  ctx.fillStyle='#100a1c';
  rr(x-w/2,p.y-h,w,h,w*0.14); ctx.fill();
  ctx.lineWidth=Math.max(1,w*0.05); ctx.strokeStyle=c.color; ctx.stroke();

  ctx.fillStyle='rgba(120,200,255,.14)';
  rr(x-w*0.34,p.y-h*0.95,w*0.68,h*0.36,w*0.08); ctx.fill();

  ctx.shadowColor='#ff2b2b'; ctx.shadowBlur=blur(Math.min(16,w*0.35));
  ctx.fillStyle='#ff4747';
  ctx.fillRect(x-w*0.44,p.y-h*0.44,w*0.20,h*0.16);
  ctx.fillRect(x+w*0.24,p.y-h*0.44,w*0.20,h*0.16);
  ctx.shadowBlur=0;

  ctx.fillStyle='#05030a';
  ctx.fillRect(x-w*0.52,p.y-h*0.22,w*0.10,h*0.22);
  ctx.fillRect(x+w*0.42,p.y-h*0.22,w*0.10,h*0.22);
  ctx.globalAlpha=1;
}

function heartPath(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.bezierCurveTo(x-s*1.05, y-s*0.78, x-s*0.80, y-s*1.74, x, y-s*1.12);
  ctx.bezierCurveTo(x+s*0.80, y-s*1.74, x+s*1.05, y-s*0.78, x, y);
  ctx.closePath();
}
function drawHeart(hh){
  var zRel=hh.z-position;
  if (zRel<=180||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var w=Math.max(4, HEART_W*p.ppu), s=w/2;
  var x=W/2+p.ppu*(bend(zRel)+hh.x-playerX);
  if (x<-w*2||x>W+w*2) return;
  var t=performance.now(), hue=(t/9)%360;
  var y=p.y - (w*0.55 + Math.sin(t/380)*w*0.14);

  ctx.globalAlpha=a*0.30;
  ctx.fillStyle='hsl('+hue+',100%,62%)';
  ctx.beginPath(); ctx.ellipse(x,p.y,w*0.85,Math.max(1,w*0.22),0,0,Math.PI*2); ctx.fill();

  ctx.globalAlpha=a;
  var g=ctx.createLinearGradient(x-s,y-s*1.6,x+s,y);
  for (var i=0;i<=4;i++) g.addColorStop(i/4,'hsl('+((hue+i*72)%360)+',100%,63%)');
  ctx.shadowColor='hsl('+((hue+180)%360)+',100%,60%)';
  ctx.shadowBlur=blur(Math.min(30,w*0.95));
  heartPath(x,y,s); ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  if (w>10){
    ctx.lineWidth=Math.max(1,w*0.055); ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.stroke();
    ctx.globalAlpha=a*0.55; ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.ellipse(x-s*0.34,y-s*0.92,s*0.17,s*0.11,-0.5,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

var BOLT=[[-0.10,-1.00],[0.62,-1.00],[0.16,-0.18],[0.72,-0.18],
          [-0.28,1.00],[0.02,0.10],[-0.50,0.10]];
function drawShot(sh){
  var zRel=sh.z-position;
  if (zRel<=140||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var w=Math.max(3,0.13*p.ppu);
  var x=W/2+p.ppu*(bend(zRel)+sh.x-playerX);
  var y=p.y-w*1.5;
  ctx.globalAlpha=a;
  var tz=Math.max(150,zRel-2800), tp=proj(tz);
  var tx=W/2+tp.ppu*(bend(tz)+sh.x-playerX), ty=tp.y-Math.max(3,0.13*tp.ppu)*1.5;
  var g=ctx.createLinearGradient(x,y,tx,ty);
  var sc=sh.col||'#8ef4ff';
  g.addColorStop(0,'rgba(255,255,255,.85)'); g.addColorStop(1,hexA(sc,0));
  ctx.strokeStyle=g; ctx.lineWidth=Math.max(1.5,w*0.6); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();
  ctx.shadowColor=sc; ctx.shadowBlur=blur(Math.min(26,w*2.4));
  ctx.globalAlpha=a*0.45; ctx.fillStyle=sc;
  ctx.beginPath(); ctx.ellipse(x,y,w*0.95,w*1.5,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=a; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.ellipse(x,y,w*0.5,w*0.85,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.globalAlpha=1;
}

/* a small mushroom cloud where a car used to be */
function drawBlast(bl){
  var zRel=bl.z-position;
  if (zRel<=140||zRel>MAXZ) return;
  var p=proj(zRel), t=bl.t;
  var a=(1-fogAt(zRel))*(1-t*t);
  var x=W/2+p.ppu*(bend(zRel)+bl.x-playerX);
  var gy=p.y;
  var R=p.ppu*(0.10+0.34*Math.pow(t,0.5));
  var rise=p.ppu*(0.08+0.62*Math.pow(t,0.75));

  ctx.globalAlpha=a*0.5;                       /* shockwave on the tarmac */
  ctx.strokeStyle='#ffd23f'; ctx.lineWidth=Math.max(1,p.ppu*0.025);
  ctx.beginPath(); ctx.ellipse(x,gy,R*(1.1+t*1.6),Math.max(1,R*(0.26+t*0.4)),0,0,Math.PI*2); ctx.stroke();

  var sw=R*0.34;                               /* stem */
  ctx.globalAlpha=a*0.7;
  var g2=ctx.createLinearGradient(x,gy,x,gy-rise);
  g2.addColorStop(0,'rgba(255,120,40,.12)'); g2.addColorStop(1,'rgba(255,205,90,.8)');
  ctx.fillStyle=g2;
  ctx.beginPath();
  ctx.moveTo(x-sw*0.5,gy); ctx.lineTo(x+sw*0.5,gy);
  ctx.lineTo(x+sw,gy-rise); ctx.lineTo(x-sw,gy-rise);
  ctx.closePath(); ctx.fill();

  ctx.globalAlpha=a;                           /* cap */
  var g=ctx.createRadialGradient(x,gy-rise,R*0.08,x,gy-rise,R);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.30,'#ffe487');
  g.addColorStop(0.68,'#ff7a2f'); g.addColorStop(1,'rgba(255,50,30,0)');
  ctx.shadowColor='#ff9b3d'; ctx.shadowBlur=blur(Math.min(26,R*0.9));
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,gy-rise,R,R*0.80,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.globalAlpha=1;
}

var UFO_W=0.62;
/* build 85 (Carlos): during the abduction the saucer's dome stays just below the LAP/TIME panel (it ends at
   y 74), not behind it. Its bob calms from 0.10 to 0.03 of its width over the lock, so it never pokes up. */
var UFO_CUT_TOP=80;
function ufoBobA(uf){ return uf.cutting && cut ? 0.10-0.07*clamp(cut.t/cut.dur/0.16,0,1) : 0.10; }
function ufoCutMin(w,bobA){ return UFO_CUT_TOP+w*(0.30+bobA); }   /* the dome reaches 0.30 w above y */
function ufoCutDrop(uf){                 /* how far the cut lowers it: the car rises that much less */
  var p=proj(Math.max(181,uf.z-position)), w=Math.max(5,UFO_W*p.ppu);
  return Math.max(0, ufoCutMin(w,0.03)-(p.y-uf.hover*p.ppu));
}
/* THE SAUCER (build 83: the Cutaway Lab v2's saucer, ported).
   A metal hull with a rim light and a seam, an under-glow, a glass dome with
   a small alien inside (the roadside glow-suit alien's head: it watches your
   car and blinks), running lights, and a layered beam: outer cone, hot core,
   edge lines, travelling rings, motes rising through it, a pool of light on
   the road. The beam's width AT THE ROAD is still exactly the width the hunt
   tests (UFO_BEAM_R), and the lock ring is build 82's code unchanged.
   Detail steps down with size, so a far saucer costs what it did. */
var ufoRgbC={};
function ufoRgb(hex){
  var c=ufoRgbC[hex]; if (c) return c;
  var n=parseInt(hex.slice(1),16);
  return (ufoRgbC[hex]=((n>>16)&255)+','+((n>>8)&255)+','+(n&255));
}
function ufoLite(rgb,m){                 /* the colour pushed toward white by m (0..1) */
  var p=rgb.split(','), o=[];
  for (var i=0;i<3;i++) o.push(Math.round(+p[i]+(255-p[i])*m));
  return o.join(',');
}
function drawUfo(uf){
  var zRel=uf.z-position;
  if (zRel<=180||zRel>MAXZ) return;
  var p=proj(zRel), a=(1-fogAt(zRel))*uf.fade;
  if (a<=0.01) return;
  var w=Math.max(5,UFO_W*p.ppu), dh=Math.max(1.5,w*0.19);
  var x=W/2+p.ppu*(bend(zRel)+uf.x-playerX);
  if (x<-w*3||x>W+w*3) return;
  var gy=p.y;
  var bobA=ufoBobA(uf), base=gy-(uf.hover*p.ppu);
  if (uf.cutting) base=Math.max(base, ufoCutMin(w,bobA));   /* build 85: below the LAP/TIME panel */
  var y=base-Math.sin(uf.bob*1.3)*w*bobA-(uf.lift||0);
  var tR=performance.now()/1000;
  var rgb=ufoRgb(uf.color), hot=ufoLite(rgb,0.62), wht=ufoLite(rgb,0.86);

  var live = !!(uf.hunt||uf.cutting);
  if (uf.beamOn && (!live || uf.beamK>0.01)){
    var k  = live ? uf.beamK : 1;
    /* the beam is drawn at EXACTLY the width it is tested at (build 82) */
    var bw = live ? UFO_BEAM_R*p.ppu*(0.55+0.45*k) : UFO_BEAM_R*p.ppu;
    var top=y+dh*0.55, x0=w*0.20, s=(live?1:0.55)*k*a;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    /* the pool of light on the road */
    var pr=bw*1.25, pg=ctx.createRadialGradient(x,gy,1,x,gy,pr);
    pg.addColorStop(0,'rgba('+wht+','+(0.42*s).toFixed(3)+')');
    pg.addColorStop(0.55,'rgba('+rgb+','+(0.20*s).toFixed(3)+')');
    pg.addColorStop(1,'rgba('+rgb+',0)');
    ctx.fillStyle=pg; ctx.beginPath(); ctx.ellipse(x,gy,pr,Math.max(1,pr*0.26),0,0,Math.PI*2); ctx.fill();
    /* outer cone: brighter under the saucer, thinner at the road */
    var bg=ctx.createLinearGradient(0,top,0,gy);
    bg.addColorStop(0,'rgba('+hot+','+(0.34*s).toFixed(3)+')');
    bg.addColorStop(0.6,'rgba('+rgb+','+(0.16*s).toFixed(3)+')');
    bg.addColorStop(1,'rgba('+rgb+','+(0.10*s).toFixed(3)+')');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.moveTo(x-x0,top); ctx.lineTo(x+x0,top); ctx.lineTo(x+bw,gy); ctx.lineTo(x-bw,gy); ctx.closePath(); ctx.fill();
    /* the hot core */
    var cg=ctx.createLinearGradient(0,top,0,gy);
    cg.addColorStop(0,'rgba('+wht+','+(0.38*s).toFixed(3)+')'); cg.addColorStop(1,'rgba('+hot+',0)');
    ctx.fillStyle=cg;
    ctx.beginPath(); ctx.moveTo(x-x0*0.45,top); ctx.lineTo(x+x0*0.45,top); ctx.lineTo(x+bw*0.42,gy); ctx.lineTo(x-bw*0.42,gy); ctx.closePath(); ctx.fill();
    /* the two edges: what you steer away from */
    ctx.strokeStyle='rgba('+wht+','+(0.55*s).toFixed(3)+')'; ctx.lineWidth=Math.max(1,w*0.012);
    ctx.beginPath(); ctx.moveTo(x-x0,top); ctx.lineTo(x-bw,gy); ctx.moveTo(x+x0,top); ctx.lineTo(x+bw,gy); ctx.stroke();
    /* motes rising through the beam (no state: each one is a phase of the clock) */
    if (w>18){
      var nm=live?16:7, bh=gy-top;
      ctx.fillStyle='rgba('+wht+',1)';
      for (var m=0;m<nm;m++){
        var ph=((tR*(0.42+0.05*(m%3))+m*0.618)%1), yy=gy-ph*bh;
        var hw=x0+(bw-x0)*(1-ph), xx=x+((m*0.371+0.13)%1-0.5)*2*hw*0.82+Math.sin(tR*2.1+m)*w*0.01;
        var ms=Math.max(1,w*(0.010+0.006*(m%2)));
        ctx.globalAlpha=0.85*s*Math.sin(ph*Math.PI);
        ctx.fillRect(xx-ms/2,yy-ms/2,ms,ms);
      }
      ctx.globalAlpha=1;
    }
    ctx.restore();

    if (live){
      /* rings travelling down the cone, so the beam reads as pulling */
      ctx.strokeStyle='rgba('+wht+',1)'; ctx.lineWidth=Math.max(1,w*0.026);
      for (var r=0;r<4;r++){
        var rp=((tR*0.85+r*0.25)%1);
        var ry=top+rp*(gy-top);
        var rw2=x0+(bw-x0)*rp;
        ctx.globalAlpha=a*0.42*k*Math.sin(rp*Math.PI);
        ctx.beginPath(); ctx.ellipse(x,ry,rw2,Math.max(1,rw2*0.20),0,0,Math.PI*2); ctx.stroke();
      }
      /* and the lock: the ring on the road closes as it takes hold (build 82, unchanged) */
      if (uf.lock>0.02){
        var lk=clamp(uf.lock/UFO_LOCK,0,1);
        ctx.globalAlpha=a*0.95;
        ctx.strokeStyle=lk>=1?'#ffffff':'#7cff4f';
        ctx.lineWidth=Math.max(1.5,w*0.05);
        ctx.shadowColor='#7cff4f'; ctx.shadowBlur=blur(Math.min(18,w*0.30));
        ctx.beginPath();
        ctx.ellipse(x,gy,bw*1.06,Math.max(1,bw*0.26),0,-Math.PI/2,-Math.PI/2+lk*Math.PI*2);
        ctx.stroke(); ctx.shadowBlur=0;
      }
    }
    ctx.globalAlpha=1;
  }

  /* under-glow, in the saucer's colour */
  if (w>10){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    var ug=ctx.createRadialGradient(x,y+dh*0.6,1,x,y+dh*0.6,w*0.7);
    ug.addColorStop(0,'rgba('+rgb+','+(a*(0.22+0.30*(uf.beamOn?(uf.beamK||0):0))).toFixed(3)+')');
    ug.addColorStop(1,'rgba('+rgb+',0)');
    ctx.fillStyle=ug; ctx.fillRect(x-w*0.7,y-w*0.3,w*1.4,w*1.0);
    ctx.restore();
  }

  ctx.globalAlpha=a;
  /* the hull: metal, lit from above, a seam, a thin rim in the saucer's colour */
  var g=ctx.createLinearGradient(0,y-dh,0,y+dh);
  g.addColorStop(0,'#6d5bb8'); g.addColorStop(0.45,'#3a2a6e'); g.addColorStop(1,'#120a24');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y,w*0.5,dh,0,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=Math.max(1,w*0.020); ctx.strokeStyle='rgba('+rgb+',0.95)';
  ctx.shadowColor=uf.color; ctx.shadowBlur=blur(Math.min(14,w*0.22));
  ctx.stroke(); ctx.shadowBlur=0;
  if (w>14){
    ctx.strokeStyle='rgba(190,175,255,.55)'; ctx.lineWidth=Math.max(1,w*0.012);
    ctx.beginPath(); ctx.ellipse(x,y,w*0.47,dh*0.9,0,Math.PI*1.05,Math.PI*1.95); ctx.stroke();
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(x-w*0.49,y-dh*0.06,w*0.98,Math.max(1,dh*0.12));
    /* the belly lens */
    ctx.fillStyle='rgba('+wht+','+(0.45+0.5*(uf.beamOn?(uf.beamK||0):0)).toFixed(3)+')';
    ctx.beginPath(); ctx.ellipse(x,y+dh*0.62,w*0.11,Math.max(1,dh*0.24),0,0,Math.PI*2); ctx.fill();
  }

  ctx.globalAlpha=a;
  /* the dome: a dark collar, the glass, the pilot, the sheen */
  var gx=x, gyD=y-dh*0.42, gw=w*0.20, gh=Math.max(1.5,w*0.22);
  var dg=ctx.createLinearGradient(0,y-dh*1.2,0,y);
  dg.addColorStop(0,'#5a43a0'); dg.addColorStop(1,'#22163f');
  ctx.fillStyle=dg; ctx.beginPath(); ctx.ellipse(x,gyD+dh*0.08,w*0.29,dh*0.55,0,Math.PI,Math.PI*2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(gx,gyD,gw,gh,0,Math.PI,Math.PI*2); ctx.closePath();
  ctx.fillStyle='rgba(8,26,44,.92)'; ctx.fill();
  if (w>30){                                            /* the pilot, inside the glass */
    ctx.clip();
    var hr=w*0.068, hh=w*0.084, hx=gx+Math.sin(uf.bob*0.7)*w*0.012, hy=gyD-gh*0.38;
    var look=clamp((playerX-uf.x)*0.9,-1,1);
    ctx.fillStyle='#1a3d24';                            /* shoulders */
    ctx.beginPath(); ctx.ellipse(hx,gyD+gh*0.05,hr*1.5,hh*0.75,0,Math.PI,Math.PI*2); ctx.fill();
    var hg=ctx.createRadialGradient(hx-hr*0.3,hy-hh*0.6,hr*0.1,hx,hy-hh*0.2,hh*1.2);
    hg.addColorStop(0,'#b6ff8a'); hg.addColorStop(1,'#3e9a2a');
    ctx.fillStyle=hg;
    ctx.beginPath(); ctx.ellipse(hx,hy-hh*0.25,hr,hh,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx-hr*0.55,hy+hh*0.35); ctx.lineTo(hx,hy+hh*0.95); ctx.lineTo(hx+hr*0.55,hy+hh*0.35); ctx.closePath(); ctx.fill();
    var blink=((tR*0.31+uf.bob*0.1)%1)<0.035;
    for (var e=-1;e<=1;e+=2){
      ctx.save(); ctx.translate(hx+look*hr*0.22+e*hr*0.42,hy-hh*0.20); ctx.rotate(e*0.5);
      ctx.fillStyle='#05030a';
      ctx.beginPath(); ctx.ellipse(0,0,hr*0.40,blink?Math.max(0.6,hh*0.04):hh*0.24,0,0,Math.PI*2); ctx.fill();
      if (!blink && w>44){ ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(-hr*0.13,-hh*0.08,Math.max(0.9,hr*0.12),0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
  }
  ctx.restore();
  ctx.globalAlpha=a;
  var gg=ctx.createRadialGradient(gx-w*0.05,gyD-gh*0.9,1,gx,gyD-gh*0.3,w*0.22);  /* the glass over everything */
  gg.addColorStop(0,'rgba(220,255,255,.55)'); gg.addColorStop(0.45,'rgba(33,230,255,.20)'); gg.addColorStop(1,'rgba(33,120,200,.28)');
  ctx.fillStyle=gg; ctx.beginPath(); ctx.ellipse(gx,gyD,gw,gh,0,Math.PI,Math.PI*2); ctx.fill();
  if (w>14){
    ctx.strokeStyle='rgba(160,240,255,.55)'; ctx.lineWidth=Math.max(1,w*0.008);
    ctx.beginPath(); ctx.ellipse(gx,gyD,gw,gh,0,Math.PI,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.60)';
    ctx.beginPath(); ctx.ellipse(gx-gw*0.55,gyD-gh*0.55,gw*0.07,gh*0.15,-0.6,0,Math.PI*2); ctx.fill();
  }

  ctx.globalAlpha=a;
  if (w>12){                                  /* running lights round the rim, front half lit */
    for (var i=0;i<9;i++){
      var ang=uf.spin+i*Math.PI*2/9, cs=Math.sin(ang);
      if (cs<-0.2) continue;
      var lx=x+Math.cos(ang)*w*0.45, ly=y+cs*dh*0.45, lit=(cs+0.2)/1.2, col=(i%2?'#ffffff':uf.color);
      if (w>26){
        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a*0.35*lit*GQ; ctx.fillStyle=col;
        ctx.beginPath(); ctx.arc(lx,ly,w*0.05,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
      ctx.globalAlpha=a*(0.4+0.6*lit); ctx.fillStyle=col;
      var ls=Math.max(1.5,w*0.036);
      ctx.fillRect(lx-ls/2,ly-ls/2,ls,ls);
    }
  }
  ctx.globalAlpha=1;
}

/* ---------------------------------------------------------------
   SCREEN EFFECTS LAYER (build 83)
   One small list of short-lived screen-space effects, shared by every
   moment that wants one: today the abduction (the pulse ring when the beam
   takes you, the landing dust), later the dino's slime drips, shockwaves,
   flashes. Each effect is a plain object with a kind, a layer and a life:
     layer 0  on the ground, under the car      (drawn before drawPlayer)
     layer 1  above the car, still in the world (after the near-miss pops)
     layer 2  over the whole frame, under the HUD (after drawCut)
   It steps in update() (so a pause freezes it) and draws in three calls in
   render(). It has its OWN random generator: the game's Math.random
   sequence is untouched, so a run plays the same with or without effects.
   Kinds:
     dot   {x,y,vx,vy,g,drag,size,col,a,add,fadeIn}       a particle
     ring  {x,y,r0,r1,sq,col,w,a,add}                       expanding ring (sq<1 = on the ground)
     flash {col,a}                                          full-screen wash
     flare {y,col,a,len}                                    anamorphic horizontal streak
     drip  {x,len,w,col,a,v,delay}                          slime running down from the top edge
--------------------------------------------------------------- */
var fx=[], FX_MAX=260, fxSeed=0x2f6e2b1;
function fxRnd(){ fxSeed=(fxSeed*1664525+1013904223)>>>0; return fxSeed/4294967296; }
function fxAdd(o){
  o.t=0; if (o.layer===undefined) o.layer=1; if (o.a===undefined) o.a=1;
  if (fx.length>=FX_MAX) fx.shift();
  fx.push(o); return o;
}
function fxClear(){ fx.length=0; }
function fxStep(dt){
  for (var i=fx.length-1;i>=0;i--){
    var o=fx[i];
    o.t+=dt;
    if (o.t>=o.life){ fx.splice(i,1); continue; }
    if (o.kind==='dot'){
      var dr=Math.pow(Math.max(0.0001,1-(o.drag||0)*0.25),dt*4);
      o.vx*=dr; o.vy=o.vy*dr+(o.g||0)*dt;
      o.x+=o.vx*dt; o.y+=o.vy*dt;
    }
  }
}
/* n particles from one point; spread in px/s, up = extra upward speed */
function fxBurst(x,y,n,o){
  for (var i=0;i<n;i++){
    var an=fxRnd()*Math.PI*2, sp=(o.spread||120)*(0.35+0.65*fxRnd());
    fxAdd({kind:'dot', layer:o.layer===undefined?1:o.layer, x:x+(fxRnd()-0.5)*(o.w||0), y:y,
           vx:Math.cos(an)*sp, vy:Math.sin(an)*sp*(o.flat||1)-(o.up||0)*(0.5+0.5*fxRnd()),
           g:o.g||0, drag:o.drag||0, size:(o.size||2)*(0.6+0.8*fxRnd()), col:o.col||'#ffffff',
           a:o.a===undefined?0.85:o.a, add:!!o.add, fadeIn:o.fadeIn||0, life:(o.life||0.8)*(0.6+0.8*fxRnd())});
  }
}
/* the dino's future spit: n drips across the top of the screen */
function fxDrips(n,col){
  for (var i=0;i<n;i++)
    fxAdd({kind:'drip', layer:2, x:W*(0.06+0.88*fxRnd()), len:40+fxRnd()*120, w:6+fxRnd()*12,
           col:col||'#9dff6a', a:0.9, v:22+fxRnd()*60, delay:fxRnd()*0.5, life:2.6+fxRnd()*1.4});
}
function fxDraw(layer){
  if (!fx.length) return;
  for (var i=0;i<fx.length;i++){
    var o=fx[i];
    if (o.layer!==layer) continue;
    var q=o.t/o.life, k=1-q;
    if (o.kind==='dot'){
      var fa=o.fadeIn ? Math.min(1,o.t/o.fadeIn) : 1;
      ctx.globalAlpha=o.a*fa*k;

      ctx.fillStyle=o.col;

      ctx.fillRect(o.x-s/2,o.y-s/2,s,s);

    } else if (o.kind==='ring'){
      var e=1-Math.pow(1-q,3), r=o.r0+(o.r1-o.r0)*e;

      if (o.add) ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle=o.col; ctx.lineWidth=Math.max(1,(o.w||3)*(0.4+0.6*k));
      ctx.beginPath(); ctx.ellipse(o.x,o.y,r,Math.max(1,r*(o.sq||1)),0,0,Math.PI*2); ctx.stroke();
      if (o.add) ctx.globalCompositeOperation='source-over';
    } else if (o.kind==='flash'){
      ctx.globalAlpha=o.a*k*k; ctx.fillStyle=o.col; ctx.fillRect(0,0,W,H);
    } else if (o.kind==='flare'){
      var fa2=o.a*Math.sin(Math.min(1,q)*Math.PI), L=(o.len||W)*(0.7+0.3*q);
      ctx.globalAlpha=1; ctx.globalCompositeOperation='lighter';
      var fg=ctx.createLinearGradient(W/2-L/2,0,W/2+L/2,0);
      fg.addColorStop(0,hexA(o.col,0)); fg.addColorStop(0.5,hexA(o.col,(0.85*fa2).toFixed(3))); fg.addColorStop(1,hexA(o.col,0));
      ctx.fillStyle=fg; ctx.fillRect(W/2-L/2,o.y-1.5,L,3);

      ctx.globalAlpha=o.a*fade;

      dg.addColorStop(0,hexA(o.col,0.95)); dg.addColorStop(1,hexA(o.col,0.55));
      ctx.fillStyle=dg;
      ctx.beginPath();                                  /* a tapering string with a bulb at its end */
      ctx.moveTo(x0-o.w*0.5,top);
      ctx.quadraticCurveTo(x0-o.w*0.18,top+(bot-top)*0.55,x0-o.w*0.20,bot-o.w*0.3);
      ctx.lineTo(x0+o.w*0.20,bot-o.w*0.3);
      ctx.quadraticCurveTo(x0+o.w*0.18,top+(bot-top)*0.55,x0+o.w*0.5,top);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x0,bot,o.w*0.34,o.w*0.44,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,'+(0.55*o.a*fade).toFixed(3)+')';   /* wet highlight */
      ctx.beginPath(); ctx.ellipse(x0-o.w*0.10,bot-o.w*0.12,o.w*0.08,o.w*0.13,0,0,Math.PI*2); ctx.fill();
    }

}

/* The strip across the roof. Everything is drawn from the same anchor so a

function drawLightBar(pw,ph,col,shape){
  if (shape>=7){ lkTopper(pw,ph,(BARS[shape]&&BARS[shape].k)||'',col); return; }   /* build 94 */
  var y=-ph-pw*0.076, w=pw*0.92, x0=-pw*0.46, th=pw*0.054, i, s, cx;
  var t=performance.now();
  ctx.fillStyle=col; ctx.strokeStyle=col;
  ctx.shadowColor=col; ctx.shadowBlur=blur(pw*0.14);

    var n=7, tw=w/n, hg=pw*0.085;
    ctx.beginPath(); ctx.moveTo(x0,y+th);
    for (i=0;i<n;i++){
      ctx.lineTo(x0+i*tw+tw/2, y+th-hg);
      ctx.lineTo(x0+(i+1)*tw, y+th);

      ctx.closePath(); ctx.fill();

  } else if (shape===3){                            /* CROWN */
    ctx.beginPath();
    ctx.moveTo(x0,y+th);
    ctx.lineTo(x0,            y+th-pw*0.055);
    ctx.lineTo(x0+w*0.20,     y+th-pw*0.012);
    ctx.lineTo(x0+w*0.35,     y+th-pw*0.115);
    ctx.lineTo(x0+w*0.50,     y+th-pw*0.020);
    ctx.lineTo(x0+w*0.65,     y+th-pw*0.115);
    ctx.lineTo(x0+w*0.80,     y+th-pw*0.012);
    ctx.lineTo(x0+w,          y+th-pw*0.055);
    ctx.lineTo(x0+w,y+th);
    ctx.closePath(); ctx.fill();
  } else if (shape===4){                            /* HORNS */
    for (s=-1;s<=1;s+=2){
      ctx.beginPath();
      ctx.moveTo(s*w*0.30, y+th);
      ctx.quadraticCurveTo(s*w*0.52, y+th-pw*0.05, s*w*0.50, y+th-pw*0.17);
      ctx.quadraticCurveTo(s*w*0.40, y+th-pw*0.07, s*w*0.20, y+th);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillRect(-w*0.22,y+th*0.3,w*0.44,th*0.75);
  } else if (shape===5){                            /* HALO */
    ctx.lineWidth=Math.max(1.4,pw*0.030);
    ctx.beginPath();
    ctx.ellipse(0, y-pw*0.085, w*0.32, pw*0.042, 0, 0, Math.PI*2);
    ctx.stroke();
  } else if (shape===6){                            /* PULSE */
    var k=8, seg=w/k;
    for (i=0;i<k;i++){
      ctx.globalAlpha = (((Math.floor(t/110)+i)%4)===0) ? 1 : 0.22;
      ctx.fillRect(x0+i*seg+seg*0.14, y, seg*0.72, th);
    }
    ctx.globalAlpha=1;
  } else {                                          /* BAR */
    ctx.fillRect(x0,y,w,th);
  }
  ctx.shadowBlur=0;
}

/* A face in the rear window. Blinks now and then, and squints under braking. */
function drawEyes(pw,ph,style,braking,rx){
  if (style===0) return;
  var t=performance.now(), blink=(t%4300)<130;
  if (style>=7){ lkFace(pw,ph,(EYES[style]&&EYES[style].k)||'',blink,rx); return; }   /* build 94 */
  var wk=(rx&&rx.k==='wink')?rx.a:0;                   /* build 94: a near miss winks */
  var ex=pw*0.15, ey=-ph*0.76, r=pw*0.055, s, cx;
  var col='#eaf6ff';
  ctx.shadowColor='#bfe9ff'; ctx.shadowBlur=blur(pw*0.09);

  if (style===6){                                   /* VISOR */
    ctx.fillStyle='#ff3b5c'; ctx.shadowColor='#ff3b5c';
    ctx.fillRect(-pw*0.25, ey-pw*0.021, pw*0.50, pw*0.042);
    ctx.fillStyle='#ffffff';
    if (wk>0){ var vw=pw*(0.07+0.10*wk); ctx.fillRect(Math.sin(t/300)*pw*0.19*(1-wk)+pw*0.15*wk-vw/2, ey-pw*0.021, vw, pw*0.042); }
    else ctx.fillRect(Math.sin(t/300)*pw*0.19-pw*0.035, ey-pw*0.021, pw*0.07, pw*0.042);
    ctx.shadowBlur=0; return;
  }
  if (style===5){                                   /* CYCLOPS */
    var R=pw*0.082;
    ctx.fillStyle=col;
    if (blink || wk>0.4){ ctx.fillRect(-R,ey-pw*0.011,R*2,pw*0.022); }
    else {
      ctx.beginPath(); ctx.arc(0,ey,R*(braking?0.72:1),0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#0d0818';
      ctx.beginPath(); ctx.arc(0,ey+R*0.06,R*0.40,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur=0; return;
  }
  for (s=-1;s<=1;s+=2){
    cx=s*ex;
    if (s===1 && wk>0.4){                          /* build 94: the right eye winks */
      ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.3,pw*0.022); ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(cx,ey+r*0.5,r*0.9,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
      continue;
    }
    if (style===4){                                 /* DIZZY */
      ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.3,pw*0.021); ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(cx-r,ey-r); ctx.lineTo(cx+r,ey+r);
      ctx.moveTo(cx+r,ey-r); ctx.lineTo(cx-r,ey+r);
      ctx.stroke();
      continue;
    }
    if (blink){
      ctx.fillStyle=col; ctx.fillRect(cx-r,ey-pw*0.010,r*2,pw*0.020);
      continue;
    }
    if (style===3){                                 /* SLEEPY */
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(cx,ey+r*0.10,r*0.92,0,Math.PI); ctx.fill();
      ctx.fillRect(cx-r,ey-pw*0.008,r*2,pw*0.017);
      continue;
    }
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(cx,ey,r*(braking?0.68:1),0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0d0818';
    ctx.beginPath(); ctx.arc(cx+s*r*0.12,ey+r*0.08,r*0.40,0,Math.PI*2); ctx.fill();
    if (style===2){                                 /* ANGRY brows */
      ctx.fillStyle=col;
      ctx.save();
      ctx.translate(cx,ey-r*1.30);
      ctx.rotate(-s*0.45);
      ctx.fillRect(-r*1.15,-pw*0.015,r*2.3,pw*0.030);
      ctx.restore();
    }
  }
  ctx.shadowBlur=0;
}

/* Super-saiyan flare: two flickering envelopes drawn additively so they
   blow out where they overlap, taller than they are wide, with embers
   climbing out of the top. Replaces the car's underglow while it burns. */
function drawAura(pw,ph,fade){
  var t=performance.now()/1000, i, k, layer;
  var cx=0, cy=-ph*0.50, n=20;
  var rx=pw*0.64, ry=ph*0.98;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for (layer=0; layer<2; layer++){
    var sc=layer?1.0:0.70, al=(layer?0.26:0.50)*fade;
    ctx.beginPath();
    for (i=0;i<=n;i++){
      var a=(i/n)*Math.PI*2 - Math.PI/2;
      var up=Math.max(0,-Math.sin(a));
      var flick=0.80+0.36*Math.abs(Math.sin(i*2.3 + t*(11+layer*5)));
      var r=flick*(1+up*0.80)*sc;
      var px=cx+Math.cos(a)*rx*r, py=cy+Math.sin(a)*ry*r;
      if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    var g=ctx.createRadialGradient(cx,cy,pw*0.05,cx,cy,rx*1.7);
    g.addColorStop(0,'rgba(255,255,238,'+al.toFixed(3)+')');
    g.addColorStop(0.48,'rgba(255,206,64,'+(al*0.72).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,120,10,0)');
    ctx.fillStyle=g; ctx.fill();
  }
  ctx.fillStyle='rgba(255,244,196,0.9)';
  for (k=0;k<8;k++){
    var pr=(t*1.9 + k*0.31)%1;
    var sx=Math.sin(k*3.1+t*2.2)*pw*0.40;
    var sy=cy - pr*ph*1.9 + ph*0.35;
    var ss=Math.max(1,pw*0.022*(1-pr));
    ctx.globalAlpha=(1-pr)*0.85*fade;
    ctx.fillRect(sx-ss/2, sy, ss, ss*2.4);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

/* ---------------------------------------------------------------

}
function lkSeeded(s){ return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

/* liveries (WRAP), clipped to the body. c1 = WRAP COLOUR (build 101; was BAR COLOUR), c2 = TRIM (NEON EDGE) */

      var rc=['#ff3b5c','#ff8a1f','#ffd23f','#7cff4f','#21e6ff','#b06cff'], w0=pw*0.11;
      for (i=0;i<6;i++){
        var xl=-pw*0.33+i*w0, sk=-d*pw*0.5;
        var g2=ctx.createLinearGradient(0,y0,0,y0+len); g2.addColorStop(0,hexA(rc[i],(0.85*A).toFixed(3))); g2.addColorStop(1,hexA(rc[i],0));
        ctx.fillStyle=g2; ctx.beginPath(); ctx.moveTo(x0+xl,y0); ctx.lineTo(x0+xl+w0,y0);
        ctx.lineTo(x0+(xl+w0)*2.2+sk,y0+len); ctx.lineTo(x0+xl*2.2+sk,y0+len); ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalCompositeOperation='source-over';
  }
  for (i=0;i<trl.length;i++){
    p=trl[i]; q=p.t/p.life;
    if (p.k==='SPARKS'){
      ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=clamp(1-q*0.8,0,1);
      ctx.strokeStyle=p.c; ctx.lineWidth=Math.max(1.5,2.2*pw/PW);
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*0.05,p.y-p.vy*0.05); ctx.stroke();
      ctx.fillStyle='#fff6c8'; ctx.fillRect(p.x-1.2,p.y-1.2,2.4,2.4);
      ctx.globalCompositeOperation='source-over';
    } else if (p.k==='HEARTS'){
      ctx.globalAlpha=clamp(1-q,0,1); lkHeart(p.x,p.y,p.sz*(1+q*0.6),p.c);
    } else if (p.k==='PIXEL'){
      var sz=p.sz*(1+q*1.6); ctx.globalAlpha=clamp((1-q)*0.7,0,1); ctx.fillStyle=p.c; ctx.fillRect(p.x-sz/2,p.y-sz/2,sz,sz);
    } else if (p.k==='GHOST'){
      var gc=trlGhost(); if (!gc) continue;
      var R=p.sz*(1+q*0.8); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=clamp(1-q*0.7,0,1);
      ctx.drawImage(gc,p.x-R,p.y-R,R*2,R*2); ctx.globalCompositeOperation='source-over';
    } else if (p.k==='NOTES'){
      ctx.globalAlpha=clamp(1-q*0.8,0,1); lkNote(p.x+Math.sin(p.t*8+p.w)*pw*0.04,p.y,p.sz,p.c,(i%2)===1);
    }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  ctx.restore();
}

/* ---- the car ---- */
function paintCar(pw,o){
  var ph=pw*0.62, L=o.lk||lookNow();
  var trim=L.trim, light=L.light, paint=L.paint;
  var glow=o.glow||0;

  if (o.aura>0){
    drawAura(pw,ph,o.aura);
  } else if (L.glow==='UNDER'){
    ctx.fillStyle=hexA(light, 0.18+glow*0.36);
    ctx.beginPath(); ctx.ellipse(0,ph*0.10,pw*0.70,ph*0.20+glow*ph*0.16,0,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle=hexA(trim, 0.10+glow*0.30);
    ctx.beginPath(); ctx.ellipse(0,ph*0.10,pw*0.62,ph*0.16+glow*ph*0.16,0,0,Math.PI*2); ctx.fill();
  }
  if (L.spo==='FINS') lkSpoiler(pw,ph,'FINS',paint.b,trim);

  ctx.fillStyle='#07040d';
  rr(-pw*0.54,-ph*0.52,pw*0.14,ph*0.5,pw*0.03); ctx.fill();
  rr( pw*0.40,-ph*0.52,pw*0.14,ph*0.5,pw*0.03); ctx.fill();
  if (L.glow==='RIM'){
    ctx.strokeStyle=light; ctx.lineWidth=Math.max(1.2,pw*0.022); ctx.shadowColor=light; ctx.shadowBlur=blur(pw*0.12);
    rr(-pw*0.56,-ph*0.54,pw*0.18,ph*0.54,pw*0.04); ctx.stroke(); rr(pw*0.38,-ph*0.54,pw*0.18,ph*0.54,pw*0.04); ctx.stroke();
    ctx.fillStyle=light; ctx.fillRect(-pw*0.585,-ph*0.34,pw*0.05,ph*0.12); ctx.fillRect(pw*0.535,-ph*0.34,pw*0.05,ph*0.12);
    ctx.shadowBlur=0;
  }

  lkBodyDraw(pw,ph,L);
  lkBody(pw,ph);
  ctx.lineWidth=Math.max(2.4,pw*0.05); ctx.strokeStyle='#0a0612'; ctx.stroke();      /* build 94: keyline */
  ctx.lineWidth=Math.max(1.4,pw*0.026); ctx.strokeStyle=trim;
  ctx.shadowColor=trim; ctx.shadowBlur=blur(pw*0.17); ctx.stroke(); ctx.shadowBlur=0;

  /* build 94: a dark tinted rear window with one streak of reflection */
  ctx.fillStyle='rgba(14,8,30,.88)'; rr(-pw*0.31,-ph*0.94,pw*0.62,ph*0.34,pw*0.05); ctx.fill();
  ctx.save(); rr(-pw*0.31,-ph*0.94,pw*0.62,ph*0.34,pw*0.05); ctx.clip();
  ctx.fillStyle='rgba(140,215,255,.13)'; ctx.beginPath(); ctx.moveTo(-pw*0.12,-ph*0.94); ctx.lineTo(-pw*0.02,-ph*0.94);
  ctx.lineTo(-pw*0.2,-ph*0.6); ctx.lineTo(-pw*0.3,-ph*0.6); ctx.fill();
  ctx.restore();

  drawEyes(pw,ph,L.eye,o.brake,o.rx);
  rxOverlay(pw,ph,L.eye,o.rx);
  if (L.spo && L.spo!=='FINS') lkSpoiler(pw,ph,L.spo,paint.b,trim);
  drawLightBar(pw,ph,light,L.shape);

  lkTails(pw,ph,L.tail,o.brake);
  lkPlate(pw,ph,L.plate,L.ptxt);
  lkExhaust(pw,ph,L.exh,o.gas);
  rxHeartPop(pw,ph,o.rx,L.shape);
}

function drawPlayerDino(lean){
  var w=DINO_CAR_W*PPU_CAR, h=w*0.72;
  var frame = speed>300 ? 1+((Math.floor(position/700))&1) : 0;
  var t=performance.now();
  var fade = (dinoT<=DINO_WARN && (Math.floor(dinoT*8)%2===0)) ? 0.40 : 1;
  ctx.save();
  ctx.translate(W/2+lean*9 + carRum*RUMBLE_X*Math.sin(shT*71.3),
                PLAYER_Y+(frame===1?-h*0.03:0) + carRum*RUMBLE_Y*Math.sin(shT*103.7+1.9));
  ctx.rotate(spinT>0?spinAng:(-lean*0.05-curSlope*92));
  ctx.globalAlpha=fade*0.30;
  ctx.fillStyle='hsl('+((t/6)%360)+',100%,60%)';
  ctx.beginPath(); ctx.ellipse(0,4,w*0.48,h*0.10,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=fade;
  dinoPath(-w/2,-h,w/24,h/17,frame);
  ctx.shadowColor='hsl('+(((t/6)+180)%360)+',100%,60%)'; ctx.shadowBlur=blur(28);
  ctx.fillStyle=rainbowFill(-w/2,-h,w/2,0,6);
  ctx.fill(); ctx.shadowBlur=0;
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawPlayer(){
  var lean=clamp(steerVel,-1.6,1.6);
  if (dinoT>0){ drawPlayerDino(lean); return; }
  var blink=invT>0&&(Math.floor(invT*12)%2===0);
  var spct=clamp(speed/maxSpeedFor(lap),0,1);

  if (cutCar.alpha<=0.01) return;
  trailDraw();                          /* build 94: under the car, while drifting */
  ctx.save();
  /* Build 71: the drift rumble shakes the car, not the world. About a pixel
     each way at 11-17 Hz while the tyres scream; the road stays still. */
  var rmX=carRum*RUMBLE_X*Math.sin(shT*71.3), rmY=carRum*RUMBLE_Y*Math.sin(shT*103.7+1.9),
      rmR=carRum*RUMBLE_ROLL*Math.sin(shT*83.0+0.4);
  ctx.translate(W/2 + lean*9 + cutCar.x + rmX, PLAYER_Y + cutCar.y + rmY);
  if (cutCar.sc!==1) ctx.scale(cutCar.sc, cutCar.sc);
  ctx.rotate((spinT>0 ? spinAng : (-lean*0.07 - curSlope*92)) + cutCar.tilt + cutCar.spin + rmR);
  ctx.globalAlpha=(blink?0.42:1)*cutCar.alpha;
  var auraOn = odT>0 ? (odT<=DINO_WARN ? (0.45+0.55*Math.abs(Math.sin(odT*9))) : 1) : 0;
  paintCar(PW,{brake:!!keys.down&&spinT<=0, glow:spct, aura:auraOn, rx:rxNow(), gas:!!keys.up});
  if (cutCar.lit>0.01 && ufo){            /* build 83: the beam lights the car */
    var ph8=PW*0.62, lg=ctx.createRadialGradient(0,-ph8*0.55,2,0,-ph8*0.45,PW*0.75);
    lg.addColorStop(0,hexA(ufo.color,(0.42*cutCar.lit).toFixed(3))); lg.addColorStop(1,hexA(ufo.color,0));
    ctx.globalCompositeOperation='lighter'; ctx.fillStyle=lg;
    ctx.fillRect(-PW*0.75,-ph8*1.3,PW*1.5,ph8*1.6);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

function drawBendWarning(){
  var mag=Math.min(1, Math.abs(warnSlope)/S_PEAK);
  if (mag<0.16) return;
  var dir=warnSlope>0?1:-1;
  var n  =mag>0.66?3:(mag>0.38?2:1);
  var col=mag>0.66?'#ff4d6d':(mag>0.38?'#ffd23f':'#21e6ff');
  var y=94;
  ctx.save();
  ctx.globalAlpha=0.45+0.55*mag;
  ctx.strokeStyle=col; ctx.lineWidth=3;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor=col; ctx.shadowBlur=hb(10);
  for (var i=0;i<n;i++){
    var cx=W/2 + dir*(i*14) - dir*((n-1)*14)/2;
    ctx.beginPath();
    ctx.moveTo(cx-dir*5,y-7);
    ctx.lineTo(cx+dir*5,y);
    ctx.lineTo(cx-dir*5,y+7);
    ctx.stroke();
  }
  ctx.restore();
}
function panel(x,y,w,h){
  ctx.fillStyle='rgba(8,4,18,.62)';
  rr(x,y,w,h,6); ctx.fill();
  ctx.strokeStyle='rgba(124,58,237,.55)'; ctx.lineWidth=1; ctx.stroke();
}
function drawHUD(){
  var maxS=maxSpeedFor(lap), spct=clamp(speed/maxS,0,1);
  var kmh=Math.round(speed/40);

  /* The whole top row is the old layout scaled up by 1.2 — panels, labels,
     readouts and bars alike — so the proportions that were tuned on a
     desktop survive intact and only the density changes. The two mini
     panels underneath sit at MICRO rather than LABEL: they are the only
     place in the HUD where a label shares its row with a live countdown,
     and at LABEL the Spanish SOBRECARGA runs straight into its own
     seconds. Widening those two panels would let them join the rest. */
  if (learn) drawLearnPanel();          /* build 72: step counter instead of SCORE / BEST */
  else {
  panel(12,12,224,62);
  monoText(T('SCORE'),24,34,TS.LABEL*UI,'#8a7ec4');
  glowText(pad(score|0,7),24,63,TS.HERO,'#ffffff','left',10);

  var beating = bestAtStart>0 && (score|0)>bestAtStart;
  panel(12,80,224,34);
  /* build 74: a new record turns the whole readout YELLOW. Spanish says only
     RECORD (RECORD + NUEVO collided with the number at the phone's label size). */
  monoText(T('BEST'),24,103,TS.LABEL*UI,beating?'#ffd23f':'#8a7ec4');
  if (beating){
    if (T('NEW')) monoText(T('NEW'),84,103,TS.LABEL*UI,'#ffd23f');
    ctx.globalAlpha=0.74+0.26*Math.abs(Math.sin(performance.now()/300));
    glowText(pad(best,7),226,103,TS.BODY,'#ffd23f','right',15);
    ctx.globalAlpha=1;
  } else {
    glowText(pad(best,7),226,103,TS.BODY,'#a99fdc','right',7);
  }

  }
  panel(W/2-94,12,188,62);
  if (mode==='cruise' || learn){
    monoText(T('LAP'),W/2,34,TS.LABEL*UI,'#8a7ec4','center');
    glowText(String(lap),W/2,63,TS.HERO,'#21e6ff','center',12);
  } else {
    monoText(T('LAP'),W/2-55,34,TS.LABEL*UI,'#8a7ec4','center');
    monoText(T('TIME'),W/2+34,34,TS.LABEL*UI,'#8a7ec4','center');
    glowText(String(lap),W/2-55,63,TS.HERO,'#21e6ff','center',12);
    var low=timeLeft<10;
    var tTxt = timeLeft>=100 ? String(Math.round(timeLeft)) : timeLeft.toFixed(1);
    glowText(tTxt,W/2+34,63,TS.HERO,low?'#ff4d6d':(timeLeft>60?'#21e6ff':'#7cff4f'),'center',low?24:10);
    ctx.fillStyle='rgba(124,58,237,.5)'; ctx.fillRect(W/2-12,26,1,41);
  }

  var slot=80;
  if (dinoT>0){
    var ending = dinoT<=DINO_WARN, beat = (Math.floor(dinoT*6)%2===0);
    panel(W-236,slot,224,34);
    monoText(T('RAMPAGE'),W-226,slot+23,TS.MICRO*UI,ending?(beat?'#ffd23f':'#ff4d6d'):'#7cff4f');
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(W-108,slot+12,84,11);
    ctx.fillStyle = ending ? (beat?'#ffd23f':'#ff4d6d') : rainbowFill(W-108,slot+12,W-24,slot+23,6);
    if (ending){ ctx.shadowColor='#ffd23f'; ctx.shadowBlur=hb(12); }
    ctx.fillRect(W-108,slot+12,84*(dinoT/DINO_TIME),11);
    ctx.shadowBlur=0;
    monoText(dinoT.toFixed(1)+'s',W-118,slot+23,TS.MICRO*UI,ending?'#ffd23f':'#eaf6ff','right');
    slot+=38;
  }
  if (odT>0){
    var oEnd = odT<=DINO_WARN, oBeat = (Math.floor(odT*6)%2===0);
    panel(W-236,slot,224,34);
    monoText(T('OVERDRIVE'),W-226,slot+23,TS.MICRO*UI,oEnd?(oBeat?'#ffd23f':'#ff4d6d'):'#ffd23f');
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(W-98,slot+12,74,11);
    ctx.fillStyle = oEnd&&!oBeat ? '#ff4d6d' : OD_COLS[(Math.floor(performance.now()/110))%OD_COLS.length];
    ctx.shadowColor='#ffd23f'; ctx.shadowBlur=hb(oEnd?14:8);
    ctx.fillRect(W-98,slot+12,74*(odT/OD_TIME),11);
    ctx.shadowBlur=0;
    monoText(odT.toFixed(1)+'s',W-108,slot+23,TS.MICRO*UI,oEnd?'#ffd23f':'#eaf6ff','right');
  }

  panel(W-236,12,224,62);
  monoText(T('SPEED'),W-24,34,TS.LABEL*UI,'#8a7ec4','right');
  glowText(kmh+' km/h',W-24,63,TS.HERO,spct>0.86?'#ff2fbe':'#ffffff','right',12);
  ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(W-224,68,200,5);
  var sg=ctx.createLinearGradient(W-224,0,W-24,0);
  sg.addColorStop(0,'#21e6ff'); sg.addColorStop(0.7,'#ff2fbe'); sg.addColorStop(1,'#ffd23f');
  ctx.fillStyle=sg; ctx.fillRect(W-224,68,200*spct,5);

  /* CHAIN — only on screen while one is alive, and it drains visibly so you
     can see exactly how long you have to find the next gap. */
  if (chain>0){
    var cf=clamp(chainT/NM_CHAIN_T,0,1);
    var ccol = chain>=10 ? '#ff2fbe' : (chain>=5 ? '#ffd23f' : '#7cff4f');
    panel(16,120,206,41);
    monoText(T('NEARMISS'),26,137,TS.LABEL*UI,'#8a7ec4');
    glowText('x'+chain,212,147,TS.HERO,ccol,'right',12);
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(26,150,120,5);
    ctx.fillStyle=ccol; ctx.shadowColor=ccol; ctx.shadowBlur=hb(8);
    ctx.fillRect(26,150,120*cf,5); ctx.shadowBlur=0;
  }

  /* -----------------------------------------------------------------
     BOTTOM ROW — two stacked pairs instead of one crowded strip.
     Left:  DRIFT over SHOTS.   Right: HULL over NEXT CHECKPOINT.
     Every column stays inside 220px so nothing lands on the player
     sprite, which spans roughly x=300..500 once you are the dinosaur.
     ----------------------------------------------------------------- */
  /* The four bottom tags are the mechanic readouts you steer by -- drift,
     shots, hull, checkpoint -- not stats like PUNTOS and VELOCIDAD, so on a
     desktop they take HERO, one step above the label row. That is deliberate
     hierarchy, not the old mismatch: the old 22 was a hand-tuned number, this
     is a step off the scale. On touch they stay exactly where the scale put
     them (LABEL * UI), which is the size that reads correctly on a phone. */
  /* The bottom row is live telemetry -- drift charge, ammo, hull, distance to
     the next checkpoint. On the title screen every one of them is a placeholder
     for a run that has not started, and they sat behind the menu as four big
     words competing with it (DISPAROS and PROX. VUELTA landed straight on the
     key legend). Nothing here is readable-but-idle; it is simply not yet true,
     so it is not drawn. The top row stays: the record on it is real. */
  if (state!=='title'){
    var BTAG = TOUCH ? TS.LABEL*UI : TS.HERO;

    /* Drift charge. Cyan is banked and safe; amber is still at risk in the drift
       you are in, so the cost of crashing out of it is on screen. */
    hudTag(T('DRIFTM'),16,394,BTAG,dPot>0?'#ffd23f':'#b9aef0');
    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(16,400,200,13);
    var wB=200*clamp(dBank,0,1), wP=200*clamp(dPot,0,1-dBank);
    if (wB>0){
      ctx.fillStyle='#21e6ff'; ctx.shadowColor='#21e6ff'; ctx.shadowBlur=hb(10);
      ctx.fillRect(16,400,wB,13); ctx.shadowBlur=0;
    }
    if (wP>0){ ctx.fillStyle='#ffd23f'; ctx.fillRect(16+wB,400,wP,13); }
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1;
    ctx.strokeRect(16.5,400.5,199,12);

    hudTag(odT>0?T('UNLIMITED'):T('SHOTS'),16,444,BTAG,
           odT>0?'#ffd23f':(shots>0?'#21e6ff':'#b9aef0'));
    var BS=1.5, ky=450;
    for (var k=0;k<MAX_SHOTS;k++){
      var kx=16+k*30;
      if (odT>0 || k<shots){
        var gc = odT>0 ? OD_COLS[(k+Math.floor(performance.now()/110))%OD_COLS.length] : '#21e6ff';
        ctx.shadowColor=gc; ctx.shadowBlur=hb(12); ctx.fillStyle=gc;
        ctx.beginPath();
        ctx.moveTo(kx+9*BS,ky);        ctx.lineTo(kx+15*BS,ky);
        ctx.lineTo(kx+10*BS,ky+7*BS);  ctx.lineTo(kx+14*BS,ky+7*BS);
        ctx.lineTo(kx+4*BS,ky+17*BS);  ctx.lineTo(kx+8*BS,ky+8*BS);
        ctx.lineTo(kx+4*BS,ky+8*BS);
        ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
      } else {
        ctx.strokeStyle='rgba(255,255,255,.24)'; ctx.lineWidth=1.5;
        ctx.strokeRect(kx+4*BS+0.5,ky+0.5,11*BS,17*BS);
      }
    }
    ctx.lineWidth=1;

    /* Hull moves over to the right column so drift can sit above shots on the
       left. In cruise there is no hull, and nothing takes its place: what
       cruise means is explained on the title screen, and repeating it as a
       standing caption over live gameplay was noise, not information. */
    if (mode!=='cruise' && !learn){
      hudTag(T('HULL'),W-16,394,BTAG,'#b9aef0','right');
      var hpMax=CH_().hp, hx0=W-16-(hpMax*34-6);
      for (var i=0;i<hpMax;i++){
        var bx=hx0+i*34;
        if (i<health){
          var col=health===1?'#ff4d6d':(health===2?'#ffd23f':'#7cff4f');
          ctx.shadowColor=col; ctx.shadowBlur=hb(14); ctx.fillStyle=col;
          ctx.fillRect(bx,400,28,15); ctx.shadowBlur=0;
        } else {
          ctx.strokeStyle='rgba(255,255,255,.24)'; ctx.lineWidth=1.5;
          ctx.strokeRect(bx+0.5,400.5,27,14);
        }
      }
      ctx.lineWidth=1;
    }

    var barW=200, bx2=W-barW-16, by=452;
    hudTag(T('NEXT_CP'),W-16,444,BTAG,'#b9aef0','right');
    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(bx2,by,barW,13);
    ctx.fillStyle='#7cff4f'; ctx.shadowColor='#7cff4f'; ctx.shadowBlur=hb(8);
    ctx.fillRect(bx2,by,barW*clamp((position+Z_CAR-cpStart)/cpLen,0,1),13);
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(124,255,79,.65)'; ctx.lineWidth=1;
    /* This outline used to sit OUTSIDE the `state!=='title'` block that
       build 57 wrapped around the bottom HUD row, while the three values it
       reads are declared inside it. `var` hoisting meant that on the title
       screen it stroked a rectangle of NaN every frame — invisible, but a
       real stray draw call. Caught headless; the fix is the brace it should
       always have been inside. */
    ctx.strokeRect(bx2+0.5,by+0.5,barW-1,12);
  }

  if (state==='playing') drawBendWarning();

  if (Math.abs(playerX)>1 && state==='playing' && Math.floor(performance.now()/220)%2===0)
    glowText(T('OFF_ROAD'),W/2,H-72,TS.HERO,'#ffd23f','center',18);

  /* On the title the card is drawn by render() after drawTitle() instead
     (build 69), so a sound change made there reads on top, not behind. */
  if (state!=='title') drawMessages();
}

}

  var g=ctx.createLinearGradient(cx,cy-sz,cx,cy+sz);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.5,'#8ef4ff'); g.addColorStop(1,'#21e6ff');
  ctx.shadowColor='#21e6ff'; ctx.shadowBlur=hb(10);
  ctx.beginPath();
  for (var i=0;i<BOLT.length;i++){
    var px=cx+BOLT[i][0]*sz*0.78, py=cy+BOLT[i][1]*sz*0.62;
    if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
}
/* The hazard triangle. It carries the whole "something new is on the road"
   message on its own, which is the point — the words next to it never need to
   be longer than two. */
function iconWarn(cx,cy,sz){
  var r=sz*0.66;
  ctx.shadowColor='#ffd23f'; ctx.shadowBlur=hb(10);
  ctx.beginPath();
  ctx.moveTo(cx, cy-r);
  ctx.lineTo(cx+r*0.98, cy+r*0.74);
  ctx.lineTo(cx-r*0.98, cy+r*0.74);
  ctx.closePath();
  ctx.fillStyle='#ffd23f'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#1a0f00';                     /* the bang, knocked out */
  ctx.fillRect(cx-r*0.12, cy-r*0.30, r*0.24, r*0.62);
  ctx.beginPath(); ctx.arc(cx, cy+r*0.53, r*0.14, 0, Math.PI*2); ctx.fill();
}
/* Top speed went up. An arrow, because "TOP SPEED UP" was a whole line of
   banner for one bit of information. */
function iconSpd(cx,cy,sz){
  var r=sz*0.62;
  ctx.shadowColor='#7cff4f'; ctx.shadowBlur=hb(8);
  ctx.beginPath();
  ctx.moveTo(cx, cy-r);
  ctx.lineTo(cx+r*0.86, cy+r*0.26);
  ctx.lineTo(cx+r*0.33, cy+r*0.26);
  ctx.lineTo(cx+r*0.33, cy+r*0.80);
  ctx.lineTo(cx-r*0.33, cy+r*0.80);
  ctx.lineTo(cx-r*0.33, cy+r*0.26);
  ctx.lineTo(cx-r*0.86, cy+r*0.26);
  ctx.closePath();
  ctx.fillStyle='#7cff4f'; ctx.fill();
  ctx.shadowBlur=0;
}
/* Every icon function takes a different `sz` to mean a different thing: the
   dinosaur draws 2.00 units wide for sz=1, the bolt only 0.95 and 1.24 tall.
   Passing them all the same number put the dinosaur at double everyone else's
   size, overflowing its slot and landing on the row below. This table is each
   icon's largest drawn dimension per unit of sz, so drawIcon can take a BOX —
   the square the icon must fit inside — and every kind ends up the same
   visual weight. Measure a new icon and add it here; do not eyeball it. */
var ICON_UNIT = { heart:1.26, bolt:1.24, warn:1.29, spd:1.12, dino:1.85 };
function drawIcon(kind,x,y,box){
  var sz = box / (ICON_UNIT[kind] || 1.30);
  if      (kind==='heart') iconHeart(x,y,sz);
  else if (kind==='bolt')  iconBolt(x,y,sz);
  else if (kind==='warn')  iconWarn(x,y,sz);
  else if (kind==='spd')   iconSpd(x,y,sz);
  else                     iconDino(x,y,sz);
}

/* Lap banners used to be loose glowing text that washed out against the road.
   They now sit in one bordered box — and the box is fitted to the stage rather
   than trusting the strings inside it to stay short. Two hard limits, because
   this 800x500 canvas is squeezed into ~360px of phone glass and the horizon
   sits at y=212:
     WIDTH  — never more than half the road (MSG_MAXW).
     HEIGHT — the bottom edge never passes MSG_FLOOR, which is above the
              horizon. A banner cannot hide traffic you are closing on.
   Both are enforced by scaling the whole card, so a long translation shrinks
   rather than spills. One measure pass, one correction pass: every dimension
   is linear in the scale, so the correction is exact and needs no search.

   The chip icons are deliberately oversized — CHIP_ICON below is close to
   double the label's own size — because they are read peripherally at 300 km/h,
   not looked at. The row therefore carries its own line height (CHIP_LH) rather
   than sharing the text lines'; the count next to each icon stays small, so
   growing the picture costs almost no width. */
var MSG_TOP   = 104;    /* clears the bend-warning chevrons, which sit at y=94 */
var MSG_FLOOR = 207;    /* ...and stays above the horizon at y=212 */
var CHIP_BOX  = 2.30;   /* icon box as a share of the chip row's unit    */
var CHIP_SLOT = 1.16;   /* ...the horizontal slot it gets, box-relative  */
var CHIP_LH   = 1.32;   /* ...and the row height it sits in, box-relative */
var CHIP_NUM  = 1.60;   /* count text ("x3") as a share of the row unit      */
function drawMessages(){
  if (!msgs.length){ msgBox = null; return; }
  var i, j, alpha=0, MSG_MAXW=W*0.52;

  function layout(sc){
    var a, b, lines=[], wmax=0, tot=0, pad=Math.round(18*sc);
    for (a=0;a<msgs.length;a++){
      var m=msgs[a], fs, w=0, parts=null, lh, box=0;
      if (m.chips){
        fs=Math.max(9,Math.round(16*sc));
        box=fs*CHIP_BOX; lh=box*CHIP_LH;
        /* Two label sizes, on purpose. A COUNT is a number you read at a glance
           next to its icon — "three hearts this leg" — so it is set at roughly
           twice the old size and now carries about the same weight as the icon
           beside it. A WORD label (only SPD/VEL) stays small: doubling that one
           would make a caption shout louder than the pickups it sits among. */
        var lf=Math.max(12,Math.round(fs*CHIP_NUM));
        var lw=Math.max(8, Math.round(fs*0.80));
        parts=[];
        for (b=0;b<m.chips.length;b++){
          var ch=m.chips[b];
          var txt = ch.label ? ch.label : (ch.n>1 ? 'x'+ch.n : '');
          var pf  = ch.label ? lw : lf;
          ctx.font='800 '+pf+'px "Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif';
          var tw  = txt ? ctx.measureText(txt).width+fs*0.18 : 0;
          parts.push({icon:ch.icon, txt:txt, iw:box*CHIP_SLOT, tw:tw, lf:pf});
          w += box*CHIP_SLOT + tw + (b<m.chips.length-1 ? fs*0.42 : 0);
        }
      } else {
        fs=Math.max(9,Math.round((m.big?TS.BODY:TS.LABEL)*sc));
        lh=fs*1.32; box=fs*1.90;
        ctx.font='700 '+fs+'px "Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif';
        w=ctx.measureText(m.t).width + (m.icon?box*1.16:0);
      }
      lines.push({m:m, fs:fs, w:w, parts:parts, lh:lh, box:box});
      if (w>wmax) wmax=w;
      tot += lh;
    }
    return {lines:lines, bw:wmax+pad*2, bh:tot+pad, pad:pad};
  }

  /* Same size on phone and desktop now. The icons exist to be caught in
     peripheral vision, which is exactly where the small screen needs them
     most; the width cap and the floor are what keep the card honest. */
  var base = 1;
  var lay  = layout(base);
  var k    = Math.min(1, MSG_MAXW/lay.bw, (MSG_FLOOR-MSG_TOP)/lay.bh);
  if (k < 0.995) lay = layout(base*k);

  for (i=0;i<msgs.length;i++) alpha=Math.max(alpha, clamp(msgs[i].life/0.55,0,1));

  var bw=lay.bw, bh=lay.bh, bx=(W-bw)/2, by=MSG_TOP;
  msgBox = [bx, by, bw, bh];                     /* build 79: the tutorial's dim leaves this rectangle alone */

  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(8,4,18,.86)';
  rr(bx,by,bw,bh,10); ctx.fill();
  ctx.lineWidth=3.5; ctx.strokeStyle=msgs[0].c;
  ctx.shadowColor=msgs[0].c; ctx.shadowBlur=hb(18);
  rr(bx,by,bw,bh,10); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.16)';
  rr(bx+5,by+5,bw-10,bh-10,7); ctx.stroke();

  /* Rows are laid out from their own centre line, not from a shared baseline —
     the chip row is twice the height of a text row, so a common baseline would
     hang the icons off the top of it. */
  var y=by+lay.pad*0.5;
  for (i=0;i<lay.lines.length;i++){
    var ln=lay.lines[i], mm=ln.m, mid=y+ln.lh*0.5;
    ctx.globalAlpha=alpha*clamp(mm.life/0.55,0,1);
    if (ln.parts){
      var px=W/2-ln.w/2;
      for (j=0;j<ln.parts.length;j++){
        var p=ln.parts[j];
        drawIcon(p.icon, px+p.iw/2, mid, ln.box);
        px += p.iw;
        if (p.txt){
          glowText(p.txt, px, mid+p.lf*0.36, p.lf, mm.c, 'left', 10, '800');
          px += p.tw;
        }
        px += ln.fs*0.42;
      }
    } else {
      var tx=W/2, cy=mid+ln.fs*0.36;
      if (mm.icon){
        drawIcon(mm.icon, W/2-ln.w/2+ln.box*0.58, mid, ln.box);
        tx=W/2+ln.box*0.58;
      }
      glowText(mm.t,tx,cy,ln.fs,mm.c,'center',14);
    }
    y += ln.lh;
  }
  ctx.restore();
  ctx.globalAlpha=1;
}
