/* TITLE FOOTER PLATE.
   Two facts used to whisper down here as separate 11px captions -- your record
   and whether progress is being kept -- the second of them at #4e4677, which
   over this background is very close to invisible. They are one object now,
   not two strays: a panel in the same style as the HUD readouts, so it reads
   as part of the game rather than as a disclaimer.

   Inside it, the hierarchy does the work the old colour could not. The word
   RECORD stays small and quiet because it is a caption; the NUMBER is the
   thing you came to see, so it takes the display face, the LABEL step and the
   amber this game already uses for "you earned something". The save state
   stops being a sentence and becomes what it actually is -- a status light:
   a green dot when storage works, amber when it does not.

   Width is measured, never fixed. RECORD/RÉCORD and SAVED/GUARDADO differ in
   length, and a hard-coded box would clip one language or float in the other. */
function titleFooter(){
  var LF = TS.MICRO*UI, NF = TS.LABEL*UI;
  var rLab = T('BEST_LINE').replace(/\s+$/,'');
  var rNum = best>0 ? String(best) : null;
  var tag  = saveOK ? T('SAVE_TAG_ON') : T('SAVE_TAG_OFF');
  var dot  = saveOK ? '#7cff4f' : '#ffd23f';

  ctx.font='700 '+LF+'px ui-monospace,Menlo,"Courier New",monospace';
  var wLab = rNum ? ctx.measureText(rLab).width : 0;
  var wTag = ctx.measureText(tag).width;
  ctx.font='700 '+NF+'px "Arial Black","VL Display","Segoe UI",Impact,system-ui,sans-serif';
  var wNum = rNum ? ctx.measureText(rNum).width : 0;

  var GAP=9, SEP=16, DOT=7, PADX=16, PH=28, y=452;
  var inner = (rNum ? wLab+GAP+wNum+SEP : 0) + DOT+GAP+wTag;
  var w = inner+PADX*2, x = W/2-w/2, cy = y+PH/2;
  /* One shared baseline for both sizes -- they sit on a line together, the
     way type does; centring each on its own box would stagger them. */
  var base = cy + Math.round(NF*0.35);

  panel(x,y,w,PH);
  var cx = x+PADX;
  if (rNum){
    monoText(rLab,cx,base,LF,'#a99fdc');            cx += wLab+GAP;
    glowText(rNum,cx,base,NF,'#ffd23f','left',12);  cx += wNum;
    ctx.fillStyle='rgba(124,58,237,.75)';
    ctx.fillRect(Math.round(cx+SEP/2)+0.5,y+7,1,PH-14);
    cx += SEP;
  }
  ctx.fillStyle=dot; ctx.shadowColor=dot; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(cx+DOT/2,cy,DOT/2,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  cx += DOT+GAP;
  monoText(tag,cx,base,LF,'#cfd6ff');

  /* The failure case is a warning, not a caption: storage is blocked and the
     run you are about to do will not be kept. It gets the whole sentence, in
     amber, under the plate. The old build put it at #6b5a1e. */
  if (!saveOK) monoText(T('SAVED_OFF'),W/2,494,LF,'#ffd23f','center');
}

/* The keyboard shortcuts, as caps rather than as one run-on line (five from
   build 68: M MUSIC/SOUND joined, so the sound setting is findable without
   opening HOW IT WORKS).
   Laid out by measurement rather than by fixed columns: the labels differ in
   length between English and Spanish, and hard-coded x positions drifted
   apart the moment either string changed. */
function titleKeys(cru){
  /* build 75 (Carlos's pick B): two side columns instead of one row of six.
     Play keys bottom-left, TUTORIAL on top; settings bottom-right. Mirrors the
     phone, where the run actions are slabs on the left and settings are tiles
     on the right. The centre (hints, PRESS ENTER, record plate) is untouched. */
  var sz=26, fs=TS.LABEL, pad=sz*0.32, i, rw=0, ROW=34, Y0=376, EDGE=22;
  var play=[['T',T('TF_LEARN')],['C',cru?T('MODE_RUN'):T('MODE_CRUISE')],['G',T('TF_GARAGE')]];
  var sets=[['I',T('TF_INFO')],['M',T('TF_SOUND')],['L',T('TF_LANG')]];
  ctx.font='700 '+fs+'px ui-monospace,Menlo,"Courier New",monospace';
  function wOf(it){ return sz+pad+ctx.measureText(it[1]).width; }
  for (i=0;i<sets.length;i++) rw=Math.max(rw,wOf(sets[i]));
  var tw=wOf(play[0]);
  for (i=0;i<3;i++){
    keyCap(EDGE,Y0+i*ROW,sz,play[i][0],play[i][1],fs);
    keyCap(W-EDGE-rw,Y0+i*ROW,sz,sets[i][0],sets[i][1],fs);
    ctx.font='700 '+fs+'px ui-monospace,Menlo,"Courier New",monospace';
  }
  garTitleNew(EDGE, Y0+2*ROW, sz, play[2][1], fs, pad);   /* build 97 */
  tutKeyBox={x:EDGE, y:Y0, w:tw, sz:sz};
}

/* build 74 (75: above the left column): NEW HERE? over the T TUTORIAL key, with a bobbing arrow pointing
   down at it. Anchored to the key's measured box, so it follows any footer
   layout. Kept inside the stage at both ends. */
var tutKeyBox=null;
function newHereDesk(){

  var tw=ctx.measureText(txt).width;
  cx=Math.max(10+tw/2, Math.min(W-10-tw/2, cx));
  var bob=Math.sin(t/260)*2.2, pulse=0.72+0.28*Math.abs(Math.sin(t/520));
  var ay=b.y-4+bob;                      /* arrow tip, just above the key */
  ctx.globalAlpha=pulse;
  glowText(txt,cx,ay-15,fs,'#7cff4f','center',16,'900');
  ctx.fillStyle='#7cff4f'; ctx.shadowColor='#7cff4f'; ctx.shadowBlur=hb(12);
  ctx.beginPath(); ctx.moveTo(cx-8,ay-10); ctx.lineTo(cx+8,ay-10); ctx.lineTo(cx,ay); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0; ctx.globalAlpha=1;
}

/* Reference sheet, opened on demand — the title screen stays sparse so the
   rest is still yours to find out on the road.

   Two columns on a desktop. On a phone the canvas is still 800 logical px
   wide but lands on ~380 physical ones, so 11px type arrived at about five
   real pixels. Touch therefore gets one full-width column at nearly double
   the size, split across three pages rather than shrunk to fit. */

/* An amber van, as seen from behind on the road, with its blinker
   alternating sides so the icon reads as "this one changes lane". */
function iconVan(cx,cy,w){
  var vh=w*0.94, x=cx-w/2, yb=cy+vh/2;
  ctx.fillStyle='#171019';
  rr(x,yb-vh,w,vh,w*0.09); ctx.fill();
  ctx.lineWidth=Math.max(1,w*0.055); ctx.strokeStyle='#ffd23f'; ctx.stroke();
  ctx.fillStyle='rgba(160,205,255,.16)';
  rr(cx-w*0.36,yb-vh*0.93,w*0.72,vh*0.24,w*0.05); ctx.fill();
  var on=(Math.floor(performance.now()/230)%2)===0;
  if (on){ ctx.shadowColor='#ffd23f'; ctx.shadowBlur=w*0.5; }
  ctx.fillStyle=on?'#ffe98a':'#6b5a1e';
  ctx.fillRect(cx-w*0.32,yb-vh-w*0.11,w*0.64,w*0.10);
  ctx.shadowBlur=0;
  var side=(Math.floor(performance.now()/1500)%2)===0?1:-1;
  if ((Math.floor(performance.now()/105)%2)===0){
    ctx.fillStyle='#ff9b1a'; ctx.shadowColor='#ff9b1a'; ctx.shadowBlur=w*0.5;
    ctx.fillRect(side>0?cx+w*0.34:cx-w*0.50, yb-vh*0.50, w*0.16, vh*0.16);
    ctx.shadowBlur=0;
  }
  ctx.shadowColor='#ff2b2b'; ctx.shadowBlur=w*0.3;
  ctx.fillStyle='#ff4747';
  ctx.fillRect(cx-w*0.42,yb-vh*0.28,w*0.18,vh*0.11);
  ctx.fillRect(cx+w*0.24,yb-vh*0.28,w*0.18,vh*0.11);
  ctx.shadowBlur=0;
}

/* The three shot lights exactly as the HUD cycles them under overdrive.
   Returns the width it used so text can sit after it. */
function odPips(x,y,s){
  for (var k=0;k<MAX_SHOTS;k++){
    var kx=x+k*20*s;
    var gc=OD_COLS[(k+Math.floor(performance.now()/110))%OD_COLS.length];
    ctx.shadowColor=gc; ctx.shadowBlur=10*s; ctx.fillStyle=gc;
    ctx.beginPath();
    ctx.moveTo(kx+9*s,y);      ctx.lineTo(kx+15*s,y);
    ctx.lineTo(kx+10*s,y+7*s); ctx.lineTo(kx+14*s,y+7*s);
    ctx.lineTo(kx+4*s,y+17*s); ctx.lineTo(kx+8*s,y+8*s);
    ctx.lineTo(kx+4*s,y+8*s);
    ctx.closePath(); ctx.fill();
  }
  ctx.shadowBlur=0;
  return MAX_SHOTS*20*s;
}

/* A keyboard cap: rounded square, letter inside, caption to the right. */
function keyCap(x,y,sz,letter,label,fs){
  ctx.fillStyle='rgba(33,230,255,.10)';
  rr(x,y,sz,sz,sz*0.22); ctx.fill();
  ctx.lineWidth=Math.max(1.5,sz*0.07); ctx.strokeStyle='#21e6ff';
  ctx.shadowColor='#21e6ff'; ctx.shadowBlur=8;
  rr(x,y,sz,sz,sz*0.22); ctx.stroke();
  ctx.shadowBlur=0;
  if (letter==='I') serifI(x+sz/2,y+sz/2,sz);
  else glowText(letter,x+sz/2,y+sz*0.72,sz*0.54,'#eaf6ff','center',6);
  monoText(label,x+sz+sz*0.32,y+sz*0.68,fs,'#cfd6ff');
}
/* The I key-cap's glyph, drawn rather than typed (build 64). In the display
   face an I is a bare vertical bar that reads as a 1 or an l at 26px; the
   old desktop legend under the stage showed a monospace I with a bar top
   and bottom, which is what an I key looks like. Drawn from rectangles so it
   is identical on every device, whatever fonts it has. Near-white with the
   same cyan glow the legend's CSS text-shadow had. */
function serifI(cx,cy,sz){
  var h=sz*0.42, bw=sz*0.32, bt=Math.max(1.5,sz*0.085), sw=Math.max(1.5,sz*0.11);
  ctx.fillStyle='#eaf6ff';
  ctx.shadowColor='rgba(33,230,255,.9)'; ctx.shadowBlur=6;
  ctx.fillRect(cx-sw/2, cy-h/2, sw, h);          /* stem */
  ctx.fillRect(cx-bw/2, cy-h/2, bw, bt);         /* top bar */
  ctx.fillRect(cx-bw/2, cy+h/2-bt, bw, bt);      /* bottom bar */
  ctx.shadowBlur=0;
}

function infoHead(x,y,head,col,fs){

  ctx.fillRect(x,y+fs*0.26,w,Math.max(2,fs*0.08));
  ctx.globalAlpha=1;
}

  if (note) monoText(note, bx+bw+(TOUCH?36:12), yy+13, TS.MICRO, plateMsgT>0?'#ff6ad5':'#8a7ec4');
}

/* ---------------------------------------------------------------
   BUILD 97: THE A SHOWROOM GARAGE (garage step 3 of 3)
   Replaces build 94's temporary 16-row screen. The car stands big on a
   turntable; you pick a CATEGORY (tabs), then a PART inside it (chips, only
   when the category has more than one), then an ITEM (cards, or LEFT / RIGHT).
   GROWS (build 94) stays the data: garRow is still the row being edited, so
   the locks (build 96), the trail preview and the plate box keep working.
     - locked items: dimmed card + lock watermark + progress bar; a lock
       watermark over the turntable car too; try on yes, race no (96's rules).
     - NEW: on every item never STOPPED ON (shown on the turntable for
       GAR_DWELL s; scrolling past doesn't count) and on every new unlock.
       A slow-pulsing NEW tag on the category tabs and the title's GARAGE.
     - a check mark on the item you will race with; OWNED on earned items.
     - TRAIL: the car drives on the stage, 3 s drive / 1 s drift left /
       3 s drive / 1 s drift right.
     - saved slots 1 2 3: look-only toggle (tap again = your build back),
       DRIVE races the shown slot, SAVE then pick a slot (overwrite check).
       Slots and the build in progress are in the save (gs).
     - RANDOM (owned items only) and PHOTO (a 1080 x 1080 PNG).
   Three layouts of the same screen: 'desk' (all on the stage, keys + mouse),
   'land' (phone sideways: cards on the stage, tabs and tools in the side
   strips) and 'port' (phone upright: the stage shows the car, everything
   else is HTML under it).
--------------------------------------------------------------- */
var GCATS=[
  {id:'paint',  lab:'GC_PAINT',   rows:['paint','fin','trim'],
   ic:'M4 4.5h12.5v5H4zM16.5 7h3v6.2h-8v2.6M10 15.8h3v4.7h-3z'},
  {id:'livery', lab:'GC_LIVERY',  rows:['liv','livc'],          /* build 101: own colour row (was the shared 'light') */
   ic:'M3.5 6h17v12h-17zM9 6v12M14.5 6l-3.5 12M20.5 10l-6 8'},
  {id:'parts',  lab:'GC_PARTS',   rows:['spo','tail','exh','glow','plate','ptxt'],
   ic:'M15 4.2a4.3 4.3 0 0 0-5.4 5.4L3.8 15.4l3 3 5.8-5.8a4.3 4.3 0 0 0 5.4-5.4l-2.7 2.7-2.8-.6-.6-2.8z'},
  {id:'topper', lab:'GC_TOPPER',  rows:['shape','light'],
   ic:'M12 3.5l5.5 13h-11zM3.5 20h17M12 3.5v-1'},
  {id:'face',   lab:'GC_FACE',    rows:['eye','react'],
   ic:'M5 11.5a3 3 0 1 0 6 0a3 3 0 1 0-6 0zM13 11.5a3 3 0 1 0 6 0a3 3 0 1 0-6 0zM8.5 17.5h7'},
  {id:'trail',  lab:'GC_TRAIL',   rows:['trail'],
   ic:'M3 7.5h12M3 12h16M3 16.5h9M17 7.5h1.5M14 16.5h2'},
  {id:'chassis',lab:'GC_CHASSIS', rows:['chassis'],
   ic:'M3.5 17.5a8.5 8.5 0 0 1 17 0M12 17.5l4.6-5.2M2.5 17.5h19'}
];
var GAR_DWELL=0.45;                          /* seconds on the turntable before an item counts as seen */
var GAR_LOOK_KEYS=['trim','light','paint','shape','eye','fin','liv','spo','tail','plate','exh','glow','trail','chassis','livc'];
var GROW_BY={};                              /* row id -> its GROWS index */
(function(){ for (var i=0;i<GROWS.length;i++) GROW_BY[GROWS[i].id]=i; })();
var garCat=0, garPart=0, garPartMem=[0,0,0,0,0,0,0];
var garSlots=[null,null,null], garSlotOn=0, garWip=null;   /* the slots, the one showing, the build underneath */
var garOwnWip=null;                          /* the build underneath's last owned items (a slot shown doesn't change them) */
var garPick=false, garOw=0;                  /* SAVE: choosing a slot; the full slot waiting for "again" */
var garMsg='', garMsgT=0, garDw={k:'',t:0}, garLean=0, garTrlTgt=0;
var garHits=[], garPlateBox={x:300,y:370,w:200,h:40}, garIconP={};
var garCar={x:W/2, y:256, pw:150};
garRow=GROW_BY.paint;

/* ---- which part, which category ---- */
function garSyncCat(){                       /* garRow is the truth (tests and old code set it) */
  var id=(GROWS[garRow]||GROWS[0]).id, c=GCATS[garCat];
  if (!c || c.rows.indexOf(id)<0){
    for (var i=0;i<GCATS.length;i++) if (GCATS[i].rows.indexOf(id)>=0){ garCat=i; break; }
  }
  garPart=Math.max(0, GCATS[garCat].rows.indexOf(id));
  garPartMem[garCat]=garPart;
}
function garDropLocked(){                    /* build 98: a locked item is a preview of the part you're on only */
  if (garSlotOn || !garLooseLocked()) return;
  prEnforce(); saveGame();
}
function garCatGo(c){
  c=(c+GCATS.length)%GCATS.length;
  if (garPick){ garPick=false; garOw=0; }
  garDropLocked();
  garCat=c; garPart=Math.min(garPartMem[c]||0, GCATS[c].rows.length-1);
  garRow=GROW_BY[GCATS[c].rows[garPart]];
  blip(520,0.05,'square',0.10);
}
function garPartGo(p){
  var rows=GCATS[garCat].rows; p=(p+rows.length)%rows.length;
  garDropLocked();
  garPart=p; garPartMem[garCat]=p; garRow=GROW_BY[rows[p]];
  blip(520,0.05,'square',0.10);
}
function garOpen(from){
  garFrom=from; state='garage'; garPick=false; garOw=0; garMsgT=0; garDw.k='';
  prGarEnter(); garSyncCat();
  if (GROWS[garRow].id==='ptxt'){ garPart=GCATS[garCat].rows.indexOf('plate'); garPartMem[garCat]=garPart; garRow=GROW_BY.plate; }   /* never open typing */
}

/* ---- the look as names (slots, the build in progress) ---- */
function garLookGet(){
  var o={}, i, row;
  for (i=0;i<GAR_LOOK_KEYS.length;i++){ row=GROWS[GROW_BY[GAR_LOOK_KEYS[i]]]; o[row.id]=row.list[row.get()].n; }
  o.ptxt=plateTxt; return o;
}
function garLookPut(o){
  if (!o) return;
  for (var i=0;i<GAR_LOOK_KEYS.length;i++){
    var row=GROWS[GROW_BY[GAR_LOOK_KEYS[i]]], v=o[row.id];
    if (row.id==='livc' && typeof v!=='string') v=o.light;      /* build 101 */
    if (typeof v!=='string') continue;
    var j=pickName(v,row.list,-1); if (j>=0) row.set(j);
  }
  var pt=plClean(o.ptxt); plateTxt=plateBad(pt)?'':pt;
  garOwnNote();
}
function garOwnNote(){                       /* what is worn now counts as the last owned, where it is owned */
  for (var i=0;i<GAR_LOOK_KEYS.length;i++){
    var row=GROWS[GROW_BY[GAR_LOOK_KEYS[i]]], j=row.get();
    if (prRowOwned(row,j)) garOwn[row.id]=j;
  }
}
function garWornIdx(row){                    /* the item you would race with in this row */
  var j=row.get(); if (row.id==='react' || prRowOwned(row,j)) return j;
  var o=garOwn[row.id]; return (typeof o==='number' && o>=0 && o<row.list.length && prRowOwned(row,o)) ? o : 0;
}
function garStrip(o){                        /* a slot never keeps a locked item */
  var cut=0;
  for (var i=0;i<GAR_LOOK_KEYS.length;i++){
    var row=GROWS[GROW_BY[GAR_LOOK_KEYS[i]]], j=pickName(o[row.id],row.list,0);
    if (!prRowOwned(row,j)){ o[row.id]=row.list[garWornIdx(row)].n; cut++; }
  }
  return cut;
}
function garLooseLocked(){                   /* is the car on the stage wearing anything it can't race? */
  for (var i=0;i<GAR_LOOK_KEYS.length;i++){ var row=GROWS[GROW_BY[GAR_LOOK_KEYS[i]]]; if (!prRowOwned(row,row.get())) return true; }
  return false;
}

/* ---- NEW ---- */
function garNewIt(rowId,item){ return rowId!=='react' && !PR.seen[prKey(rowId,item.n)]; }
function garRowNew(id){
  var row=GROWS[GROW_BY[id]]; if (!row || !row.list || id==='react') return false;
  for (var i=0;i<row.list.length;i++) if (!PR.seen[prKey(id,row.list[i].n)]) return true;
  return false;
}
/* build 99: does the car differ from the stock look in this row / category? (the green dot) */
var GAR_STOCK={trim:0, light:1, livc:1, paint:8, shape:0, eye:0, chassis:0};   /* a brand-new player's look; other rows: item 0 */
function garRowMod(id){
  if (id==='react') return false;            /* a switch, not a design */
  if (id==='ptxt') return !!plateTxt;
  var row=GROWS[GROW_BY[id]]; if (!row || !row.list) return false;
  var st=GAR_STOCK.hasOwnProperty(id) ? GAR_STOCK[id] : 0;
  return garWornIdx(row)!==st;
}
function garCatMod(c){ var r=GCATS[c].rows; for (var i=0;i<r.length;i++) if (garRowMod(r[i])) return true; return false; }
function garModDot(x,y,r){
  ctx.save(); ctx.fillStyle='#7cff4f'; ctx.shadowColor='#7cff4f'; ctx.shadowBlur=hb(6);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.lineWidth=1.2; ctx.strokeStyle='rgba(10,4,24,.9)'; ctx.stroke(); ctx.restore();
}
function garCatNew(c){ var r=GCATS[c].rows; for (var i=0;i<r.length;i++) if (garRowNew(r[i])) return true; return false; }
function garAnyNew(){ for (var c=0;c<GCATS.length;c++) if (garCatNew(c)) return true; return false; }
function garPulse(){ return 0.55+0.45*Math.abs(Math.sin(performance.now()/650)); }   /* slow */

/* ---- actions ---- */
function garSay(t){ garMsg=t; garMsgT=2.4; }
function garLookOnly(){
  garSay(T(TOUCH?'G_LOOK_T':'G_LOOK_K').replace(/#/g,garSlotOn));
  blip(220,0.08,'square',0.08);
}
function garStep(d){
  var row=GROWS[garRow]; if (!row || !row.list) return;
  if (garSlotOn){ garLookOnly(); return; }
  var n=row.list.length; row.set((row.get()+d+n)%n); prGarSet(row);
  blip(880,0.05,'square',0.12); saveGame();
}
function garPickIdx(i){
  var row=GROWS[garRow]; if (!row || !row.list) return;
  if (garSlotOn){ garLookOnly(); return; }
  if (i===row.get()) return;
  row.set(i); prGarSet(row); blip(880,0.05,'square',0.12); saveGame();
}
function garRandom(){
  if (garSlotOn){ garLookOnly(); return; }
  garDropLocked();
  for (var i=0;i<GAR_LOOK_KEYS.length;i++){
    var row=GROWS[GROW_BY[GAR_LOOK_KEYS[i]]]; if (row.id==='chassis') continue;   /* the chassis changes how it drives */
    var ok=[]; for (var j=0;j<row.list.length;j++) if (prRowOwned(row,j)) ok.push(j);
    if (ok.length) row.set(ok[(Math.random()*ok.length)|0]);
  }
  garOwnNote(); garSay(T('G_RANDOMED'));
  blip(660,0.05,'square',0.12); setTimeout(function(){ blip(990,0.07,'square',0.12); },60);
  saveGame();
}
function garSlotTap(n){
  if (garPick){ garSaveTo(n); return; }
  var s=garSlots[n-1];
  if (garSlotOn===n){                         /* tap again: the build in progress comes back, exactly */
    garLookPut(garWip); garWip=null; garSlotOn=0; garMsgT=0;
    if (garOwnWip){ for (var k in garOwnWip) garOwn[k]=garOwnWip[k]; garOwnNote(); garOwnWip=null; }
    blip(520,0.07,'square',0.12); saveGame(); return;
  }
  if (!s){ blip(220,0.06,'square',0.06); return; }   /* empty: dimmed, nothing to show */
  if (!garSlotOn){ garDropLocked(); garWip=garLookGet(); garOwnWip={}; for (var k in garOwn) garOwnWip[k]=garOwn[k]; }
  garLookPut(s); garSlotOn=n; garMsgT=0;
  blip(880,0.06,'square',0.12); setTimeout(function(){ blip(1180,0.08,'square',0.12); },60);
  saveGame();
}
function garSaveBtn(){
  if (garSlotOn){ garLookOnly(); return; }
  garPick=!garPick; garOw=0;
  blip(garPick?740:330,0.06,'square',0.10);
}
function garSaveTo(n){
  if (garSlots[n-1] && garOw!==n){ garOw=n; blip(440,0.08,'square',0.12); return; }   /* full: ask first */
  var o=garLookGet(), cut=garStrip(o);
  garSlots[n-1]=o; garPick=false; garOw=0;
  garSay(T('G_SAVED_TO').replace(/#/g,n)+(cut?'  \u00b7  '+T('G_LOCK_LEFT'):''));
  blip(660,0.06,'square',0.14); setTimeout(function(){ blip(990,0.10,'square',0.14); },70);
  saveGame();
}
function garBack(){
  if (garPick){ garPick=false; garOw=0; blip(330,0.06,'square',0.10); return; }
  prGarLeave(); state=garFrom; blip(660,0.09,'square',0.14);
}
function garDrive(){
  garPick=false; garOw=0; prGarLeave();
  if (garFrom==='paused') state='playing';
  else beginRun();
}

/* ---- keys (desktop) ---- */
function garageKey(code){
  var gr=GROWS[garRow]||GROWS[0];
  garSyncCat();
  if (garPick){
    var dg=/^(?:Digit|Numpad)([1-3])$/.exec(code);
    if (dg){ garSaveTo(+dg[1]); return; }
    if (code==='Escape'||code==='KeyS'){ garBack(); return; }
  }
  if (code==='Tab'){ garCatGo(garCat+1); return; }
  if (code==='ArrowUp'){   garPartGo(garPart-1); return; }
  if (code==='ArrowDown'){ garPartGo(garPart+1); return; }
  if (gr.id==='ptxt'){                    /* type the plate (desktop); LEFT deletes, RIGHT opens the phone's keyboard */
    if (code==='Backspace'||code==='Delete'||code==='ArrowLeft'){
      if (plateTxt){ plateTxt=plateTxt.slice(0,-1); saveGame(); blip(660,0.05,'square',0.10); }
      if (plateIn) plateIn.value=plateTxt;
      return;
    }
    if (code==='ArrowRight'){ if (plateIn && plateIn.style.display!=='none'){ try{ plateIn.focus(); }catch(_){} } return; }
    var m=/^Key([A-Z])$/.exec(code) || /^(?:Digit|Numpad)([0-9])$/.exec(code);
    if (m){ if (plateType(m[1])) blip(880,0.05,'square',0.12); if (plateIn) plateIn.value=plateTxt; return; }
  }
  if (code==='ArrowLeft'){  garStep(-1); return; }
  if (code==='ArrowRight'){ garStep(1); return; }
  if (code==='KeyQ'){ garCatGo(garCat-1); return; }
  if (code==='KeyE'){ garCatGo(garCat+1); return; }
  if (code==='KeyR'){ garRandom(); return; }
  if (code==='KeyP'){ garPhoto(); return; }
  if (code==='KeyS'){ garSaveBtn(); return; }
  var d=/^(?:Digit|Numpad)([1-3])$/.exec(code);
  if (d){ garSlotTap(+d[1]); return; }
  if (code==='Enter'||code==='Space'){ garDrive(); return; }
  if (code==='Escape'||code==='KeyG'){ garBack(); }
}

/* ---- every frame (from update) ---- */
function garTick(dt){
  /* the trail preview's drive / drift cycle: 3 s drive, 1 s left, 3 s drive, 1 s right */
  var t=(performance.now()/1000)%8;
  garTrlTgt = (t>=3 && t<4) ? -1 : (t>=7 ? 1 : 0);
  var tl = (state==='garage' && GROWS[garRow] && GROWS[garRow].id==='trail') ? garTrlTgt*1.25 : 0;
  garLean += (tl-garLean)*Math.min(1,dt*7);
  if (state!=='garage') return;
  if (garMsgT>0) garMsgT-=dt;
  var row=GROWS[garRow];
  if (row && row.list && row.id!=='react'){
    var k=prKey(row.id,row.list[row.get()].n);
    if (k!==garDw.k){ garDw.k=k; garDw.t=0; }
    else if (!PR.seen[k]){ garDw.t+=dt; if (garDw.t>=GAR_DWELL){ PR.seen[k]=1; saveGame(); } }
  }
}

/* ---- the save ---- */
function garLookOk(o){
  if (!o || typeof o!=='object') return null;
  var r={}, n=0, i, k;
  for (i=0;i<GAR_LOOK_KEYS.length;i++){ k=GAR_LOOK_KEYS[i]; if (typeof o[k]==='string' && o[k].length<40){ r[k]=o[k]; n++; } }
  r.ptxt = typeof o.ptxt==='string' ? plClean(o.ptxt) : '';
  return n ? r : null;
}
function garSaveObj(){ return { s:garSlots, on:garSlotOn, wip:garWip }; }
function garLoad(g){
  garSlots=[null,null,null]; garSlotOn=0; garWip=null;
  if (!g || typeof g!=='object') return;
  if (Array.isArray(g.s)) for (var i=0;i<3;i++) garSlots[i]=garLookOk(g.s[i]);
  var on=parseInt(g.on,10), w=garLookOk(g.wip);
  if (on>=1 && on<=3 && garSlots[on-1] && w){ garSlotOn=on; garWip=w; }
}

/* ---- drawing helpers ---- */
function garMode(){ return !TOUCH ? 'desk' : (isLandscape() ? 'land' : 'port'); }
function garHit(x,y,w,h,f){ garHits.push({x:x,y:y,w:w,h:h,f:f}); }
function garTap(lx,ly){
  for (var i=garHits.length-1;i>=0;i--){
    var h=garHits[i];
    if (lx>=h.x && lx<=h.x+h.w && ly>=h.y && ly<=h.y+h.h){ h.f(); return true; }
  }
  return false;
}
function garFont(sz,w){ ctx.font=(w||700)+' '+sz+'px ui-monospace,Menlo,"Courier New",monospace'; }
function garFit(txt,maxW,sz,w){              /* shrink to 70 %, then cut with ... */
  var s=sz; garFont(s,w);
  while (s>sz*0.7 && ctx.measureText(txt).width>maxW){ s-=0.5; garFont(s,w); }
  if (ctx.measureText(txt).width<=maxW) return {t:txt,s:s};
  while (txt.length>2 && ctx.measureText(txt+'\u2026').width>maxW) txt=txt.slice(0,-1);
  return {t:txt+'\u2026', s:s};
}
function garText(txt,x,y,sz,col,align,w){
  garFont(sz,w); ctx.fillStyle=col; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic'; ctx.fillText(txt,x,y);
}
function garIcon(c,x,y,s,col,lw){             /* a category icon (24-unit path) at x,y, s px */
  var p=garIconP[c];
  if (p===undefined){ try{ p=new Path2D(GCATS[c].ic); }catch(_){ p=null; } garIconP[c]=p; }
  if (!p) return;
  ctx.save(); ctx.translate(x,y); ctx.scale(s/24,s/24);
  ctx.strokeStyle=col; ctx.lineWidth=lw||1.9; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke(p); ctx.restore();
}
function garDice(cx,cy,s,col){
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,s*0.09); rr(cx-s/2,cy-s/2,s,s,s*0.22); ctx.stroke();
  ctx.fillStyle=col; var d=s*0.25, r=s*0.085;
  [[-d,-d],[d,-d],[0,0],[-d,d],[d,d]].forEach(function(p){ ctx.beginPath(); ctx.arc(cx+p[0],cy+p[1],r,0,Math.PI*2); ctx.fill(); });
}
function garCam(cx,cy,s,col){
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.2,s*0.09);
  rr(cx-s/2,cy-s*0.32,s,s*0.7,s*0.12); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy+s*0.03,s*0.2,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=col; ctx.fillRect(cx-s*0.22,cy-s*0.44,s*0.24,s*0.12);
}
function garLockMark(cx,cy,s,col,lw){        /* an outline padlock: the item still shows through it */
  lw=lw||Math.max(2.5,s*0.14);               /* build 99: 97's classic shape (shackle + body) with 98's bold edge + glow */
  ctx.save(); ctx.lineJoin='round'; ctx.lineCap='round';
  var pass=function(dark){
    ctx.strokeStyle=dark?'rgba(10,4,24,.85)':col; ctx.lineWidth=dark?lw+Math.max(2,lw*0.8):lw;
    if (!dark){ ctx.shadowColor=col; ctx.shadowBlur=hb(Math.max(4,s*0.12)); }
    ctx.beginPath(); ctx.moveTo(cx-s*0.30, cy-s*0.04); ctx.lineTo(cx-s*0.30, cy-s*0.30);   /* the shackle */
    ctx.arc(cx, cy-s*0.30, s*0.30, Math.PI, 0); ctx.lineTo(cx+s*0.30, cy-s*0.04); ctx.stroke();
    rr(cx-s*0.5, cy-s*0.06, s, s*0.72, s*0.1); ctx.stroke();                             /* the body */
    ctx.shadowBlur=0;
  };
  pass(true); pass(false);
  ctx.fillStyle='rgba(10,4,24,.85)'; ctx.beginPath(); ctx.arc(cx, cy+s*0.22, s*0.12, 0, Math.PI*2); ctx.fill();
  ctx.fillRect(cx-s*0.065, cy+s*0.22, s*0.13, s*0.24);
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx, cy+s*0.22, s*0.085, 0, Math.PI*2); ctx.fill();   /* the keyhole */
  ctx.fillRect(cx-s*0.035, cy+s*0.22, s*0.07, s*0.2);
  ctx.restore();
}
function garChev(cx,cy,d){                   /* build 99: a glowing chevron, d = -1 left / +1 right */
  ctx.save(); ctx.globalAlpha=0.75+0.25*garPulse();
  ctx.strokeStyle='#21e6ff'; ctx.lineWidth=3.2; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor='#21e6ff'; ctx.shadowBlur=hb(10);
  ctx.beginPath(); ctx.moveTo(cx-d*4,cy-9); ctx.lineTo(cx+d*4,cy); ctx.lineTo(cx-d*4,cy+9); ctx.stroke();
  ctx.restore();
}
function garCheck(cx,cy,s,col){
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.6,s*0.2); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(cx-s*0.45,cy); ctx.lineTo(cx-s*0.12,cy+s*0.32); ctx.lineTo(cx+s*0.48,cy-s*0.38); ctx.stroke();
  ctx.lineCap='butt';
}
function garPill(txt,x,y,sz,col,alpha,align){  /* x,y = top-left (or top-right with align 'right') */
  garFont(sz,900); var w=ctx.measureText(txt).width+sz*0.9, h=sz*1.45;
  if (align==='right') x-=w;

function garPadUpdate(){

function garPhoto(){
  if (garLooseLocked()){ garSay(T('G_PHOTO_LOCK')); blip(220,0.08,'square',0.08); return; }   /* build 98 */
  var S=1080, c=null;
  try{ c=offCv(null,S,S,true); }catch(_){ c=null; }

  var g=c.getContext('2d'), keep=ctx; ctx=g;

  var url=null;
  try{ url=c.toDataURL('image/png'); }catch(_){ url=null; }

  var name='vapor-lane-'+(plateTxt||'car').toLowerCase()+'.png', blob=null, file=null;
  try{
    var bin=atob(url.split(',')[1]), arr=new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    blob=new Blob([arr],{type:'image/png'});
    if (typeof File==='function') file=new File([blob],name,{type:'image/png'});
  }catch(_){ blob=null; }
  try{                                        /* phones: the share sheet (save to photos, send) */

    var a=document.createElement('a'), u=blob ? URL.createObjectURL(blob) : url;
    a.href=u; a.download=name; a.style.display='none'; document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ if (blob) URL.revokeObjectURL(u); a.remove(); }catch(_){} },4000);
    garSay(T('G_PHOTO_OK')); blip(1320,0.06,'square',0.12);
  }catch(_){ garSay(T('G_PHOTO_NO')); }
}
function garPhotoPaint(S){
  var g=ctx.createRadialGradient(S/2,S*0.3,40,S/2,S*0.45,S*0.85);
  g.addColorStop(0,'#3a1166'); g.addColorStop(0.55,'#14072a'); g.addColorStop(1,'#05020c');
  ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
  /* sun */
  var sy=S*0.50, sr=S*0.22, sg=ctx.createLinearGradient(0,sy-sr,0,sy);
  sg.addColorStop(0,'#ffd23f'); sg.addColorStop(1,'#ff2fbe');
  ctx.save(); ctx.beginPath(); ctx.arc(S/2,sy,sr,Math.PI,0); ctx.closePath(); ctx.clip();
  ctx.fillStyle=sg; ctx.fillRect(S/2-sr,sy-sr,sr*2,sr);
  ctx.fillStyle='#14072a'; for (var k=0;k<6;k++){ var yy=sy-sr*0.42+k*sr*0.09; ctx.fillRect(S/2-sr,yy,sr*2,3+k*2.2); }
  ctx.restore();
  /* grid floor */
  ctx.fillStyle='#0b0418'; ctx.fillRect(0,sy,S,S-sy);
  ctx.strokeStyle='rgba(255,47,190,.55)'; ctx.lineWidth=2;
  for (var i=-12;i<=12;i++){ ctx.beginPath(); ctx.moveTo(S/2+i*14,sy); ctx.lineTo(S/2+i*150,S); ctx.stroke(); }
  for (var j=1;j<12;j++){ var t=Math.pow(j/12,2.1), y2=sy+(S-sy)*t; ctx.globalAlpha=0.25+0.6*t; ctx.beginPath(); ctx.moveTo(0,y2); ctx.lineTo(S,y2); ctx.stroke(); }
  ctx.globalAlpha=1;
  /* the turntable and the car */
  ctx.fillStyle='rgba(255,47,190,.22)'; ctx.beginPath(); ctx.ellipse(S/2,S*0.785,S*0.33,S*0.06,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#21e6ff'; ctx.lineWidth=4; ctx.shadowColor='#21e6ff'; ctx.shadowBlur=20; ctx.stroke(); ctx.shadowBlur=0;
  ctx.save(); ctx.translate(S/2,S*0.775); paintCar(S*0.40,{glow:0.8}); ctx.restore();
  /* words */
  glowText('VAPOR LANE', S/2, S*0.13, 96, '#21e6ff', 'center', 30, '900');
  garText(T('BEST')+'  '+prFmt(best), S/2, S*0.935, 46, '#ffd23f', 'center', 800);
  if (plateTxt) garText(plateTxt.split('').join(' '), S/2, S*0.20, 34, '#ff6ad5', 'center', 800);
}

/* ---------------------------------------------------------------
   WEATHER
   Lifted from the Zone Lab. One flake pool, reused by every mode; the
   zone picks the mode and how much of the pool is alive. `d` is a fake
   depth, so near flakes are bigger, faster and more opaque than far
   ones, and everything drifts with the road so it does not read as a
   sticker on the glass.
--------------------------------------------------------------- */
var WEATHERS=['none','snow','rain','ember','dust','ash'];
var flakes=[];
function seedFlakes(){
  flakes=[];
  for (var i=0;i<420;i++)
    flakes.push({x:Math.random()*W, y:Math.random()*H, d:0.25+Math.random()*0.75,
                 p:Math.random()*6.28, s:Math.random()});
}
seedFlakes();

function drawWeather(dt){
  var kind=ZN.weather; if (!kind||kind==='none') return;
  var amt=clamp(ZN.wamt*ZN.weatherAmt,0,1); if (amt<=0.01) return;
  var n=Math.round(flakes.length*amt), t=performance.now()/1000, i, f;
  var drift=-bgX*0.0006-playerX*0.4;
  ctx.save();
  if (kind==='ember') ctx.globalCompositeOperation='lighter';
  for (i=0;i<n;i++){
    f=flakes[i];
    if (kind==='snow'){
      f.y+=(26+f.d*66)*dt; f.x+=Math.sin(t*0.8+f.p)*11*dt+drift;
      var sz=0.9+f.d*2.2;
      ctx.globalAlpha=0.22+f.d*0.55;
      ctx.fillStyle=ZN.wcol; ctx.fillRect(f.x,f.y,sz,sz);
    } else if (kind==='rain'){
      f.y+=(520+f.d*900)*dt; f.x+=(-90-f.d*70)*dt+drift;
      var ln=8+f.d*22;
      ctx.globalAlpha=0.10+f.d*0.28;
      ctx.strokeStyle=ZN.wcol; ctx.lineWidth=0.7+f.d*0.9;
      ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(f.x+ln*0.16,f.y-ln); ctx.stroke();
    } else if (kind==='ember'){
      f.y-=(30+f.d*130)*dt; f.x+=Math.sin(t*1.6+f.p)*22*dt+drift;
      if (f.y<-6){ f.y=H+Math.random()*40; f.x=Math.random()*W; }
      var e=0.55+0.45*Math.sin(t*7+f.p), es=Math.max(1,f.d*2.6);
      ctx.globalAlpha=(0.15+f.d*0.55)*e;
      ctx.fillStyle=ZN.wcol; ctx.fillRect(f.x,f.y,es,es*1.6);
    } else if (kind==='dust'){
      f.y+=Math.sin(t*0.5+f.p)*7*dt; f.x+=(-14-f.d*34)*dt+drift;
      ctx.globalAlpha=(0.05+f.d*0.20)*(0.6+0.4*Math.sin(t*1.1+f.p));
      ctx.fillStyle=ZN.wcol; ctx.fillRect(f.x,f.y,1+f.d,1+f.d);
    } else if (kind==='ash'){
      f.y+=(14+f.d*40)*dt; f.x+=Math.sin(t*0.4+f.p)*17*dt+drift;
      ctx.globalAlpha=0.10+f.d*0.30;
      ctx.fillStyle=ZN.wcol; ctx.fillRect(f.x,f.y,1+f.d*1.6,1+f.d*1.6);
    }
    if (f.y>H+8){ f.y=-8-Math.random()*40; f.x=Math.random()*W; }
    else if (f.y<-48){ f.y=H+Math.random()*20; f.x=Math.random()*W; }
    if (f.x<-60) f.x+=W+120; else if (f.x>W+60) f.x-=W+120;
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

/* ---------------------------------------------------------------
   ZONE SWITCHING
   A hard snap, always behind a cutaway, exactly as decided: no
   crossfade. Props are placed on a deterministic grid and coloured at
   draw time, so nothing needs per-prop zone memory.
--------------------------------------------------------------- */
function setZone(id, keepSong){
  /* setZone owns `zoneI`. Nothing else may assign it — that split is
     exactly what let the two drift apart across a reset().
     keepSong (build 65): the ride swaps the map mid-cutscene but the song
     only on drop-off (musArrive in endAbduct). Every other caller -- reset()
     in particular -- swaps both at once. */
  if (!ZONES[id]) id='vapor';
  zoneI = id;
  ZN = ZONES[id];
  hwSpookClear();                      /* build 87: the ghost and the hand belong to their zone */
  GB = ZN.bloom*ZN.bloomMul;
  var cc=ZN.chev||CHEV_STD;            /* build 84: the zone's chevron colours */
  if (cc){ CHEV_AMBER=cc[0]; CHEV_DIM=cc[1]; CHEV_SIDE=cc[2]; CHEV_CORE=cc[3]; }
  rebuildRows();
  applyGrade();
  if (ZN.song && !keepSong) musLoadSong(ZN.song);
  for (var i=0;i<cars.length;i++)
    cars[i].color = cars[i].weaver ? '#ffd23f'
                                   : ZN.traffic[(Math.random()*ZN.traffic.length)|0];
}


/* ---------------------------------------------------------------
   THE ABDUCTION
   Ported from the cutaway lab's `abduct` script, beat for beat. The
   renderer is never captured or masked — it just keeps running while
   this drives the car sprite, the camera and the saucer.

   THE CLOCK IS FROZEN FOR THE WHOLE THING. update() hands over to
   abductStep() before it reaches `timeLeft -= dt`, so the freeze is the
   absence of a line rather than a new pause path. You get the seconds
   back that the cutscene spends, which is the only fair reading: you
   did not choose to stop driving, the saucer stopped you.
--------------------------------------------------------------- */
/* ---------------------------------------------------------------
   THE MIST (build 84): the ride into and out of HAUNTED HIGHWAY.
   It runs on the abduction's machinery (state 'abduct', cutStep, endAbduct),
   so the clock is held for the whole thing, nothing can hurt you, and the
   map swaps under full cover; there is just no saucer.
     0.00-0.12  the lantern flares green, a pulse ring under the car, a wail
     0.08-0.44  a pale purple mist rises over the screen, bats burst out of it,
                the car fades into it
     0.55-0.70  swallowed: two yellow eyes open in the dark and blink; a
                green flash, and the map swaps at 0.62
     0.70-0.95  the mist parts from the middle and you drive out of it
   Started by the Halloween activator (VAPOR -> HAUNTED HIGHWAY) and by a
   hitchhiker in HAUNTED HIGHWAY (-> VAPOR).
--------------------------------------------------------------- */
function startMist(to){
  cut = { kind:'mist', t:0, dur:CUTS.mist.dur, swapped:false, to:to };
  state = 'abduct';
  cutCarRest();
  hailCool = HAIL_COOL;
  shake=Math.max(shake,5);
  fxAdd({kind:'ring', layer:0, x:W/2, y:PLAYER_Y, r0:PW*0.4, r1:PW*2.8, sq:0.26, col:'#9dff6a', w:4, a:0.9, add:true, life:0.9});
  fxBurst(W/2, PLAYER_Y-10, 26, {layer:1, w:PW*0.9, spread:180, flat:0.5, up:90, g:-40, drag:1.6, size:2.4, col:'#9dff6a', a:0.75, add:true, life:1.1});
  say(T('MIST_TAKE'), '#9dff6a', true, null, 1.3);   /* gone before CLOCK HELD comes up in the same place */
  mistSfx();
}
/* a ghostly wail: two voices sliding up and down with a slow wobble, over a low thump */
function mistSfx(){
  if (!A||muted) return;
  try{
    var t=A.ctx.currentTime, g=A.ctx.createGain(), o=A.ctx.createOscillator(), o2=A.ctx.createOscillator();
    var lfo=A.ctx.createOscillator(), lg=A.ctx.createGain();
    o.type='sine'; o2.type='triangle';
    o.frequency.setValueAtTime(330,t); o.frequency.linearRampToValueAtTime(620,t+0.7); o.frequency.linearRampToValueAtTime(250,t+1.9);
    o2.frequency.setValueAtTime(334,t); o2.frequency.linearRampToValueAtTime(626,t+0.72); o2.frequency.linearRampToValueAtTime(247,t+1.9);
    lfo.frequency.setValueAtTime(5.5,t); lg.gain.setValueAtTime(12,t);
    lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.11,t+0.25);
    g.gain.linearRampToValueAtTime(0.08,t+1.2); g.gain.exponentialRampToValueAtTime(0.0001,t+2.0);
    o.connect(g); o2.connect(g); g.connect(A.master);
    o.start(t); o2.start(t); lfo.start(t); o.stop(t+2.05); o2.stop(t+2.05); lfo.stop(t+2.05);
  }catch(e){}
  blip(96,0.55,'sine',0.20,0,0.5);
}
function mistScript(p,dt){
  if (p<0.15) speed += (2600-speed)*Math.min(1,dt*2.4);
  else if (p<0.62) speed += (1700-speed)*Math.min(1,dt*1.2);
  else speed += (maxSpeedFor(lap)*0.55-speed)*Math.min(1,dt*1.3);
  /* back onto the road if you went in beside the hitchhikers */
  playerX += (clamp(playerX,-0.75,0.75)-playerX)*Math.min(1,dt*1.5);
  if (p<0.15){ cutCar.alpha=1; cutCar.y=0; }
  else if (p<0.62){
    var e=(p-0.15)/0.47;
    cutCar.y=-ease(e)*24; cutCar.tilt=Math.sin(e*6.2)*0.05;
    cutCar.alpha=1-0.8*ease((p-0.32)/0.20);
  } else {
    var e2=(p-0.62)/0.38;
    cutCar.alpha=0.2+0.8*ease((p-0.70)/0.14);
    cutCar.y=-24*(1-bounceOut(e2*1.3)); cutCar.tilt=Math.sin(e2*9)*0.04*(1-e2);
  }
  if (!cut.boom && p>=0.62){                       /* the flash at the swap */
    cut.boom=true; shake=Math.max(shake,4);
    blip(70,0.7,'sawtooth',0.10,0,0.35);
  }
  if (!cut.out && p>=0.80){                        /* driving out: the mist breaks around the car */
    cut.out=true;
    fxAdd({kind:'ring', layer:0, x:W/2, y:PLAYER_Y+2, r0:PW*0.35, r1:PW*2.4, sq:0.22, col:'#d8c8f0', w:3, a:0.7, life:0.8});
    fxBurst(W/2, PLAYER_Y, 22, {layer:1, w:PW*0.9, spread:240, flat:0.35, up:50, g:120, drag:2.0, size:3.2, col:'#cbb8e8', a:0.45, life:0.9});
  }
}
function drawMistCut(p){
  var t=performance.now()/1000, i, cover;
  if (p<0.12){                                     /* the green flare */
    var fl=Math.sin(p/0.12*Math.PI);
    var vg=ctx.createRadialGradient(W/2,H*0.62,H*0.25,W/2,H*0.62,W*0.75);
    vg.addColorStop(0,'rgba(157,255,106,0)'); vg.addColorStop(1,'rgba(157,255,106,'+(0.45*fl).toFixed(3)+')');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
  if (p<0.70){                                     /* the mist rising from the bottom and the sides */
    cover=p<0.08?0:ease((p-0.08)/0.36);
    if (cover>0){
      var top=H-cover*(H+180);
      var mg=ctx.createLinearGradient(0,top,0,top+180);
      mg.addColorStop(0,'rgba(74,56,98,0)'); mg.addColorStop(1,'rgba(74,56,98,'+Math.min(1,cover*1.15).toFixed(3)+')');
      ctx.fillStyle=mg; ctx.fillRect(0,top,W,180);
      if (top+180<H){ ctx.fillStyle='rgba(74,56,98,'+Math.min(1,cover*1.15).toFixed(3)+')'; ctx.fillRect(0,top+180,W,H-top-180); }
      for (i=0;i<2;i++){                           /* side curtains */
        var sx=i?W:0, sg=ctx.createLinearGradient(sx,0,i?W-W*0.45*cover:W*0.45*cover,0);
        sg.addColorStop(0,'rgba(74,56,98,'+(0.9*cover).toFixed(3)+')'); sg.addColorStop(1,'rgba(74,56,98,0)');
        ctx.fillStyle=sg; ctx.fillRect(i?W-W*0.45*cover:0,0,W*0.45*cover,H);
      }
      for (i=0;i<6;i++){                           /* pale wisps riding the mist's edge */
        var ww=180+i*40, wx=((t*(26+i*9)*(i%2?1:-1)+i*173)%(W+ww*2)+W+ww*2)%(W+ww*2)-ww, wy=Math.max(-40,top+60+i*18);
        ctx.save(); ctx.translate(wx,wy); ctx.scale(1,0.22);
        var wg=ctx.createRadialGradient(0,0,0,0,0,ww);
        wg.addColorStop(0,'rgba(222,208,245,'+(0.30*cover).toFixed(3)+')'); wg.addColorStop(1,'rgba(222,208,245,0)');
        ctx.fillStyle=wg; ctx.beginPath(); ctx.arc(0,0,ww,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
    }
    if (p>0.18 && p<0.64){                         /* bats bursting out toward the camera */
      ctx.fillStyle='#07030c';
      for (i=0;i<20;i++){
        var q=(p-0.18-hashAt(i,71)*0.12)/0.34; if (q<=0||q>=1) continue;
        var an=hashAt(i,72)*Math.PI*2, rd=q*q*(420+hashAt(i,73)*260);
        batShape(W/2+Math.cos(an)*rd, H*0.55+Math.sin(an)*rd*0.6-q*60, 4+q*22, Math.sin(t*16+i*1.7));
      }
    }
  } else {                                         /* the mist parting from the middle */
    cover=p<0.95 ? 1-ease((p-0.70)/0.25) : 0;
    if (cover>0){
      var hole=(1-cover)*W*0.95, rg=ctx.createRadialGradient(W/2,H*0.60,hole*0.55,W/2,H*0.60,hole+60);
      rg.addColorStop(0,'rgba(74,56,98,0)'); rg.addColorStop(1,'rgba(74,56,98,'+Math.min(1,cover*1.2).toFixed(3)+')');
      ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
    }
  }
  if (p>=0.55 && p<0.72){                          /* swallowed: two yellow eyes in the dark, a blink, a flash */
    var k=ease((p-0.55)/0.04)*ease((0.72-p)/0.04);
    ctx.fillStyle='rgba(14,6,20,'+(0.85*k).toFixed(3)+')'; ctx.fillRect(0,0,W,H);
    var bl=(p>0.60&&p<0.615)?0.1:1;
    for (var e=-1;e<=1;e+=2){
      var ex=W/2+e*66, ey=H*0.45;          /* under CLOCK HELD, even at phone size */
      ctx.save(); ctx.globalCompositeOperation='lighter';
      var eg=ctx.createRadialGradient(ex,ey,2,ex,ey,90); eg.addColorStop(0,'rgba(255,225,74,'+(0.45*k*bl).toFixed(3)+')'); eg.addColorStop(1,'rgba(255,225,74,0)');
      ctx.fillStyle=eg; ctx.fillRect(ex-90,ey-90,180,180); ctx.restore();
      ctx.globalAlpha=k; ctx.fillStyle='#ffe14a';
      ctx.beginPath(); ctx.ellipse(ex,ey,34,15*bl*(0.6+0.4*k),e*-0.18,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#160a04'; ctx.beginPath(); ctx.ellipse(ex,ey,4,13*bl*(0.6+0.4*k),0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
    if (p>0.62 && p<0.66){ ctx.fillStyle='rgba(200,255,170,'+(0.85*(1-(p-0.62)/0.04)).toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
  }
}
function callUfo(){
  /* build 77: a wandering saucer already ahead and within the hunter's start distance ANSWERS the call where
     it hangs (no pop); one out of reach is replaced by a fresh hunter, as before. */
  var wdz = ufo ? ufo.z-(position+Z_CAR) : 0;
  if (ufo && !ufo.hunt && !ufo.cutting && wdz>0 && wdz<=22000){
    ufo.hunt=true; ufo.lock=0; ufo.told=false; ufo.beamOn=true; ufo.beamT=99; ufo.beamK=1;
    ufo.v=speed*0.8; ufo.life=UFO_HUNT_T; ufo.fade=1; ufo.color=ZN.accent; ufo.amp=0; ufo.rate=0;
  } else
  ufo = { z: position+Z_CAR+22000, x: playerX*0.4, amp:0, rate:0, phase:0,
          hover: 1.15, bob: Math.random()*6, spin: 0,
          color: ZN.accent, beamOn: true, beamT: 99, beamK: 1,
          life: UFO_HUNT_T, fade: 1, isUfo: true,
          hunt: true, lock: 0, told: false, v: speed*0.8 };
  hailCool = HAIL_COOL;
  say(T('HAIL_CALL'), '#7cff4f', true, null, 2.0);
  blip(320,0.10,'square',0.16);
  setTimeout(function(){ blip(214,0.16,'square',0.16); },110);
}

/* The transition table, same shape as the cutaway lab's. `swapAt` is the
   moment the map changes underneath; `freeze` marks the five lab cuts that
   redraw a captured frame (VHS TEAR, PIXEL MELT, CHROMA SPLIT, TAPE REWIND,
   CRT COLLAPSE) and would additionally need an offscreen snapshot canvas.
   Adding one of the four LIVE cuts is a row here plus a case in cutScript()
   and one in drawCut(); nothing else in the game has to move. */
var CUTS = {
  abduct: { dur:5.4, swapAt:0.74, freeze:false },
  mist:   { dur:4.2, swapAt:0.62, freeze:false }    /* build 84: HAUNTED HIGHWAY's ride */
};

function startCut(kind, to){
  cut = { kind:kind, t:0, dur:CUTS[kind].dur, swapped:false, to:to };
  state = 'abduct';
  cutCarRest();
  ufo.hunt=false; ufo.cutting=true; ufo.lock=UFO_LOCK;
  shake=Math.max(shake,10);
  /* build 83: a pulse ring off the car as the beam takes it */
  fxAdd({kind:'ring', layer:0, x:W/2, y:PLAYER_Y, r0:PW*0.4, r1:PW*2.6, sq:0.26, col:ufo.color, w:4, a:0.9, add:true, life:0.9});
  fxAdd({kind:'ring', layer:0, x:W/2, y:PLAYER_Y, r0:PW*0.2, r1:PW*1.8, sq:0.26, col:'#ffffff', w:2, a:0.7, add:true, life:0.7});
  blip(880,0.30,'sine',0.22);
  setTimeout(function(){ blip(1320,0.45,'sine',0.20); },160);
}

function endAbduct(){
  var ck=cut ? cut.kind : '';         /* build 96: which ride this was */
  cut=null; cutCarRest();
  ufo=null; ufoT=ufoWait(18); hailCool=HAIL_COOL;   /* build 85: the zone has swapped already */
  spinT=0; spinAng=0;                 /* never set down mid-spin */
  invT=Math.max(invT,1.2);            /* a beat to read the new road */
  state='playing';
  var zn=ZONES[zoneI];
  musArrive(zn.song);                           /* the zone's song, from bar 1 */
  msgs.length=0;                                /* drop any stale banner */
  say(T('ZONE_IN')+'  '+zn.name, zn.accent, true, null, 2.6);
  if (zn.mult!==1)
    say('×'+zn.mult.toFixed(1)+'  '+T('ZONE_PAY'), '#ffd23f', false, null, 2.6);
  if (ck==='abduct') prAdd('beam');                               /* build 96: a UFO beam-up */
  else if (ck==='mist' && zoneI==='haunted') prAdd('haunt');      /* build 96: into HAUNTED HIGHWAY by THE MIST */
}

function startAbduct(){
  startCut('abduct', zoneI==='vapor' ? 'vaporEdit' : 'vapor');
}

function cutStep(dt){
  var p = clamp(cut.t/cut.dur, 0, 1);
  cut.t += dt;
  cutScript(cut.kind, p, dt);

  if (!cut.swapped && p>=CUTS[cut.kind].swapAt){
    cut.swapped=true;
    setZone(cut.to, true);      /* map now, song on drop-off (endAbduct) */
    /* The road AHEAD of you is already generated, so the new zone's curve
       and len dials arrive with the next section rather than at the seam.
       That is deliberate and it is free: regenerating the centreline here
       would jump the road under the white-out, and a gentle first bend is
       exactly what lets you learn a zone's grip before it punishes you.
       Grip and the centrifugal gain ARE instant — they are read per frame. */
  }

  /* the world keeps flowing underneath, minus the clock and minus every
     way the player could be hurt */
  position += speed*dt;
  for (var i=cars.length-1;i>=0;i--){
    cars[i].z += cars[i].speed*dt;
    if (cars[i].z-position < -6000) cars.splice(i,1);
  }
  ensure(position+MAXZ+Z_CAR+CH);
  cAnchor=curveAt(position+Z_CAR);
  curSlope=slopeAt(position+Z_CAR);
  warnSlope=slopeAt(position+Z_CAR+17000);
  bgX += (-curSlope*108000 - bgX)*Math.min(1,3*dt);
  engine(ENG_IDLE+(speed/14800)*0.5, true);
  screech(0);
  musMix();

  if (cut.t>=cut.dur) endAbduct();
}

/* How each cut drives the world and the car sprite. */
function cutScript(kind, p, dt){
  var e;
  if (kind==='mist'){ mistScript(p,dt); return; }   /* build 84 */
  if (kind!=='abduct') return;

  /* 0.00-0.16 lock   — beam widens, throttle dies
     0.16-0.62 lift   — the car rises, sways and shrinks into the cone
     0.62-0.80 bloom  — white-out, and the map swaps at 0.74
     0.80-1.00 set down on the new road                                  */
  if (ufo){
    ufo.z = position+Z_CAR+UFO_HOLD - UFO_HOLD*Math.min(1,p/0.16);
    ufo.spin += dt*3.1; ufo.bob += dt;
  }
  cutCar.lit = p<0.16 ? clamp(p/0.16,0,1) : (p<0.80 ? 1 : 0);   /* build 83: lit by the beam */
  if (p<0.16){
    speed += (2100-speed)*Math.min(1,dt*2.6);
    if (ufo) playerX += (ufo.x-playerX)*Math.min(1,dt*1.6);
  } else if (p<0.62){
    e=(p-0.16)/0.46;
    speed += (900-speed)*Math.min(1,dt*1.4);
    cutCar.y   = -ease(e)*(430-(ufo?ufoCutDrop(ufo):0));   /* build 85: into the saucer where it now hangs */
    cutCar.x   = Math.sin(e*7.2)*46*(1-e*0.35);
    cutCar.tilt= Math.sin(e*5.1)*0.30 + Math.sin(e*11)*0.06;
    cutCar.sc  = 1 - ease(e)*0.68;
    cutCar.spin= e*e*2.4;
  } else if (p<0.80){
    cutCar.alpha = Math.max(0, 1-(p-0.62)/0.10);
    speed += (600-speed)*Math.min(1,dt*1.4);
  } else {
    e=(p-0.80)/0.20;
    if (ufo) ufo.beamK = Math.max(0, 1-e*2);
    /* build 83: the lab's landing: drops in, bounces, a dust ring; the saucer climbs away */
    cutCar.alpha = Math.min(1, e*4);
    cutCar.sc    = 0.62 + 0.38*easeOut(e*1.6);
    cutCar.y     = -230*(1-bounceOut(e*1.12));
    cutCar.x     = 0;
    cutCar.tilt  = Math.sin(e*9)*0.07*(1-e);
    cutCar.spin  = 0;
    if (ufo) ufo.lift = easeIn((p-0.86)/0.14)*420;
    if (!cut.landed && e>0.325){
      cut.landed=true;
      shake=Math.max(shake,3.2);
      fxAdd({kind:'ring', layer:0, x:W/2, y:PLAYER_Y+2, r0:PW*0.35, r1:PW*2.2, sq:0.22, col:'#e6ffd0', w:3, a:0.75, life:0.75});
      fxBurst(W/2, PLAYER_Y, 22, {layer:1, w:PW*0.8, spread:260, flat:0.35, up:70, g:320, drag:2.2, size:2.6, col:'#d8d0f5', a:0.6, life:0.75});
    }
    speed += (maxSpeedFor(lap)*0.62-speed)*Math.min(1,dt*1.5);
  }

}

/* The screen-space overlay for the running cut. */
function drawCut(){
  if (cut.kind==='mist'){               /* build 84 */
    var pm=clamp(cut.t/cut.dur,0,1); drawMistCut(pm);
    if (mode==='run' && pm>0.33 && pm<0.90){   /* after THE MIST TAKES YOU has gone */

    fg.addColorStop(0,'rgba(33,230,255,0)'); fg.addColorStop(0.5,'rgba(200,255,255,'+(0.8*b).toFixed(3)+')'); fg.addColorStop(1,'rgba(33,230,255,0)');
    ctx.fillStyle=fg; ctx.fillRect(0,horizonY+66,W,3); ctx.globalAlpha=0.5; ctx.fillRect(0,horizonY+60,W,1); ctx.fillRect(0,horizonY+76,W,1);
    ctx.restore();
  }
  if (mode==='run' && p<0.90){

    glowText(T('CLOCK_HELD'), W/2, 196+10*UI, TS.LABEL*UI, '#21e6ff', 'center', 14);   /* build 85: under the lowered hull (206; 210 with the touch HUD's bigger text) */
    ctx.globalAlpha=1;
  }
}

function render(){
  var sx=0, sy=0;
  if (shake>0.3){
    /* Build 71: a smooth shake. Two sines per axis at 8-14 Hz (under half of
       30 fps, so a capped browser shows the same motion), on game time. The
       old one jumped to a new random spot every frame, which made its rhythm
       the frame rhythm: any uneven frame read as stutter. Peak = shake and
       y = 0.6 of x, as before. */
    sx=shake*(0.62*Math.sin(shT*50.3+1.3)+0.38*Math.sin(shT*77.1+4.1));
    sy=shake*0.6*(0.62*Math.sin(shT*61.0+2.2)+0.38*Math.sin(shT*89.2+0.7));
    /* whole device pixels for EVERYTHING: the road's one-pixel rows never
       smear across two screen rows, and the cached sky and sun move with
       the rest instead of half a pixel apart */
    sx=Math.round(sx*dpr)/dpr; sy=Math.round(sy*dpr)/dpr;
  }
  shX=sx; shY=sy;

  /* The sky and ground blits cover every pixel, opaque, so the old
     full-canvas clear only matters for the strip a camera shake uncovers
     (build 70). The blits land on whole pixels, so the strip is exact. */
  useWorld();
  ctx.setTransform(1,0,0,1,0,0);
  var ox=Math.round(sx*dpr), oy=Math.round(sy*dpr), CWd=cv.width, CHd=cv.height;
  if (ox>0) ctx.clearRect(0,0,ox,CHd); else if (ox<0) ctx.clearRect(CWd+ox,0,-ox,CHd);
  if (oy>0) ctx.clearRect(0,0,CWd,oy); else if (oy<0) ctx.clearRect(0,CHd+oy,CWd,-oy);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* build 104: the top layer starts empty every frame */
  ctx2.setTransform(1,0,0,1,0,0); ctx2.clearRect(0,0,cv2.width,cv2.height); ctx2.setTransform(dpr,0,0,dpr,0,0);

  if (state==='garage'){                 /* build 97: the showroom covers the whole stage; the road behind isn't drawn */
    if (!wBlank){                         /* build 104: nothing of the world (or its grade) is left under the garage */
      ctxW.setTransform(1,0,0,1,0,0); ctxW.clearRect(0,0,CWd,CHd); ctxW.setTransform(dpr,0,0,dpr,0,0); wBlank=true;
    }
    useTop();
    drawGarage();
    plateInput(!!(GROWS[garRow] && GROWS[garRow].id==='ptxt'));
    tutFxVis();
    return;
  }
  wBlank=false;
  ctx.save();
  ctx.translate(sx,sy);

  drawSky();
  drawGround();
  drawRoad();
  drawDecor();
  drawPosts();
  drawGate();

  var sorted=cars.slice();
  for (var q3=0;q3<pickups.length;q3++) sorted.push(pickups[q3]);
  if (ufo)   sorted.push(ufo);
  for (var q=0;q<pshots.length;q++) sorted.push(pshots[q]);
  for (var q2=0;q2<blasts.length;q2++) sorted.push(blasts[q2]);
  hwSpookSort(sorted);                 /* build 87 */
  sorted.sort(function(a,b){ return b.z-a.z; });
  for (var i=0;i<sorted.length;i++){
    if (sorted[i].kind==='heart')     drawHeart(sorted[i]);
    else if (sorted[i].kind==='bolt') drawBoost(sorted[i]);
    else if (sorted[i].kind==='dino') drawDinoPickup(sorted[i]);
    else if (sorted[i].isUfo)   drawUfo(sorted[i]);
    else if (sorted[i].isShot)  drawShot(sorted[i]);
    else if (sorted[i].isBlast) drawBlast(sorted[i]);
    else if (sorted[i].isSpook) drawSpook(sorted[i]);   /* build 87 */
    else                        drawTraffic(sorted[i]);
  }

  drawGroundFog();
  drawWeather(lastDt);                 /* build 104: weather belongs to the graded world (it now falls behind the car) */
  ctx.restore();

  /* ---- build 104: from here on, the TOP layer (never graded) ---- */
  useTop();
  ctx.save();
  ctx.translate(sx,sy);
  fxDraw(0);                           /* build 83: effects on the ground, under the car */
  drawPlayer();
  hwSpookNear();                       /* build 87 */
  drawNearMissPops();
  fxDraw(1);                           /* build 83: effects above the car */
  ctx.restore();
  drawScareFace();                     /* build 87: the ghost's boo, see-through, under the HUD */

  if (flash>0){ ctx.fillStyle='rgba(124,255,79,'+(flash*0.28).toFixed(3)+')'; ctx.fillRect(0,0,W,H); }
  if (hitFlash>0){ ctx.fillStyle='rgba(255,60,90,'+(hitFlash*0.34).toFixed(3)+')'; ctx.fillRect(0,0,W,H); }

  if (state==='abduct') drawCut();
  fxDraw(2);                             /* build 83: effects over the frame, under the HUD */

  if (state!=='garage' && state!=='info') drawHUD();
  if (state==='title'){   drawTitle(); drawMessages(); }   /* card on top (build 69) */
  if (state==='paused')   drawPause();
  if (state==='gameover') drawOver();
  if (state==='garage')   drawGarage();
  plateInput(state==='garage' && GROWS[garRow] && GROWS[garRow].id==='ptxt');   /* build 94: the phone's plate field */
  if (state==='info')     drawInfo();
  drawBuildTag();                        /* build 93 */
  if (state==='tutorial') tutLayout();   /* build 72/73: keep the closing card where it belongs */
  tutFxVis();                            /* build 73: the boxes and the dim only while driving */
}

/* BUILD TAG (build 93). A faint "v.93" so the build on itch / GitHub can be checked at a glance.
   Bottom-right on both (Carlos: the same side on desktop and phone), clear of the stage's rounded corner: under the
   title's right key column on a desktop, under NEXT LAP while driving.
   Only on the title, driving, pause and game over screens. */
var BUILD_TAG_A = 0.45;               /* how faint: 0 = gone, 1 = full */
function drawBuildTag(){

  var fs = TOUCH ? TS.MICRO*UI : 12, txt = 'v.'+BUILD_NO;
