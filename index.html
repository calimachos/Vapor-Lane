});
/* LEAVING THE GAME.
   Everything that has to happen when the app stops being in front of you:
   drop every held control, pause the run, save, and silence the audio.

   The audio half is the part that was missing. `blur` alone is not enough on a
   phone — an installed PWA often does not fire it when you swipe home or take
   a call, so the context kept running and the music played on over the home
   screen. `visibilitychange` fires in every one of those cases, and
   `pagehide` covers the tab actually going away. All three land here. */
function leaveGame(){
  /* `padDir=null` used to sit here. Nothing has declared padDir since the pad
     was rebuilt as fans, and this file is "use strict", so that line threw a
     ReferenceError every single time the window blurred — taking the pause,
     the save and (once it was added) the audio suspend down with it. The
     handler had been dead for a while and nothing said so. fansRelease() is
     what actually clears the pedals now. */
  kbd={}; held={up:0,down:0,left:0,right:0}; fireHeld=false; applyKeys();
  fansRelease();
  var lit=document.querySelectorAll('.tbtn.on');
  for (var li=0;li<lit.length;li++) lit[li].classList.remove('on');
  if (state==='playing') state='paused';
  saveGame();                       /* a record set mid-run isn't lost on a tab switch */
  audioSuspend();
}
window.addEventListener('blur', leaveGame);
window.addEventListener('pagehide', leaveGame);
document.addEventListener('visibilitychange', function(){
  if (document.hidden) leaveGame();
  else audioResume();               /* back in front: wake the graph up again */
});
function el(id){ return document.getElementById(id); }
function bindHold(node,on,off){
  if (!node) return;
  node.addEventListener('pointerdown', function(e){
    e.preventDefault(); audioInit();
    node.classList.add('on');
    try{ node.setPointerCapture(e.pointerId); }catch(_){}
    on();
  });
  ['pointerup','pointercancel'].forEach(function(t){
    node.addEventListener(t, function(e){
      e.preventDefault(); node.classList.remove('on'); off();
    });
  });
}
function bindTap(node,fn){
  if (!node) return;
  node.addEventListener('pointerdown', function(e){
    e.preventDefault(); audioInit(); node.classList.add('on'); fn();
  });
  ['pointerup','pointercancel'].forEach(function(t){
    node.addEventListener(t, function(){ node.classList.remove('on'); });
  });
}

/* ------------------------------------------------------------------
   THE THUMB FANS
   Two sliding pads instead of one. Each is a 135-degree arc of three
   wedges pivoting at the corner that thumb actually rests in, so a thumb
   can travel its whole range without ever lifting.

   LEFT  steers:   left / straight / right along one diagonal
   RIGHT drives:   gas in the middle, brake and drift on an outer ring

   Throttle used to ride along with steering, because the old layout had
   no other way to hold it one-handed. Now that the right thumb owns the
   pedals, steering is only steering — which is what makes it possible to
   brake and turn at the same time instead of pinning DRIFT to survive.

   The steering pad is one axis, not a fan: a thumb slides up-left to turn
   left and down-right to turn right, across a ridged centre strip that is
   deliberately dead. That strip is the whole point — it is somewhere to
   rest without steering, and it is wide enough that going straight is a
   position rather than a balancing act.

   The right pad is two shapes. GAS is a solid disc at the corner where the
   thumb rests flat — it is what you hold nearly all the time, so it gets
   the biggest, closest, least deliberate target. BRAKE and DRIFT sit on a
   ring further out, reached by *extending* the thumb, which is the
   deliberate motion they deserve. The gap between disc and ring is real:
   it stops a resting thumb grazing a pedal it did not mean to touch.
   ------------------------------------------------------------------ */
var FANS=[
  { id:'fanL', vbw:218, vbh:218, pvx:109.2, pvy:109.2, dir:null,
    axis:true, ang:45, neut:38,
    ids:['wRight','wUp','wLeft'],
    keys:[['right'],[],['left']] },
  /* Sector 3 is the trigger. It is not a wedge on the arc — it is the bar that
     sits just under the pad — but it belongs to this fan because that is the
     only way the right thumb can reach it. Before this, firing meant lifting
     off the gas and tapping a separate button, which is why nobody used it.
     Note keys[3] is ['up']: sliding onto the trigger must not cost you the
     throttle, exactly as DRIFT keeps 'up' held while it adds 'down'. */
  { id:'fanR', vbw:210, vbh:210, pvx:205, pvy:205, dir:null,
    ring:true,  a0:90, span:90, rGas:132,
    fireId:'bFire', fireIdx:3,
    ids:['wGas','wDrift','wBrake','bFire'],
    keys:[['up'],['up','down'],['down'],['up']] }
];
function fanSector(f,e){
  var n=el(f.id); if (!n || !n.getBoundingClientRect) return f.axis?1:0;
  /* The trigger bar is tested before any of the arc maths, and it has to be:
     it sits below the pad but well inside the gas disc's radius, so the
     distance check further down would read it as GAS. That is precisely why
     sliding the thumb down off the gas never reached it. */
  if (f.fireId){
    var fn=el(f.fireId);
    if (fn && fn.getBoundingClientRect){
      var fr=fn.getBoundingClientRect();
      if (fr.width>0 && e.clientX>=fr.left && e.clientX<=fr.right &&
                        e.clientY>=fr.top  && e.clientY<=fr.bottom) return f.fireIdx;
    }
  }
  var r=n.getBoundingClientRect();
  var px=r.left+r.width*(f.pvx/f.vbw), py=r.top+r.height*(f.pvy/f.vbh);
  var dx=e.clientX-px, dy=e.clientY-py;      /* screen space, y downwards */
  var sc=(r.width/f.vbw)||1;

  if (f.axis){
    /* Project onto the diagonal and ignore the perpendicular entirely, so
       the strip works however far along its length the thumb happens to be. */
    var rad=f.ang*Math.PI/180;
    var t=(dx*Math.cos(rad)+dy*Math.sin(rad))/sc;
    if (t> f.neut) return 0;                 /* down-right  -> steer right */
    if (t<-f.neut) return 2;                 /* up-left     -> steer left  */
    return 1;                                /* on the strip -> straight   */
  }

  var a=Math.atan2(-dy,dx)*180/Math.PI;      /* arc maths wants y upwards */
  var rel=a-f.a0;
  while (rel<0)    rel+=360;
  while (rel>=360) rel-=360;

  if (f.ring){
    /* Radius decides disc vs ring first, angle only splits the ring. The
       whole visual gap belongs to GAS: overshooting into it costs you
       nothing, overshooting into BRAKE at speed costs you the run. */
    if (Math.sqrt(dx*dx+dy*dy)/sc < f.rGas) return 0;
    if (rel<f.span) return rel < f.span/2 ? 1 : 2;
    return rel < (f.span+360)/2 ? 2 : 1;     /* nearest end of the ring wins */
  }
  return 0;
}
function fanSet(f,idx){
  if (idx===f.dir) return;
  var i,ks,n, was=f.dir;
  if (f.dir!==null){ ks=f.keys[f.dir];
    for (i=0;i<ks.length;i++) held[ks[i]]=Math.max(0,held[ks[i]]-1); }
  f.dir=idx;
  if (idx!==null){ ks=f.keys[idx]; for (i=0;i<ks.length;i++) held[ks[i]]++; }
  applyKeys();
  for (i=0;i<f.ids.length;i++){ n=el(f.ids[i]); if (n) n.classList.remove('on'); }
  if (idx!==null){ n=el(f.ids[idx]); if (n) n.classList.add('on'); }
  /* The trigger is not a key, so it cannot ride the held[] bookkeeping above.
     Entering the sector fires one round; staying in it only keeps firing while
     OVERDRIVE is lit, which is the fireHeld rule the main loop already owns. */
  if (f.fireIdx!==undefined){
    if (idx===f.fireIdx){
      fireHeld=true; if (state==='playing') fire();
      /* Light GAS too. Sliding onto the trigger keeps 'up' held, so letting the
         gas wedge go dark would have the pad reporting a lift-off that never
         happened — at 370 km/h that is the kind of thing you react to. */
      n=el(f.ids[0]); if (n) n.classList.add('on');
    }
    else if (was===f.fireIdx) fireHeld=false;
  }
}
function bindFan(f){
  var n=el(f.id); if (!n) return;
  n.addEventListener('pointerdown', function(e){
    e.preventDefault(); audioInit();
    try{ n.setPointerCapture(e.pointerId); }catch(_){}
    fanSet(f, fanSector(f,e));
  });
  n.addEventListener('pointermove', function(e){
    if (f.dir===null) return;           /* only tracks while a thumb is down */
    e.preventDefault();
    fanSet(f, fanSector(f,e));
  });
  ['pointerup','pointercancel'].forEach(function(t){
    n.addEventListener(t, function(e){ e.preventDefault(); fanSet(f,null); });
  });
}
/* Losing a pointer without an up event (app switch, call) would otherwise
   leave a pedal stuck down for the rest of the run. */
function fansRelease(){ for (var i=0;i<FANS.length;i++) fanSet(FANS[i],null); }

(function(){
  if (TOUCH) document.body.classList.add('touch');
  bindHold(el('bFire'),
    function(){ fireHeld=true; if (state==='playing') fire(); },
    function(){ fireHeld=false; });
  for (var i=0;i<FANS.length;i++) bindFan(FANS[i]);
  bindTap(el('bPause'), function(){
    if (state==='playing') state='paused'; else if (state==='paused') state='playing';
  });
  window.addEventListener('blur', fansRelease);
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) fansRelease();
  });
  /* Rotating moves both pads out from under the thumbs holding them. Without
     this a pedal stays latched for the rest of the run. */
  window.addEventListener('orientationchange', onRotate);
  /* Fullscreen can also end by a route we never see — Esc, a swipe, the
     system backing out — so listen rather than assuming our button is the
     only way it changes. */
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(t){
    document.addEventListener(t, function(){
      padState=null; syncFsClass(); scheduleCircuit();
    });
  });
  syncFsClass();
  window.addEventListener('resize', scheduleCircuit);
  if (window.matchMedia){
    var mq=window.matchMedia('(orientation: landscape)');
    if (mq.addEventListener) mq.addEventListener('change', onRotate);
    else if (mq.addListener) mq.addListener(onRotate);
  }
})();

function onRotate(){
  fansRelease();
  padState=null;                /* force the menu strip to re-lay-out */
  noteLandscape();
  scheduleCircuit();            /* the stage moved, so the board must follow */
}

/* ------------------------------------------------------------------
   FULLSCREEN
   Feature-detected rather than assumed, because iPhone Safari has no
   Fullscreen API at all — only iPad and Android do. Where it is missing
   the button never appears, instead of appearing and doing nothing. The
   iOS route to a full screen is "Add to Home Screen", which the metas in
   <head> already handle.
   ------------------------------------------------------------------ */
var FS_OK = (function(){
  var e=document.documentElement;
  return !!(e.requestFullscreen || e.webkitRequestFullscreen);
})();
function fsActive(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
/* CSS cannot match prefixed fullscreen reliably across engines, so the
   state is mirrored onto <body> and the layout keys off that instead.
   Going fullscreen reclaims the browser chrome, which shifts everything up
   under thumbs that have not moved — these offsets put it back. */
function syncFsClass(){
  document.body.classList.toggle('fs', fsActive());
}
/* ------------------------------------------------------------------
   CIRCUIT BACKGROUND
   Procedural, because a hand-drawn board would be tens of KB against the
   single-file rule and would not adapt to an arbitrary screen.

   Composition: the stage is treated as the chip. Traces leave its edges
   like pins, run outward on a grid at 0/45/90 degrees, and terminate in a
   via, a pad, or a small component. That reads as intentional rather than
   as noise, and it means the busiest area is the margin — where there is
   nothing to compete with — while the region behind the stage is left
   empty on purpose.

   Counts scale with viewport AREA rather than being fixed, so a phone in
   portrait and a desktop window both come out at the same visual density
   instead of the big screen looking bare.

   Drawn ONCE to its own canvas. It never touches the game loop. Repaint
   only on resize/rotation, debounced.
   ------------------------------------------------------------------ */
var CIRCUIT={
  /* density per 100k px^2, then clamped — a phone is ~330k, a laptop ~1.3M */
  pinsPer100k:   8.5, minPins:16,   maxPins:74,
  straysPer100k: 5.5, minStrays:10, maxStrays:48,
  chipsPer100k:  1.5, minChips:4,   maxChips:22,
  /* Phones read sparser than a monitor at the same per-area density: the
     board is squeezed into thin margins around the stage rather than spread
     over open desktop, so the eye samples less of it. Touch only — the
     desktop amount is already right. */
  mobileBoost:   1.28,

  cell:       24,      /* grid pitch; every segment is a multiple */
  segMin:     1,  segMax:3,
  stepMin:    3,  stepMax:8,
  turnOdds:   0.40,
  width:      1.5,

  base:      '150,110,255',
  alpha:      0.34,    /* dim, but present */
  accents:  ['33,230,255','255,47,190','124,255,79'],
  accentEvery:4,       /* 1 in N traces gets colour + glow */
  accentAlpha:0.60,

  /* Glow is layered strokes, not shadowBlur: two wider faint passes under
     the bright one. Same halo, a fraction of the cost, and it cannot bleed
     across the whole canvas the way a large blur radius does. */
  glowOuter:  0.20, glowOuterW:5.5,
  glowMid:    0.42, glowMidW:2.6,

  viaR:       3.2,
  padOdds:    0.26,    /* chance a trace ends in a pad instead of a via */
  chipOdds:   0.16,    /* ...or in a component */
  maxDpr:     2        /* a dim backdrop does not need 3x pixels */
};

var circuitCv=el('circuit'), circuitT=null;

function rrOn(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath();
}
function rgba(rgb,a){ return 'rgba('+rgb+','+a.toFixed(3)+')'; }

function ctrace(g,pts,rgb,a,w,glow){
  function run(width,alpha){
    var i;
    g.beginPath();
    g.moveTo(pts[0].x,pts[0].y);
    for (i=1;i<pts.length-1;i++) g.arcTo(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,7);
    g.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
    g.strokeStyle=rgba(rgb,alpha); g.lineWidth=width; g.stroke();
  }
  if (glow){
    run(w*CIRCUIT.glowOuterW, a*CIRCUIT.glowOuter);
    run(w*CIRCUIT.glowMidW,   a*CIRCUIT.glowMid);
  }
  run(w,a);
}

function cvia(g,p,rgb,a,glow){
  var r=CIRCUIT.viaR;
  /* every via gets a little bloom; accents get a lot */
  g.beginPath(); g.arc(p.x,p.y,r*(glow?3.4:2.0),0,Math.PI*2);
  g.fillStyle=rgba(rgb,a*(glow?0.30:0.12)); g.fill();
  g.beginPath(); g.arc(p.x,p.y,r,0,Math.PI*2);
  g.strokeStyle=rgba(rgb,a); g.lineWidth=CIRCUIT.width; g.stroke();
  g.beginPath(); g.arc(p.x,p.y,r*0.42,0,Math.PI*2);
  g.fillStyle=rgba(rgb,Math.min(1,a*1.3)); g.fill();
}
function cpad(g,p,rgb,a){
  var w=11,h=7;
  g.strokeStyle=rgba(rgb,a); g.lineWidth=CIRCUIT.width;
  rrOn(g,p.x-w/2,p.y-h/2,w,h,2); g.stroke();
}

/* A small IC: body, a notch dot, and leg ticks down both long sides. */
function cchip(g,x,y,rgb,a,glow){
  var w=16+((Math.random()*16)|0), h=10+((Math.random()*9)|0), i;
  var vert=Math.random()<0.4;
  if (vert){ var t=w; w=h; h=t; }
  g.lineWidth=CIRCUIT.width;
  if (glow){
    g.strokeStyle=rgba(rgb,a*CIRCUIT.glowOuter);
    g.lineWidth=CIRCUIT.width*4; rrOn(g,x-w/2,y-h/2,w,h,2.5); g.stroke();
    g.lineWidth=CIRCUIT.width;
  }
  g.fillStyle=rgba(rgb,a*0.10);
  rrOn(g,x-w/2,y-h/2,w,h,2.5); g.fill();
  g.strokeStyle=rgba(rgb,a); g.stroke();
  var legs=2+((Math.random()*3)|0), span=(vert?h:w)-8;
  g.beginPath();
  for (i=0;i<legs;i++){
    var f=legs===1?0.5:i/(legs-1), o=-span/2+span*f;
    if (vert){
      g.moveTo(x-w/2,y+o); g.lineTo(x-w/2-4,y+o);
      g.moveTo(x+w/2,y+o); g.lineTo(x+w/2+4,y+o);
    } else {
      g.moveTo(x+o,y-h/2); g.lineTo(x+o,y-h/2-4);
      g.moveTo(x+o,y+h/2); g.lineTo(x+o,y+h/2+4);
    }
  }
  g.strokeStyle=rgba(rgb,a*0.8); g.stroke();
  g.beginPath(); g.arc(x-w/2+3.5,y-h/2+3.5,1.2,0,Math.PI*2);
  g.fillStyle=rgba(rgb,a); g.fill();
}

/* A breaker / resistor: a stubby body with a lead out of each end. */
function cbreaker(g,x,y,rgb,a,glow){
  var w=14+((Math.random()*10)|0), h=7, lead=7;
  var rot=Math.random()<0.5?0:Math.PI/2;
  g.save(); g.translate(x,y); g.rotate(rot);
  g.lineWidth=CIRCUIT.width;
  if (glow){
    g.strokeStyle=rgba(rgb,a*CIRCUIT.glowOuter);
    g.lineWidth=CIRCUIT.width*4; rrOn(g,-w/2,-h/2,w,h,2); g.stroke();
    g.lineWidth=CIRCUIT.width;
  }
  g.fillStyle=rgba(rgb,a*0.12); rrOn(g,-w/2,-h/2,w,h,2); g.fill();
  g.strokeStyle=rgba(rgb,a); g.stroke();
  g.beginPath();
  g.moveTo(-w/2,0); g.lineTo(-w/2-lead,0);
  g.moveTo( w/2,0); g.lineTo( w/2+lead,0);
  g.stroke();
  g.beginPath();
  g.moveTo(-w/6,-h/2); g.lineTo(-w/6,h/2);
  g.moveTo( w/6,-h/2); g.lineTo( w/6,h/2);
  g.strokeStyle=rgba(rgb,a*0.55); g.stroke();
  g.restore();
}

function cwalk(g,x,y,dir,rgb,a,glow,vw,vh,box){
  var pts=[{x:x,y:y}], DIRS=8, steps=CIRCUIT.stepMin+
      ((Math.random()*(CIRCUIT.stepMax-CIRCUIT.stepMin+1))|0);
  for (var k=0;k<steps;k++){
    if (k>0 && Math.random()<CIRCUIT.turnOdds)
      dir=(dir + (Math.random()<0.5?1:DIRS-1))%DIRS;
    var ang=dir*Math.PI/4;
    var len=CIRCUIT.cell*(CIRCUIT.segMin+((Math.random()*
             (CIRCUIT.segMax-CIRCUIT.segMin+1))|0));
    var nx=x+Math.cos(ang)*len, ny=y+Math.sin(ang)*len;
    /* never re-enter the chip, and stop at the screen edge */
    if (box && nx>box.l-6 && nx<box.r+6 && ny>box.t-6 && ny<box.b+6) break;
    if (nx<-20||nx>vw+20||ny<-20||ny>vh+20) break;
    x=nx; y=ny; pts.push({x:x,y:y});
  }
  if (pts.length<2) return;
  ctrace(g,pts,rgb,a,CIRCUIT.width,glow);
  var end=pts[pts.length-1], roll=Math.random();
  if (roll<CIRCUIT.chipOdds)             cchip(g,end.x,end.y,rgb,a,glow);
  else if (roll<CIRCUIT.chipOdds+CIRCUIT.padOdds) cpad(g,end,rgb,a);
  else                                   cvia(g,end,rgb,a,glow);
}

function ccount(per100k,mn,mx,area){
  return Math.max(mn, Math.min(mx, Math.round(area/100000*per100k)));
}

function drawCircuit(){
  if (!circuitCv || !circuitCv.getContext) return;   /* every layout draws it */
  var vw=window.innerWidth, vh=window.innerHeight;
  var d=Math.min(window.devicePixelRatio||1, CIRCUIT.maxDpr);
  circuitCv.width=Math.round(vw*d); circuitCv.height=Math.round(vh*d);
  var g=circuitCv.getContext('2d');
  g.setTransform(d,0,0,d,0,0);
  g.clearRect(0,0,vw,vh);
  g.lineCap='round'; g.lineJoin='round';

  var st=el('stage'), box=null;
  if (st && st.getBoundingClientRect){
    var r=st.getBoundingClientRect();
    box={l:r.left,t:r.top,r:r.right,b:r.bottom};
  }
  var area=vw*vh, i, n=0;
  var boost=TOUCH ? CIRCUIT.mobileBoost : 1;
  var nPins  =ccount(CIRCUIT.pinsPer100k*boost,  CIRCUIT.minPins,  CIRCUIT.maxPins,  area);
  var nStrays=ccount(CIRCUIT.straysPer100k*boost,CIRCUIT.minStrays,CIRCUIT.maxStrays,area);
  var nChips =ccount(CIRCUIT.chipsPer100k*boost, CIRCUIT.minChips, CIRCUIT.maxChips, area);

  function nextStyle(){
    n++;
    return (n % CIRCUIT.accentEvery)===0
      ? { rgb:CIRCUIT.accents[(Math.random()*CIRCUIT.accents.length)|0],
          a:CIRCUIT.accentAlpha, glow:true }
      : { rgb:CIRCUIT.base, a:CIRCUIT.alpha, glow:false };
  }
  function clearOfBox(x,y,m){
    return !box || x<box.l-m || x>box.r+m || y<box.t-m || y>box.b+m;
  }

  if (box){
    for (i=0;i<nPins;i++){
      var side=(Math.random()*4)|0, x,y,dir;
      var t=0.06+Math.random()*0.88;
      if (side===0){ x=box.l; y=box.t+(box.b-box.t)*t; dir=4; }
      else if (side===1){ x=box.r; y=box.t+(box.b-box.t)*t; dir=0; }
      else if (side===2){ x=box.l+(box.r-box.l)*t; y=box.t; dir=6; }
      else { x=box.l+(box.r-box.l)*t; y=box.b; dir=2; }
      var s1=nextStyle();
      cpad(g,{x:x,y:y},s1.rgb,s1.a*0.9);
      cwalk(g,x,y,dir,s1.rgb,s1.a,s1.glow,vw,vh,box);
    }
  }
  for (i=0;i<nStrays;i++){
    var sx=Math.random()*vw, sy=Math.random()*vh;
    if (!clearOfBox(sx,sy,30)) continue;
    var s2=nextStyle();
    cwalk(g,sx,sy,(Math.random()*8)|0,s2.rgb,s2.a*0.85,s2.glow,vw,vh,box);
  }
  for (i=0;i<nChips;i++){
    var cx2=20+Math.random()*(vw-40), cy2=20+Math.random()*(vh-40);
    if (!clearOfBox(cx2,cy2,34)) continue;
    var s3=nextStyle();
    if (Math.random()<0.55) cchip(g,cx2,cy2,s3.rgb,s3.a,s3.glow);
    else                    cbreaker(g,cx2,cy2,s3.rgb,s3.a,s3.glow);
  }
}
function scheduleCircuit(){
  if (circuitT) clearTimeout(circuitT);
  circuitT=setTimeout(function(){ circuitT=null; drawCircuit(); }, 140);
}

function toggleFullscreen(){
  try{
    if (fsActive()){
      var x=document.exitFullscreen || document.webkitExitFullscreen;
      if (x) x.call(document);
    } else {
      var e=document.documentElement;
      var r=e.requestFullscreen || e.webkitRequestFullscreen;
      /* must be inside a user gesture, which bindTap guarantees */
      if (r) r.call(e);
    }
  }catch(_){}                   /* a refusal is not worth breaking a run over */
}
/* Seeing landscape once is what retires the nudge — there is no button to
   dismiss, because having actually tried it is better evidence than a tap. */
function noteLandscape(){
  if (!sawLandscape && TOUCH && isLandscape()){ sawLandscape=true; saveGame(); }
}

/* The menu strip swaps its buttons to match whatever screen is showing. */
var padDrive=el('padDrive'), padMenu=el('padMenu'), padState=null, padAudio=null, padLang=null, padMode=null, padFull=null;
var PAD_ACTS={
  start:  function(){ reset(); state='playing'; },
  resume: function(){ state='playing'; },
  garage: function(){ garFrom=state; garRow=0; state='garage'; },
  info:   function(){ infoFrom=state; infoPage=0; state='info'; },
  infoPrev: function(){ infoPage=(infoPage+INFO_PAGES-1)%INFO_PAGES; },
  infoNext: function(){ infoPage=(infoPage+1)%INFO_PAGES; },
  back:   function(){ state = (state==='garage') ? garFrom : infoFrom; },
  menu:   function(){ saveGame(); state='title'; },
  sound:  function(){ cycleAudio(); },
  lang:   function(){ toggleLang(); padState=null; },
  mode:   function(){ toggleMode(); padState=null; },

  rowUp:  function(){ garageKey('ArrowUp'); },
  rowDn:  function(){ garageKey('ArrowDown'); },
  prev:   function(){ garageKey('ArrowLeft'); },
  next:   function(){ garageKey('ArrowRight'); }

/* Line art for the settings tiles. Stroked with currentColor so a tile lights

var ICONS={

var TIL_SND=['TIL_SND0','TIL_SND1','TIL_SND2','TIL_SND3'];
var SLAB_ST={title:1, paused:1, gameover:1};

function padBtn(label,act,cls,icon){
  var b=document.createElement('button');
  b.className='tbtn'+(cls?' '+cls:'');
  if (icon){
    b.innerHTML=icon+'<span class="lab"></span>';
    b.lastChild.textContent=label;     /* text, never markup */
  } else b.textContent=label;
  bindTap(b, PAD_ACTS[act]);
  return b;
}

function syncPad(){
  if (!TOUCH) return;
  var fsNow=fsActive();
  if (state===padState && audioMode===padAudio && lang===padLang &&
      mode===padMode && fsNow===padFull) return;
  padState=state; padAudio=audioMode; padLang=lang; padMode=mode; padFull=fsNow;
  var driving = (state==='playing');
  padDrive.style.display = driving ? 'flex' : 'none';
  /* The garage lays its arrows out as a cross, which needs grid rather than
     the wrapping row the remaining screens use. */
  padMenu.style.display  = driving ? 'none' : (state==='garage' ? 'grid' : 'flex');
  padMenu.classList.toggle('cross', state==='garage');
  padMenu.classList.toggle('slabs', !!SLAB_ST[state]);
  if (driving) return;
  padMenu.innerHTML='';

  /* Title, pause and game over all share one shape, so the buttons never
     move between them: three slabs on the left, the same four tiles on the
     right. Only the top slab changes label — DRIVE, RESUME, RACE AGAIN. */
  if (SLAB_ST[state]){
    var L = state==='title' ?
              [[T('MOB_DRIVE'),'start'],
               [mode==='cruise'?T('MODE_RUN'):T('MODE_CRUISE'),'mode'],
               [T('MOB_GARAGE'),'garage']] :
            state==='paused' ?
              [[T('MOB_RESUME'),'resume'],
               [T('MOB_MAIN_MENU'),'menu'],
               [T('MOB_GARAGE'),'garage']] :
              [[T('MOB_RACE_AGAIN'),'start'],
               [T('MOB_MAIN_MENU'),'menu'],
               [T('MOB_GARAGE'),'garage']];
    var cl=document.createElement('div'); cl.className='col l';
    L.forEach(function(d,i){ cl.appendChild(padBtn(d[0],d[1],'slab'+(i?'':' big'))); });

    var cr=document.createElement('div'); cr.className='col r';
    cr.appendChild(padBtn(T('MOB_INFO'),'info','tile',ICONS.info));
    cr.appendChild(padBtn(T(TIL_SND[audioMode]),'sound','tile',
                          ICONS[audioMode===0?'snd0':(audioMode===3?'snd3':'snd1')]));
    cr.appendChild(padBtn(T('MOB_LANG'),'lang','tile',ICONS.lang));
    if (FS_OK) cr.appendChild(padBtn(fsNow?T('TIL_EXIT'):T('TIL_FULL'),'full','tile',
                                     fsNow?ICONS.unfull:ICONS.full));
    padMenu.appendChild(cl); padMenu.appendChild(cr);
    return;
  }

  var defs =
    state==='garage'   ? [['\u25B2','rowUp','nav up'],['\u25C0','prev','nav left'],
                          ['\u25B6','next','nav right'],['\u25BC','rowDn','nav down'],
                          [T('MOB_BACK'),'back','backbtn']] :
    state==='info'     ? [['\u25C0','infoPrev','nav'],['\u25B6','infoNext','nav'],
                          [T('MOB_BACK'),'back','']] :
                         [[T('MOB_BACK'),'back','']];
  defs.forEach(function(dfn){
    padMenu.appendChild(padBtn(dfn[0],dfn[1],dfn[2]));
  });
}

cv.addEventListener('pointerdown', function(){
  audioInit();
  if (state==='title'||state==='gameover'){ reset(); state='playing'; }
});

/* ---------------------------------------------------------------
   TRAFFIC
--------------------------------------------------------------- */
function trySpawn(){
  var z=position + 50000 + Math.random()*4000;
  var win=clusterWin(lap), near=0, blocked={}, i, d;
  for (i=0;i<cars.length;i++){
    d=Math.abs(cars[i].z - z);
    if (d < win) near++;
    if (d < 2800) blocked[cars[i].lane]=true;
  }
  if (near >= maxCluster(lap)) return;
  var free=[];
  for (i=0;i<LANES.length;i++) if (!blocked[i]) free.push(i);
  if (free.length <= 1) return;              // always leave a way through
  var lane=free[(Math.random()*free.length)|0];
  var top=trafficTop(lap);
  var weav=Math.random() < weaverOdds(lap);
  cars.push({
    z:z, lane:lane, x:LANES[lane],
    speed: top*(0.55+Math.random()*0.45),
    color: weav ? '#ffd23f' : PAL[(Math.random()*PAL.length)|0],
    passed:false,
    weaver:weav, phase:weav?'wait':null, sigT:0, moveT:0, sigDir:0,
    fromX:0, toLane:0,
    changeT: 0.8+Math.random()*1.6         // first move soon after it appears
  });
}

function fire(){
  if (spinT>0 || fireCd>0) return;
  var col='#8ef4ff';
  if (odT>0){
    col=OD_COLS[odShotN%OD_COLS.length];   /* purple, green, orange, white */
    odShotN++;
  } else {
    if (shots<=0) return;
    shots--;
  }
  fireCd = (odT>0 ? OD_CD : FIRE_CD);
  pshots.push({z:position+Z_CAR+240, x:playerX, prevZ:position+Z_CAR, isShot:true, col:col});
  shake=Math.max(shake, odT>0?3:4.5);
  blip(odT>0?1750:1500,0.05,'square',0.15);
  setTimeout(function(){ blip(680,0.12,'sawtooth',0.12); },45);
}

/* One bolt, from wherever it came: a pickup, or a drift you banked. Kept in
   one place so the drift award cannot drift out of step with the pickup. */
function giveBolt(){
  if (odT>0){                       /* already lit: top it back up */
    odT=OD_TIME; score+=500;
    say(T('T_OD_REFRESH'),'#ffd23f',true,'bolt');
    overdriveSfx();
    return;
  }
  shots++;
  if (shots>=MAX_SHOTS){            /* the third one tips you over */
    shots=0; odT=OD_TIME; odShotN=0; flash=1;
    shake=Math.max(shake,7);
    say(T('T_OD_ON')+OD_TIME+'s','#ffd23f',true,'bolt');
    overdriveSfx();
  } else {
    say(T('T_SHOT_LOADED1')+shots+T('T_SHOT_LOADED2')+MAX_SHOTS,'#21e6ff',true,'bolt');
    blip(520,0.07,'square',0.18);
    setTimeout(function(){ blip(780,0.07,'square',0.18); },70);
    setTimeout(function(){ blip(1170,0.18,'square',0.18); },140);
  }
}

function crash(){
  dPot=0;                         /* a drift you crash out of pays nothing */
  chain=0; chainT=0;              /* any contact breaks the chain, always */
  invT=2.3; hitFlash=1;
  if (odT>0){
    /* no invulnerability, but the aura carries you through: half your speed
       and a jolt instead of a spin and a dead stop */
    speed*=0.5; spinT=0; shake=12;
  } else {
    speed*=0.2; spinT=0.85; shake=15;
  }
  crashSfx();
  /* In cruise the impact still costs you momentum and the chain — it should
     sting — but health and the clock are not in play at all, so there is
     nothing to lose and nothing to end. */
  if (mode==='cruise') return;

  health--;
  timeLeft=Math.max(0, timeLeft-CRASH_TIME);
  if (health<=0){
    endReason='WRECKED'; state='gameover'; best=Math.max(best,score|0); saveGame();
  } else if (timeLeft<=0){
    endReason='OUT OF TIME'; state='gameover'; best=Math.max(best,score|0); saveGame();
  } else {
    say(T('T_CRASH')+CRASH_TIME+T('T_CRASH_S'),'#ff5d5d',true);
  }
}

/* ---------------------------------------------------------------
   UPDATE
--------------------------------------------------------------- */
function update(dt){
  var i,c,dz;

  shake *= Math.pow(0.02,dt);
  hitFlash=Math.max(0,hitFlash-dt*2.6);
  flash   =Math.max(0,flash-dt*1.8);
  for (i=msgs.length-1;i>=0;i--){ msgs[i].life-=dt; if (msgs[i].life<=0) msgs.splice(i,1); }

  if (state!=='playing'){
    if (state!=='garage' && state!=='info' && state!=='paused') position += 2400*dt;
    ensure(position+MAXZ+Z_CAR+CH);
    cAnchor=curveAt(position+Z_CAR);
    curSlope=slopeAt(position+Z_CAR);
    warnSlope=slopeAt(position+Z_CAR+17000);
    bgX += (-curSlope*108000 - bgX)*Math.min(1,3*dt);
    engine(ENG_IDLE, state==='title');
    screech(0);
    musMix();
    return;
  }

  var maxS=maxSpeedFor(lap);
  var spct=clamp(speed/maxS,0,1);

  /* last frame's drift state, so the exit can be spotted. Set true again below
     only while the drift is live; spinning out counts as not drifting. */
  var wasDrift=drifting; drifting=false;

  if (spinT>0){
    spinT-=dt; spinAng+=dt*11;
    speed-=maxS*0.9*dt;
    steerVel*=Math.pow(0.05,dt);
  } else {
    spinAng*=Math.pow(0.001,dt);

    // Calculate input first to check for drifting
    var input = (keys.left?-1:0) + (keys.right?1:0);
    
    // Drift condition: braking + steering + moving at a decent speed
    var isDrifting = keys.down && input !== 0 && speed > maxS * 0.35;

    var both = keys.up && keys.down;

    if (both){
      /* holding both is a drift tool, not free speed — it bleeds off at the
         same rate as a plain brake until you sit 20% below your top speed */
      var floorS = maxS*DRIFT_HOLD;
      if (speed > floorS){
        speed -= (maxS/1.15)*dt;
        if (speed < floorS) speed = floorS;
      }
      /* at or below the floor it simply holds: you can drift at a steady 80%
         indefinitely, but holding both can never gain you speed */
    } else if (keys.up) {
      speed += (maxS/3.1)*dt;
    } else if (keys.down) {
      speed -= isDrifting ? (maxS/2.2)*dt : (maxS/1.15)*dt;
    } else {
      speed -= (maxS/6.5)*dt;
    }

    var grip = CH_().grip;
    var agility = (1.60 - 0.70 * spct) * grip;
    var resp = (9.5 - 5.4 * spct) * grip;

    // Apply drift physics and screeching sound effect
    if (isDrifting) {
      agility *= 1.85; // Significantly sharper turning radius
      resp *= 1.4;     // Faster response snapping into the turn
      shake = Math.max(shake, 1.2); // Add a subtle rumble to the camera
      

      /* charge the pot — bend and speed gates, see the DR_ block */
      drifting = true;
      if (speed >= maxS*DR_MIN_SPD){
        var bendF = Math.abs(curSlope)/S_PEAK;
        if (bendF > DR_MIN_BEND) dPot += Math.min(1,bendF)*DR_RATE*dt;
      }
    }

    steerVel += (input*agility-steerVel)*Math.min(1,resp*dt);
  }

  if (Math.abs(playerX)>1){
    if (speed > maxS*0.45) speed -= (maxS/2.0)*dt;
    shake=Math.max(shake, 2.4*spct);
    scrapeCd-=dt;                /* was up to 24 onsets a second: same crackle */
    if (scrapeCd<=0 && Math.random()<spct*0.6){
      scrapeCd=0.11;
      blip(90+Math.random()*60,0.05,'triangle',0.05, playerX>0?0.85:-0.85);
    }
    dPot=0;                      /* nothing earned off the road ever banks */
  }

  /* Came out of a drift still on the road: the pot becomes a bank, and a full
     bank is a bolt. Sits after the shoulder test so an exit that puts a wheel
     off the road has already been voided by it. */
  screech(drifting ? 0.45+Math.min(1,Math.abs(steerVel)*0.9)*0.55 : 0);

  if (wasDrift && !drifting && dPot>0){
    dBank += dPot; dPot=0;
    while (dBank>=1){ dBank-=1; giveBolt(); }
  }

  speed=clamp(speed,0,maxS);
  spct =clamp(speed/maxS,0,1);

  playerX += steerVel*dt*Math.min(1, spct*3.2);

  /* the bend throws you wide — measured where the car actually is */
  playerX -= curSlope*speed*dt*(0.007 + 0.024*Math.pow(spct,1.5));

  if (playerX> 1.55){ playerX= 1.55; steerVel=0; }
  if (playerX<-1.55){ playerX=-1.55; steerVel=0; }

  position += speed*dt;
  score    += speed*dt/220;
  invT=Math.max(0,invT-dt);

  /* the chain lapses on its own if you stop threading traffic */
  if (chainT>0){
    chainT-=dt;
    if (chainT<=0) chain=0;
  }
  for (i=nmPops.length-1;i>=0;i--){
    nmPops[i].t+=dt;
    if (nmPops[i].t>NM_POP_LIFE) nmPops.splice(i,1);
  }

  ensure(position+MAXZ+Z_CAR+CH);
  cAnchor =curveAt(position+Z_CAR);
  curSlope=slopeAt(position+Z_CAR);
  warnSlope=slopeAt(position+Z_CAR+17000);
  bgX += (-curSlope*108000 - bgX)*Math.min(1,3*dt);

  if (mode==='run'){
    timeLeft-=dt;
    if (timeLeft<=0){
      timeLeft=0; endReason='OUT OF TIME'; state='gameover'; best=Math.max(best,score|0); saveGame();
    }
  }

  if (position+Z_CAR >= nextCP){
    lap++;
    cpStart=nextCP; cpLen=lapLength(lap); nextCP=cpStart+cpLen;
    var award=cpBonus(lap);
    timeLeft += award;
    /* The lap<=3 clamp to CLOCK_CAP is gone. It only ever bit a player who was
       ALREADY doing well — someone struggling never reached 48s in the first
       place — so all it did was confiscate the early margin from good play and
       hand nothing to anyone. The generous early awards are the beginner
       assist now, and the tapering multiplier plus the traffic curve take that
       cushion back over the following ten laps. */
    score+=2500; flash=1;
    /* ONE CARD, NOT FIVE SENTENCES.
       This block used to fire up to five separate say() lines at the same
       instant. On lap 8 that was a 480x117 slab parked at y=120 — across the
       horizon (y=212) and over the traffic you were closing on at 14,400
       units a second. The card is now:
         line 1  LAP n  +award        (the two numbers that matter)
         line 2  chip row             (what this leg carries, as icons)
         line 3  hazard alert         (only on the lap one is introduced)
       heart early in the leg, bolt later, so they never land on top of each
       other and you get a reason to keep pushing through the middle. Hull
       kits scale with the punishment: one, then two, then three. */
    /* The unlock schedule, moved forward. Everything interesting used to sit
       behind minutes of driving: the first shot at 46s, the rampage at 103s,
       the first lane-changing van at 201s. Someone trying the game out of
       curiosity quit before any of it. Note also that the old heart rule was
       `lap>=7 || lap%2===0`, which gave laps 2, 4 and 6 a heart and laps 1, 3
       and 5 none — an accident of the modulo, not a decision. */
    /* Three from lap 7, not from lap 10. The simulation had flagged that health
       and not the clock was probably the meter that runs out after lap 10 —
       1 to 2 crashes a leg against a 4-bar cap — and playtesting confirmed it.
       The extra bar is the cheap fix; the clock multiplier stays as tuned. */
    var hearts = lap>=7 ? 3 : 1;
    var bolts  = lap>=6 ? 2 : 1;                   /* shooting from lap 1     */
    var dinos  = lap>=3 ? 1 : 0;                   /* rampage at ~37s in      */
    /* Only claim a speed bump when there is one. Top speed caps at lap 7, so
       the old unconditional "TOP SPEED UP" was false on every lap after it. */
    var spdUp  = maxSpeedFor(lap) > maxSpeedFor(lap-1);

    say(T('T_LAP')+lap+'   +'+award+T('T_CP_S'),'#7cff4f',true,null,CP_MSG);
    var chips=[];
    if (hearts>0) chips.push({icon:'heart', n:hearts});
    if (bolts >0) chips.push({icon:'bolt',  n:bolts});
    if (dinos >0) chips.push({icon:'dino',  n:dinos});
    if (spdUp)    chips.push({icon:'spd',   n:1, label:T('T_SPD')});
    if (chips.length) sayChips(chips,'#21e6ff',CP_MSG);

    if (hearts>0){
      addPickup('heart',0.10,0.20);
      if (hearts>1) addPickup('heart',0.40,0.48);
      if (hearts>2) addPickup('heart',0.66,0.74);
    }
    if (bolts>0){
      addPickup('bolt',0.26,0.36);
      if (bolts>1) addPickup('bolt',0.80,0.90);     /* a second round per leg */
    }
    if (dinos>0) addPickup('dino',0.52,0.62);
    /* Must match weaverOdds() — this warning fired on lap 8 while the vans
       themselves moved to lap 5, so for three laps you met the hazard with no
       warning at all and then got told about it long after you had worked it
       out. If weaverOdds moves again, move this with it. */
    if (weaverOdds(lap)>0 && !taughtWeavers){
      taughtWeavers=true;
      say(T('T_WEAVERS'),'#ffd23f',false,'warn',CP_MSG);
    }
    blip(660,0.10,'square',0.2);
    setTimeout(function(){ blip(990,0.16,'square',0.2); },110);
  }

  for (i=cars.length-1;i>=0;i--){
    c=cars[i];
    c.z+=c.speed*dt;
    dz=c.z-position-Z_CAR;               // distance from the car you can see
    var dzPrev=dz+(speed-c.speed)*dt;    // where it was one step ago
    if (!c.passed && dz<0){
      c.passed=true; overtakes++;
      score+=180*(1+0.2*(lap-1));
      blip(1200,0.05,'sine',0.06);

      /* NEAR MISS — the reason to shave past traffic instead of avoiding it.
         This lives INSIDE the overtake block on purpose. It used to be a
         separate test further down that also required !c.passed, which the
         line above had already set in the same iteration — so the condition
         was unsatisfiable and the whole mechanic was dead. The moment a car
         draws level is exactly here; there is no second place to check it.

         The band is under half a lane wide, so it cannot trigger from
         ordinary lane discipline — you have to aim at the gap. */
      var nmLat=Math.abs(c.x-playerX);
      if (dinoT<=0 && spinT<=0 && nmLat<NM_BAND && nmLat>=CAR_W-0.01 &&
          speed>maxSpeedFor(lap)*0.45){
        chain++; chainT=NM_CHAIN_T;
        if (chain>chainBest) chainBest=chain;
        var close=1-(nmLat-(CAR_W-0.01))/(NM_BAND-(CAR_W-0.01));
        var mult=Math.min(NM_MAX_MULT, chain);
        /* runs 0.5 at the outer edge of the band to 1.5 for a paint-scraping
           pass — the part of the score the player has no other way to see */
        var closeMul=0.5+close;
        score += Math.round(NM_BASE*closeMul*mult*(1+0.2*(lap-1)));
        var nmSide=(c.x>playerX?1:-1);
        nmPops.push({m:closeMul, t:0, side:nmSide});
        if (nmPops.length>5) nmPops.shift();
        /* the chirp comes from the side the car went by and slides down as it
           passes: a Doppler read for the one thing you cannot see happening */
        blip(760+Math.min(8,chain)*90, 0.05, 'sine', 0.07, nmSide*0.8, 0.78);
        if (chain===5||chain===10||chain===20)
          say(T('T_CHAIN')+chain,'#ffd23f',true,null,1.4);
      }
    }
    if (dz<-2600){ cars.splice(i,1); continue; }
    if (c.weaver){
      c.changeT -= dt;                    /* the clock runs through every phase,
                                             so changes land a true 5s apart */
      if (c.phase==='wait'){
        /* Gate on TIME to reach you, not distance. Barrel along and the vans
           settle early; ease off and they keep weaving right in front of you,
           which is the only way you ever get to watch one do it. */
        var ttc = dz/Math.max(400, speed-c.speed);
        if (c.changeT<=0 && ttc>WEAVE_TTC && dz>1500){
          var opts=[], j, k, ok;
          for (j=-1;j<=1;j+=2){
            k=c.lane+j;
            if (k<0||k>3) continue;
            ok=true;
            for (var q=0;q<cars.length;q++){
              if (cars[q]!==c && cars[q].lane===k && Math.abs(cars[q].z-c.z)<4200){ ok=false; break; }
            }
            if (ok) opts.push(k);
          }
          if (opts.length){
            c.toLane=opts[(Math.random()*opts.length)|0];
            c.sigDir=c.toLane>c.lane?1:-1;
            c.sigT=0.8;                       // blink before it commits
            c.phase='signal';
            c.changeT=WEAVE_EVERY;            // next one is due 5s from now
          } else c.changeT=1.2;               // boxed in: try again shortly
        }
      } else if (c.phase==='signal'){
        c.sigT-=dt;
        if (c.sigT<=0){ c.phase='move'; c.moveT=0.8; c.fromX=c.x; }
      } else if (c.phase==='move'){
        c.moveT-=dt;
        var tt=clamp(1-c.moveT/0.8,0,1);
        c.x=c.fromX+(LANES[c.toLane]-c.fromX)*(tt*tt*(3-2*tt));
        if (c.moveT<=0){
          c.x=LANES[c.toLane]; c.lane=c.toLane;
          c.phase='wait';
        }
      }
    }

    /* swept in z: a gap closing at 10,000 units/sec cannot skip the box */
    var inBox = Math.min(dz,dzPrev)<HIT_FRONT && Math.max(dz,dzPrev)>-HIT_BACK;
    var lat = Math.abs(c.x-playerX);

    if (dinoT>0){
      if (inBox && lat<DINO_HIT){
        blasts.push({z:c.z, x:c.x, t:0, isBlast:true});
        score += killScore();
        cars.splice(i,1);
        blip(150,0.20,'sawtooth',0.16);
        shake=Math.max(shake,6);
        continue;
      }
    } else if (invT<=0 && spinT<=0 && inBox && lat<CAR_W-0.01) crash();
  }
  if (fireHeld && odT>0) fire();      /* held trigger only runs in overdrive */

  spawnT-=dt;
  if (spawnT<=0){ spawnT=spawnGap(lap)*(0.7+Math.random()*0.7); trySpawn(); }

  for (i=pickups.length-1;i>=0;i--){
    var pk=pickups[i];
    var pdz=pk.z-position-Z_CAR, pdzPrev=pdz+speed*dt;
    if (pdz<-3000){ pickups.splice(i,1); continue; }
    var reach = pk.kind==='dino' ? DINO_R : HEART_R;
    if (Math.min(pdz,pdzPrev)<HIT_FRONT && Math.max(pdz,pdzPrev)>-HIT_BACK &&
        Math.abs(pk.x-playerX)<reach){
      pickups.splice(i,1); flash=1;
      if (pk.kind==='heart'){
        if (health<CH_().hp){ health++; say(T('T_HULL_UP'),'#ff6ad5',true,'heart'); }
        else { score+=10000; say(T('T_HULL_FULL'),'#ff6ad5',true,'heart'); }
        blip(740,0.09,'sine',0.2);
        setTimeout(function(){ blip(988,0.09,'sine',0.2); },90);
        setTimeout(function(){ blip(1319,0.20,'sine',0.2); },180);
      } else if (pk.kind==='bolt'){
        giveBolt();
      } else {
        dinoT=DINO_TIME; shake=Math.max(shake,8);
        say(T('T_RAMPAGE_ON')+DINO_TIME+'s','#7cff4f',true,'dino');
        roar();
      }
    }
  }


  /* the saucer: drifts along the road at half your speed, so you reel it in
     slowly instead of blowing past it. Scenery only — nothing collides. */
  if (ufo){
    ufo.z    += speed*0.5*dt;
    ufo.phase+= ufo.rate*dt;
    ufo.x     = ufo.amp*Math.sin(ufo.phase);
    ufo.spin += dt*2.4;
    ufo.bob  += dt;
    ufo.beamT-= dt;
    if (ufo.beamT<=0){                       /* the beam blinks on and off */
      ufo.beamOn=!ufo.beamOn;
      ufo.beamT = ufo.beamOn ? (0.5+Math.random()*1.4) : (0.7+Math.random()*2.2);
    }
    ufo.life -= dt;
    if (ufo.life<1.4) ufo.fade=Math.max(0,ufo.life/1.4);
    if (ufo.life<=0 || ufo.z-position-Z_CAR < -3200) ufo=null;
  } else {
    ufoT -= dt;
    if (ufoT<=0){
      ufoT = 20+Math.random()*14;
      ufo = { z: position+44000+Math.random()*6000, x:0,
              amp: 1.5+Math.random()*1.0, rate: 0.45+Math.random()*0.60,
              phase: Math.random()*Math.PI*2,
              hover: 0.95+Math.random()*0.50, bob: Math.random()*6, spin:0,
              color: PROP_COLS[(Math.random()*PROP_COLS.length)|0],
              beamOn: Math.random()<0.5, beamT: 0.6+Math.random()*1.4,
              life: 26, fade: 1, isUfo: true };
      ufo.x = ufo.amp*Math.sin(ufo.phase);
    }
  }

  /* Cruise has no fail state, so its score is unbounded — a long enough
     session would beat any legitimate run. It never touches `best`. */
  if (mode==='run' && (score|0)>best) best=score|0;
  if (fireCd>0) fireCd=Math.max(0,fireCd-dt);
  if (odT>0){
    var wasO=odT;
    odT=Math.max(0,odT-dt);
    if (wasO>DINO_WARN && odT<=DINO_WARN){
      rampageWarn();
      say(T('T_OD_ENDING'),'#ffd23f',true,'bolt');
    }
    if (odT===0) say(T('T_OD_SPENT'),'#8a7ec4');
  }

  if (dinoT>0){
    var wasT=dinoT;
    dinoT=Math.max(0,dinoT-dt);
    /* call it before it drops, not after — running out mid-traffic while
       you still think you are invincible is how you lose a run */
    if (wasT>DINO_WARN && dinoT<=DINO_WARN){
      rampageWarn();
      say(T('T_RAMPAGE_ENDING'),'#ffd23f',true,'dino');
    }
    if (dinoT===0) say(T('T_BACK_TO_CAR'),'#8a7ec4');
  }

  /* rounds in flight: they pierce, so one shot can clear a whole queue */
  var shotV=maxSpeedFor(lap)*1.5;
  for (i=pshots.length-1;i>=0;i--){
    var sh=pshots[i];
    sh.prevZ=sh.z;
    sh.z += shotV*dt;
    for (var j=cars.length-1;j>=0;j--){
      var tc=cars[j];
      if (Math.abs(tc.x-sh.x)<0.22 && tc.z>sh.prevZ-340 && tc.z<=sh.z+340){
        blasts.push({z:tc.z, x:tc.x, t:0, isBlast:true});
        score += killScore();
        cars.splice(j,1);
        blip(150,0.20,'sawtooth',0.16);
      }
    }
    if (sh.z>position+MAXZ) pshots.splice(i,1);
  }
  for (i=blasts.length-1;i>=0;i--){
    blasts[i].t += dt/0.7;
    if (blasts[i].t>=1 || blasts[i].z<position-3000) blasts.splice(i,1);
  }

  engine(speed/SPD_REF,true);
  musMix();
}

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,horizonY);
  g.addColorStop(0,'#0a0418'); g.addColorStop(0.55,'#2a0b4e'); g.addColorStop(1,'#6b1170');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,horizonY+1);

  var now=performance.now();
  for (var i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=s.a*(0.45+0.55*Math.abs(Math.sin(i+now/1400)));
    ctx.fillStyle='#dcefff';
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.globalAlpha=1;

  var cxs=W/2+bgX*0.6, cys=horizonY+18, R=88;
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,W,horizonY); ctx.clip();
  var sg=ctx.createLinearGradient(0,cys-R,0,cys+R);
  sg.addColorStop(0,'#fff27a'); sg.addColorStop(0.45,'#ff9b3d'); sg.addColorStop(1,'#ff2fbe');
  ctx.shadowColor='rgba(255,80,190,.85)'; ctx.shadowBlur=50;
  ctx.beginPath(); ctx.arc(cxs,cys,R,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(12,4,26,0.85)';
  for (var k=0;k<7;k++){
    var yy=cys-R+26+k*10+k*k*1.4;
    ctx.fillRect(cxs-R,yy,R*2,2+k*0.9);
  }
  ctx.restore();

  var shift=((bgX%TILE)+TILE)%TILE;
  for (var pass=0;pass<2;pass++){
    var ox=shift-40-pass*TILE;
    for (var b=0;b<skyline.length;b++){
      var bd=skyline[b], bx=bd.x+ox;
      if (bx>W||bx+bd.w<0) continue;
      ctx.fillStyle='#14062b';
      ctx.fillRect(bx,horizonY-bd.h,bd.w,bd.h);
      ctx.strokeStyle=bd.lit?'rgba(33,230,255,.42)':'rgba(255,47,190,.36)';
      ctx.lineWidth=1;
      ctx.strokeRect(bx+0.5,horizonY-bd.h+0.5,bd.w-1,bd.h);
      if (bd.lit){
        ctx.fillStyle='rgba(33,230,255,.30)';
        for (var wy=horizonY-bd.h+6; wy<horizonY-4; wy+=7)
          for (var wx=bx+3; wx<bx+bd.w-3; wx+=6)
            if ((((wx+wy)|0)%3)===0) ctx.fillRect(wx,wy,2,3);
      }
    }
  }
}

function drawGround(){
  var g=ctx.createLinearGradient(0,horizonY,0,H);
  g.addColorStop(0,'#2c0e4c'); g.addColorStop(0.35,'#170830'); g.addColorStop(1,'#0a0418');
  ctx.fillStyle=g; ctx.fillRect(0,horizonY,W,H-horizonY);

  var grid=1200, i, zRel, p, a;
  var bppu=proj(rowZ[H-1]).ppu;
  var gu=grid/roadWidth, base=Math.floor(playerX/gu)*gu;
  ctx.lineWidth=1;
  for (i=-16;i<=16;i++){
    var xr=base+i*gu;
    var xb=W/2+bppu*(xr-playerX);
    if (xb<-W||xb>W*2) continue;
    ctx.strokeStyle=(Math.round(xr/gu)%4===0)?'rgba(255,47,190,.20)':'rgba(124,58,237,.13)';
    ctx.beginPath(); ctx.moveTo(W/2,horizonY); ctx.lineTo(xb,H); ctx.stroke();
  }
  var start=Math.floor(position/grid)+1;
  for (i=0;i<50;i++){
    zRel=(start+i)*grid-position;
    if (zRel<=0) continue;
    if (zRel>MAXZ) break;
    p=proj(zRel);
    if (p.y<=horizonY+1||p.y>=H) continue;
    a=(1-fogAt(zRel))*0.4;
    ctx.fillStyle='rgba(33,230,255,'+a.toFixed(3)+')';
    ctx.fillRect(0,p.y,W,Math.max(1,p.ppu*0.006));
  }
}

function drawRoad(){
  for (var y=topRow;y<H;y++){
    var z=rowZ[y]; if (z>MAXZ) continue;
    var ppu=rowPPU[y], col=rowCol[y];
    var zw=z+position;
    var cx=W/2+ppu*(bend(z)-playerX);
    var seg=Math.floor(zw/segLength);
    var even=(seg&1)===0;

    ctx.fillStyle=even?col.a:col.b;
    ctx.fillRect(cx-ppu,y,ppu*2,1);

    var rw=Math.max(1.5,ppu*0.055);
    ctx.fillStyle=even?col.ra:col.rb;
    ctx.fillRect(cx-ppu-rw,y,rw+1,1);
    ctx.fillRect(cx+ppu,   y,rw+1,1);

    if (ppu>8 && Math.floor(zw/(segLength*2.5))%2===0){
      var lw=Math.max(1,ppu*0.014);
      ctx.fillStyle=col.ln;
      ctx.fillRect(cx-0.5*ppu-lw/2,y,lw,1);
      ctx.fillRect(cx        -lw/2,y,lw,1);
      ctx.fillRect(cx+0.5*ppu-lw/2,y,lw,1);
    }
  }
}

function hashAt(n,salt){
  n=(n*7349 + salt*1013)|0;
  n=(n^61)^(n>>>16); n=n+(n<<3); n=n^(n>>>4);
  n=Math.imul(n,0x27d4eb2d); n=n^(n>>>15);
  return (n>>>0)/4294967296;
}
var DECO_SPACE=6000;

/* ---------------------------------------------------------------
   A LITTLE REAL 3D
   Everything else on this road is a flat sprite pinned to one point of
   ground. These props are built from actual vertices instead: each one is
   pushed through the same camera the road uses, so they share its
   perspective, its curve and its fog for free. Local coordinates are in
   road units, y is up, z is deeper into the screen, and the shape is spun
   about its vertical axis before projection.
--------------------------------------------------------------- */
function v3(lx,ly,lz,rot,lat,zRelBase){
  var cs=Math.cos(rot), sn=Math.sin(rot);
  var rx=lx*cs - lz*sn, rz=lx*sn + lz*cs;
  var zr=zRelBase + rz*roadWidth;
  if (zr<250) zr=250;
  var sc=camDepth/zr, ppu=sc*roadWidth*W/2;
  return { x: W/2 + ppu*(bend(zr) + lat + rx - playerX),
           y: H/2 + sc*camH*(H/2) + yOff - ppu*ly,
           zr: zr, ppu: ppu };
}

/* Obelisk: a tapered four-sided shaft under a pyramid cap, turning slowly.
   Edges behind the centre of the shape are drawn faint, the ones in front
   bright, which is all the depth cue a wireframe needs. */
function decoObelisk(zRel,lat,u,idx){
  var rot=performance.now()/2600 + hashAt(idx,6)*6.283;
  var col=PROP_COLS[(hashAt(idx,5)*PROP_COLS.length)|0];
  var w0=0.30, w1=0.18, hgt=2.30, cap=0.60;
  var corner=[[-1,-1],[1,-1],[1,1],[-1,1]];
  var b=[], tp=[], i, e, az;
  for (i=0;i<4;i++){
    b.push (v3(corner[i][0]*w0, 0  , corner[i][1]*w0, rot, lat, zRel));
    tp.push(v3(corner[i][0]*w1, hgt, corner[i][1]*w1, rot, lat, zRel));
  }
  var apex=v3(0,hgt+cap,0,rot,lat,zRel);
  var edges=[];
  for (i=0;i<4;i++){
    edges.push([b[i], b[(i+1)%4]]);
    edges.push([tp[i],tp[(i+1)%4]]);
    edges.push([b[i], tp[i]]);
    edges.push([tp[i],apex]);
  }
  ctx.lineCap='round';
  ctx.lineWidth=Math.max(1,u*0.020);
  ctx.strokeStyle=col;
  for (i=0;i<edges.length;i++){
    e=edges[i]; az=(e[0].zr+e[1].zr)/2;
    if (az<=zRel) continue;                       /* far half first */
    ctx.globalAlpha=0.30;
    ctx.beginPath(); ctx.moveTo(e[0].x,e[0].y); ctx.lineTo(e[1].x,e[1].y); ctx.stroke();
  }
  ctx.shadowColor=col; ctx.shadowBlur=Math.min(16,u*0.30);
  for (i=0;i<edges.length;i++){
    e=edges[i]; az=(e[0].zr+e[1].zr)/2;
    if (az>zRel) continue;                        /* then the near half */
    ctx.globalAlpha=0.95;
    ctx.beginPath(); ctx.moveTo(e[0].x,e[0].y); ctx.lineTo(e[1].x,e[1].y); ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(apex.x,apex.y,Math.max(1.2,u*0.035),0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.globalAlpha=0.18; ctx.fillStyle=col;
  ctx.beginPath(); ctx.ellipse(v3(0,0,0,rot,lat,zRel).x, v3(0,0,0,rot,lat,zRel).y,
                               u*w0*1.8, Math.max(1,u*w0*0.5), 0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
}

/* Alien: a jointed figure whose limbs are placed in 3D, so the wave sweeps
   toward you rather than sliding flat across the screen. */
function decoAlien(zRel,lat,u,idx,side){
  var t=performance.now()/1000 + hashAt(idx,6)*11;
  var col=['#7cff4f','#21e6ff','#b06cff'][(hashAt(idx,5)*3)|0];
  var rot=(side>0?-0.55:0.55);                    /* turned toward the road */
  var wave=Math.sin(t*4.4), yaw=Math.sin(t*0.85)*0.9;
  var look=Math.max(0,Math.sin(t*0.41));          /* every so often, chin up */
  var bob=Math.sin(t*1.7)*0.015;
  var d=(side>0?-1:1);                            /* the arm nearest the road */
  var P=function(x,y,z){ return v3(x,y+bob,z,rot,lat,zRel); };

  var hipL=P(-0.06,0.30,0), hipR=P(0.06,0.30,0);
  var footL=P(-0.09,0,0.02), footR=P(0.09,0,-0.02);
  var shL=P(-0.11,0.56,0), shR=P(0.11,0.56,0);
  var neck=P(0,0.62,0);
  var headY=0.79+look*0.03;
  var head=P(Math.sin(yaw)*0.04, headY, Math.cos(yaw)*0.02);

  var swS=(d<0?shL:shR), swX=d*0.11;
  var elbow=P(swX+d*0.10, 0.62, 0.05);
  var hand =P(swX+d*(0.15+0.05*wave), 0.80+0.05*wave, 0.10);
  var oS=(d<0?shR:shL), oX=-d*0.11;
  var oElbow=P(oX-d*0.02, 0.42, 0);
  var oHand =P(oX+d*0.01, 0.27, 0.01);

  ctx.globalAlpha=0.20; ctx.fillStyle=col;
  ctx.beginPath(); ctx.ellipse(footL.x+(footR.x-footL.x)/2, footL.y,
                               u*0.20, Math.max(1,u*0.05),0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;

  ctx.strokeStyle=col; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.lineWidth=Math.max(1,u*0.030);
  ctx.shadowColor=col; ctx.shadowBlur=Math.min(14,u*0.25);
  function seg(a,bb){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(bb.x,bb.y); ctx.stroke(); }
  seg(hipL,footL); seg(hipR,footR); seg(hipL,hipR);
  seg(oS,oElbow); seg(oElbow,oHand);
  seg(swS,elbow); seg(elbow,hand);

  ctx.beginPath();                                 /* torso */
  ctx.moveTo(hipL.x,hipL.y); ctx.lineTo(shL.x,shL.y);
  ctx.lineTo(shR.x,shR.y);   ctx.lineTo(hipR.x,hipR.y);
  ctx.closePath();
  ctx.fillStyle=hexA(col,0.35); ctx.fill(); ctx.stroke();
  seg(neck,head);

  var hr=u*0.135, hh=u*0.175;                      /* the big grey head */
  ctx.beginPath(); ctx.ellipse(head.x,head.y-hh*0.25,hr,hh,0,0,Math.PI*2);
  ctx.fillStyle=hexA(col,0.55); ctx.fill(); ctx.stroke();
  ctx.beginPath();                                 /* pointed chin */
  ctx.moveTo(head.x-hr*0.55,head.y+hh*0.35);
  ctx.lineTo(head.x,head.y+hh*0.95);
  ctx.lineTo(head.x+hr*0.55,head.y+hh*0.35);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0;

  if (u>18){                                       /* eyes track the head */
    ctx.fillStyle='#05030a';
    var ox=Math.sin(yaw)*hr*0.30, oy=-look*hh*0.18;
    for (var e2=-1;e2<=1;e2+=2){
      ctx.save();
      ctx.translate(head.x+ox+e2*hr*0.42, head.y-hh*0.20+oy);
      ctx.rotate(e2*0.5);
      ctx.beginPath(); ctx.ellipse(0,0,hr*0.34,hh*0.20,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
}
var PROP_COLS=['#7cff4f','#21e6ff','#ff2fbe','#ffd23f','#b06cff','#ff6a3d'];

var DINO=[
  "..............######....",
  ".............########...",
  ".............##.######..",
  ".............##########.",
  ".............###########",
  ".............##.#.#.#.#.",
  ".............#########..",
  "#...........########....",
  "##.........#########....",
  "###.......##########....",
  ".####...############....",
  "..###################...",
  "..##################....",
  "..#################....."
];
/* Builds the dinosaur into the current path, merging each row's runs of
   blocks into single rects. Shared by the roadside prop, the pickup, the
   transformed player car and the icon in the menus. */
function dinoPath(x0,y0,bw,bh,frame){
  var legs=DINO_LEGS[frame], r,c,c2,line;
  ctx.beginPath();
  for (r=0;r<17;r++){
    line = r<14 ? DINO[r] : legs[r-14];
    c=0;
    while (c<24){
      if (line.charCodeAt(c)===35){
        c2=c; while (c2<24 && line.charCodeAt(c2)===35) c2++;
        ctx.rect(x0+c*bw, y0+r*bh, (c2-c)*bw+0.7, bh+0.7);
        c=c2;
      } else c++;
    }
  }
}
function rainbowFill(x0,y0,x1,y1,div){
  var hue=(performance.now()/(div||9))%360, g=ctx.createLinearGradient(x0,y0,x1,y1);
  for (var i=0;i<=4;i++) g.addColorStop(i/4,'hsl('+((hue+i*72)%360)+',100%,63%)');
  return g;
}

/* three sets of legs: standing, and the two halves of a stride */
var DINO_LEGS=[
  ["...####.....#####.......","...###.......####.......","..#####.....######......"],
  ["...####.....#####.......","..###..........###......",".####...........####...."],
  ["...####.....#####.......","....###.....###.........","...####.....####........"]
];
function decoDino(x,gy,u,idx,side,walk){
  var cols=24, rows=17, wR=5.0, hR=3.6;   /* longer head needs a wider grid */
  var bw=u*wR/cols, bh=u*hR/rows;
  var col=PROP_COLS[(hashAt(idx,5)*PROP_COLS.length)|0];
  /* stride is driven by how far it has crossed, not by the clock, so the feet
     move in step with the body instead of paddling on the spot */
  var moving = walk>0.001 && walk<0.999;
  var frame  = moving ? 1+(((walk*17)|0)&1) : 0;
  var legs   = DINO_LEGS[frame];
  ctx.save();
  ctx.translate(x, gy + (frame===1 ? -bh*0.45 : 0));
  if (side>0) ctx.scale(-1,1);            
  var x0=-u*wR/2, y0=-u*hR;
  ctx.fillStyle='rgba(10,5,22,.8)';
  ctx.fillRect(-u*wR*0.30,-u*0.13,u*wR*0.60,u*0.15);
  dinoPath(x0,y0,bw,bh,frame);
  ctx.shadowColor=col; ctx.shadowBlur=Math.min(24,u*0.4);
  ctx.fillStyle=col; ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();
}

function decoBuilding(x,gy,u,idx){
  var col=PROP_COLS[(hashAt(idx,5)*PROP_COLS.length)|0];
  var wR=1.5+hashAt(idx,6)*0.9, hR=3.2+hashAt(idx,7)*2.6;
  var w=u*wR, h=u*hR, bx=x-w/2, by=gy-h;
  var cn=Math.max(2,Math.round(wR*2.6)), rn=Math.max(3,Math.round(hR*2.1));
  var cw=w/cn, ch=h/rn, pad=Math.max(0.4,Math.min(cw,ch)*0.26);
  ctx.fillStyle='#0c0520';
  ctx.fillRect(bx,by,w,h);
  ctx.beginPath();
  for (var r=0;r<rn;r++) for (var c=0;c<cn;c++){
    if (hashAt(idx*131+r*17+c,8)<0.48) continue;      
    ctx.rect(bx+c*cw+pad, by+r*ch+pad, Math.max(0.8,cw-pad*2), Math.max(0.8,ch-pad*2));
  }
  ctx.shadowColor=col; ctx.shadowBlur=Math.min(11,u*0.18);
  ctx.fillStyle=col; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,u*0.022);
  ctx.globalAlpha*=0.75; ctx.strokeRect(bx+0.5,by+0.5,w-1,h-1); ctx.globalAlpha/=0.75;
  ctx.fillStyle=col;
  ctx.fillRect(x-Math.max(1,u*0.02)/2, by-u*0.30, Math.max(1,u*0.02), u*0.30);
  if ((Math.floor(performance.now()/700+idx)%2)===0){
    ctx.shadowColor='#ff3b5c'; ctx.shadowBlur=Math.min(14,u*0.3);
    ctx.fillStyle='#ff5d78';
    ctx.fillRect(x-Math.max(1,u*0.045)/2, by-u*0.36, Math.max(1,u*0.045), Math.max(1,u*0.06));
    ctx.shadowBlur=0;
  }
}

function decoMast(x,gy,u,idx){
  var hgt=u*2.55, w=Math.max(1,u*0.05), i, f, yy, ww;
  ctx.strokeStyle='rgba(138,104,206,.72)';
  ctx.lineWidth=Math.max(1,u*0.022);
  ctx.beginPath();
  ctx.moveTo(x-w*1.7,gy); ctx.lineTo(x-w*0.28,gy-hgt);
  ctx.moveTo(x+w*1.7,gy); ctx.lineTo(x+w*0.28,gy-hgt);
  ctx.stroke();
  ctx.beginPath();
  for (i=1;i<=4;i++){
    f=i/5; yy=gy-hgt*f; ww=w*1.7*(1-f*0.82);
    ctx.moveTo(x-ww,yy); ctx.lineTo(x+ww,yy);
  }
  ctx.stroke();
  ctx.fillStyle='rgba(33,230,255,.30)';
  ctx.beginPath();
  ctx.ellipse(x+w*2.4,gy-hgt*0.62,Math.max(1,u*0.15),Math.max(1,u*0.10),0.5,0,Math.PI*2);
  ctx.fill();
  if ((Math.floor(performance.now()/640+idx)%2)===0){
    ctx.shadowColor='#ff3b5c'; ctx.shadowBlur=Math.min(20,u*0.5);
    ctx.fillStyle='#ff5d78';
    ctx.beginPath(); ctx.arc(x,gy-hgt-u*0.07,Math.max(1.2,u*0.055),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
}

function decoBillboard(x,gy,u,idx){
  var legH=u*0.95, pw=u*1.3, ph=u*1.0, lw=Math.max(1,u*0.04), i, yy;
  var py=gy-legH-ph;
  ctx.fillStyle='rgba(28,17,48,.92)';
  ctx.fillRect(x-pw*0.33,gy-legH,lw,legH);
  ctx.fillRect(x+pw*0.33-lw,gy-legH,lw,legH);
  var g=ctx.createLinearGradient(x-pw/2,py,x+pw/2,py+ph);
  g.addColorStop(0,'#3a0f5e'); g.addColorStop(1,'#110827');
  ctx.fillStyle=g; ctx.fillRect(x-pw/2,py,pw,ph);
  var col=(idx%3===0)?'#21e6ff':((idx%3===1)?'#ff2fbe':'#b06cff');
  ctx.save();
  ctx.globalAlpha*=0.70+0.30*Math.abs(Math.sin(performance.now()/(240+(idx%7)*95)+idx));
  ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=Math.min(15,u*0.34);
  ctx.fillRect(x-pw*0.40,py+ph*0.17,pw*0.25,ph*0.52);
  for (i=0;i<3;i++)
    ctx.fillRect(x-pw*0.05,py+ph*0.20+i*ph*0.18,pw*(0.26+0.13*((idx+i)%3)),ph*0.085);
  ctx.shadowBlur=0; ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.26)';
  for (yy=py; yy<py+ph; yy+=Math.max(2,u*0.07)) ctx.fillRect(x-pw/2,yy,pw,Math.max(1,u*0.025));
  ctx.strokeStyle='rgba(255,255,255,.26)'; ctx.lineWidth=Math.max(1,u*0.02);
  ctx.strokeRect(x-pw/2,py,pw,ph);
}

function decoKiosk(x,gy,u,idx,side){
  var w=u*1.0, h=u*0.5;
  ctx.save();
  ctx.globalAlpha*=0.5;
  ctx.fillStyle='#ffb15a';
  ctx.beginPath(); ctx.ellipse(x,gy,w*0.9,Math.max(1,u*0.15),0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#150d24';
  ctx.fillRect(x-w/2,gy-h,w,h);
  ctx.fillStyle='rgba(255,178,90,.5)';
  ctx.fillRect(x-w*0.37,gy-h*0.80,w*0.74,h*0.46);
  ctx.fillStyle='#ff2fbe';
  ctx.fillRect(x-w*0.60,gy-h-Math.max(1,u*0.05),w*1.20,Math.max(1.2,u*0.05));
  var col=(idx%2===0)?'#21e6ff':'#ffd23f';
  var bx=x+side*w*0.66, bw=Math.max(1.2,u*0.05);
  ctx.shadowColor=col; ctx.shadowBlur=Math.min(13,u*0.3);
  ctx.fillStyle=col;
  ctx.fillRect(bx-bw/2,gy-h*2.5,bw,h*2.0);
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.55)';
  for (var i=0;i<3;i++) ctx.fillRect(bx-bw*0.9,gy-h*2.3+i*h*0.6,bw*1.8,Math.max(1,u*0.03));
}

function drawDecor(){
  var first=Math.floor(position/DECO_SPACE)+1;
  var last =Math.floor((position+MAXZ)/DECO_SPACE);
  for (var idx=last; idx>=first; idx--){          
    if (hashAt(idx,1)>0.5) continue;              
    var zRel=idx*DECO_SPACE-position;
    if (zRel<=350||zRel>MAXZ) continue;
    var p=proj(zRel), a=1-fogAt(zRel);
    if (a<0.06||p.y<=horizonY||p.y>H) continue;
    var side=hashAt(idx,2)<0.5?-1:1;
    var t=hashAt(idx,4);
    /* mast .22 | billboard .20 | kiosk .17 | tower .17 | dino .09 |
       obelisk .09 | alien .06 — the two new ones stay rare on purpose */
    var type = t<0.22?0 : t<0.42?1 : t<0.59?2 : t<0.76?3 : t<0.85?4 : t<0.94?5 : 6;
    var lat, walk=0;
    if (type===4){
      /* it crosses the road well ahead and is clear of it long before you
         arrive — pure scenery, nothing in the game collides with it */
      var base=4.3+hashAt(idx,3)*1.6;
      walk=clamp((36000-zRel)/27000,0,1);
      walk=walk*walk*(3-2*walk);
      lat=side*base*(1-2*walk);
    } else {
      var latMin = type===3?3.2 : (type===5?3.0 : (type===6?2.00 : 2.05));
      var latSpan= type===3?1.4 : (type===5?1.2 : (type===6?0.60 : 0.95));
      lat=side*(latMin+hashAt(idx,3)*latSpan);
    }
    var x=W/2+p.ppu*(bend(zRel)+lat-playerX);
    if (x<-p.ppu*7||x>W+p.ppu*7) continue;
    ctx.globalAlpha=a;
    if ((type<3||type===6) && p.ppu<5){                        
      ctx.fillStyle=t<0.5?'#b06cff':'#21e6ff';
      ctx.fillRect(x-1,p.y-Math.max(2,p.ppu*1.6),2,Math.max(2,p.ppu*1.6));
    }
    else if (type===0) decoMast(x,p.y,p.ppu,idx);
    else if (type===1) decoBillboard(x,p.y,p.ppu,idx);
    else if (type===2) decoKiosk(x,p.y,p.ppu,idx,side);
    else if (type===3) decoBuilding(x,p.y,p.ppu,idx);
    else if (type===4) decoDino(x,p.y,p.ppu,idx,side,walk);
    else if (type===5) decoObelisk(zRel,lat,p.ppu,idx);
    else               decoAlien(zRel,lat,p.ppu,idx,side);
    ctx.globalAlpha=1;
  }
}

function drawPosts(){
  var space=1200, start=Math.floor(position/space)+1;
  for (var i=47;i>=0;i--){
    var zRel=(start+i)*space-position;
    if (zRel<=200||zRel>MAXZ) continue;
    var p=proj(zRel);
    if (p.y<=horizonY||p.y>H) continue;
    var a=1-fogAt(zRel);
    var col=(((start+i)&1)===1)?'#21e6ff':'#ff2fbe';
    var w=Math.max(1,p.ppu*0.03), h=p.ppu*0.46;
    var cRoad=bend(zRel);
    for (var s=-1;s<=1;s+=2){
      var x=W/2+p.ppu*(cRoad+s*1.22-playerX);
      if (x<-40||x>W+40) continue;
      ctx.globalAlpha=a*0.18; ctx.fillStyle=col;
      ctx.fillRect(x-w*2,p.y-h,w*4,h);
      ctx.globalAlpha=a*0.95;
      ctx.fillRect(x-w/2,p.y-h,w,h);
      ctx.fillRect(x-w*1.6,p.y-h,w*3.2,Math.max(1,w));
    }
  }
  ctx.globalAlpha=1;
}

function drawGate(){
  var zRel=nextCP-position;
  if (zRel<=140||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var cRoad=bend(zRel);
  var h=p.ppu*1.05, thick=Math.max(2,p.ppu*0.06);
  var x0=W/2+p.ppu*(cRoad-1.3-playerX), x1=W/2+p.ppu*(cRoad+1.3-playerX);
  ctx.globalAlpha=a;
  ctx.shadowColor='#7cff4f'; ctx.shadowBlur=Math.min(26,p.ppu*0.3);
  ctx.fillStyle='#7cff4f';
  ctx.fillRect(x0-thick/2,p.y-h,thick,h);
  ctx.fillRect(x1-thick/2,p.y-h,thick,h);
  ctx.fillRect(x0,p.y-h-thick,x1-x0,thick*1.2);
  ctx.shadowBlur=0;
  if (p.ppu>50) glowText(T('CHECKPOINT'),(x0+x1)/2,p.y-h-thick*2.4,Math.min(30,p.ppu*0.16),'#eaffe0','center',12);
  ctx.globalAlpha=1;
}

/* The closeness multiplier, thrown off the side of the car the traffic went
   past on. Drawn in screen space rather than world space: it belongs to you,
   not to the car you shaved, and anchoring it to the player means it stays
   legible instead of shrinking away down the road. Called inside the shake
   transform so it rides with the car.

   The chain count is deliberately NOT repeated here — it already has a live
   HUD meter, and two numbers popping at once for one event reads as noise. */
function drawNearMissPops(){
  if (!nmPops.length) return;
  var lean=clamp(steerVel,-1.6,1.6);
  var bx=W/2+lean*9, by=PLAYER_Y-PW*0.55, i;
  for (i=0;i<nmPops.length;i++){
    var np=nmPops[i], k=np.t/NM_POP_LIFE;
    /* rises fast then settles, so the number is readable while it is still
       bright and only drifts once it is on its way out */
    var rise=1-(1-k)*(1-k);
    var x=bx + np.side*(PW*0.58 + 14*k);
    var y=by - 54*rise;
    var a=k<0.55 ? 1 : 1-(k-0.55)/0.45;
    /* cool -> hot as the pass gets closer, matching the game's own ramp */
    var col = np.m>=1.25 ? '#ff2fbe' : (np.m>=0.95 ? '#ffd23f' : '#8ef4ff');
    ctx.globalAlpha=Math.max(0,a);
    glowText('x'+np.m.toFixed(1), x, y, 15+np.m*4, col, 'center', 12);
    ctx.globalAlpha=1;
  }
}

/* A weaver's lane change used to be announced by one small amber square on
   its flank, which at any real distance was a couple of pixels you had to
   already be looking for. The roof bar now becomes the signal instead: three
   chevrons pointing the way it is about to go, lit in sequence so the block
   reads as MOVEMENT rather than as a light that is merely on. Three frames of
   chase plus one dark frame, so it still blinks. */
function vanChevrons(x,yTop,w,dir){
  var bw=w*0.78, x0=x-bw/2, cw=bw/3, h=Math.max(2.2,w*0.17), i, cx, lit;
  var ph=(Math.floor(performance.now()/105))%4;   /* 0 dark, then 1..3 lit */
  ctx.lineWidth=Math.max(1.4,w*0.062);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for (i=0;i<3;i++){
    /* index from the leading edge out, so the chase runs the way it points */
    lit = ph > (dir>0 ? i : (2-i));
    ctx.strokeStyle = lit ? '#ffd24a' : 'rgba(120,92,26,.85)';
    if (lit){ ctx.shadowColor='#ffb020'; ctx.shadowBlur=Math.min(22,w*0.55); }
    cx = x0 + cw*(i+0.5);
    ctx.beginPath();
    ctx.moveTo(cx-dir*cw*0.24, yTop);
    ctx.lineTo(cx+dir*cw*0.24, yTop+h/2);
    ctx.lineTo(cx-dir*cw*0.24, yTop+h);
    ctx.stroke();
    ctx.shadowBlur=0;
  }
  ctx.lineCap='butt'; ctx.lineJoin='miter'; ctx.lineWidth=1;
}

function drawTraffic(c){
  var zRel=c.z-position;
  if (zRel<=180||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var w=CAR_W*p.ppu, h=w*0.66;
  var x=W/2+p.ppu*(bend(zRel)+c.x-playerX);
  if (x<-w||x>W+w) return;

  ctx.globalAlpha=a*0.25; ctx.fillStyle=c.color;
  ctx.beginPath(); ctx.ellipse(x,p.y,Math.max(1,w*0.62),Math.max(1,h*0.14),0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=a;

  if (w<8){                       
    var mw=Math.max(5,w), mh=Math.max(c.weaver?6:4,h);
    ctx.fillStyle=c.color;
    ctx.fillRect(x-mw/2,p.y-mh,mw,mh);
    if (c.weaver){
      /* Too few pixels for chevrons out here, so the strip itself leans:
         half width, pushed to the side it is heading for, blinking fast. */
      var fsg = (c.sigT>0||c.phase==='move') ? c.sigDir : 0;
      var fon = (Math.floor(performance.now()/(fsg?105:230))%2)===0;
      if (fon){
        /* A weaver usually starts signalling around 13,000 units out, which
           is exactly where it is too small for chevrons — so out here the
           strip leans AND blooms. At five pixels wide the glow is doing more
           work than the shape is. */
        if (fsg){
          ctx.shadowColor='#ffb020'; ctx.shadowBlur=9; ctx.fillStyle='#ffe07a';
          ctx.fillRect(x+(fsg>0?mw*0.05:-mw*0.55), p.y-mh-3, mw*0.5, 3);
          ctx.shadowBlur=0;
        } else {
          ctx.fillStyle='#fff3b0';
          ctx.fillRect(x-mw/2, p.y-mh-2, mw, 2);
        }
      }
    }
    ctx.fillStyle='#ff5555';
    ctx.fillRect(x-mw/2,p.y-mh*0.5,mw,Math.max(1,mh*0.28));
    ctx.globalAlpha=1; return;
  }

  if (c.weaver){                  
    var vh=w*0.94;
    ctx.fillStyle='#171019';
    rr(x-w/2,p.y-vh,w,vh,w*0.09); ctx.fill();
    ctx.lineWidth=Math.max(1,w*0.055); ctx.strokeStyle='#ffd23f'; ctx.stroke();

    ctx.fillStyle='rgba(160,205,255,.16)';
    rr(x-w*0.36,p.y-vh*0.93,w*0.72,vh*0.24,w*0.05); ctx.fill();
    ctx.fillStyle='rgba(255,210,63,.22)';
    ctx.fillRect(x-w/2,p.y-vh*0.56,w,Math.max(1,vh*0.05));

    /* The signal runs through the whole change, not just the wind-up: the
       chevrons stay up while it is actually crossing, so a van caught
       mid-slide still tells you which way it is committed. */
    var sgn = (c.sigT>0 || c.phase==='move') ? c.sigDir : 0;
    if (sgn){
      vanChevrons(x, p.y-vh-w*0.20, w, sgn);
    } else {
      var on=(Math.floor(performance.now()/230)%2)===0;
      if (on){ ctx.shadowColor='#ffd23f'; ctx.shadowBlur=Math.min(20,w*0.55); }
      ctx.fillStyle=on?'#ffe98a':'#6b5a1e';
      ctx.fillRect(x-w*0.32,p.y-vh-w*0.11,w*0.64,w*0.10);
      ctx.shadowBlur=0;
    }

    ctx.shadowColor='#ff2b2b'; ctx.shadowBlur=Math.min(14,w*0.3);
    ctx.fillStyle='#ff4747';
    ctx.fillRect(x-w*0.42,p.y-vh*0.28,w*0.18,vh*0.11);
    ctx.fillRect(x+w*0.24,p.y-vh*0.28,w*0.18,vh*0.11);
    ctx.shadowBlur=0;
    ctx.fillStyle='#05030a';
    ctx.fillRect(x-w*0.52,p.y-vh*0.15,w*0.10,vh*0.15);
    ctx.fillRect(x+w*0.42,p.y-vh*0.15,w*0.10,vh*0.15);
    ctx.globalAlpha=1; return;
  }

  ctx.fillStyle='#100a1c';
  rr(x-w/2,p.y-h,w,h,w*0.14); ctx.fill();
  ctx.lineWidth=Math.max(1,w*0.05); ctx.strokeStyle=c.color; ctx.stroke();

  ctx.fillStyle='rgba(120,200,255,.14)';
  rr(x-w*0.34,p.y-h*0.95,w*0.68,h*0.36,w*0.08); ctx.fill();

  ctx.shadowColor='#ff2b2b'; ctx.shadowBlur=Math.min(16,w*0.35);
  ctx.fillStyle='#ff4747';
  ctx.fillRect(x-w*0.44,p.y-h*0.44,w*0.20,h*0.16);
  ctx.fillRect(x+w*0.24,p.y-h*0.44,w*0.20,h*0.16);
  ctx.shadowBlur=0;

  ctx.fillStyle='#05030a';
  ctx.fillRect(x-w*0.52,p.y-h*0.22,w*0.10,h*0.22);
  ctx.fillRect(x+w*0.42,p.y-h*0.22,w*0.10,h*0.22);
  ctx.globalAlpha=1;
}

function heartPath(x,y,s){
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.bezierCurveTo(x-s*1.05, y-s*0.78, x-s*0.80, y-s*1.74, x, y-s*1.12);
  ctx.bezierCurveTo(x+s*0.80, y-s*1.74, x+s*1.05, y-s*0.78, x, y);
  ctx.closePath();
}
function drawHeart(hh){
  var zRel=hh.z-position;
  if (zRel<=180||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var w=Math.max(4, HEART_W*p.ppu), s=w/2;
  var x=W/2+p.ppu*(bend(zRel)+hh.x-playerX);
  if (x<-w*2||x>W+w*2) return;
  var t=performance.now(), hue=(t/9)%360;
  var y=p.y - (w*0.55 + Math.sin(t/380)*w*0.14);

  ctx.globalAlpha=a*0.30;
  ctx.fillStyle='hsl('+hue+',100%,62%)';
  ctx.beginPath(); ctx.ellipse(x,p.y,w*0.85,Math.max(1,w*0.22),0,0,Math.PI*2); ctx.fill();

  ctx.globalAlpha=a;
  var g=ctx.createLinearGradient(x-s,y-s*1.6,x+s,y);
  for (var i=0;i<=4;i++) g.addColorStop(i/4,'hsl('+((hue+i*72)%360)+',100%,63%)');
  ctx.shadowColor='hsl('+((hue+180)%360)+',100%,60%)';
  ctx.shadowBlur=Math.min(30,w*0.95);
  heartPath(x,y,s); ctx.fillStyle=g; ctx.fill();
  ctx.shadowBlur=0;
  if (w>10){
    ctx.lineWidth=Math.max(1,w*0.055); ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.stroke();
    ctx.globalAlpha=a*0.55; ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.ellipse(x-s*0.34,y-s*0.92,s*0.17,s*0.11,-0.5,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

var BOLT=[[-0.10,-1.00],[0.62,-1.00],[0.16,-0.18],[0.72,-0.18],
          [-0.28,1.00],[0.02,0.10],[-0.50,0.10]];
function drawShot(sh){
  var zRel=sh.z-position;
  if (zRel<=140||zRel>MAXZ) return;
  var p=proj(zRel), a=1-fogAt(zRel);
  var w=Math.max(3,0.13*p.ppu);
  var x=W/2+p.ppu*(bend(zRel)+sh.x-playerX);
  var y=p.y-w*1.5;
  ctx.globalAlpha=a;
  var tz=Math.max(150,zRel-2800), tp=proj(tz);
  var tx=W/2+tp.ppu*(bend(tz)+sh.x-playerX), ty=tp.y-Math.max(3,0.13*tp.ppu)*1.5;
  var g=ctx.createLinearGradient(x,y,tx,ty);
  var sc=sh.col||'#8ef4ff';
  g.addColorStop(0,'rgba(255,255,255,.85)'); g.addColorStop(1,hexA(sc,0));
  ctx.strokeStyle=g; ctx.lineWidth=Math.max(1.5,w*0.6); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(tx,ty); ctx.stroke();
  ctx.shadowColor=sc; ctx.shadowBlur=Math.min(26,w*2.4);
  ctx.globalAlpha=a*0.45; ctx.fillStyle=sc;
  ctx.beginPath(); ctx.ellipse(x,y,w*0.95,w*1.5,0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=a; ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.ellipse(x,y,w*0.5,w*0.85,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.globalAlpha=1;
}

/* a small mushroom cloud where a car used to be */
function drawBlast(bl){
  var zRel=bl.z-position;
  if (zRel<=140||zRel>MAXZ) return;
  var p=proj(zRel), t=bl.t;
  var a=(1-fogAt(zRel))*(1-t*t);
  var x=W/2+p.ppu*(bend(zRel)+bl.x-playerX);
  var gy=p.y;
  var R=p.ppu*(0.10+0.34*Math.pow(t,0.5));
  var rise=p.ppu*(0.08+0.62*Math.pow(t,0.75));

  ctx.globalAlpha=a*0.5;                       /* shockwave on the tarmac */
  ctx.strokeStyle='#ffd23f'; ctx.lineWidth=Math.max(1,p.ppu*0.025);
  ctx.beginPath(); ctx.ellipse(x,gy,R*(1.1+t*1.6),Math.max(1,R*(0.26+t*0.4)),0,0,Math.PI*2); ctx.stroke();

  var sw=R*0.34;                               /* stem */
  ctx.globalAlpha=a*0.7;
  var g2=ctx.createLinearGradient(x,gy,x,gy-rise);
  g2.addColorStop(0,'rgba(255,120,40,.12)'); g2.addColorStop(1,'rgba(255,205,90,.8)');
  ctx.fillStyle=g2;
  ctx.beginPath();
  ctx.moveTo(x-sw*0.5,gy); ctx.lineTo(x+sw*0.5,gy);
  ctx.lineTo(x+sw,gy-rise); ctx.lineTo(x-sw,gy-rise);
  ctx.closePath(); ctx.fill();

  ctx.globalAlpha=a;                           /* cap */
  var g=ctx.createRadialGradient(x,gy-rise,R*0.08,x,gy-rise,R);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.30,'#ffe487');
  g.addColorStop(0.68,'#ff7a2f'); g.addColorStop(1,'rgba(255,50,30,0)');
  ctx.shadowColor='#ff9b3d'; ctx.shadowBlur=Math.min(26,R*0.9);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,gy-rise,R,R*0.80,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.globalAlpha=1;
}

var UFO_W=0.62;
function drawUfo(uf){
  var zRel=uf.z-position;
  if (zRel<=180||zRel>MAXZ) return;
  var p=proj(zRel), a=(1-fogAt(zRel))*uf.fade;
  if (a<=0.01) return;
  var w=Math.max(5,UFO_W*p.ppu), dh=Math.max(1.5,w*0.19);
  var x=W/2+p.ppu*(bend(zRel)+uf.x-playerX);
  if (x<-w*3||x>W+w*3) return;
  var gy=p.y;
  var y=gy-(uf.hover*p.ppu)-Math.sin(uf.bob*1.3)*w*0.10;

  if (uf.beamOn){                             /* cone of light down to the road */
    var bw=w*0.72;
    ctx.globalAlpha=a*0.14; ctx.fillStyle=uf.color;
    ctx.beginPath();
    ctx.moveTo(x-w*0.20,y+dh*0.55); ctx.lineTo(x+w*0.20,y+dh*0.55);
    ctx.lineTo(x+bw,gy); ctx.lineTo(x-bw,gy);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=a*0.30;
    ctx.beginPath(); ctx.ellipse(x,gy,bw,Math.max(1,bw*0.24),0,0,Math.PI*2); ctx.fill();
  }

  ctx.globalAlpha=a;
  ctx.fillStyle='rgba(185,232,255,.32)';      /* dome */
  ctx.beginPath(); ctx.ellipse(x,y-dh*0.55,w*0.24,w*0.20,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.ellipse(x-w*0.09,y-dh*0.80,w*0.06,w*0.04,-0.5,0,Math.PI*2); ctx.fill();

  var g=ctx.createLinearGradient(x,y-dh,x,y+dh);   /* hull */
  g.addColorStop(0,'#3a3157'); g.addColorStop(0.5,'#1a1430'); g.addColorStop(1,'#0b0818');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y,w*0.5,dh,0,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=Math.max(1,w*0.032); ctx.strokeStyle=uf.color;
  ctx.shadowColor=uf.color; ctx.shadowBlur=Math.min(20,w*0.36);
  ctx.stroke(); ctx.shadowBlur=0;

  if (w>12){                                  /* running lights round the rim */
    for (var i=0;i<7;i++){
      var ang=uf.spin+i*Math.PI*2/7;
      var lx=x+Math.cos(ang)*w*0.41, ly=y+Math.sin(ang)*dh*0.62;
      ctx.globalAlpha=a*(0.30+0.70*Math.max(0,Math.sin(ang)));
      ctx.fillStyle=uf.color;
      ctx.fillRect(lx-w*0.030,ly-w*0.020,Math.max(1.5,w*0.060),Math.max(1.5,w*0.040));
    }
  }
  ctx.globalAlpha=1;
}

function drawDinoPickup(pu){

  var t=performance.now();
  var y=p.y-(h*0.22+Math.sin(t/380)*w*0.10);
  ctx.globalAlpha=a*0.30;
  ctx.fillStyle='hsl('+((t/9)%360)+',100%,62%)';
  ctx.beginPath(); ctx.ellipse(x,p.y,w*0.58,Math.max(1,w*0.15),0,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=a;
  dinoPath(x-w/2, y-h, w/24, h/17, 1+((Math.floor(t/190))&1));
  ctx.shadowColor='hsl('+(((t/9)+180)%360)+',100%,60%)';
